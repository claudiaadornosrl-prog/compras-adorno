async function anularOP(id, comp){
  const motivo = prompt(`Anular ${comp}\n\nLas facturas vuelven a quedar disponibles para armar otra OP, se anulan sus retenciones` +
    (MODO_PRUEBA ? '.' : ' y se cancela el pendiente en Tesorería.') + '\n\n¿Por qué la anulás?');
  if (motivo === null) return;
  if (!motivo.trim()){ alert('El motivo es obligatorio.'); return; }
  const {data, error} = await sb.rpc('compras_op_anular', {p_op: id, p_motivo: motivo.trim()});
  if (error){ alert('No se pudo anular: ' + error.message); return; }
  alert(`Anulada. ${data.comprobantes_liberados} comprobante(s) volvieron a "controlado sin OP".` +
        (data.retenciones_anuladas ? `\n${data.retenciones_anuladas} retención(es) anulada(s): no entran en los listados ni en el acumulado del mes.` : ''));
  vistaOrdenes();
}

// ═══════════════════════════════════════════════════════════════════════
//  🏢 PROVEEDORES · ficha del módulo
//
//  🚨 Dragonfish es la AUTORIDAD de la identidad (nombre, CUIT, mail,
//  teléfono, activo): sync_proveedores.py los pisa cada 4 hs. Por eso lo que
//  se edita acá vive en `compras_proveedor_datos`, una tabla aparte que el
//  sync no toca. Si alguien guardara la condición de pago en la tabla de
//  Dragonfish, se borraría sola a las pocas horas.
//
//  El alta manual crea un código propio (MAN- / EXT-) justamente para que el
//  sync, que matchea por código, nunca lo encuentre y lo pise.
// ═══════════════════════════════════════════════════════════════════════
let _provCache = [], _provBusca = '';
// (v132, JP) filtros rápidos sobre la lista ya traída; inactivos ocultos por defecto
let _provFil = { mercaderia:false, exterior:false, inactivos:false, sinficha:false };
const _provEsMerc = p => p.compra_mercaderia === true || (p.compra_mercaderia == null && p.mercaderia_auto);
// (v146, JP) razón social: la que cargamos en la ficha manda; la del Dragon queda de referencia
const _provNom = p => (p.nombre_propio || '').trim() || p.nombre || '';
const _saldoChip = v => { const n = Number(v) || 0; return n ? `<span class="chip" style="background:${n > 0 ? '#fee2e2;color:#991b1b' : '#dcfce7;color:#166534'}" title="${n > 0 ? 'Le debemos' : 'Saldo a favor nuestro'}">${_fmtP(Math.abs(n))}</span>` : '<span class="mini">—</span>'; };
function toggleProvFiltro(k){ _provFil[k] = !_provFil[k]; pintarProveedores(); }

async function vistaProveedores(){
  const c = document.getElementById('cont');
  c.innerHTML = `<div class="card">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
      <input id="prov-q" type="search" placeholder="Buscar por nombre o CUIT…" value="${_mEscP(_provBusca)}"
             style="flex:1;min-width:220px;padding:9px 11px;border:1px solid var(--bd);border-radius:9px;font-size:14px;font-family:inherit;">
      <button class="act gh mini-ico" title="Buscar" onclick="buscarProveedores()">${ico('lupa')}</button>
      <button class="act mini-ico" title="Nuevo proveedor" onclick="altaProveedor()">${ico('mas')}</button>
    </div>
    <div id="prov-lista"><div class="hint">Cargando…</div></div>
  </div>`;
  document.getElementById('prov-q').addEventListener('keydown', e => { if (e.key === 'Enter') buscarProveedores(); });
  // (v132, JP) si se borra todo lo escrito, vuelve el listado general sin apretar Enter
  document.getElementById('prov-q').addEventListener('input', e => { if (!e.target.value.trim() && _provBusca) buscarProveedores(); });
  await buscarProveedores();
}

function _mEscP(t){ return String(t ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
const _fmtP = n => '$' + Number(n||0).toLocaleString('es-AR', {maximumFractionDigits:0});

async function buscarProveedores(){
  _provBusca = (document.getElementById('prov-q')?.value || '').trim();
  const cont = document.getElementById('prov-lista');
  cont.innerHTML = '<div class="hint">Buscando…</div>';
  const { data, error } = await sb.rpc('compras_proveedores_listar', { p_busca: _provBusca || null, p_limite: 60, p_prueba: MODO_PRUEBA });
  if (error){ cont.innerHTML = `<div class="hint" style="color:#b91c1c;">No pude traer los proveedores: ${_mEscP(error.message)}</div>`; return; }
  _provCache = data || [];
  if (!_provCache.length){ cont.innerHTML = '<div class="hint">No encontré ningún proveedor con ese nombre o CUIT.</div>'; return; }
  // Última constancia de ARCA guardada para cada CUIT del listado (si se consultó alguna vez)
  try {
    const cuits = [...new Set(_provCache.map(p => String(p.cuit||'').replace(/\D/g,'')).filter(c => c.length === 11))];
    if (cuits.length){
      const { data: ac } = await sb.from('compras_arca_consultas').select('cuit,vigente,estado_clave,razon_social,tipo_persona,cond_iva,monotributo_categoria,domicilio,impuestos,actividades,errores,consultado_at,error').in('cuit', cuits);
      const porCuit = Object.fromEntries((ac||[]).map(a => [a.cuit, a]));
      _provCache.forEach(p => { p.arca = porCuit[String(p.cuit||'').replace(/\D/g,'')] || null; });
    }
  } catch(e){ console.warn('arca', e); }
  pintarProveedores();
}

function pintarProveedores(){
  const cont = document.getElementById('prov-lista'); if (!cont) return;
  const f = _provFil;

// ── Helpers de contacto: links directos a WhatsApp y mail ──
function _waLink(tel){
  let d = String(tel||'').replace(/\D/g,''); if (!d) return '';
  if (d.startsWith('0')) d = d.slice(1);
  if (d.startsWith('15')) d = '11' + d.slice(2);
  if (!d.startsWith('54')) d = '54' + (d.length <= 10 ? '9' : '') + d;
  return 'https://wa.me/' + d;
}
// (8-oct, JP) versión compacta para la tabla: solo íconos, el dato en el tooltip
function _contactoIcos(c){
  const out = [];
  if (c.whatsapp) out.push(`<a class="eico" style="background:#dcfce7;color:#166534;cursor:pointer" target="_blank" rel="noopener" href="${_waLink(c.whatsapp)}" title="WhatsApp ${_mEscP(c.whatsapp)}">${ico('chat','s')}</a>`);
  if (c.email) out.push(`<a class="eico" style="background:#eff6ff;color:#1e40af;cursor:pointer" href="mailto:${_mEscP(c.email)}" title="Mail ${_mEscP(c.email)}">${ico('mail','s')}</a>`);
  return out.join('') || '<span class="mini">—</span>';
}
function _contactoLinks(c){
  const out = [];
  if (c.whatsapp) out.push(`<a class="btn" style="padding:3px 8px;font-size:12px;background:#dcfce7;border-color:#86efac;" target="_blank" href="${_waLink(c.whatsapp)}" title="Abrir chat de WhatsApp">💬 WhatsApp</a>`);
  if (c.telefono) out.push(`<a class="btn" style="padding:3px 8px;font-size:12px;" href="tel:${_mEscP(String(c.telefono).replace(/\s/g,''))}">📞 ${_mEscP(c.telefono)}</a>`);
  if (c.email) out.push(`<a class="btn" style="padding:3px 8px;font-size:12px;background:#eff6ff;border-color:#93c5fd;" href="mailto:${_mEscP(c.email)}" title="Escribir mail">✉ ${_mEscP(c.email)}</a>`);
  return out.join(' ');
}

const _h4P = t => `<h4 style="margin:18px 0 8px;font-size:13px;letter-spacing:.4px;text-transform:uppercase;color:var(--mut);border-bottom:1px solid var(--bd);padding-bottom:4px;">${t}</h4>`;
// (v133) apartado plegable de la ficha: título + resumen a la derecha (se actualiza con _resP)
const _secP = (id, icon, titulo, resumen, body, abierto) =>
  `<details class="pf-sec" id="sec-${id}" ${abierto ? 'open' : ''}><summary>${ico('chevron','s chev')}${ico(icon,'s')} ${titulo}<span class="res" id="res-${id}">${resumen}</span></summary><div class="pf-body">${body}</div></details>`;
function _resP(id, txt, ok, warn){ const r = document.getElementById('res-'+id); if (r){ r.textContent = txt; r.classList.toggle('ok', !!ok && !warn); r.classList.toggle('warn', !!warn); } }

const _mesesDesde = d => d ? (Date.now() - new Date(d).getTime()) / 2592000000 : null;
// (v135) CBU: 22 dígitos y dos dígitos verificadores (módulo 10, pesos 7-1-3-9)
function cbuValido(cbu){
  const d = String(cbu||'').replace(/\D/g,''); if (d.length !== 22) return false;
  const dv = (str, pesos) => { let t = 0; for (let i = 0; i < str.length; i++) t += Number(str[i]) * pesos[i % pesos.length]; return (10 - t % 10) % 10; };
  return dv(d.slice(0,7), [7,1,3,9,7,1,3]) === Number(d[7]) && dv(d.slice(8,21), [3,9,7,1,3,9,7,1,3,9,7,1,3]) === Number(d[21]);
}

// (v135) todo lo editable de la ficha, serializado, para saber si hay cambios sin guardar
let _pfFoto = '';
function _pfEstado(){
  const m = document.getElementById('prov-modal'); if (!m) return '';
  const campos = [...m.querySelectorAll('input,select,textarea')].map(el => el.type === 'checkbox' ? (el.checked ? '1' : '0') : el.value);
  return JSON.stringify([campos, _fContactos, _fDescuentos, _fRet]);
}
function cerrarFichaProveedor(){
  if (_pfFoto && _pfEstado() !== _pfFoto && !confirm('Tenés cambios sin guardar en la ficha.\n\n¿Cerrar igual y perderlos?')) return;
  _pfFoto = ''; cerrarModalP();
}
async function guardarFichaProveedor(codigo, cuit){
  const g = id => (document.getElementById(id)?.value || '').trim();
  const _pOrig = _provCache.find(x => x.codigo === codigo) || {};
  const nombreForm = g('pf-nombre');
  const datos = { sku: g('pf-sku').toUpperCase(), nombre_propio: (nombreForm && nombreForm !== (_pOrig.nombre || '')) ? nombreForm : '',
    condicion_pago:g('pf-cond'), cond_iva:g('pf-iva'), cbu:g('pf-cbu'), alias_cbu:g('pf-alias'),
    email_op:g('pf-mail'), moneda_habitual:g('pf-moneda'), domicilio:g('pf-dom'), notas:g('pf-notas'),
    pais:g('pf-pais'), es_exterior: !!document.getElementById('pf-ext')?.checked,
    compra_mercaderia: g('pf-merc') === 'si' ? true : g('pf-merc') === 'no' ? false : null,
    telefono:g('pf-tel'), whatsapp:g('pf-wa'), email:g('pf-email'), web:g('pf-web'),
    contactos: _fContactos.filter(c => c.nombre || c.telefono || c.whatsapp || c.email),
    descuentos: _fDescuentos.filter(d => d.descripcion || d.porcentaje),
    pedido_minimo: { importe: parseFloat(g('pf-min-imp')) || null, unidades: parseFloat(g('pf-min-uni')) || null,
                     modo: g('pf-min-modo') || 'cualquiera', nota: g('pf-min-nota') } };
  const volMal = datos.descuentos.find(d => ['monto_minimo','cantidad_minima'].includes(d.tipo) && !(d.umbral > 0 && d.porcentaje > 0));
  if (volMal) return alert('El descuento "' + (volMal.descripcion || volMal.tipo) + '" es por volumen: necesita el "Desde" y el %.');
  // 5) CBU: 22 dígitos con sus dos dígitos verificadores; uno mal cargado se descubre cuando el banco rechaza la transferencia
  if (datos.cbu && !cbuValido(datos.cbu)){
    const d = datos.cbu.replace(/\D/g,'');
    return alert(d.length !== 22 ? `El CBU tiene ${d.length} dígitos y tiene que tener 22. Revisalo.` : 'El CBU no pasa la verificación del banco (dígitos verificadores): hay algún número mal copiado. Revisalo.');
  }
  datos.cbu = datos.cbu.replace(/\D/g,'');
  const { error } = await sb.rpc('compras_proveedor_guardar', { p_codigo: codigo, p_datos: datos });
  if (error) return alert('No se pudo guardar: ' + error.message);
  if (cuit && _fRet.length){
    const { error: e2 } = await sb.rpc('compras_proveedor_retenciones_guardar', { p_cuit: cuit,
      p_filas: _fRet.map(r => ({ regimen_id: r.regimen_id, aplica: !!r.aplica, exento: !!r.exento, alicuota: r.alicuota || null,
        cert_numero: r.cert_numero || null, cert_vigencia_hasta: r.cert_vigencia_hasta || null, notas: r.notas || null })) });
    if (e2) return alert('Ficha guardada, pero las retenciones no: ' + e2.message);
  }
  // (v136, JP) Guardar cierra la ficha; el aviso de cambios sin guardar queda solo para Cerrar / click afuera
  _pfFoto = ''; cerrarModalP();
  if (document.getElementById('prov-lista')) await buscarProveedores();
}

// ═══ 🔍 Validación de CUIT contra ARCA (constancia de inscripción) ═══
//  La PWA no habla con ARCA: encola el CUIT (compras_arca_pedir) y el script
//  arca_padron.py (PC de JP / VPS, con el certificado "AdornoPadron") consulta
//  el web service y deja el resultado en compras_arca_consultas. Acá se sondea.
const _condIvaTxt = { RI:'Responsable Inscripto', MT:'Monotributo', EX:'Exento', NI:'Sin IVA (no inscripto)', EXT:'Del exterior', CF:'Consumidor final' };
let _arcaUltima = null;

async function validarArca(cuit, contId, forzar){
  const cont = document.getElementById(contId); if (!cont) return null;
  const limpio = String(cuit||'').replace(/\D/g,'');
  if (limpio.length !== 11){ cont.innerHTML = '<div class="hint" style="color:#b91c1c;">El CUIT tiene que tener 11 dígitos.</div>'; return null; }
  cont.innerHTML = '<div class="hint"><span class="reloj">⏳</span> Consultando ARCA…</div>';
  const { data, error } = await sb.rpc('compras_arca_pedir', { p_cuit: limpio, p_forzar: !!forzar });
  if (error || !data?.ok){ cont.innerHTML = `<div class="hint" style="color:#b91c1c;">${_mEscP(error?.message || data?.motivo || 'No se pudo pedir la consulta')}</div>`; return null; }
  let c = data.consulta;
  if (!data.cache){
    for (let i = 0; i < 45 && !c; i++){
      await new Promise(r => setTimeout(r, 2000));
      const { data: e } = await sb.rpc('compras_arca_estado', { p_cola_id: data.cola_id });
      if (e?.estado === 'listo' && e.consulta) c = e.consulta;
      if (e?.estado === 'error'){ cont.innerHTML = '<div class="hint" style="color:#b91c1c;">El consultor de ARCA no respondió. ¿Está corriendo arca_padron.py en la PC de JP?</div>'; return null; }
      if (i === 5) cont.innerHTML = '<div class="hint"><span class="reloj">⏳</span> ARCA está tardando… (sigo esperando)</div>';
    }
    if (!c){ cont.innerHTML = '<div class="hint" style="color:#b91c1c;">ARCA no respondió en 90 segundos. Probá de nuevo en un rato.</div>'; return null; }
  }
  _arcaUltima = c;
  cont.innerHTML = _arcaCard(c);
  return c;
}

// (v134) resumen para el título del apartado: "CUIT vigente · RI · 22/09/26"
function _arcaResumen(c){
  if (!c) return 'sin consultar';
  if (c.error) return 'ARCA dio error';
  const f = c.consultado_at ? new Date(c.consultado_at).toLocaleDateString('es-AR', {day:'2-digit',month:'2-digit',year:'2-digit'}) : '';
  return [c.vigente === true ? 'CUIT vigente' : '⚠ CUIT no vigente', c.cond_iva || null, f].filter(Boolean).join(' · ');
}
function _arcaCard(c){
  if (c.error) return `<div class="hint" style="background:#fef2f2;border-left:3px solid #ef4444;padding:8px 10px;border-radius:6px;">❌ ARCA: ${_mEscP(c.error)}</div>`;
  const errs = (c.errores||[]).map(e => typeof e === 'string' ? e : JSON.stringify(e));

// (2-oct, JP) Ventanas MOVIBLES: se arrastran desde la franja de arriba (el título) por toda la pantalla.
// Vale para el modal de proveedores/OP (#prov-modal) y para todos los *-overlay con .c-head.
(function(){
  let box = null, x0 = 0, y0 = 0, dx0 = 0, dy0 = 0;
  const punto = e => e.touches ? e.touches[0] : e;
  function empezar(e){
    const ov = e.target.closest && e.target.closest('#prov-modal,[id$="-overlay"]'); if (!ov) return;
    if (e.target.closest('input,select,textarea,button,a,label,.op-tip')) return;
    let b = null;
    const cab = e.target.closest('.c-head');
    if (cab) b = cab.closest('.c-box') || ov.firstElementChild;
    else if (ov.id === 'prov-modal'){
      b = ov.firstElementChild;
      if (!b || !b.contains(e.target) || punto(e).clientY - b.getBoundingClientRect().top > 58) return;
    }
    if (!b) return;
    box = b; x0 = punto(e).clientX; y0 = punto(e).clientY; dx0 = b._dx || 0; dy0 = b._dy || 0;
    document.body.style.userSelect = 'none';
    if (!e.touches) e.preventDefault();
  }
  function mover(e){
    if (!box) return;
    const p = punto(e), r = box.getBoundingClientRect();
    let dx = dx0 + p.clientX - x0, dy = dy0 + p.clientY - y0;
    // que siempre quede un pedazo agarrable a la vista
    const izq = r.left - (box._dx || 0) + dx, arr = r.top - (box._dy || 0) + dy;
    if (izq > innerWidth - 80) dx -= izq - (innerWidth - 80);
    if (izq + r.width < 80) dx += 80 - (izq + r.width);
    if (arr < 0) dy -= arr;
    if (arr > innerHeight - 50) dy -= arr - (innerHeight - 50);
    box._dx = dx; box._dy = dy; box.style.transform = `translate(${dx}px,${dy}px)`;
    if (e.cancelable && e.touches) e.preventDefault();
  }
  function soltar(){ box = null; document.body.style.userSelect = ''; }
  document.addEventListener('mousedown', empezar);
  document.addEventListener('mousemove', mover);
  document.addEventListener('mouseup', soltar);
  document.addEventListener('touchstart', empezar, {passive: true});
  document.addEventListener('touchmove', mover, {passive: false});
  document.addEventListener('touchend', soltar);
})();

const _r2g = x => Math.round((Number(x) || 0) * 100) / 100;
function _gMesMas(per, k){ const y = +per.slice(0,4), m = +per.slice(5,7) - 1 + k; const d = new Date(y, m, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-01'; }
function _gRepartoInit(d, gs){
  if (d._reparto) return;
  if (Array.isArray(d.gestion_reparto) && d.gestion_reparto.length > 1){
    d._reparto = d.gestion_reparto.map(x => ({periodo: String(x.periodo).slice(0,10), unidad: x.unidad, categoria: x.categoria,
                                              pct: x.pct, importe: Number(x.importe)}));
    d._gBase = _r2g(d._reparto.reduce((a,x) => a + x.importe, 0));
  } else {
    const imp = gs.importe != null ? Number(gs.importe) : null;
    d._gBase = imp;
    d._reparto = [{periodo: gs.periodo || d.gestion_periodo || _gMesMas(_hoyAR().slice(0,7) + '-01', 0),
                   unidad: gs.unidad || '', categoria: gs.categoria || 'varios', pct: 100, importe: imp}];
    // (24-oct, JP) el motor encontró el Excel del proveedor (Cabify/Calog/OCA): se propone el reparto por local

      const ref = d._reparto[0], tot = Object.values(rx.por_unidad).reduce((a, b) => a + Number(b || 0), 0);
      const us = ['alcorta', 'unicenter', 'oficina'].filter(u => Number(rx.por_unidad[u]) > 0);
      if (tot > 0 && us.length){
        let acum = 0;
        d._reparto = us.map((u, i) => { const v = i === us.length - 1 ? _r2g(imp - acum) : _r2g(imp * Number(rx.por_unidad[u]) / tot); acum = _r2g(acum + v);
          return {periodo: ref.periodo, unidad: u, categoria: ref.categoria, pct: null, importe: v}; });

}

function _gRepintar(){ const el = document.getElementById('ctrl-g-rep'); if (el) el.innerHTML = _gRepartoHTML(); _avisoUnidadConcepto(); }
function _gRefrescarSuma(){

function _gBaseSet(v){

  if (d._reparto.length === 1){ d._reparto[0].importe = d._gBase; const el = document.getElementById('g-imp-0'); if (el) el.value = nmShow(d._gBase); }

function _gPartAgregar(){

// (24-oct, JP) Reparto por Excel del proveedor (Cabify / OCA): cada fila trae un importe y algo que dice a qué local
// corresponde. El "Total a la planilla" se reparte en proporción a lo que suma cada local en el Excel (el IVA y las
// percepciones quedan prorrateados igual). Lo que no se puede asignar va a Oficina y se avisa.
function _gUnidadDeTexto(t){
  const u = String(t || '').toLowerCase();
  if (/unicenter|cente\b|martinez|martínez/.test(u)) return 'unicenter';
  if (/alcorta|salguero|palermo|alco\b/.test(u)) return 'alcorta';
  if (/oficina|admin|administracion|administración|marisa|analia|analía|torcuato|deposito|depósito|web|online/.test(u)) return 'oficina';
  return null;
}
async function _gImportarExcel(file){
  if (!file || !enControl || !enControl._reparto) return;
  if (!window.XLSX) await _cargarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type: 'array'}), ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, {header: 1, raw: true, defval: ''});
  const hdrIx = rows.findIndex(r => r.some(c => /importe|i m p o r t e|precio total/i.test(String(c))));
  if (hdrIx < 0){ alert('No encontré una columna de importes en la primera hoja del Excel.'); return; }
  const hdr = rows[hdrIx].map(c => String(c || '').toLowerCase().replace(/\s+/g, ' ').trim());
  const col = re => hdr.findIndex(h => re.test(h));
  // Cabify: "Importe" + "Solicitado por" / "Pasajero" / "Email del pasajero" · OCA: "I m p o r t e" + "CtrCosto" / "Des"
  const cImp = col(/^(importe|i m p o r t e)$/) >= 0 ? col(/^(importe|i m p o r t e)$/) : col(/precio total/);
  // (JP) PRIMERO el centro de costo: un local puede pedir el viaje pero el costo es del otro. Después, quién lo pidió.
  const cCC = [col(/^centro de cost[eo]$/), col(/centro de cost[eo] variable/), col(/ctrcosto|centro de cost|^unidad$|^local$|sucursal/)].filter(i => i >= 0);
  const cTxt = [col(/email del pasajero/), col(/solicitado por/), col(/^pasajero$/), col(/^des$|destino/)].filter(i => i >= 0);
  const porU = {alcorta: 0, unicenter: 0, oficina: 0}, sinAsignar = [];
  let n = 0;
  const num = v => typeof v === 'number' ? v : (Number(String(v).replace(/\./g, '').replace(',', '.')) || Number(v) || 0);
  for (const r of rows.slice(hdrIx + 1)){
    const imp = num(r[cImp]);
    if (!imp) continue;
    const vals = cCC.concat(cTxt).map(i => r[i]).filter(v => v !== '' && v != null).map(String);
    // Cabify: la fila sin centro de costo, pasajero ni solicitante es la percepción / ajuste: no es un viaje
    if (!vals.length){ sinAsignar.push(imp); continue; }
    // columna por columna en orden de prioridad: "Centro de coste" > variable > del pasajero > mail / solicitante
    const u = vals.map(_gUnidadDeTexto).find(Boolean) || null;
    if (!u){ sinAsignar.push(imp); continue; }
    porU[u] += imp; n++;
  }
  const sumaU = Object.values(porU).reduce((a, b) => a + b, 0);
  if (!n || sumaU <= 0){ alert('No pude asignar ningún renglón del Excel a un local. Columnas leídas: ' + hdr.filter(Boolean).slice(0, 8).join(' · ')); return; }
  const d = enControl, base = Number(d._gBase || 0);
  if (!(base > 0)){ alert('Primero cargá el "Total" a la planilla.'); return; }
  const ref = d._reparto[0] || {};
  const unidades = ['alcorta', 'unicenter', 'oficina'].filter(u => porU[u] > 0);
  const partes = [];
  let acum = 0;
  unidades.forEach((u, i) => {
    const imp = i === unidades.length - 1 ? _r2g(base - acum) : _r2g(base * porU[u] / sumaU);
    acum = _r2g(acum + imp);
    partes.push({periodo: ref.periodo, unidad: u, categoria: ref.categoria || 'varios', pct: null, importe: imp});
  });
  d._reparto = partes;
  _gRepintar();
  const det = unidades.map(u => `${u}: ${plata(porU[u])} del Excel (${(porU[u] / sumaU * 100).toFixed(1)} %) → ${plata(partes.find(p => p.unidad === u).importe)}`).join('\n');
  alert(`Reparto desde ${file.name}: ${n} renglones asignados.\n${det}` + (sinAsignar.length ? `\n\n${sinAsignar.length} renglón(es) sin local (percepciones, ajustes o sin nombre) por ${plata(sinAsignar.reduce((a, b) => a + b, 0))}: no entran en la proporción.` : ''));
}
function _gPartQuitar(i){
  const d = enControl; d._reparto.splice(i, 1);
  if (d._reparto.length === 1) d._reparto[0].importe = d._gBase;
  _gRepintar();
}

  if (b.error) throw b.error;
  BANDEJA = (b.data || []).filter(d => !!d.es_prueba === MODO_PRUEBA);
  if (c.data) CONCEPTOS = c.data;
  MOTOR = (m.data && m.data[0]) || null;
  // (v157, JP) avisos "Leyó mal" pendientes → ícono con contador en la barra de la Bandeja (admin)
  try { const f = await sb.from('compras_motor_feedback').select('id', {count: 'exact', head: true}).eq('estado', 'pendiente'); AVISOS_MOTOR_PEND = f.count || 0; } catch (e) { AVISOS_MOTOR_PEND = 0; }
}
let AVISOS_MOTOR_PEND = 0;

let MOTOR_PEDIDO = null;   // {id, estado} del pedido en curso (botón 🤖)

async function pedirMotor(){
  const btn = document.getElementById('btn-motor');
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="reloj">⏳</span> Pidiendo…'; }
  const {data, error} = await sb.rpc('compras_pedir_motor');
  if (error){ alert('No pude pedir la lectura: ' + error.message); if (btn){ btn.disabled=false; btn.textContent='🤖 Leer 1 - SIN CONTABILIZAR'; } return; }
  MOTOR_PEDIDO = {id: data.id, estado: 'pendiente', desde: Date.now()};
  pintarEstadoMotor();
  seguirPedido();
}
function pintarEstadoMotor(){
  const el = document.getElementById('motor-estado'); if (!el) return;
  const p = MOTOR_PEDIDO;
  if (!p) { el.innerHTML = ''; return; }
  const seg = Math.round((Date.now() - p.desde)/1000);
  if (p.estado === 'pendiente') el.innerHTML = MODO_PRUEBA
    ? `📥 Pedido #${p.id} registrado. En la etapa de prueba lo atiende Claude (Cowork) en su próxima pasada — sin consumir saldo de la API. Podés cerrar y volver más tarde: la Bandeja se actualiza sola. (${Math.floor(seg/60)} min)`
    : `<span class="reloj">⏳</span> Pedido #${p.id} en cola — el servidor lo toma en menos de 1 minuto (${seg}s)`;
  else if (p.estado === 'corriendo') el.innerHTML = `<span class="girar">🔄</span> Leyendo la carpeta… (${seg}s)`;
  else if (p.estado === 'listo') el.innerHTML = `✅ Listo: ${p.resumen || 'lectura terminada'}`;
  else if (p.estado === 'error') el.innerHTML = `<span style="color:#dc2626">✗ El motor falló: ${esc(p.error || '')}</span>`;
}
async function seguirPedido(){
  if (!MOTOR_PEDIDO) return;
  const {data} = await sb.from('compras_motor_cola').select('estado,resultado').eq('id', MOTOR_PEDIDO.id).maybeSingle();
  if (data){
    MOTOR_PEDIDO.estado = data.estado;
    if (data.estado === 'listo'){
      const r = data.resultado || {};
      const leidas = (r.a_revisar||0)+(r.sin_regla||0)+(r.auto||0);
      MOTOR_PEDIDO.resumen = `${leidas} nueva(s) en la Bandeja · ${r.ignoradas||0} fuera de norma · ${r.errores||0} error(es)`;
      pintarEstadoMotor();
      await cargarTodo();      // refresca Bandeja + franja 🤖
      MOTOR_PEDIDO = null;
      return;
    }
    if (data.estado === 'error'){ MOTOR_PEDIDO.error = (data.resultado||{}).error; pintarEstadoMotor(); return; }
  }
  pintarEstadoMotor();
  const limite = MODO_PRUEBA ? 3*60*60*1000 : 5*60*1000;
  if (Date.now() - MOTOR_PEDIDO.desde > limite){
    MOTOR_PEDIDO.estado = 'error'; MOTOR_PEDIDO.error = MODO_PRUEBA
      ? 'pasaron 3 horas sin respuesta — avisale a JP que corra la pasada desde Cowork'
      : 'pasaron 5 minutos y el servidor no respondió — revisar el cron de compras en el VPS';
    pintarEstadoMotor(); return;
  }
  setTimeout(seguirPedido, MODO_PRUEBA ? 30000 : 4000);
}

function _bandSort(lista){

    : (d[k] || '');

async function editarNumeroDoc(id){
  const d = enControl && enControl.id === id ? enControl : null; if (!d) return;
  if (_docClase(d) === 'poliza'){
    const ne = Object.assign({}, _docNE(d) || {});
    const v = prompt('Póliza, endoso y operación, como figuran en el papel.\nFormato: POLIZA ENDOSO OPERACION (ejemplo: 243675 0 238142). La clave fiscal queda: punto de venta = póliza+endoso, número = operación.', `${ne.poliza || ''} ${ne.endoso ?? 0} ${ne.operacion || ''}`);
    if (v === null) return;
    const m = String(v).trim().match(/^0*(\d{1,10})\s+0*(\d{1,3})\s+(?:[A-Z]{0,4}\s*)?0*(\d{1,10})$/i);
    if (!m){ alert('Formato: póliza, endoso y operación separados por espacio. Ejemplo: 243675 0 238142'); return; }
    ne.poliza = m[1]; ne.endoso = Number(m[2]); ne.operacion = m[3];
    const pv = Number(m[1] + String(Number(m[2]))), num = Number(m[3]);
    const {error} = await sb.from('compras_documentos').update({punto_venta: pv, numero: num, numeros_extra: ne, corregida: true}).eq('id', id);
    if (error){ alert(error.message.includes('duplicate') || error.message.includes('unique') ? 'Ya existe un comprobante de este proveedor con esa póliza/endoso/operación.' : 'No se pudo guardar: ' + error.message); return; }
    await sb.from('compras_eventos').insert({documento_id: id, usuario: (session && session.email) || null, accion: 'numero_corregido', detalle: {poliza: ne, punto_venta: pv, numero: num}});
    d.punto_venta = pv; d.numero = num; d.numeros_extra = ne;
    if (typeof toast === 'function') toast('✓ Números de la póliza corregidos');
    pintarControl();
    return;
  }
  const actual = `${d.tipo || 'FC'} ${d.letra || 'A'} ${String(d.punto_venta ?? '').padStart(4,'0')}-${String(d.numero ?? '').padStart(8,'0')}`;
  // (24-oct, JP) también el TIPO (FC / NC / ND) y la LETRA se corrigen acá
  const v = prompt('Tipo, letra, punto de venta y número, como figura en el papel.\nFormato: TIPO LETRA PPPP-NNNNNNNN (tipo FC, NC o ND · letra A, B, C, M, E o X). Ejemplo: NC A 0014-22110163', actual);
  if (v === null) return;
  const m = String(v).trim().toUpperCase().match(/^(?:(FC|NC|ND)\s+)?(?:([ABCMEX])\s+)?0*(\d{1,5})\s*-\s*0*(\d{1,8})$/);
  if (!m) { alert('Formato: TIPO LETRA punto de venta-número. Ejemplo: FC A 0014-22110163'); return; }
  const tipo = m[1] || d.tipo || 'FC', letra = m[2] || d.letra || 'A', pv = Number(m[3]), num = Number(m[4]);
  if (pv === Number(d.punto_venta) && num === Number(d.numero) && tipo === d.tipo && letra === d.letra) return;
  const {error} = await sb.from('compras_documentos').update({tipo, letra, punto_venta: pv, numero: num, corregida: true}).eq('id', id);
  if (error) { alert(error.message.includes('duplicate') || error.message.includes('unique') ? 'Ya existe un comprobante de este proveedor con ese número.' : 'No se pudo guardar: ' + error.message); return; }
  await sb.from('compras_eventos').insert({documento_id: id, usuario: (session && session.email) || null, accion: 'numero_corregido', detalle: {antes: actual, despues: `${String(pv).padStart(4,'0')}-${String(num).padStart(8,'0')}`}});
  d.punto_venta = pv; d.numero = num; d.tipo = tipo; d.letra = letra;
  const n = document.querySelector('.fx-cab .fx-num a, .fx-cab .fx-num span.fx-numtxt'); if (n) n.textContent = `${esc(tipo)} ${esc(letra)} ${String(pv).padStart(4,'0')}-${String(num).padStart(8,'0')}`;
  if (typeof toast === 'function') toast('✓ Número corregido');
}
async function abrirControl(id){
  await cargarCatalogosGastos();
  enControl = BANDEJA.find(d => d.id === id);
  if (!enControl) return;
  delete enControl._reparto; delete enControl._gBase;   // cada apertura arranca de la sugerencia
  const neto = Number(enControl.neto_gravado||0) + Number(enControl.neto_no_gravado||0) + Number(enControl.exento||0);
  lineasControl = [{concepto: enControl.sug_concepto || '', monto: Math.round((neto || Number(enControl.total)) * 100)/100}];
  // (23-sep) Factura con parte gravada Y parte no gravada (Edenor: tasas y contribuciones): se propone
  // partida en dos, como en el Dragonfish — el concepto gravado y su hermano "no gravado".
  const _ng = Number(enControl.neto_no_gravado||0) + Number(enControl.exento||0), _gr = Number(enControl.neto_gravado||0);
  const _herm = _conceptoNoGravado(enControl.sug_concepto);
  if (_ng > 0 && _gr > 0 && _herm){
    lineasControl = [{concepto: enControl.sug_concepto, monto: Math.round(_gr*100)/100},
                     {concepto: _herm, monto: Math.round(_ng*100)/100}];
  }
  pintarControl();
  // Desglose impositivo (la RPC de la bandeja no lo trae): IVA por alícuota, percepciones y otros tributos
  try {
    const { data: imp } = await sb.from('compras_documentos')
      .select('iva_21,iva_105,iva_27,iva_otros,percep_iva,percep_iibb_caba,percep_iibb_ba,otros_tributos,fecha_vto,cae,cae_vto,extraido_json,descuentos_extra,numero_interno,fecha_ingreso').eq('id', id).single();
    if (imp && enControl && enControl.id === id){ Object.assign(enControl, imp); enControl._impuestosOk = true; pintarControl(); }
  } catch (_) {}
  // Renglones de la factura (mercadería) con el control contra las listas COMPRA / COSTO del Dragonfish
  try {
    const { data: rg } = await sb.rpc('compras_doc_renglones', { p_doc: id });
    if (enControl && enControl.id === id){ enControl._renglones = rg || []; pintarControl(); }
  } catch (_) {}
  try {
    const { data: ac } = await _arcaDe(enControl.cuit_emisor);
    if (enControl && enControl.id === id){ enControl._arca = ac; pintarControl(); }
  } catch (_) {}
  { const e = enControl; await _remitosDelDoc(e); if (enControl === e) pintarControl(); }
  const {data} = await sb.rpc('compras_conceptos_proveedor', {p_cuit: enControl.cuit_emisor});
  enControl._usados = data || [];
  pintarControl();
}
function cerrarControl(){
  const o = document.getElementById('ctrl-overlay');
  if (o) o.remove();
  document.body.style.overflow = '';
  enControl = null;
}

// ── Desglose impositivo del comprobante (pedido JP 11-sep: ver IVA, % y percepciones por separado) ──
function _desgloseImpositivo(d, neto){
  if (!d._impuestosOk) return '<p class="mini">Cargando desglose impositivo…</p>';
  const n = x => Number(x || 0);
  const grav = n(d.neto_gravado), nograv = n(d.neto_no_gravado), ex = n(d.exento);
  const pct = (imp, base) => base > 0 ? (imp / base * 100).toLocaleString('es-AR', { maximumFractionDigits: 2 }) + ' %' : '—';
  const filas = [];
  const add = (grupo, nombre, importe, base, esperado) => {
    if (!importe) return;
    const p = base > 0 ? importe / base * 100 : null;
    const raro = esperado != null && p != null && Math.abs(p - esperado) > 0.6;   // alícuota que no coincide con la nominal
    filas.push(`<tr><td>${grupo}</td><td>${nombre}</td><td class="num">${plata(base)}</td>
      <td class="num" style="${raro ? 'color:#b45309;font-weight:600' : ''}" title="${raro ? 'La alícuota efectiva no coincide con la nominal: revisar la base o el importe' : 'importe ÷ base'}">${pct(importe, base)}${raro ? ' ⚠' : ''}</td>
      <td class="num"><b>${plata(importe)}</b></td></tr>`);
  };
  // IVA: base = neto gravado. Si hay más de una alícuota no se puede repartir la base sin los renglones: se usa la alícuota nominal.
  const ivas = [['IVA 21 %', n(d.iva_21), 21], ['IVA 10,5 %', n(d.iva_105), 10.5], ['IVA 27 %', n(d.iva_27), 27]].filter(x => x[1]);
  if (ivas.length === 1) add('IVA', ivas[0][0], ivas[0][1], grav, ivas[0][2]);
  else ivas.forEach(([nom, imp, al]) => add('IVA', nom, imp, imp / (al / 100), al));
  if (n(d.iva_otros)) add('IVA', 'IVA otras alícuotas', n(d.iva_otros), grav, null);
  add('Percepción', 'Percepción IVA', n(d.percep_iva), grav, null);
  add('Percepción', 'IIBB CABA', n(d.percep_iibb_caba), neto, null);
  add('Percepción', 'IIBB Buenos Aires', n(d.percep_iibb_ba), neto, null);
  add('Otros', 'Otros tributos / impuestos internos', n(d.otros_tributos), neto, null);
  const sumaImp = n(d.iva_21) + n(d.iva_105) + n(d.iva_27) + n(d.iva_otros) + n(d.percep_iva) + n(d.percep_iibb_caba) + n(d.percep_iibb_ba) + n(d.otros_tributos);
  const dif = Math.round((n(d.total) - neto - sumaImp) * 100) / 100;
  return `<details class="c-imp" ${filas.length ? 'open' : ''} style="margin:6px 0 10px;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;">
    <summary style="cursor:pointer;font-size:12.5px;font-weight:600;color:var(--mut);">🧾 Desglose impositivo · ${filas.length ? filas.length + ' concepto(s)' : 'sin impuestos discriminados'}</summary>
    <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin:6px 0 4px;">
      <span>Neto gravado <b>${plata(grav)}</b></span>
      ${nograv ? `<span>No gravado <b>${plata(nograv)}</b></span>` : ''}
      ${ex ? `<span>Exento <b>${plata(ex)}</b></span>` : ''}
    </div>
    ${filas.length ? `<table style="width:100%;font-size:12.5px;"><thead><tr><th></th><th>Impuesto</th><th class="num">Base</th><th class="num">%</th><th class="num">Importe</th></tr></thead>
      <tbody>${filas.join('')}</tbody>
      <tfoot><tr><td colspan="4" style="text-align:right;color:var(--mut);">Total impuestos</td><td class="num"><b>${plata(sumaImp)}</b></td></tr></tfoot></table>` : ''}
    <div class="mini" style="margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;${Math.abs(dif) > 1 ? 'color:#b91c1c;font-weight:600' : 'color:#166534'}">
      <span>${Math.abs(dif) > 1 ? `⚠ Neto + impuestos no llegan al total: faltan ${plata(dif)} (el motor no identificó algún concepto — revisar el PDF)` : '✓ Neto + impuestos = total de la factura'}</span>
      <button class="act op-ico" type="button" onclick="_editarImportes()" title="Corregir importes: si el motor leyó mal algún importe, cargalo a mano">${ico('lapiz','s')}</button>
    </div>

}


// ═══════════════════════════════════════════════════════════════════════
//  FORMATO "ESPEJO DE LA FACTURA" (decisión JP 22-sep: opción A)
//  El modal de control y el resumen se arman con la misma anatomía que el
//  papel: proveedor arriba a la izquierda, datos del comprobante a la derecha,
//  renglones en el medio, pie con la pirámide subtotal → neto → IVA → total.
//  Lo que agrega el módulo (concepto, control contra lista, planilla) va en
//  bloques aparte para que lo de la izquierda sea solo lo que dice el papel.
// ═══════════════════════════════════════════════════════════════════════
const _FX_ESTADO = {
  ok:         ['✓ lista', '#166534', 'Coincide con la lista: precio e importe iguales a la lista COSTO (con descuento) vigente a la fecha', 'ok'],
  ok_precio:  ['✓ precio', '#166534', 'Coincide el precio: el precio unitario es el de la lista COMPRA, pero el descuento difiere de la lista COSTO', 'ok'],
  difiere:    ['≠ lista', '#b45309', 'Difiere de la lista del Dragonfish', 'alerta'],
  sin_lista:  ['sin lista', '#64748b', 'Sin lista: el SKU no tiene precio cargado en el Dragonfish a esa fecha', 'pregunta'],
  sin_sku:    ['sin SKU', '#b91c1c', 'Sin SKU: no se pudo traducir el código del proveedor. Asignalo con el eslabón de al lado o en Equivalencias', 'link'],
  sin_stock:  ['no es stock', '#64748b', 'No es stock: renglón que se paga pero no entra al stock (cajas, fletes)', 'caja'],
  desglosado: ['🎨 por color', '#6d28d9', 'Desglosado por color: la factura lo trae como un solo renglón; en el remito está abierto por color (Mercadería › Remitos para importar › ver)', 'paleta'],
};
const _fxPct = v => v == null ? '' : (v > 0 ? '+' : '') + Number(v).toLocaleString('es-AR', {maximumFractionDigits: 1}) + ' %';
// (24-sep, JP) Un renglón = cant × p.unit × (1 − dto). Mismas cuentas que compras_doc_renglones / compras_renglones_guardar.
const _r2 = x => Math.round((Number(x) || 0) * 100) / 100;
const _rengN = n => Number(n || 0).toLocaleString('es-AR', {maximumFractionDigits: 2});
function _rengPun(r){ return r.precio_unitario == null ? null : Number(r.precio_unitario) * (1 - Number(r.descuento_pct || 0) / 100); }
function _rengNeto(r){ const pu = _rengPun(r); return pu == null ? Number(r.importe || 0) : _r2(Number(r.cantidad || 0) * pu); }
// El control contra lista se recalcula en el navegador cuando se edita un renglón (misma regla que la RPC)
function _rengEstado(r){
  const lc = r.lista_compra != null ? Number(r.lista_compra) : null, lk = r.lista_costo != null ? Number(r.lista_costo) : null;
  // (29-sep) Con pack (PX2, PACK X 3) la lista es por unidad nuestra: se compara el precio ÷ pack.
  const pk = Number(r.pack) > 1 ? Number(r.pack) : 1;
  const pu = r.precio_unitario != null ? Number(r.precio_unitario) / pk : null, pun0 = _rengPun(r), pun = pun0 != null ? pun0 / pk : null;
  const dp = lc > 0 && pu != null ? Math.round((pu / lc - 1) * 10000) / 100 : null;
  const dk = lk > 0 && pun != null ? Math.round((pun / lk - 1) * 10000) / 100 : null;
  let e;
  if (r.sin_stock) e = 'sin_stock';
  else if (!r.sku) e = r.estado === 'desglosado' ? 'desglosado' : 'sin_sku';
  else if (lc == null && lk == null) e = 'sin_lista';
  else if (lk > 0 && pun != null && Math.abs(pun / lk - 1) <= 0.005) e = 'ok';
  else if (lc > 0 && pu != null && Math.abs(pu / lc - 1) <= 0.005) e = 'ok_precio';
  else e = 'difiere';
  return {estado: e, dif_precio_pct: dp, dif_costo_pct: dk};
}
// Descuentos generales (no por producto: pago contado, bonificación, etc.). Con % se calcula sobre la suma de renglones.
function _descExtras(d, sub){
  const arr = d._descExtra ?? d.descuentos_extra ?? [];
  return arr.map(x => ({...x, monto: (x.pct !== null && x.pct !== undefined && x.pct !== '') ? _r2(sub * Number(x.pct) / 100) : _r2(x.importe)}));
}

// Última consulta al padrón de ARCA para ese CUIT (null si nunca se validó)
async function _arcaDe(cuit){
  if (!cuit) return {data: null};
  const r = await sb.from('compras_arca_consultas').select('cuit,vigente,estado_clave,cond_iva,consultado_at').eq('cuit', String(cuit)).maybeSingle();
  return {data: r.data || null};
}
// Consulta a ARCA desde el modal de control / resumen (misma cola que la ficha del proveedor)
async function _arcaConsultarDoc(cuit){
  const d = enControl; if (!d || String(d.cuit_emisor) !== String(cuit)) return;
  d._arcaBuscando = true; pintarControl();
  try {
    const { data, error } = await sb.rpc('compras_arca_pedir', { p_cuit: String(cuit).replace(/\D/g,''), p_forzar: false });
    if (error || !data?.ok) throw new Error(error?.message || data?.motivo || 'No se pudo pedir la consulta');
    let c = data.consulta;
    for (let i = 0; i < 45 && !c; i++){
      await new Promise(r => setTimeout(r, 2000));
      const { data: e } = await sb.rpc('compras_arca_estado', { p_cola_id: data.cola_id });
      if (e?.estado === 'listo' && e.consulta) c = e.consulta;
      if (e?.estado === 'error') throw new Error('El consultor de ARCA no respondió. ¿Está corriendo arca_padron.py en la PC de JP?');
    }
    if (!c) throw new Error('ARCA no respondió en 90 segundos. Probá de nuevo en un rato.');
    if (enControl && enControl.id === d.id) enControl._arca = c;
  } catch (e) { alert(e.message); }
  if (enControl && enControl.id === d.id){ enControl._arcaBuscando = false; pintarControl(); }
}
// (28-sep, JP) Remitos asociados a la factura, para el botón "📦 Ver remito" del control/resumen.

function _numRemito(r){ return `${String(r.punto_venta||0).padStart(4,'0')}-${String(r.numero).padStart(8,'0')}`; }

// Renglones del papel. Con renglones reales (mercadería): cant · descripción/SKU · p.unit · dto · neto · control.

        <td class="num">${ed ? inp(i, 'precio_unitario', r.precio_unitario, 96) : (r.precio_unitario != null ? plata(r.precio_unitario) : '—')}</td>

        <td class="num" id="fx-pun-${i}">${pun != null ? plata(pun) : '—'}</td>
        <td class="num" id="fx-net-${i}"><b>${plata(_rengNeto(r))}</b></td>

    </table></div>

  }

}

// Pie: la pirámide del papel. Devuelve las filas (label, valor, opciones).
function _facturaPieFilas(d, reng){
  const n = x => Number(x || 0);
  const grav = n(d.neto_gravado), nograv = n(d.neto_no_gravado), ex = n(d.exento);
  const neto = grav + nograv + ex;
  const filas = [];
  if (reng && reng.length){
    const sub = reng.reduce((a,r) => a + _rengNeto(r), 0);
    const ex = _descExtras(d, sub);
    const calc = sub - ex.reduce((a,x) => a + x.monto, 0);
    const resid = Math.round((calc - neto) * 100) / 100;
    if (ex.length || Math.abs(resid) > 0.02){
      filas.push(['Suma de renglones', sub]);
      ex.forEach(x => filas.push([`Dto. ${x.descripcion || 'general'}${x.pct !== null && x.pct !== undefined && x.pct !== '' ? ' ' + Number(x.pct).toLocaleString('es-AR') + ' %' : ''}`, -x.monto]));
      if (Math.abs(resid) > 0.02) filas.push([resid > 0 ? 'Descuento sin explicar' : 'Ajuste sin explicar', -resid, {raro: true, tip: 'La suma de renglones menos los descuentos no llega al neto de la factura: revisá precios, descuentos por renglón o agregá un descuento general.'}]);
    }
  }
  filas.push(['Neto gravado', grav, {b: true}]);
  if (nograv) filas.push(['No gravado', nograv]);
  if (ex) filas.push(['Exento', ex]);
  const pct = (imp, base) => base > 0 ? imp / base * 100 : null;
  [['IVA 21 %', n(d.iva_21), 21], ['IVA 10,5 %', n(d.iva_105), 10.5], ['IVA 27 %', n(d.iva_27), 27]].forEach(([nom, imp, al]) => {
    if (!imp) return;
    const ivas = [n(d.iva_21), n(d.iva_105), n(d.iva_27)].filter(Boolean).length;
    const p = ivas === 1 ? pct(imp, grav) : al;
    filas.push([nom, imp, {raro: p != null && Math.abs(p - al) > 0.6, p}]);
  });
  if (n(d.iva_otros)) filas.push(['IVA otras alícuotas', n(d.iva_otros), {raro: true, tip: 'IVA de ajuste: el histórico lo metió para que el comprobante cerrara'}]);
  if (n(d.percep_iva)) filas.push(['Percepción IVA', n(d.percep_iva)]);
  if (n(d.percep_iibb_caba)) filas.push(['Perc. IIBB CABA', n(d.percep_iibb_caba)]);
  if (n(d.percep_iibb_ba)) filas.push(['Perc. IIBB Buenos Aires', n(d.percep_iibb_ba)]);
  if (n(d.otros_tributos)) filas.push(['Otros tributos', n(d.otros_tributos)]);
  const sumaImp = n(d.iva_21) + n(d.iva_105) + n(d.iva_27) + n(d.iva_otros) + n(d.percep_iva) + n(d.percep_iibb_caba) + n(d.percep_iibb_ba) + n(d.otros_tributos);
  const dif = Math.round((n(d.total) - neto - sumaImp) * 100) / 100;
  return {filas, neto, sumaImp, dif};
}

function _facturaPie(d, reng, opts = {}){
  if (!d._impuestosOk && !opts.listo) return '<p class="mini">Cargando el pie de la factura…</p>';
  const {filas, neto, dif} = _facturaPieFilas(d, reng);
  const cargado = (d.cae || (d.extraido_json||{}).cae), caeVto = d.cae_vto || (d.extraido_json||{}).cae_vto;
  const checks = [];
  const okDif = Math.abs(dif) <= 1;
  checks.push([okDif, okDif ? 'Neto + IVA + percepciones = total' : `Neto + impuestos no llegan al total: faltan ${plata(dif)}`]);
  // (v151, JP) SKU y lista COSTO solo se controlan en MERCADERÍA; en gastos los renglones son informativos
  const _esMercCtl = (document.getElementById('ctrl-tipo')?.value || d.tipo_gasto) === 'mercaderia';
  if (reng && reng.length && _esMercCtl){
    const conSku = reng.filter(r => r.sku && !r.sin_stock), sinSku = reng.filter(r => !r.sku && !r.sin_stock && r.estado !== 'desglosado');
    const _e = r => _rengEstado(r).estado;
    const okL = conSku.filter(r => _e(r) === 'ok' || _e(r) === 'ok_precio').length, difL = conSku.filter(r => _e(r) === 'difiere').length, sinL = conSku.filter(r => _e(r) === 'sin_lista').length;
    checks.push([difL === 0, `Precio vs lista Dragonfish: ${okL} de ${conSku.length} coinciden${difL ? ` · ${difL} difieren` : ''}${sinL ? ` · ${sinL} sin lista` : ''}`]);
    if (sinSku.length) checks.push([false, `${sinSku.length} renglón(es) sin SKU (🔗 Equivalencias)`]);
  }
  if (reng && reng.length && _docClase(d) === 'poliza'){
    const sub = reng.reduce((a,r) => a + _rengNeto(r), 0), tot = Number(d.total || 0);
    const okQ = Math.abs(sub - tot) <= 1.5;
    checks.push([okQ, okQ ? `Las ${reng.length} cuotas suman el total de la póliza` : `Las cuotas suman ${plata(sub)} y el total es ${plata(tot)} (dif ${plata(sub - tot)})`]);
  } else if (reng && reng.length){
    const sub = reng.reduce((a,r) => a + _rengNeto(r), 0);
    const ex = _descExtras(d, sub), calc = sub - ex.reduce((a,x) => a + x.monto, 0);
    const okSub = Math.abs(calc - neto) <= 1;
    checks.push([okSub, okSub ? (ex.length ? 'Renglones − descuentos generales = neto' : 'Los renglones suman el neto')
      : `Renglones${ex.length ? ' − descuentos' : ''} dan ${plata(calc)} y el neto de la factura dice ${plata(neto)} (dif ${plata(calc - neto)})`]);
  }
  if (opts.lineasOk != null) checks.push([opts.lineasOk, opts.lineasTxt]);
  if (_docClase(d) === 'factura') checks.push([!!cargado && !!caeVto, cargado ? (caeVto ? 'CAE y vencimiento leídos' : 'CAE leído · falta el vencimiento') : 'Falta el CAE']);
  else checks.push([true, `${_claseTxt[_docClase(d)] || 'Documento'}: no lleva CAE`]);
  if (opts.vtoCheck !== false) checks.push([!!(d.fecha_vto || (d.extraido_json||{}).fecha_vto), (d.fecha_vto || (d.extraido_json||{}).fecha_vto) ? 'Vencimiento cargado (define la fecha de pago)' : 'Sin vencimiento: cargalo arriba, es la fecha de pago de la OP']);
  return `<div class="fx-pie">
    <div>
      <div style="font-weight:700;font-size:12.5px;color:var(--mut);margin-bottom:4px">CONTROL</div>
      ${checks.map(([ok, tx]) => `<div class="mini" style="color:${ok ? '#166534' : '#b45309'};margin:2px 0">${ok ? '✓' : '⚠'} ${esc(tx)}</div>`).join('')}
      ${opts.extra || ''}
    </div>
    <table class="fx-tot"><tbody>
      ${filas.map(([l, v, o = {}]) => `<tr><td style="color:var(--mut)">${esc(l)}${o.raro ? ` <span title="${esc(o.tip || ('La alícuota efectiva (' + (o.p != null ? o.p.toFixed(2) : '?') + ' %) no coincide con la nominal: revisar la base o el importe'))}" style="color:#b45309;cursor:help">⚠</span>` : ''}</td>
        <td class="num" style="${o.b ? 'font-weight:600' : ''}">${plata(v)}</td></tr>`).join('')}
      <tr class="fx-total"><td>${opts.editar ? `<button class="act op-ico" type="button" style="margin:0 6px 0 0" onclick="_editarImportes()" title="Corregir importes: si el motor leyó mal algún importe, cargalo a mano">${ico('lapiz','s')}</button>` : ''}TOTAL</td><td class="num">${plata(d.total)}</td></tr>
    </tbody></table>
  </div>`;
}

function _tipoGastoCambio(tipo){
  const g = document.getElementById('ctrl-gestion'); if (!g) return;
  // la planilla es de GASTOS: mercadería, inversiones y Z no van (editable igual)
  g.checked = !['no_actividad','mercaderia','inversiones'].includes(tipo);
  _gestionCambio();
}

      <div id="fx-pie-wrap">${_pieControlHTML()}</div><div id="imp-edit"></div>

      <div class="c-fila" style="gap:12px">
        <label>CAE <input id="ctrl-cae" value="${esc(d.cae || d.extraido_json?.cae || '')}" placeholder="14 dígitos" inputmode="numeric" maxlength="20" style="width:150px"></label>

        <label>Tipo de gasto
          <select id="ctrl-tipo" onchange="_tipoGastoCambio(this.value)">
            <option value="">— sin clasificar —</option>
            ${Object.entries(TIPOS).map(([k,v]) =>
              `<option value="${k}" ${d.tipo_gasto===k?'selected':''}>${v}</option>`).join('')}
          </select></label>
        <label class="c-tog" title="Va al Libro IVA (contabilidad formal). Naranja = sí"><input type="checkbox" id="ctrl-formal" ${d.computa_formal!==false?'checked':''}><span class="eico">${ico('iva')}</span></label>
        <label class="c-tog" title="Va a la planilla de gastos (gestión). Naranja = sí"><input type="checkbox" id="ctrl-gestion" onchange="_gestionCambio()" ${gs.computa!==false?'checked':''}><span class="eico">${ico('hoja')}</span></label>
      </div>
      <div id="ctrl-gestion-box" style="display:${gs.computa!==false?'block':'none'};margin-top:8px;padding:8px 10px;border:1px dashed var(--line);border-radius:8px">
        <div id="ctrl-g-rep">${_gRepartoHTML()}</div>
        <div id="ctrl-g-aviso" class="mini" style="display:none;margin-top:6px;padding:6px 8px;border-radius:6px;background:#fef3c7;color:#92400e"></div>
      </div>
      <div id="nota-doc-box-${d.id}" style="${d.nota ? '' : 'display:none;'}margin-top:12px">${_notaEditorHTML(d, 'control')}</div>
    </div>

    ${docCerrado(d) ? `<div class="aviso-amb" style="margin:0 17px 10px"><div>${ico('candado','s')} El mes ${esc(_mesDoc(d).split('-').reverse().join('/'))} ya se envió al estudio${SOY_ADMIN ? ': podés modificarlo porque sos el administrador, pero el listado que recibió el estudio ya no va a coincidir.' : ': este comprobante no se puede modificar. Si hace falta, pedíselo a JP.'}</div></div>` : ''}
    <div class="c-pie">
      <button class="act gh" onclick="rechazarDoc()" style="color:var(--bad);border-color:var(--bad)" ${docCerrado(d) && !SOY_ADMIN ? 'disabled style="opacity:.4"' : ''}>Rechazar</button>
      <button class="act gh ico-btn" onclick="abrirAvisoMotor(${d.id})" title="El motor leyó mal este comprobante (renglones, importes, proveedor…): contá qué estuvo mal y JP ajusta el lector">${ico('robot','s')} Leyó mal</button>
      <button class="act gh ico-btn" id="ctrl-nota-btn" onclick="abrirNotaDoc(${d.id}, 'control')" title="${d.nota ? esc(d.nota) : 'Agregar una nota a este comprobante (queda guardada y se ve en el resumen)'}" style="${d.nota ? 'background:#fef3c7;border-color:#d97706;color:#92400e' : ''}">${ico('hoja','s')} ${d.nota ? 'Nota' : 'Agregar nota'}</button>
      <div style="flex:1"></div>
      <button class="act gh" onclick="cerrarControl()">Cancelar</button>
      ${docCerrado(d) && !SOY_ADMIN ? `<button class="act" disabled style="opacity:.4" title="Mes enviado al estudio: no se puede modificar">${ico('candado','s')} Mes cerrado</button>` : `<button class="act" onclick="contabilizar()">✓ Contabilizar</button>`}
    </div>
    <datalist id="dl-alic"><option value="21"></option><option value="10.5"></option><option value="27"></option><option value="0">No gravado</option><option value="2.5"></option><option value="5"></option></datalist>
    <datalist id="dl-conceptos">${CONCEPTOS.map(c =>
      `<option value="${esc(c.codigo)}">${esc(c.descripcion||'')}</option>`).join('')}</datalist>

  let ov = document.getElementById('ctrl-overlay');

    ov.id = 'ctrl-overlay';
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';

  ov.innerHTML = html;
  _avisoUnidadConcepto();

function pintarNums(){
  const d = enControl; if (!d) return;
  const neto = Number(d.neto_gravado||0) + Number(d.neto_no_gravado||0) + Number(d.exento||0);
  const asignado = lineasControl.reduce((a,l) => a + (Number(l.monto)||0), 0);
  const dif = Math.round((neto - asignado) * 100) / 100;
  const el = document.getElementById('ctrl-dif');
  if (el) el.innerHTML = _difConceptosHTML(dif, neto);
  _repintarPie();
}
// (8-oct, JP) el control "los conceptos suman el neto" es un ícono con el detalle en tooltip
function _difConceptosHTML(dif, neto){
  return Math.abs(dif) < 0.02
    ? `<span class="eico" style="color:var(--ok);background:#dcfce7;width:22px;height:22px" title="Los conceptos suman el neto de la factura (${plata(neto)})">${ico('ok','s')}</span>`
    : `<span class="eico" style="color:#92400e;background:#fef3c7;width:22px;height:22px" title="Faltan ${plata(dif)} por asignar a conceptos (neto ${plata(neto)})">${ico('alerta','s')}</span>`;
}
function toggleUsados(){ const u=document.getElementById('ctrl-usados'); if(u) u.style.display = u.style.display==='none' ? 'block' : 'none'; }
function usarConcepto(cod){ lineasControl[0].concepto = cod; pintarControl(); }
function toggleNuevoConcepto(){
  const f = document.getElementById('nc-form');
  if (f) f.style.display = f.style.display === 'none' ? 'block' : 'none';
}
async function crearConcepto(){
  const cod  = (document.getElementById('nc-codigo').value || '').trim().toUpperCase();
  const desc = (document.getElementById('nc-desc').value || '').trim();
  const alic = document.getElementById('nc-alic').value;
  if (!cod || !desc){ alert('Completá código y descripción.'); return; }
  const {data, error} = await sb.rpc('compras_crear_concepto',
    {p_codigo: cod, p_descripcion: desc, p_alicuota: alic});
  if (error){ alert('No se pudo crear: ' + error.message); return; }
  CONCEPTOS.push({codigo: cod, descripcion: desc, alicuota: alic});
  // lo pone directo en la primera línea vacía (o en la primera)
  const libre = lineasControl.find(l => !(l.concepto||'').trim()) || lineasControl[0];
  libre.concepto = cod;
  pintarControl();
}
function cambioCotiz(v){
  const c = Number(v);
  if (!enControl || !c || c <= 0) return;
  const nuevoTotal = Math.round(Number(enControl.importe_moneda) * c * 100) / 100;
  enControl._cotizNueva = c;
  enControl.cotizacion = c;
  enControl.total = nuevoTotal;
  enControl.neto_no_gravado = nuevoTotal;
  // (24-oct) la imputación se re-escala con la cotización: una línea = el total; varias = misma proporción
  if (lineasControl.length === 1) lineasControl[0].monto = nuevoTotal;
  else if (lineasControl.length > 1){
    const suma = lineasControl.reduce((a, l) => a + (Number(l.monto) || 0), 0);
    if (suma > 0){
      let acum = 0;
      lineasControl.forEach((l, i) => {
        if (i === lineasControl.length - 1) l.monto = Math.round((nuevoTotal - acum) * 100) / 100;
        else { l.monto = Math.round((Number(l.monto) || 0) / suma * nuevoTotal * 100) / 100; acum += l.monto; }
      });
    }
  }
  pintarControl();
}
function agregarLinea(){ lineasControl.push({concepto:'', monto:0}); pintarControl(); }
function quitarLinea(i){ lineasControl.splice(i,1); pintarControl(); }

// Hoy en hora argentina (toISOString da el día siguiente después de las 21 hs)
function _hoyAR(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires'}).format(new Date()); }

async function contabilizar(){
  const lineas = lineasControl
    .filter(l => (l.concepto||'').trim())
    .map(l => ({concepto: l.concepto.trim(), monto_neto: Number(l.monto)||0,
                alicuota: (l.alicuota === '' || l.alicuota == null) ? null : String(Number(l.alicuota))}));
  if (!lineas.length){ alert('Elegí al menos un concepto contable.'); return; }
  const alicMala = lineas.find(l => l.alicuota !== null && (isNaN(Number(l.alicuota)) || Number(l.alicuota) < 0 || Number(l.alicuota) > 100));
  if (alicMala){ alert('La alícuota de IVA tiene que ser un número entre 0 y 100 (ej: 21, 10.5, 27, 0).'); return; }
  const cae = (document.getElementById('ctrl-cae')?.value || '').trim(), caeVto = document.getElementById('ctrl-cae-vto')?.value || null;
  if (cae && !/^\d{14}$/.test(cae) && !confirm('El CAE suele tener 14 dígitos y este tiene ' + cae.length + '. ¿Guardar igual?')) return;
  const vtoIn = document.getElementById('ctrl-vto')?.value || '';
  if (!vtoIn && !confirm('La factura no tiene FECHA DE VENCIMIENTO cargada.\n\nSin vencimiento, la orden de pago no sabe cuándo pagarla (va a proponer la fecha del día). ¿Contabilizar igual?')) return;
  for (const [id, t] of [['ctrl-ingreso','de ingreso'],['ctrl-vto','de vencimiento'],['ctrl-cae-vto','de vencimiento del CAE']]){
    const el = document.getElementById(id);
    if (_fechaInvalida(el)){ alert('⚠ La fecha ' + t + ' no es válida. Revisá día, mes y año.'); el.focus(); return; }
  }
  const ingIn = document.getElementById('ctrl-ingreso')?.value || null;
  // (24-sep, JP) Tope de 12 meses entre emisión e ingreso (la base también lo frena).
  if (ingIn && enControl.fecha_emision && ingIn > _sumarMeses(enControl.fecha_emision, 12)){
    alert('La fecha de ingreso (' + _fecha(ingIn) + ') supera el tope de 12 meses desde la emisión (' + _fecha(enControl.fecha_emision)
      + ').\n\nÚltimo día permitido: ' + _fecha(_sumarMeses(enControl.fecha_emision, 12)) + '.');
    return;
  }
  if (ingIn && ingIn.slice(0,7) !== _hoyAR().slice(0,7)
      && !confirm('La fecha de ingreso (' + fechaCorta(ingIn) + ') es de otro mes que hoy.\n\nEsta factura va a entrar en el Libro IVA Compras de ' + MESES[+ingIn.slice(5,7)-1] + ' ' + ingIn.slice(0,4) + '. ¿Seguro?')) return;
  if (ingIn && enControl.fecha_emision && ingIn < enControl.fecha_emision){ alert('La fecha de ingreso no puede ser anterior a la emisión (' + fechaCorta(enControl.fecha_emision) + ').'); return; }
  const niTxt = (document.getElementById('ctrl-numint')?.value || '').trim();
  if (niTxt && !(/^\d+$/.test(niTxt) && Number(niTxt) > 0)){ alert('El número interno tiene que ser un entero mayor a cero (o dejalo vacío para que se asigne solo).'); return; }
  if (vtoIn && enControl.fecha_emision && vtoIn < enControl.fecha_emision){ alert('El vencimiento no puede ser anterior a la emisión (' + fechaCorta(enControl.fecha_emision) + ').'); return; }
  // (24-sep) Renglones editados / descuentos generales: se guardan primero (queda el antes/después en eventos)
  if (enControl._rengDirty || enControl._descDirty){
    const dl = enControl._descExtra || [];
    if (dl.some(x => !String(x.descripcion || '').trim())){ alert('Cada descuento general necesita una descripción (ej. "Pago contado").'); return; }
    const sub = (enControl._renglones || []).reduce((a,r) => a + _rengNeto(r), 0);
    const {error: eR} = await sb.rpc('compras_renglones_guardar', {
      p_doc: enControl.id,
      p_renglones: enControl._rengDirty ? (enControl._renglones || []).map(r => ({nroitem: r.nroitem, cantidad: r.cantidad, precio_unitario: r.precio_unitario, descuento_pct: r.descuento_pct ?? 0})) : null,
      p_descuentos: enControl._descDirty ? _descExtras(enControl, sub).map(x => ({descripcion: x.descripcion, pct: (x.pct === '' ? null : x.pct), importe: x.monto})) : null,
    });
    if (eR){ alert('No se pudieron guardar los renglones: ' + eR.message); return; }
    enControl._rengDirty = false; enControl._descDirty = false;
  }
  // (24-sep) Planilla de gastos: una parte = como siempre · varias partes = reparto por unidad y/o período
  let gestionPayload = null;
  if (document.getElementById('ctrl-gestion').checked){
    const P = enControl._reparto || [];
    if (P.length > 1){
      const falta = P.findIndex(x => !x.periodo || !x.unidad || !x.categoria || x.importe == null || x.importe === '');
      if (falta >= 0){ alert('La parte ' + (falta+1) + ' del reparto está incompleta: necesita período, unidad, categoría e importe.'); return; }
      const suma = _r2g(P.reduce((a,x) => a + Number(x.importe), 0)), base = Number(enControl._gBase || 0);
      // (25-sep, JP) TRABA: los renglones tienen que sumar exacto el total (la base lo vuelve a controlar)
      if (Math.abs(suma - base) > 0.01){
        const dif = _r2g(suma - base);
        alert('No se puede contabilizar: el reparto no cierra.\n\nLos renglones suman ' + plata(suma) + ' y el total a la planilla es ' + plata(base) + ': ' + (dif > 0 ? 'sobran ' : 'faltan ') + plata(Math.abs(dif)) + '.\n\nCorregí el importe de algún renglón o el total a la planilla.');
        const el = document.getElementById('ctrl-g-rep'); if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
        return;
      }
      gestionPayload = {total: base, reparto: P.map(x => ({periodo: x.periodo, unidad: x.unidad, categoria: x.categoria, pct: null, importe: Number(x.importe)}))};
    } else if (P.length === 1){
      const x = P[0];
      gestionPayload = {periodo: x.periodo || null, unidad: x.unidad || null, categoria: x.categoria || null,
                        importe: x.importe == null || x.importe === '' ? null : Number(x.importe)};
    }
  }
  const {data, error} = await sb.rpc('compras_contabilizar', {
    p_doc_id: enControl.id,
    p_lineas: lineas,
    p_tipo_gasto: document.getElementById('ctrl-tipo').value || null,
    p_computa_formal:  document.getElementById('ctrl-formal').checked,
    p_computa_gestion: document.getElementById('ctrl-gestion').checked,
    p_cotizacion: enControl._cotizNueva || null,
    p_cae: cae || null, p_cae_vto: caeVto,
    p_fecha_vto: document.getElementById('ctrl-vto')?.value || null,
    p_fecha_ingreso: ingIn,
    p_numero_interno: niTxt ? Number(niTxt) : null,
    p_gestion: gestionPayload,
  });
  if (error){ alert('No se pudo contabilizar: ' + error.message); return; }
  // (24-oct, JP) póliza → un pago pendiente en Tesorería por cada cuota (en 🧪 no se crean)
  if (_docClase(enControl) === 'poliza'){

//    · Gestión  → cuánto se gastó y en qué (tipo de gasto, mes, proveedor)
//    · Estudio  → IVA Compras, percepciones sufridas y retenciones
//  Se separan porque responden preguntas distintas: la de gestión mira el
//  total pagado, la del estudio mira el crédito fiscal.
// ═══════════════════════════════════════════════════════════════════════
// (24-sep, JP) Los listados del estudio filtran por fecha de INGRESO y de EMISIÓN a la vez.
// Cada rango es opcional: "Desde" vacío = desde el principio · "Hasta" vacío = sin tope.
// listPor = a qué fila aplica el selector rápido de mes (‹ Mes Año ›).
let listPor = 'ingreso';
let listSub = 'gestion', LIST_IVA = null, LIST_PERC = null, LIST_RET = null, LIST_PDET = null, LIST_FUERA = null;
const _ymd = (y, m, d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const _finMes = (y, m) => new Date(y, m, 0).getDate();          // m = 1..12
function _rangoMes(y, m){ return { desde: _ymd(y, m, 1), hasta: _ymd(y, m, _finMes(y, m)) }; }
const _hoyIso = _hoyAR();
let listPer = { ing: _rangoMes(+_hoyIso.slice(0,4), +_hoyIso.slice(5,7)), emi: { desde: '', hasta: '' } };
const _listFila = () => listPor === 'emision' ? 'emi' : 'ing';

// Suma n meses a una fecha ISO igual que Postgres (31/01 + 1 mes = 28 o 29/02).
function _sumarMeses(iso, n){
  const y = +iso.slice(0,4), m0 = +iso.slice(5,7) - 1 + n, d = +iso.slice(8,10);
  const yy = y + Math.floor(m0 / 12), mm = ((m0 % 12) + 12) % 12 + 1;
  return _ymd(yy, mm, Math.min(d, _finMes(yy, mm)));
}
// Una fecha que el navegador no pudo interpretar (31/02, 32/01) o con un año absurdo.
function _fechaInvalida(el){
  if (!el || el.type !== 'date') return false;
  if (el.validity && el.validity.badInput) return true;
  const v = el.value; if (!v) return false;
  const y = +v.slice(0,4); return !(y >= 2000 && y <= 2100);
}
// Aviso para TODOS los campos de fecha del módulo, apenas se sale del campo.
// (28-sep, JP) Se valida al SALIR del campo, no mientras se escribe: al tipear el año
// dígito por dígito el navegador pasa por 0002, 0020, 0202… y cada paso disparaba
// 'change' con un año "absurdo" → alerta a mitad de camino, solo andaba el calendario.
document.addEventListener('change', e => {
  const el = e.target; if (!el || el.type !== 'date') return;
  if (!_fechaInvalida(el)) el.classList.remove('fecha-mala');   // mientras escribe: nada de alertas
}, true);
document.addEventListener('focusout', e => {
  const el = e.target; if (!el || el.type !== 'date') return;
  if (_fechaInvalida(el)){
    el.classList.add('fecha-mala');
    alert('⚠ Fecha inválida' + (el.validity && el.validity.badInput ? ': esa fecha no existe' : ' (' + _fecha(el.value) + ')')
      + '.\n\nRevisá día, mes y año — por ejemplo, el 32/01 o el 31/02 no existen.');
  } else el.classList.remove('fecha-mala');
}, true);

function _listMes(delta){
  const f = _listFila(), r = listPer[f];
  const base = r.desde || r.hasta || _hoyAR();
  const d = new Date(+base.slice(0,4), +base.slice(5,7) - 1 + delta, 1);
  listPer[f] = _rangoMes(d.getFullYear(), d.getMonth() + 1);
  LIST_IVA = null; cargarListadosEstudio();
}
// ¿la fila del selector rápido tiene exactamente un mes calendario?
function _listEsMesEntero(){
  const { desde: d, hasta: h } = listPer[_listFila()];
  if (!d || !h || d.slice(0,7) !== h.slice(0,7) || d.slice(8) !== '01') return false;
  return +h.slice(8) === _finMes(+d.slice(0,4), +d.slice(5,7));
}
function _listAnios(){
  const hoy = new Date().getFullYear(), arr = [];
  for (let a = hoy + 1; a >= 2019; a--) arr.push(a);
  return arr;
}
// Mes + año → el rango se arma solo (1 al último día), en la fila elegida.
function _listMesRapido(){
  const m = +document.getElementById('lp-mes').value, a = +document.getElementById('lp-anio').value;
  if (!m || !a) return;
  listPer[_listFila()] = _rangoMes(a, m);
  LIST_IVA = null; cargarListadosEstudio();
}
// Cambiar a qué fecha aplica el mes: el rango se muda de fila (como el filtro de antes).
function _listPorCambio(v){
  const de = _listFila(); listPor = v; const a = _listFila();
  if (de !== a){ listPer[a] = { ...listPer[de] }; listPer[de] = { desde: '', hasta: '' }; }
  LIST_IVA = null; cargarListadosEstudio();
}
function _listLimpiar(f){
  listPer[f] = { desde: '', hasta: '' };
  if (!listPer.ing.desde && !listPer.ing.hasta && !listPer.emi.desde && !listPer.emi.hasta){
    const h = _hoyAR(); listPer.ing = _rangoMes(+h.slice(0,4), +h.slice(5,7));
  }
  LIST_IVA = null; cargarListadosEstudio();
}
function _listPerCambio(){
  const ids = ['lp-ing-desde','lp-ing-hasta','lp-emi-desde','lp-emi-hasta'];
  for (const id of ids){ const el = document.getElementById(id); if (_fechaInvalida(el)){ el.focus(); return; } }
  const g = id => document.getElementById(id).value || '';
  const n = { ing: { desde: g('lp-ing-desde'), hasta: g('lp-ing-hasta') },
              emi: { desde: g('lp-emi-desde'), hasta: g('lp-emi-hasta') } };
  for (const [k, t] of [['ing','ingreso'],['emi','emisión']])
    if (n[k].desde && n[k].hasta && n[k].desde > n[k].hasta){
      alert('En la fecha de ' + t + ', "Desde" (' + _fecha(n[k].desde) + ') es posterior a "Hasta" (' + _fecha(n[k].hasta) + ').');
      return;
    }
  if (!n.ing.desde && !n.ing.hasta && !n.emi.desde && !n.emi.hasta){
    alert('Poné al menos una fecha, de ingreso o de emisión.\n\n(Un "Desde" vacío es "desde el principio"; un "Hasta" vacío, "sin tope".)');
    return;
  }
  listPer = n; LIST_IVA = null; cargarListadosEstudio();
}
// Rótulo del período, para el título y los nombres de archivo.
function _listRotulo(archivo){
  const { ing, emi } = listPer;
  const soloMesIng = _listEsMesEntero() && listPor === 'ingreso' && !emi.desde && !emi.hasta;
  if (soloMesIng && !archivo) return new Date(ing.desde + 'T12:00:00').toLocaleDateString('es-AR', {month:'long', year:'numeric'});
  const f = x => archivo ? x : _fecha(x);
  const parte = (r, t) => (r.desde || r.hasta)
    ? `${t} ${r.desde ? f(r.desde) : (archivo ? 'inicio' : 'el principio')} a ${r.hasta ? f(r.hasta) : (archivo ? 'hoy' : 'sin tope')}` : '';
  return [parte(ing, 'ingreso'), parte(emi, 'emisión')].filter(Boolean).join(archivo ? ' + ' : ' · ');
}

async function cargarListadosEstudio(){
  const c = document.getElementById('list-estudio');
  if (!c) return;
  if (!LIST_IVA) c.innerHTML = '<div class="vacio">Armando los listados…</div>';
  // p_prueba = el AMBIENTE, no "sumar los de prueba": en modo 🧪 se listan
  // SOLO los de test y en definitivo SOLO los reales. Nunca se mezclan.
  const P = { p_ing_desde: listPer.ing.desde || null, p_ing_hasta: listPer.ing.hasta || null,
              p_emi_desde: listPer.emi.desde || null, p_emi_hasta: listPer.emi.hasta || null, p_prueba: MODO_PRUEBA };
  // Las retenciones cuelgan de la ORDEN DE PAGO: van por su fecha, con el rango
  // que esté cargado (ingreso primero, si no emisión).
  const R = (listPer.ing.desde || listPer.ing.hasta) ? listPer.ing : listPer.emi;
  const [iva, per, ret, pdet] = await Promise.all([
    sb.rpc('compras_listado_iva', P),
    sb.rpc('compras_listado_percepciones', P),
    sb.rpc('compras_listado_retenciones', {p_desde: R.desde || '2000-01-01', p_hasta: R.hasta || '2999-12-31', p_prueba: MODO_PRUEBA}),
    sb.rpc('compras_listado_percepciones_detalle', P),
  ]);
  if (iva.error){ c.innerHTML = `<div class="alerta">${esc(iva.error.message)}</div>`; return; }
  // Siempre por fecha de emisión, de la más vieja a la más nueva (sort estable:
  // dentro del mismo día respeta el orden que ya trae la base).
  const porEmision = (x, y) => String(x.fecha_emision || '').localeCompare(String(y.fecha_emision || ''));
  LIST_IVA = (iva.data || []).sort(porEmision); LIST_PERC = per.data || []; LIST_RET = ret.data || [];
  LIST_PDET = (pdet.data || []).sort(porEmision);
  // Los que NO van al Libro IVA se muestran aparte: si un comprobante del
  // período no está en el listado, tiene que verse POR QUÉ, no desaparecer.
  let q = sb.from('compras_documentos')
    .select('tipo,letra,punto_venta,numero,proveedor_nombre,fecha_emision,fecha_ingreso,total,moneda')
    .eq('es_prueba', MODO_PRUEBA).eq('computa_formal', false);
  if (listPer.emi.desde) q = q.gte('fecha_emision', listPer.emi.desde);
  if (listPer.emi.hasta) q = q.lte('fecha_emision', listPer.emi.hasta);
  const {data: fuera} = await q.order('fecha_emision').order('numero').limit(3000);
  // mismo criterio que el Libro IVA para el ingreso: si no tiene, cuenta la emisión
  LIST_FUERA = (fuera || []).filter(d => {
    const fi = d.fecha_ingreso || d.fecha_emision || '';
    return (!listPer.ing.desde || fi >= listPer.ing.desde) && (!listPer.ing.hasta || fi <= listPer.ing.hasta);
  });
  _pintarEstudio();
}

async function enviarEstudio(per){
  const ventas = (document.getElementById('nota-overlay') || {})._ventas || [];
  const lista = t => String(document.getElementById(t)?.value || '').split(/[,;\s]+/).map(x => x.trim()).filter(Boolean);
  const para = lista('env-para'), cc = lista('env-cc');
  const asunto = (document.getElementById('env-asunto')?.value || '').trim(), cuerpo = (document.getElementById('env-cuerpo')?.value || '').trim();
  const malos = para.concat(cc).filter(m => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m));
  if (!para.length){ alert('Falta el mail del estudio (Para).'); return; }
  if (malos.length){ alert('Estos mails no parecen válidos: ' + malos.join(', ')); return; }
  if (!asunto){ alert('Falta el asunto.'); return; }
  const on = id => !!document.getElementById(id)?.checked;
  const btn = document.getElementById('env-btn'), est = document.getElementById('env-estado');
  btn.disabled = true; est.textContent = 'Armando los archivos…';
  _CAPTURA = [];
  try {
    if (on('env-a-estudio')) _bajarFormatoEstudio();
    if (on('env-a-iva')) _bajarIvaCompras();
    if (on('env-a-perc')) _bajarPercepciones();
    if (on('env-a-ret')) _bajarRetenciones();
    if (on('env-a-libro')){ _libBajarCompras('cb'); _libBajarCompras('al'); }
    if (on('env-a-ventas')) for (const a of ventas) await _libBajarVentas(per, a);
  } catch (e){ _CAPTURA = null; btn.disabled = false; est.textContent = ''; alert('No pude armar los archivos: ' + e.message); return; }
  const archivos = _CAPTURA; _CAPTURA = null;
  if (!archivos.length){ btn.disabled = false; est.textContent = ''; alert('No quedó ningún adjunto para mandar.'); return; }
  const carpeta = `${MODO_PRUEBA ? 'prueba/' : ''}${per}/${Date.now()}`, subidos = [];
  for (const a of archivos){
    est.textContent = `Subiendo ${a.nombre}…`;
    const path = `${carpeta}/${a.nombre}`;
    const r = await sb.storage.from('compras-estudio').upload(path, a.blob, {upsert: true, contentType: a.blob.type || 'application/octet-stream'});
    if (r.error){ btn.disabled = false; est.textContent = ''; alert(`No se pudo subir ${a.nombre}: ` + r.error.message); return; }
    subidos.push({path, nombre: a.nombre, bytes: a.blob.size});
  }
  const ins = await sb.from('compras_envios_estudio').insert({periodo: per + '-01', es_prueba: MODO_PRUEBA, para, cc, asunto, cuerpo, archivos: subidos, pedido_por: session.email || null});
  if (ins.error){ btn.disabled = false; est.textContent = ''; alert('No se pudo encolar el envío: ' + ins.error.message); return; }
  if (on('env-guardar')){
    const cfg = await _envioCfg();
    const mesTxt = _envioMesTxt(per), des = t => String(t || '').split(mesTxt).join('{periodo}');
    const valor = {...cfg, para, cc, asunto: des(asunto), cuerpo: des(cuerpo)};
    const up = await sb.from('compras_config').upsert({clave: 'estudio_envio', valor, actualizado_por: session.email || null, actualizado_at: new Date().toISOString()});
    if (!up.error) ENVIO_CFG = valor;
  }
  document.getElementById('nota-overlay')?.remove();
  alert(`Envío encolado: ${subidos.length} adjuntos a ${para.join(', ')}. Sale desde la PC de JP en unos 5 minutos; en la tarjeta del mes vas a ver cuando salió.`);
  _pintarEnviosEstudio(per);
}

// ── Export ───────────────────────────────────────────────────────────────
// CSV con ; y coma decimal: Excel en español lo abre de una, sin librerías.
// Hay DOS formatos a propósito:
//  · "Formato estudio" = las mismas columnas del Subdiario que se manda hoy,
//    con el prefijo de comprobante del Dragonfish (FDC/NCC) y una sola columna
//    de alícuota variable, para que el estudio no tenga que cambiar nada.
//  · "IVA Compras completo" = una columna por alícuota + descuadre + alertas.
//    Es el que sirve para controlar, no para presentar.
// (24-oct, JP) Envío al estudio: con _CAPTURA activa, los "bajar" no descargan: dejan el archivo en la lista para subirlo.
let _CAPTURA = null;
const _capturar = (nombre, blob) => { if (_CAPTURA){ _CAPTURA.push({nombre, blob}); return true; } return false; };
function _csvBajar(nombre, filas){
  const blob = new Blob(['﻿' + filas.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  if (_capturar(nombre, blob)) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const _csvNum = v => (Number(v)||0).toFixed(2).replace('.', ',');
const _csvTxt = v => (v === null || v === undefined) ? '' : String(v).replace(/[;\r\n]/g, ' ');

// El Dragonfish nombra los comprobantes de compra FDC (factura), NCC (nota de
// crédito) y NDC (nota de débito). El módulo guarda FC/NC/ND.
// (24-oct, JP) Pólizas: punto de venta = póliza+endoso (2436750) y número = operación. ARCA acepta 5 dígitos de
// punto de venta, así que en los listados y el Libro IVA se cortan los primeros (decisión JP).
const _pvArca = x => String(x.punto_venta ?? 0).replace(/\D/g, '').slice(-5).padStart(5, '0');
const _docNE = d => (d && (d.numeros_extra || (d.extraido_json || {}).numeros_extra)) || null;
const _docClase = d => (d && (d.doc_clase || (d.extraido_json || {}).doc_clase)) || 'factura';
const _claseTxt = {poliza: 'Póliza', despacho: 'Despacho de importación', resumen_tarjeta: 'Resumen de tarjeta'};
const _compEstudio = x => ({FC:'FDC', NC:'NCC', ND:'NDC'}[x.tipo] || x.tipo) + ' ' +
  (x.letra || '') + ' ' + _pvArca(x) + '-' +
  String(x.numero ?? 0).padStart(8,'0');

function _bajarFormatoEstudio(){
  if (!LIST_IVA || !LIST_IVA.length){ alert('No hay comprobantes en el período.'); return; }
  const enc = ['Comprobante','Fecha emisión','Proveedor','CUIT','Sit.fiscal','Mto grav.','No Grav.',
               'IVA 21%','IVA %','Importe','Per./Ret. IVA','Otros','Total'];
  const filas = [enc.join(';')].concat(LIST_IVA.map(x => {
    // Una sola alícuota variable, como el listado de hoy: la que tenga importe.
    const otra = Number(x.iva_27) ? {p:'27,00',  i:x.iva_27}
               : Number(x.iva_105) ? {p:'10,50', i:x.iva_105}
               : {p:'0,00', i:0};
    return [
      _csvTxt(_compEstudio(x)),
