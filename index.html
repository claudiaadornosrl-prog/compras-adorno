<script>
// ═══ SESIÓN COMPARTIDA ENTRE MÓDULOS · SSO Adorno (10-sep-2026) ═══
// Todos los módulos viven en el mismo origen (claudiaadornosrl-prog.github.io),
// así que pueden compartir la sesión: se guarda bajo la clave 'adorno-auth' en
// vez de una por módulo. Que un módulo te deje pasar SIN escribir la clave
// depende de dos marcas, y alcanza con una:
//   · dispositivo confiable → se tilda UNA vez en el Hub ("Confiar en esta
//     computadora"). Vale para todos los módulos de ese equipo. Pensado para
//     la PC de JP; en los locales, que son compartidos, nadie la tilda.
//   · módulo recordado → ya te habías logueado en ESE módulo con ese mismo
//     usuario. Conserva el comportamiento de siempre para las vendedoras.
// Sin ninguna de las dos, el módulo pide usuario y contraseña como antes.
window.ADORNO_SSO = (function () {
  var KEY = 'adorno-auth', DEV = 'adorno-equipo-confiable', MOD = 'adorno-modulo-';
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function del(k) { try { localStorage.removeItem(k); } catch (e) {} }
  return {
    KEY: KEY,
    // Al estrenar la clave compartida, adopta la sesión que este módulo ya
    // tenía guardada con su clave vieja: nadie se queda afuera por el cambio.
    migrar: function (keyVieja, modulo) {
      if (!keyVieja) return;
      var v = get(keyVieja);
      if (!v) return;
      // La sesión se copia una sola vez; la marca del módulo se pone siempre
      // que este módulo tuviera sesión propia — Documentos y Compras
      // compartían la clave por defecto y si no, al segundo le pediría login.
      if (!get(KEY)) set(KEY, v);
      var mail = '1';
      try { mail = (JSON.parse(v).user || {}).email || '1'; } catch (e) {}
      set(MOD + modulo, String(mail).toLowerCase());
    },
    confiable: function () { return get(DEV) === '1'; },
    confiar: function (si) { si ? set(DEV, '1') : del(DEV); },
    recordar: function (modulo, email) { set(MOD + modulo, String(email || '1').toLowerCase()); },
    entraDirecto: function (modulo, email) {
      if (this.confiable()) return true;
      var m = get(MOD + modulo);
      return !!m && (m === '1' || m === String(email || '').toLowerCase());
    },
    // Al cerrar sesión se olvidan los módulos, pero NO que el equipo es de
    // confianza: eso es una propiedad de la computadora, no de la sesión.
    olvidarModulos: function () {
      try {
        Object.keys(localStorage).filter(function (k) { return k.indexOf(MOD) === 0; }).forEach(del);
      } catch (e) {}
    }
  };
})();
</script>

// (SSO) Envolver login/logout una sola vez cubre todas las pantallas del
// módulo: al loguearte acá queda recordado (para no pedirte la clave de
// nuevo la próxima), y al salir se olvidan TODOS los módulos — pero no que
// esta computadora es de confianza, que se maneja desde el Hub.
(function (mod) {
  var inOrig = sb.auth.signInWithPassword.bind(sb.auth);
  sb.auth.signInWithPassword = async function (cred) {
    var r = await inOrig(cred);
    if (!r.error && r.data && r.data.user) ADORNO_SSO.recordar(mod, r.data.user.email);
    return r;
  };
  var outOrig = sb.auth.signOut.bind(sb.auth);
  sb.auth.signOut = async function () {
    ADORNO_SSO.olvidarModulos();
    return outOrig.apply(null, arguments);
  };
})('compras');


const TIPOS = {gastos:'Gastos (G)', mercaderia:'Mercadería (M)', inversiones:'Inversiones (I)', no_actividad:'No actividad (Z)'};
// El estado de pago espeja el circuito de carpetas de DOCUMENTOS/CONTABILIZAR
const EPAGO = {
  sin_contabilizar:           {tx:'Sin contabilizar',            bg:'#fee2e2', col:'#991b1b'},
  contabilizado_sin_controlar:{tx:'Contabilizada s/ controlar',  bg:'#fef3c7', col:'#92400e'},
  controlado_sin_op:          {tx:'Controlada · sin OP',         bg:'#dbeafe', col:'#1e40af'},
  con_op_sin_pagar:           {tx:'Con OP · sin pagar',          bg:'#ede9fe', col:'#5b21b6'},
  pagada:                     {tx:'Pagada y archivada',          bg:'#dcfce7', col:'#166534'},
  sin_definir:                {tx:'—',                           bg:'#f1f5f9', col:'#94a3b8'},
};
const chipPago = e => { const p = EPAGO[e] || EPAGO.sin_definir;
  return `<span class="chip" style="background:${p.bg};color:${p.col}">${p.tx}</span>`; };
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let session = {email:null}, DOCS = [], tabActual = 'bandeja';
let MOTOR = null;   // última corrida del motor del circuito
let filtro = {texto:'', tipo:'', clase:'', mes:'', anio:String(new Date().getFullYear())};  // clase: '' | FC | NC | ND | RTO
let orden = {col:'fecha_emision', desc:true};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plata = n => '$' + (Number(n)||0).toLocaleString('es-AR',{minimumFractionDigits:2, maximumFractionDigits:2});
const platac = n => '$' + (Number(n)||0).toLocaleString('es-AR',{maximumFractionDigits:0});
// (2-sep, pedido JP) importes con miles también en los campos de carga
const nmParse = v => {
  v = String(v ?? '').trim().replace(/\$|\s/g, '');
  if (!v || v === '-') return 0;
  if (!v.includes(',')) {
    const m = v.match(/^(-?\d+)\.(\d{1,2})$/);
    if (m) return Number(v) || 0;
  }
  return Number(v.replace(/\./g, '').replace(',', '.')) || 0;
};
const nmShow = n => { n = Number(n) || 0; return n === 0 ? '' :
  n.toLocaleString('es-AR', { maximumFractionDigits: 2 }); };
function wireImporte(el) {
  if (!el || el._wireImp) return;
  el._wireImp = true;
  el.addEventListener('focus', () => { const n = nmParse(el.value);
    el.value = n ? String(n).replace('.', ',') : ''; el.select?.(); });
  el.addEventListener('blur',  () => { el.value = nmShow(nmParse(el.value)); });
}
// (24-sep, JP) TODAS las fechas del módulo en dd/mm/aaaa.
const fechaCorta = f => f ? String(f).slice(8,10)+'/'+String(f).slice(5,7)+'/'+String(f).slice(0,4) : '—';
// Para timestamps (Date o ISO con hora): el día en hora argentina, dd/mm/aaaa.
const _fechaTs = t => { if (!t) return '—'; const d = t instanceof Date ? t : new Date(t); if (isNaN(d)) return '—';
  return new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',day:'2-digit',month:'2-digit',year:'numeric'}).format(d); };

async function cargarTodo(){
  document.getElementById('cont').innerHTML = '<div class="vacio">Cargando comprobantes…</div>';
  let todos = [], desde = 0;
  while (true){
    let q = sb.from('compras_documentos')
      .select('id,tipo,letra,punto_venta,numero,cuit_emisor,proveedor_nombre,fecha_emision,total,estado,estado_pago,tipo_gasto,archivo_path,archivo_alerta,confianza,origen,moneda,cotizacion,importe_moneda,cotizacion_fuente,es_prueba,computa_gestion,gestion_periodo,gestion_unidad,gestion_categoria,gestion_importe,numero_interno,fecha_ingreso')
      .eq('es_prueba', MODO_PRUEBA)
      // (2-sep, regla JP) Facturas = SOLO lo contabilizado (aprobada). Lo que
      // espera control vive en la Bandeja y recién pasa acá al darle el OK.
      .eq('estado', 'aprobada')
      .order('fecha_emision', {ascending:false}).range(desde, desde+999);
    if (!MODO_PRUEBA) q = q.gte('fecha_emision', filtro.anio + '-01-01').lte('fecha_emision', filtro.anio + '-12-31');
    const {data, error} = await q;
    if (error){ document.getElementById('cont').innerHTML = `<div class="alerta">No se pudieron leer los comprobantes: ${esc(error.message)}</div>`; return; }
    todos = todos.concat(data);
    if (data.length < 1000) break;
    desde += 1000;
  }
  DOCS = todos;
  await cargarRemitosDeDocs();
  try { await cargarBandeja(); }
  catch(e){ console.warn('bandeja:', e.message); BANDEJA = []; }
  render();
}

// ── Remitos asociados a cada factura (columna "Remito" de la grilla) ────
//  El vínculo vive en compras_remitos.documento_id: lo pone el motor al leer
//  la factura (mismo número, o el nº de remito impreso en la factura) o
//  administración a mano en 🚚 Mercadería. Acá solo se lee para mostrarlo.
let REMITOS_DOC = {}, REMITOS_ALL = [];  // (22-sep) todos los remitos del ambiente, con o sin factura
async function cargarRemitosDeDocs(){
  REMITOS_DOC = {}; REMITOS_ALL = [];
  let desde = 0;
  while (true){
    let q = sb.from('compras_remitos')
      .select('documento_id,proveedor_cuit,fecha,punto_venta,numero,numero_proveedor,estado,origen,local_destino,txt_generado_at,txt_proveedor,asociado_por,archivo_path,doc:compras_documentos(id,tipo,letra,punto_venta,numero,proveedor_nombre,estado)')
      .eq('es_prueba', MODO_PRUEBA)
      .order('numero').range(desde, desde+999);
    if (!MODO_PRUEBA) q = q.gte('fecha', (filtro.anio - 1) + '-10-01');
    const {data, error} = await q;
    if (error){ console.warn('remitos:', error.message); return; }
    (data||[]).forEach(r => { REMITOS_ALL.push(r); if (r.documento_id) (REMITOS_DOC[r.documento_id] ||= []).push(r); });
    if ((data||[]).length < 1000) break;
    desde += 1000;
  }
}
// cómo se ve el remito en la grilla: número + en qué estado está su stock
function celdaRemitos(d){
  const rs = REMITOS_DOC[d.id] || [];
  if (!rs.length) return (d.tipo_gasto === 'mercaderia' || d.tipo_gasto === 'M')
    ? '<span class="chip" style="background:#fee2e2;color:#991b1b" title="Factura de mercadería sin remito asociado: la mercadería todavía no tiene cómo entrar al stock">⚠ sin remito</span>'
    : '<span class="mini">—</span>';
  return rs.map(r => {
    const num = `${String(r.punto_venta||0).padStart(4,'0')}-${String(r.numero).padStart(8,'0')}`;
    let chip, tit;
    if (r.origen === 'fgr_txt' || r.estado === 'recibido'){ chip = '<span class="chip" style="background:#dcfce7;color:#166534">en stock</span>'; tit = 'Ya ingresó al Dragonfish'; }
    else if (r.txt_proveedor){ chip = '<span class="chip" style="background:#e0e7ff;color:#3730a3">📨 TXT prov.</span>'; tit = 'El TXT lo manda el proveedor'; }
    else if (r.txt_generado_at){ chip = '<span class="chip" style="background:#dcfce7;color:#166534">TXT ✓</span>'; tit = 'TXT generado ' + _fechaTs(String(r.txt_generado_at).slice(0,10)); }
    else { chip = '<span class="chip" style="background:#fef3c7;color:#92400e">TXT pend.</span>'; tit = 'Falta generar el TXT para el Dragonfish'; }
    return `<span title="${esc(tit)}${r.local_destino ? ' · destino ' + esc(r.local_destino) : ''}${r.asociado_por ? ' · vinculado: ' + esc(r.asociado_por) : ''}">R ${num} ${chip}</span>`;
  }).join('<br>');
}

// ── Filtro y orden comunes ──────────────────────────────────────────────
function filtrados(base){
  const t = filtro.texto.toLowerCase();
  let r = base.filter(d => {
    if (filtro.tipo && d.tipo_gasto !== filtro.tipo) return false;
    if (filtro.clase && filtro.clase !== 'RTO' && d.tipo !== filtro.clase) return false;
    if (filtro.mes && (d.fecha_emision||'').slice(5,7) !== filtro.mes) return false;
    if (t){
      const bolsa = `${d.proveedor_nombre||''} ${d.numero} ${d.cuit_emisor||''} ${d.archivo_path||''} ${d.numero_interno ? '#' + d.numero_interno + ' ni' + d.numero_interno : ''}`.toLowerCase();
      if (!bolsa.includes(t)) return false;
    }
    return true;
  });
  r.sort((a,b) => {
    let x = a[orden.col], y = b[orden.col];
    if (orden.col === 'total' || orden.col === 'numero_interno'){ x = Number(x)||0; y = Number(y)||0; }
    else if (orden.col === 'remito'){ x = (REMITOS_DOC[a.id]||[]).length; y = (REMITOS_DOC[b.id]||[]).length; }
    else { x = String(x??'').toLowerCase(); y = String(y??'').toLowerCase(); }
    return (x<y?-1:x>y?1:0) * (orden.desc?-1:1);
  });
  return r;
}
function ordenar(col){ orden = {col, desc: orden.col===col ? !orden.desc : true}; render(); }
function setF(k,v){ filtro[k]=v; if(k==='anio') cargarTodo(); else render(); }

// ═══════════════════════════════════════════════════════════════════════
//  💸 ÓRDENES DE PAGO · punto 4
//
//  El circuito: una factura controlada espera OP → se elige el proveedor,
//  se marcan las facturas a pagar (pueden ser varias, y las NC restan), el
//  sistema calcula las retenciones que correspondan y muestra el neto a
//  pagar → al emitir, la factura avanza a "con OP sin pagar" (el PDF se muda
//  solo) y se crea el pendiente en Tesorería para no cargar la plata dos veces.
//
//  🚨 El sistema NUNCA inventa una retención: si al régimen le falta la
//  alícuota, sale $0 y lo dice. Los avisos se muestran SIEMPRE, antes de emitir.
// ═══════════════════════════════════════════════════════════════════════
let OP_PROVS = null, OP_LISTA = null, opSel = null, opDocs = [], opPrep = null, opRets = [], opPagos = [], OP_CUENTAS = null;

    sb.rpc('compras_op_proveedores', {p_prueba: MODO_PRUEBA}),

  ]);

  OP_PROVS = provs.data || []; OP_LISTA = lista.data || [];
  pintarOrdenes();
}

const _diasDesde = f => {
  if (!f) return '';
  const d = Math.floor((Date.now() - new Date(f+'T12:00:00')) / 86400000);
  return d > 30 ? ` <span style="color:var(--bad)">(${d} días)</span>` : ` <span class="mini">(${d} d)</span>`;
};

async function abrirOP(cuit){
  opSel = cuit; opPrep = null; opRets = []; opPagos = []; opVencManual = false;
  // el catálogo de regímenes lo carga la pestaña ⚙️; si nunca la abrieron, acá
  if (!REGIMENES.length){
    const rg = await sb.from('compras_regimenes').select('*').order('codigo');
    REGIMENES = rg.data || [];
  }
  const {data, error} = await sb.rpc('compras_op_candidatos', {p_cuit: cuit, p_prueba: MODO_PRUEBA});
  if (error){ alert(error.message); return; }
  opDocs = (data||[]).map(d => d.documento_id);   // por defecto, todas
  // (25-sep, JP) remito asociado de cada factura, para ver antes de pagar si la mercadería ya tiene remito
  if (opDocs.length){
    const rr = await sb.from('compras_remitos')
      .select('documento_id,proveedor_cuit,fecha,punto_venta,numero,numero_proveedor,estado,origen,local_destino,txt_generado_at,txt_proveedor,asociado_por')
      .in('documento_id', opDocs);
    if (!rr.error){
      opDocs.forEach(id => { delete REMITOS_DOC[id]; });
      (rr.data||[]).forEach(r => (REMITOS_DOC[r.documento_id] ||= []).push(r));
    }
  }
  _pintarModalOP(data || []);
}

const _hoyISO = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

// Vencimiento propuesto de la OP = el más cercano entre las facturas marcadas (regla JP 22-sep:
// el vencimiento de la factura determina la fecha de pago). Sin ninguno cargado → hoy.
let opCands = [], opVencManual = false;
function _opVencDefault(cands){
  opCands = cands || opCands;
  const v = opCands.filter(c => opDocs.includes(c.documento_id) && c.fecha_vto).map(c => c.fecha_vto).sort();
  return v[0] || _hoyISO();
}

function _opToggle(id, on){
  opDocs = on ? Array.from(new Set(opDocs.concat([id]))) : opDocs.filter(x => x !== id);
  const vi = document.getElementById('op-venc');
  if (vi && !opVencManual) vi.value = _opVencDefault();
  _opCalcular();
}

async function _opCalcular(){
  const cont = document.getElementById('op-calc'); if (!cont) return;
  const btn = document.getElementById('op-emitir');
  if (!opDocs.length){
    opPrep = null;
    cont.innerHTML = '<div class="alerta">Marcá al menos un comprobante.</div>';
    if (btn) btn.disabled = true;
    return;
  }
  cont.innerHTML = '<div class="vacio">Calculando…</div>';
  const {data, error} = await sb.rpc('compras_op_preparar',
    {p_cuit: opSel, p_docs: opDocs, p_fecha: document.getElementById('op-fecha')?.value || null,
     p_prueba: MODO_PRUEBA});
  if (error){
    opPrep = null; if (btn) btn.disabled = true;
    cont.innerHTML = `<div class="alerta">${esc(error.message)}</div>`; return;
  }
  opPrep = data; if (btn) btn.disabled = false;
  // copia de trabajo: acá es donde se pueden tocar los importes a mano
  opRets = (data.retenciones || []).map(x => ({
    codigo: x.codigo, nombre: x.nombre, propuesto: !!x.propuesto,
    alicuota: x.alicuota, aviso: x.aviso,
    importe: Number(x.importe || 0), calculado: Number(x.importe || 0),
    motivo_edicion: '', agregada: false,
    calculo: Array.isArray(x.calculo) ? x.calculo : [] }));
  if (!opPagos.length) opPagos = [{medio: '', importe: 0, cuenta_id: null, cheque_numero: '', cheque_banco: '', cheque_fecha: '', cheque_emision: '', dias_diferimiento: '', notas: ''}];
  if (opPagos.length === 1) opPagos[0].importe = Math.round(_opNeto() * 100) / 100;
  if (OP_CUENTAS === null){
    const cu = await sb.from('tesoreria_cuentas').select('id,nombre,tipo,moneda,local').eq('activa', true).order('orden_display');
    OP_CUENTAS = cu.error ? [] : (cu.data || []);
  }
  const av = data.avisos || [], pp = data.pagos_posibles || [];
  cont.innerHTML = `
    ${pp.length ? `<div class="alerta" style="margin-bottom:10px;border-left:4px solid #b45309">
       <b>⚠ Puede que este pago YA esté hecho.</b><br>
       Hay ${pp.length} egreso${pp.length===1?'':'s'} del banco por este mismo importe sin conciliar:<br>
       ${pp.map(m => `· ${_fecha(m.fecha)} · ${esc(m.cuenta||'')} · ${plata(Math.abs(m.importe))} · ${esc((m.descripcion||'').slice(0,50))} <span class="mini">(${esc(m.evidencia)})</span>`).join('<br>')}
       <br><span class="mini">Si emitís igual, Tesorería lo vincula sola en vez de duplicar el pago.</span></div>` : ''}
    ${av.length ? `<div class="alerta" style="margin-bottom:10px"><b>Antes de emitir, mirá esto:</b><br>
       ${av.map(a => '· ' + esc(a)).join('<br>')}</div>` : ''}
    <table style="font-size:13px"><tbody>
      <tr><td>Comprobantes (${data.comprobantes})</td><td class="num"><b>${plata(data.subtotal)}</b></td></tr>
      <tr><td class="mini" style="padding-left:14px">neto sobre el que se calcula</td>
          <td class="num mini">${plata(data.neto)}</td></tr>
    </tbody></table>
    <div id="op-rets"></div>
    <div id="op-pagos" style="margin-top:12px"></div>
    <p class="mini" style="margin-top:8px">Se va a emitir como <b>OP X ${String(data.punto_venta).padStart(4,'0')}-${String(data.proximo_numero).padStart(8,'0')}</b>.</p>`;
  _opPintarRets();
  _opPintarPagos();
}

// ── Cálculo de la retención, a la vista ────────────────────────────────
//  La RPC devuelve los pasos en castellano (calculo[]) — el front solo los
//  muestra. Así lo que se lee al pasar el mouse es EXACTAMENTE lo que se
//  calculó, y en la OP emitida queda guardado tal cual.
function _opTip(lineas, texto){
  const ls = Array.isArray(lineas) ? lineas.filter(Boolean) : [];
  if (!ls.length) return esc(texto);
  // (22-sep, JP) sin title nativo: duplicaba el popover con el cartel chico del navegador
  return `<span class="op-tip" onclick="this.classList.toggle('abierto');event.stopPropagation()">${esc(texto)}
    <span class="op-tipbox">${ls.map(l => `<div>${esc(l)}</div>`).join('')}</span></span>`;
}

// ── Medios de pago: uno o varios ───────────────────────────────────────
//  Una OP puede pagarse parte por transferencia, parte con cheque, parte en
//  efectivo. Cada fila es un medio con su importe; la suma tiene que dar el
//  neto a pagar (la RPC lo vuelve a controlar). Fuera de prueba, cada medio
//  crea SU pendiente en Tesorería, así el banco concilia cada egreso solo.
const _opSumPagos = () => opPagos.reduce((a,p) => a + (Number(p.importe)||0), 0);
const _opEsCheque = m => /cheq|echeq/i.test(m||'');
const _opEsEcheq  = m => /echeq|e-cheq|e cheq/i.test(m||'');
// Cheque/Echeq: fecha de emisión + días de diferimiento → fecha de pago (22-sep, JP)
function _opFechaPago(p){
  if (p.cheque_emision && p.dias_diferimiento !== '' && p.dias_diferimiento != null){
    const d = new Date(p.cheque_emision + 'T12:00:00'); d.setDate(d.getDate() + (Number(p.dias_diferimiento)||0));
    return d.toISOString().slice(0,10);
  }
  return p.cheque_fecha || '';
}
// Título con mayúscula inicial para mostrar (lo guardado se normaliza igual)
const _opCap = m => { m = String(m||'').trim(); return m ? m.charAt(0).toUpperCase() + m.slice(1) : m; };

function _opPintarPagos(){
  const cont = document.getElementById('op-pagos'); if (!cont) return;
  const neto = _opNeto(), suma = _opSumPagos(), dif = Math.round((neto - suma)*100)/100;
  const ctas = OP_CUENTAS || [];
  cont.innerHTML = `
    <h4 style="font-size:13px;margin:0 0 5px">Medio de pago${opPagos.length>1 ? 's' : ''}</h4>
    ${opPagos.map((p,i) => `
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px;padding:6px 8px;border:1px solid var(--bd);border-radius:9px">
        <div style="flex:1;min-width:130px"><label>Medio</label>
          <input list="dl-medios" value="${esc(p.medio||'')}" placeholder="Transferencia / Cheque / Echeq / Efectivo"
                 oninput="_opPagoSet(${i},'medio',this.value)" style="font-size:12.5px;padding:5px 7px"></div>
        <div style="width:140px"><label>Importe</label>
          <input type="number" step="0.01" min="0" value="${Number(p.importe)||0}" ${opPagos.length===1 ? 'readonly title="Con un solo medio, el importe es el neto a pagar"' : ''}
                 oninput="_opPagoSet(${i},'importe',this.value)" style="text-align:right;font-size:12.5px;padding:5px 7px"></div>
        ${ctas.length ? `<div style="min-width:150px"><label>Cuenta</label>
          <select onchange="_opPagoSet(${i},'cuenta_id',this.value)" style="font-size:12.5px;padding:5px 7px">
            <option value="">—</option>
            ${ctas.map(c => `<option value="${c.id}" ${String(p.cuenta_id||'')===String(c.id)?'selected':''}>${esc(c.nombre)}</option>`).join('')}
          </select></div>` : ''}
        ${_opEsCheque(p.medio) ? `
          ${_opEsEcheq(p.medio) ? '' : `<div style="width:110px"><label>N° cheque</label><input value="${esc(p.cheque_numero||'')}" oninput="_opPagoSet(${i},'cheque_numero',this.value)" style="font-size:12.5px;padding:5px 7px"></div>`}
          <div style="width:110px"><label>Banco</label><input value="${esc(p.cheque_banco||'')}" oninput="_opPagoSet(${i},'cheque_banco',this.value)" style="font-size:12.5px;padding:5px 7px"></div>
          <div style="width:135px"><label>Fecha de emisión</label><input type="date" value="${esc(p.cheque_emision||'')}" onchange="_opPagoSet(${i},'cheque_emision',this.value)" style="font-size:12.5px;padding:5px 7px"></div>
          <div style="width:95px"><label>Días difer.</label><input type="number" min="0" step="1" value="${p.dias_diferimiento ?? ''}" placeholder="30" oninput="_opPagoSet(${i},'dias_diferimiento',this.value)" style="font-size:12.5px;padding:5px 7px"></div>
          <div style="width:120px"><label>Fecha de pago</label><div id="op-fpago-${i}" class="mini" style="padding:6px 0;font-weight:600">${_opFechaPago(p) ? _fecha(_opFechaPago(p)) : '—'}</div></div>
          ${_opEsEcheq(p.medio) ? `<div class="mini" style="width:100%;color:#64748b">El número del Echeq lo asigna el banco al emitirlo: no se carga acá.</div>` : ''}` : ''}
        ${opPagos.length>1 ? `<button class="act gh" onclick="_opPagoQuitar(${i})" title="Quitar este medio" style="padding:4px 8px">✕</button>` : ''}
      </div>`).join('')}
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">
      <button class="act gh" style="font-size:12px;padding:5px 9px" onclick="_opPagoAgregar()">➕ Otro medio de pago</button>
      <span class="mini" id="op-pagos-dif" style="${Math.abs(dif) > 0.005 ? 'color:var(--bad);font-weight:700' : 'color:var(--ok,#166534)'}">
        ${opPagos.length>1 ? (Math.abs(dif) > 0.005
            ? (dif > 0 ? `faltan asignar ${plata(dif)}` : `sobran ${plata(-dif)}`) + ` · asignado ${plata(suma)} de ${plata(neto)}`
            : `✓ ${plata(suma)} repartidos en ${opPagos.length} medios`) : ''}
      </span>
    </div>`;
}
function _opPagoSet(i, campo, val){
  const p = opPagos[i]; if (!p) return;
  if (campo === 'importe') p.importe = Math.max(0, Number(String(val).replace(',', '.')) || 0);
  else if (campo === 'cuenta_id') p.cuenta_id = val ? Number(val) : null;
  else p[campo] = val;
  if (campo === 'cheque_emision' || campo === 'dias_diferimiento'){
    const f = document.getElementById('op-fpago-' + i); const fp = _opFechaPago(p);
    if (f) f.textContent = fp ? _fecha(fp) : '—';
  }
  if (campo === 'medio' || campo === 'importe'){
    // el medio decide si aparecen los campos del cheque; el importe mueve el "faltan"
    if (campo === 'medio'){ const era = !!p._chq, es = _opEsCheque(val), eraE = !!p._echq, esE = _opEsEcheq(val); p._chq = es; p._echq = esE; if (era !== es || eraE !== esE) { _opPintarPagos(); return; } }
    const d = document.getElementById('op-pagos-dif');
    if (d && opPagos.length > 1){
      const neto = _opNeto(), suma = _opSumPagos(), dif = Math.round((neto - suma)*100)/100;
      d.style.cssText = Math.abs(dif) > 0.005 ? 'color:var(--bad);font-weight:700' : 'color:var(--ok,#166534)';
      d.textContent = Math.abs(dif) > 0.005
        ? (dif > 0 ? `faltan asignar ${plata(dif)}` : `sobran ${plata(-dif)}`) + ` · asignado ${plata(suma)} de ${plata(neto)}`
        : `✓ ${plata(suma)} repartidos en ${opPagos.length} medios`;
    }
  }
}
function _opPagoAgregar(){
  // el nuevo medio arranca con lo que falta asignar
  const resto = Math.round((_opNeto() - _opSumPagos())*100)/100;
  opPagos.push({medio: '', importe: resto > 0 ? resto : 0, cuenta_id: null, cheque_numero: '', cheque_banco: '', cheque_fecha: '', cheque_emision: '', dias_diferimiento: '', notas: ''});
  _opPintarPagos();
}
function _opPagoQuitar(i){
  opPagos.splice(i,1);
  if (opPagos.length === 1) opPagos[0].importe = Math.round(_opNeto()*100)/100;
  _opPintarPagos();
}

// ── Retenciones editables ──────────────────────────────────────────────
//  El sistema propone el número, pero quien firma la OP es una persona: si
//  el régimen todavía no tiene alícuota cargada (⚙️ Retenciones), o el
//  contador indica otro importe, se pone a mano. 🚨 Todo importe que difiera
//  de lo calculado EXIGE motivo — el certificado de retención que se le
//  entrega al proveedor tiene que poder explicar de dónde salió el número.
//  La base valida igual: el código y el nombre del régimen los pone la DB.
const _opEditada = r => Math.abs(Number(r.importe||0) - Number(r.calculado||0)) > 0.005;
const _opTotRet  = () => opRets.reduce((a,r) => a + (Number(r.importe)||0), 0);
const _opNeto    = () => Number(opPrep?.subtotal || 0) - _opTotRet();

function _opPintarRets(){
  const cont = document.getElementById('op-rets'); if (!cont) return;
  const libres = (REGIMENES||[]).filter(r => r.activo && !opRets.some(x => x.codigo === r.codigo));
  cont.innerHTML = `
    <table style="font-size:13px"><tbody>
      ${opRets.length ? opRets.map((r,i) => {
        const ed = _opEditada(r);
        return `<tr>
        <td style="padding-right:10px">${_opTip(r.calculo, r.codigo + ' · ' + (r.nombre||'').slice(0,42))}
          ${r.propuesto ? ' <span class="chip" style="background:#fef3c7;color:#92400e">propuesto</span>' : ''}
          ${r.agregada ? ' <span class="chip" style="background:#e0e7ff;color:#3730a3">agregada</span>' : ''}
          <span class="chip" id="op-mano-${i}" style="background:#fee2e2;color:#991b1b;${ed?'':'display:none'}">a mano</span>
          ${r.alicuota ? ` <span class="mini">${Number(r.alicuota)}%</span>` : ''}
          ${r.aviso ? `<br><span class="mini" style="color:#b45309">${esc(r.aviso)}</span>` : ''}
          <div id="op-motivo-${i}" style="${ed?'':'display:none'};margin-top:4px">
            <input id="op-motivo-in-${i}" placeholder="¿Por qué este importe? (va al certificado)"
                   value="${esc(r.motivo_edicion||'')}" oninput="_opRetMotivo(${i}, this.value)"
                   style="font-size:12px;padding:4px 7px">
            <span class="mini">calculado: ${plata(r.calculado)}</span>
          </div></td>
        <td class="num" style="white-space:nowrap">−
          <input type="number" step="0.01" min="0" id="op-imp-${i}" value="${Number(r.importe)||0}"
                 oninput="_opRetImporte(${i}, this.value)"
                 style="width:118px;text-align:right;display:inline-block;padding:4px 7px">
          ${r.agregada
            ? `<button class="act gh" onclick="_opRetQuitar(${i})" title="Quitar" style="padding:2px 7px;margin-left:3px">✕</button>`
            : `<button class="act gh" onclick="_opRetReset(${i})" title="Volver a lo calculado" style="padding:2px 7px;margin-left:3px">↺</button>`}
        </td></tr>`; }).join('')
        : '<tr><td class="mini">Sin retenciones para este proveedor.</td><td></td></tr>'}
      ${libres.length ? `<tr><td colspan="2" style="padding-top:6px">
        <select onchange="_opRetAgregar(this.value); this.value='';"
                style="font-size:12px;padding:4px 7px;max-width:100%">
          <option value="">➕ Agregar otra retención…</option>
          ${libres.map(r => `<option value="${esc(r.codigo)}">${esc(r.codigo)} · ${esc(r.nombre)}</option>`).join('')}
        </select></td></tr>` : ''}
      <tr style="font-weight:700;border-top:2px solid var(--bd)">
        <td>Neto a pagar</td>
        <td class="num" style="font-size:16px" id="op-neto">${plata(_opNeto())}</td></tr>
    </tbody></table>`;
}

function _opRetImporte(i, val){
  const r = opRets[i]; if (!r) return;
  r.importe = Math.max(0, Number(String(val).replace(',', '.')) || 0);
  const ed = _opEditada(r);
  const chip = document.getElementById('op-mano-' + i);
  const mot  = document.getElementById('op-motivo-' + i);
  if (chip) chip.style.display = ed ? '' : 'none';
  if (mot)  mot.style.display  = ed ? '' : 'none';
  const neto = document.getElementById('op-neto');
  if (neto){
    neto.textContent = plata(_opNeto());
    neto.style.color = _opNeto() < 0 ? 'var(--bad)' : '';
  }
  if (opPagos.length === 1){ opPagos[0].importe = Math.round(_opNeto()*100)/100; }
  _opPintarPagos();
}

function _opRetReset(i){
  const r = opRets[i]; if (!r) return;
  r.importe = Number(r.calculado) || 0; r.motivo_edicion = '';
  const inp = document.getElementById('op-imp-' + i);
  if (inp) inp.value = r.importe;
  _opRetImporte(i, r.importe);
}

function _opRetAgregar(cod){
  if (!cod) return;
  const reg = (REGIMENES||[]).find(r => r.codigo === cod); if (!reg) return;
  opRets.push({codigo: reg.codigo, nombre: reg.nombre, propuesto: false,
    alicuota: null, aviso: null, importe: 0, calculado: 0,
    motivo_edicion: '', agregada: true});
  _opPintarRets();
}

function _opRetMotivo(i, val){ if (opRets[i]) opRets[i].motivo_edicion = val; }
function _opRetQuitar(i){ opRets.splice(i,1); _opPintarRets(); }

async function emitirOP(){
  if (!opPrep){ alert('Todavía no se calculó la orden.'); return; }
  const av = opPrep.avisos || [];
  const editadas = opRets.filter(_opEditada);
  const sinMotivo = editadas.find(r => !(r.motivo_edicion||'').trim());
  if (sinMotivo){
    alert(`Cambiaste a mano la retención de ${sinMotivo.codigo}.\n\n` +
          'Escribí el motivo: queda guardado y es lo que explica el número en el ' +
          'certificado de retención que se le entrega al proveedor.');
    document.getElementById('op-motivo-in-' + opRets.indexOf(sinMotivo))?.focus();
    return;
  }
  if (_opNeto() < 0){ alert('Las retenciones superan el total de la orden.'); return; }
  const sinMedio = opPagos.find(p => !(p.medio||'').trim());
  if (sinMedio){ alert('Poné el medio de pago (transferencia / cheque / efectivo…).'); return; }
  if (opPagos.length > 1){
    const dif = Math.round((_opNeto() - _opSumPagos())*100)/100;
    if (Math.abs(dif) > 0.005){
      alert(`Los medios de pago suman ${plata(_opSumPagos())} y el neto a pagar es ${plata(_opNeto())}.\n\n` +
            (dif > 0 ? `Faltan asignar ${plata(dif)}.` : `Sobran ${plata(-dif)}.`)); return;
    }
    if (opPagos.some(p => !(Number(p.importe) > 0))){ alert('Hay un medio de pago con importe cero: sacalo o ponele importe.'); return; }
  }
  const txt = `Emitir la orden de pago de ${opPrep.proveedor}\n\n` +
    `${opPrep.comprobantes} comprobante(s): ${plata(opPrep.subtotal)}\n` +
    `Retenciones: ${plata(_opTotRet())}` +
    (editadas.length ? ` (${editadas.length} puesta(s) a mano)` : '') + '\n' +
    `A pagar: ${plata(_opNeto())}\n` +
    (opPagos.length > 1 ? opPagos.map(p => `   · ${p.medio}: ${plata(p.importe)}`).join('\n') + '\n' : `   · ${opPagos[0].medio}\n`) + '\n' +
    (editadas.length ? editadas.map(r =>
       `✏ ${r.codigo}: ${plata(r.importe)} en vez de ${plata(r.calculado)} — ${r.motivo_edicion.trim()}`).join('\n') + '\n\n' : '') +
    (av.length ? `⚠ ${av.length} aviso(s) sin resolver:\n${av.map(a=>'· '+a).join('\n')}\n\n` : '') +
    (MODO_PRUEBA ? '🧪 Prueba: no se crea el pendiente en Tesorería.\n\n' : 'Se va a crear el pendiente de pago en Tesorería.\n\n') +
    '¿Confirmás?';
  if (!confirm(txt)) return;
  const btn = document.getElementById('op-emitir');
  if (btn){ btn.disabled = true; btn.textContent = 'Emitiendo…'; }
  const {data, error} = await sb.rpc('compras_op_emitir', {
    p_cuit: opSel, p_docs: opDocs,
    p_fecha: document.getElementById('op-fecha').value || null,
    p_vencimiento: document.getElementById('op-venc').value || null,
    p_medio_pago: _opCap(opPagos[0]?.medio) || null,
    p_observaciones: document.getElementById('op-obs').value || null,
    p_pagos: opPagos.map(p => ({medio: _opCap(p.medio), importe: Math.round((Number(p.importe)||0)*100)/100,
      cuenta_id: p.cuenta_id || null, cheque_numero: _opEsEcheq(p.medio) ? null : ((p.cheque_numero||'').trim() || null),
      cheque_banco: (p.cheque_banco||'').trim() || null, cheque_fecha: _opFechaPago(p) || null,
      cheque_emision: p.cheque_emision || null, dias_diferimiento: (p.dias_diferimiento === '' || p.dias_diferimiento == null) ? null : Number(p.dias_diferimiento),
      notas: (p.notas||'').trim() || null})),
    p_retenciones: opRets.map(r => ({codigo: r.codigo, importe: Number(r.importe)||0,
                                     motivo_edicion: (r.motivo_edicion||'').trim() || null})),
    p_prueba: MODO_PRUEBA });
  if (error){
    alert('No se pudo emitir: ' + error.message);
    if (btn){ btn.disabled = false; btn.textContent = 'Emitir orden de pago'; }
    return;
  }
  cerrarModalP();
  alert(`${data.comprobante} emitida\n\nA pagar: ${plata(data.neto_a_pagar)}` +
        (data.mensaje_pago ? `\n\n${data.mensaje_pago}`

async function anularOP(id, comp){
  const motivo = prompt(`Anular ${comp}\n\nLas facturas vuelven a quedar disponibles para armar otra OP` +
    (MODO_PRUEBA ? '.' : ' y se cancela el pendiente en Tesorería.') + '\n\n¿Por qué la anulás?');
  if (motivo === null) return;
  if (!motivo.trim()){ alert('El motivo es obligatorio.'); return; }
  const {data, error} = await sb.rpc('compras_op_anular', {p_op: id, p_motivo: motivo.trim()});
  if (error){ alert('No se pudo anular: ' + error.message); return; }
  alert(`Anulada. ${data.comprobantes_liberados} comprobante(s) volvieron a "controlado sin OP".`);
  vistaOrdenes();
}

let _provCache = [], _provBusca = '';

async function vistaProveedores(){
  const c = document.getElementById('cont');
  c.innerHTML = `<div class="card">
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;">
      <input id="prov-q" placeholder="Buscar por nombre o CUIT…" value="${_mEscP(_provBusca)}"

  </div>`;
  document.getElementById('prov-q').addEventListener('keydown', e => { if (e.key === 'Enter') buscarProveedores(); });
  await buscarProveedores();

function _mEscP(t){ return String(t ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
const _fmtP = n => '$' + Number(n||0).toLocaleString('es-AR', {maximumFractionDigits:0});

async function buscarProveedores(){
  _provBusca = (document.getElementById('prov-q')?.value || '').trim();
  const cont = document.getElementById('prov-lista');
  cont.innerHTML = '<div class="hint">Buscando…</div>';
  const { data, error } = await sb.rpc('compras_proveedores_listar', { p_busca: _provBusca || null, p_limite: 60 });
  if (error){ cont.innerHTML = `<div class="hint" style="color:#b91c1c;">No pude traer los proveedores: ${_mEscP(error.message)}</div>`; return; }
  _provCache = data || [];
  if (!_provCache.length){ cont.innerHTML = '<div class="hint">No encontré ningún proveedor con ese nombre o CUIT.</div>'; return; }
  // Última constancia de ARCA guardada para cada CUIT del listado (si se consultó alguna vez)
  try {
    const cuits = [...new Set(_provCache.map(p => String(p.cuit||'').replace(/\D/g,'')).filter(c => c.length === 11))];
    if (cuits.length){
      const { data: ac } = await sb.from('compras_arca_consultas').select('cuit,vigente,estado_clave,razon_social,tipo_persona,cond_iva,monotributo_categoria,domicilio,impuestos,actividades,errores,consultado_at,error').in('cuit', cuits);
      const porCuit = Object.fromEntries((ac||[]).map(a => [a.cuit, a]));
      _provCache.forEach(p => { p.arca = porCuit[String(p.cuit||'').replace(/\D/g,'')] || null; });
    }
  } catch(e){ console.warn('arca', e); }
  cont.innerHTML = `
    <div class="hint" style="margin-bottom:8px;">${_provCache.length} proveedor(es) · ordenados por cuántas facturas les cargamos</div>
    <table><thead><tr>
      <th>Proveedor</th><th>CUIT</th><th class="num">Facturas</th><th class="num">Total comprado</th>
      <th>Última</th><th>Condición de pago</th><th>Ficha</th><th></th></tr></thead><tbody>
    ${_provCache.map((p,i) => `<tr>
      <td><strong>${_mEscP(p.nombre)}</strong>
        ${p.es_exterior ? '<span class="chip" style="background:#ede9fe;color:#5b21b6;margin-left:6px;">🌎 Exterior</span>' : ''}
        ${p.origen === 'manual' ? '<span class="chip" style="background:#f1f5f9;color:#475569;margin-left:6px;">manual</span>' : ''}
        ${!p.activo ? '<span class="chip" style="background:#fee2e2;color:#991b1b;margin-left:6px;">inactivo</span>' : ''}
        ${p.copias_mismo_cuit > 1 ? `<div style="font-size:11px;color:#b45309;margin-top:2px;">⚠ Dragonfish tiene ${p.copias_mismo_cuit} fichas con este mismo CUIT — cargá los datos en una sola</div>` : ''}
      </td>
      <td style="font-variant-numeric:tabular-nums;">${_mEscP(p.cuit || '—')}
        ${p.arca ? (p.arca.vigente === true ? '<span class="chip" title="ARCA: CUIT vigente" style="background:#dcfce7;color:#166534;margin-left:4px;">ARCA ✓</span>'
                   : `<span class="chip" title="ARCA: ${_mEscP(p.arca.estado_clave || p.arca.error || 'sin dato')}" style="background:#fee2e2;color:#991b1b;margin-left:4px;">ARCA ⚠</span>`) : ''}</td>
      <td class="num">${p.facturas || 0}</td>
      <td class="num">${p.facturas ? _fmtP(p.total_comprado) : '—'}</td>
      <td>${p.ultima_compra ? p.ultima_compra.split('-').reverse().join('/') : '—'}</td>
      <td>${_mEscP(p.condicion_pago || '—')}
        ${p.retenciones_excluidas ? `<span class="chip" title="Certificado de exclusión en ${p.retenciones_excluidas} régimen(es)" style="background:#fef3c7;color:#92400e;margin-left:4px;">excl. ${p.retenciones_excluidas}</span>` : ''}
        ${(p.descuentos||[]).length ? `<span class="chip" title="${_mEscP((p.descuentos||[]).map(d => (d.porcentaje||0)+'% '+(d.descripcion||'')).join(' · '))}" style="background:#dcfce7;color:#166534;margin-left:4px;">${(p.descuentos||[]).length} dto.</span>` : ''}
        <div style="margin-top:3px;">${_contactoLinks({ whatsapp: p.whatsapp, email: p.email || p.email_op || p.df_email })}</div></td>
      <td>${p.tiene_ficha ? '✅' : '<span style="color:var(--mut);">sin completar</span>'}</td>

// ── Helpers de contacto: links directos a WhatsApp y mail ──
function _waLink(tel){
  let d = String(tel||'').replace(/\D/g,''); if (!d) return '';
  if (d.startsWith('0')) d = d.slice(1);
  if (d.startsWith('15')) d = '11' + d.slice(2);
  if (!d.startsWith('54')) d = '54' + (d.length <= 10 ? '9' : '') + d;
  return 'https://wa.me/' + d;
}
function _contactoLinks(c){
  const out = [];
  if (c.whatsapp) out.push(`<a class="btn" style="padding:3px 8px;font-size:12px;background:#dcfce7;border-color:#86efac;" target="_blank" href="${_waLink(c.whatsapp)}" title="Abrir chat de WhatsApp">💬 WhatsApp</a>`);
  if (c.telefono) out.push(`<a class="btn" style="padding:3px 8px;font-size:12px;" href="tel:${_mEscP(String(c.telefono).replace(/\s/g,''))}">📞 ${_mEscP(c.telefono)}</a>`);
  if (c.email) out.push(`<a class="btn" style="padding:3px 8px;font-size:12px;background:#eff6ff;border-color:#93c5fd;" href="mailto:${_mEscP(c.email)}" title="Escribir mail">✉ ${_mEscP(c.email)}</a>`);
  return out.join(' ');
}

async function confirmarAltaProveedor(){
  let nombre = (document.getElementById('pa-nombre').value || '').trim();
  const ext = !!document.getElementById('pa-ext').checked;
  const cuit = (document.getElementById('pa-cuit')?.value || '').trim();
  const pais = (document.getElementById('pa-pais')?.value || '').trim();
  let arca = null;
  if (!ext){
    if (cuit.replace(/\D/g,'').length !== 11) return alert('Poné el CUIT (11 dígitos). Si es del exterior, tildá "Es del exterior".');
    // 🚨 Regla JP (11-sep): NUNCA se da de alta un proveedor argentino sin mirar ARCA.
    arca = (_arcaUltima && _arcaUltima.cuit === cuit.replace(/\D/g,'')) ? _arcaUltima : await validarAltaArca();
    if (!arca) return alert('No pude validar el CUIT en ARCA. Sin esa validación no se da de alta.');
    if (arca.vigente !== true && !confirm(`⚠ ARCA dice que este CUIT está ${arca.estado_clave || 'sin estado'} — NO vigente.\n\n¿Igual querés darlo de alta?`)) return;
    nombre = nombre || arca.razon_social || '';
  }
  if (!nombre) return alert('Poné el nombre del proveedor.');
  const domArca = arca?.domicilio ? [arca.domicilio.direccion, arca.domicilio.localidad, arca.domicilio.descripcionProvincia].filter(Boolean).join(', ') : '';
  const { data, error } = await sb.rpc('compras_proveedor_alta',
    { p_nombre: nombre, p_cuit: cuit || null, p_es_exterior: ext,
      p_datos: { pais, moneda_habitual: ext ? 'USD' : 'ARS', cond_iva: ext ? 'EXT' : (arca?.cond_iva || ''), domicilio: domArca,
                 notas: arca ? `ARCA ${arca.estado_clave} · ${arca.razon_social || ''} · validado ${_fechaTs(new Date())}` : '' } });
  if (error) return alert('No se pudo crear: ' + error.message);

// ═══ 🔍 Validación de CUIT contra ARCA (constancia de inscripción) ═══
//  La PWA no habla con ARCA: encola el CUIT (compras_arca_pedir) y el script
//  arca_padron.py (PC de JP / VPS, con el certificado "AdornoPadron") consulta
//  el web service y deja el resultado en compras_arca_consultas. Acá se sondea.
const _condIvaTxt = { RI:'Responsable Inscripto', MT:'Monotributo', EX:'Exento', NI:'Sin IVA (no inscripto)', EXT:'Del exterior', CF:'Consumidor final' };
let _arcaUltima = null;

async function validarArca(cuit, contId, forzar){
  const cont = document.getElementById(contId); if (!cont) return null;
  const limpio = String(cuit||'').replace(/\D/g,'');
  if (limpio.length !== 11){ cont.innerHTML = '<div class="hint" style="color:#b91c1c;">El CUIT tiene que tener 11 dígitos.</div>'; return null; }
  cont.innerHTML = '<div class="hint">⏳ Consultando ARCA…</div>';
  const { data, error } = await sb.rpc('compras_arca_pedir', { p_cuit: limpio, p_forzar: !!forzar });
  if (error || !data?.ok){ cont.innerHTML = `<div class="hint" style="color:#b91c1c;">${_mEscP(error?.message || data?.motivo || 'No se pudo pedir la consulta')}</div>`; return null; }
  let c = data.consulta;
  if (!data.cache){
    for (let i = 0; i < 45 && !c; i++){
      await new Promise(r => setTimeout(r, 2000));
      const { data: e } = await sb.rpc('compras_arca_estado', { p_cola_id: data.cola_id });
      if (e?.estado === 'listo' && e.consulta) c = e.consulta;
      if (e?.estado === 'error'){ cont.innerHTML = '<div class="hint" style="color:#b91c1c;">El consultor de ARCA no respondió. ¿Está corriendo arca_padron.py en la PC de JP?</div>'; return null; }
      if (i === 5) cont.innerHTML = '<div class="hint">⏳ ARCA está tardando… (sigo esperando)</div>';
    }
    if (!c){ cont.innerHTML = '<div class="hint" style="color:#b91c1c;">ARCA no respondió en 90 segundos. Probá de nuevo en un rato.</div>'; return null; }
  }
  _arcaUltima = c;
  cont.innerHTML = _arcaCard(c);
  return c;
}

function _arcaCard(c){
  if (c.error) return `<div class="hint" style="background:#fef2f2;border-left:3px solid #ef4444;padding:8px 10px;border-radius:6px;">❌ ARCA: ${_mEscP(c.error)}</div>`;
  const errs = (c.errores||[]).map(e => typeof e === 'string' ? e : JSON.stringify(e));
  const ok = c.vigente === true;
  const col = ok ? '#16a34a' : '#dc2626', bg = ok ? '#f0fdf4' : '#fef2f2';
  const dom = c.domicilio ? [c.domicilio.direccion, c.domicilio.localidad, c.domicilio.codPostal, c.domicilio.descripcionProvincia].filter(Boolean).join(', ') : '';
  const imp = (c.impuestos||[]).map(i => i.desc).filter(Boolean);
  const act = (c.actividades||[]).sort((a,b)=>(a.orden||9)-(b.orden||9)).map(a => a.desc).filter(Boolean);
  const cuando = c.consultado_at ? new Date(c.consultado_at).toLocaleString('es-AR', {dateStyle:'short', timeStyle:'short'}) : '';
  return `<div style="background:${bg};border-left:3px solid ${col};padding:10px 12px;border-radius:6px;font-size:13px;line-height:1.5;">
    <div style="font-weight:700;color:${col};">${ok ? '✅ CUIT VIGENTE' : '⚠ CUIT NO VIGENTE'} · ${_mEscP(c.estado_clave || 'sin estado')}</div>
    <div><strong>${_mEscP(c.razon_social || '—')}</strong> · ${_mEscP(c.tipo_persona === 'JURIDICA' ? 'persona jurídica' : c.tipo_persona === 'FISICA' ? 'persona física' : '')}</div>
    <div>IVA: <strong>${_mEscP(_condIvaTxt[c.cond_iva] || c.cond_iva || 'sin dato')}</strong>${c.monotributo_categoria ? ' · categoría ' + _mEscP(c.monotributo_categoria) : ''}</div>
    ${dom ? `<div>Domicilio fiscal: ${_mEscP(dom)}</div>` : ''}
    ${act.length ? `<div>Actividad: ${_mEscP(act[0])}${act.length > 1 ? ` (+${act.length-1})` : ''}</div>` : ''}
    ${imp.length ? `<div class="hint">Inscripto en: ${_mEscP(imp.join(' · '))}</div>` : ''}
    ${errs.length ? `<div style="color:#b45309;">ARCA informa: ${_mEscP(errs.join(' · '))}</div>` : ''}
    <div class="hint">Fuente: ARCA, constancia de inscripción · consultado ${_mEscP(cuando)}</div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════
//  📥 BANDEJA · el control humano de la contabilización
//
//  El motor no adivina: cuando el historial del proveedor es claro (mismo
//  concepto en las dos últimas facturas → 96 % de acierto medido sobre las
//  1.147 de 2026) la contabiliza solo; cuando no, la deja acá con el motivo
//  escrito para que quien controla pueda desconfiar con criterio.
//
//  Aprobar o corregir acá alimenta la próxima predicción: no hay tabla de
//  reglas que mantener a mano, el sistema aprende de lo que se contabiliza.
// ═══════════════════════════════════════════════════════════════════════
let BANDEJA = [], CONCEPTOS = [], enControl = null, lineasControl = [];
// Planilla de gastos (22-sep): catálogos de gastos_unidades / gastos_categorias
let G_UNIDADES = [], G_CATEGORIAS = [];
async function cargarCatalogosGastos(){
  if (G_UNIDADES.length) return;
  const [u, c] = await Promise.all([
    sb.from('gastos_unidades').select('clave,nombre,orden').eq('activo', true).order('orden'),
    sb.from('gastos_categorias').select('clave,nombre,orden').eq('activo', true).order('orden')]);
  G_UNIDADES = u.data || []; G_CATEGORIAS = c.data || [];
}
const MESES_G = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function _gPeriodoOpts(sel){
  // 8 meses para atrás y 2 para adelante desde hoy, + el seleccionado si cae afuera
  const hoy = new Date(); const out = []; const vistos = new Set();
  for (let k = -8; k <= 2; k++){
    const d = new Date(hoy.getFullYear(), hoy.getMonth()+k, 1);
    const v = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-01';
    vistos.add(v); out.push(v);
  }
  if (sel && !vistos.has(sel)) out.unshift(sel);
  return out.sort().map(v => `<option value="${v}" ${v===sel?'selected':''}>${MESES_G[Number(v.slice(5,7))-1]} ${v.slice(0,4)}</option>`).join('');
}
function _gestionCambio(){
  const on = document.getElementById('ctrl-gestion').checked;
  const b = document.getElementById('ctrl-gestion-box'); if (b) b.style.display = on ? 'block' : 'none';
  _avisoUnidadConcepto();
}
// ── (24-sep, JP) Reparto del gasto: parte a un local y parte a otro, y/o en distintos períodos ──
// enControl._reparto = [{periodo, unidad, categoria, pct, importe}] · enControl._gBase = total a repartir
const _r2g = x => Math.round((Number(x) || 0) * 100) / 100;
function _gMesMas(per, k){ const y = +per.slice(0,4), m = +per.slice(5,7) - 1 + k; const d = new Date(y, m, 1);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-01'; }
function _gRepartoInit(d, gs){
  if (d._reparto) return;
  if (Array.isArray(d.gestion_reparto) && d.gestion_reparto.length > 1){
    d._reparto = d.gestion_reparto.map(x => ({periodo: String(x.periodo).slice(0,10), unidad: x.unidad, categoria: x.categoria,
                                              pct: x.pct, importe: Number(x.importe)}));
    d._gBase = _r2g(d._reparto.reduce((a,x) => a + x.importe, 0));
  } else {
    const imp = gs.importe != null ? Number(gs.importe) : null;
    d._gBase = imp;
    d._reparto = [{periodo: gs.periodo || d.gestion_periodo || _gMesMas(_hoyAR().slice(0,7) + '-01', 0),
                   unidad: gs.unidad || '', categoria: gs.categoria || 'varios', pct: 100, importe: imp}];
  }
}
function _gRepartoHTML(){
  const d = enControl; if (!d || !d._reparto) return '';
  const P = d._reparto, varias = P.length > 1, base = Number(d._gBase || 0);
  const suma = _r2g(P.reduce((a,x) => a + (Number(x.importe) || 0), 0)), dif = _r2g(base - suma);
  const fila = (x, i) => `<tr>
      <td><select onchange="_gPartSet(${i},'periodo',this.value)">${_gPeriodoOpts(x.periodo)}</select></td>
      <td><select onchange="_gPartSet(${i},'unidad',this.value)"><option value="">— elegir —</option>
        ${G_UNIDADES.map(u => `<option value="${u.clave}" ${x.unidad===u.clave?'selected':''}>${esc(u.nombre)}</option>`).join('')}</select></td>
      <td><select onchange="_gPartSet(${i},'categoria',this.value)">
        ${G_CATEGORIAS.map(c => `<option value="${c.clave}" ${x.categoria===c.clave?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></td>
      <td class="num"><input type="text" inputmode="decimal" id="g-imp-${i}" class="fx-in" style="width:130px" value="${x.importe == null ? '' : nmShow(x.importe)}" oninput="_gPartImp(${i}, this.value)"></td>
      <td>${varias ? `<button class="act gh" type="button" style="padding:2px 8px" title="Quitar este renglón" onclick="_gPartQuitar(${i})">✕</button>` : ''}</td>
    </tr>`;
  return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 6px">
      <label class="mini">Total a la planilla <input type="text" inputmode="decimal" id="g-base" class="fx-in" style="width:130px" value="${nmShow(base)}" oninput="_gBaseSet(this.value)"></label>
      <span class="mini" style="color:var(--mut)">Si el gasto va a más de un local o a más de un mes, agregá un renglón por cada parte y poné el importe de cada una.</span>
    </div>
    <div style="overflow-x:auto"><table class="fx-tbl">
      <thead><tr><th>Período (mes de consumo)</th><th>Unidad</th><th>Categoría</th><th class="num">Importe</th><th></th></tr></thead>
      <tbody>${P.map(fila).join('')}</tbody>
      ${varias ? `<tfoot><tr><td colspan="3" style="text-align:right;color:var(--mut)">Suma de los renglones</td><td class="num" id="g-suma"><b>${plata(suma)}</b></td><td></td></tr></tfoot>` : ''}
    </table></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px">
      <button class="act gh" type="button" style="font-size:12px;padding:3px 9px" onclick="_gPartAgregar()" title="Otro renglón: otro local, otro mes o las dos cosas. Arranca con lo que falta repartir.">+ Agregar renglón</button>
      <span class="mini" id="g-dif" style="${Math.abs(dif) > 0.01 && varias ? 'color:#b45309' : 'color:var(--mut)'}">${varias ? (Math.abs(dif) > 0.01 ? `⚠ Los renglones suman ${plata(suma)} y el total es ${plata(base)}: ${dif > 0 ? 'faltan' : 'sobran'} ${plata(Math.abs(dif))}. Hasta que cierre no se puede contabilizar.` : '✓ Los renglones suman el total.') : ''}</span>
    </div>`;
}
function _gRepintar(){ const el = document.getElementById('ctrl-g-rep'); if (el) el.innerHTML = _gRepartoHTML(); _avisoUnidadConcepto(); }
function _gRefrescarSuma(){
  const d = enControl, P = d._reparto, base = Number(d._gBase || 0);
  const suma = _r2g(P.reduce((a,x) => a + (Number(x.importe) || 0), 0)), dif = _r2g(base - suma);
  const s = document.getElementById('g-suma'); if (s) s.innerHTML = `<b>${plata(suma)}</b>`;
  const e = document.getElementById('g-dif');
  if (e && P.length > 1){ e.style.color = Math.abs(dif) > 0.01 ? '#b45309' : 'var(--mut)';
    e.innerHTML = Math.abs(dif) > 0.01 ? `⚠ Los renglones suman ${plata(suma)} y el total es ${plata(base)}: ${dif > 0 ? 'faltan' : 'sobran'} ${plata(Math.abs(dif))}. Hasta que cierre no se puede contabilizar.` : '✓ Los renglones suman el total.'; }
}
function _gPartSet(i, campo, v){ enControl._reparto[i][campo] = v; if (campo === 'unidad') _avisoUnidadConcepto(); }
function _gPartImp(i, v){
  const d = enControl, x = d._reparto[i]; x.importe = String(v).trim() === '' ? null : nmParse(v);
  if (d._reparto.length === 1){ d._gBase = x.importe; const b = document.getElementById('g-base'); if (b) b.value = nmShow(d._gBase); }
  _gRefrescarSuma();
}
function _gBaseSet(v){
  const d = enControl; d._gBase = String(v).trim() === '' ? null : nmParse(v);
  if (d._reparto.length === 1){ d._reparto[0].importe = d._gBase; const el = document.getElementById('g-imp-0'); if (el) el.value = nmShow(d._gBase); }
  _gRefrescarSuma();
}
function _gPartAgregar(){
  const d = enControl, P = d._reparto, ult = P[P.length-1];
  const resto = d._gBase != null ? _r2g(Number(d._gBase) - P.reduce((a,x) => a + (Number(x.importe)||0), 0)) : 0;
  P.push({periodo: ult.periodo, unidad: '', categoria: ult.categoria, pct: null, importe: resto > 0 ? resto : 0});
  _gRepintar();
}
function _gPartQuitar(i){
  const d = enControl; d._reparto.splice(i, 1);
  if (d._reparto.length === 1) d._reparto[0].importe = d._gBase;
  _gRepintar();
}

async function cargarBandeja(){
  const [b, c, m] = await Promise.all([
    sb.rpc('compras_bandeja', {p_anio: null}),   // (30-ago) la bandeja no filtra por año: pendiente es pendiente
    CONCEPTOS.length ? Promise.resolve({data:null})
      : sb.from('compras_conceptos').select('codigo,descripcion,alicuota,gestion_unidad').eq('activo',true).limit(2000),
    sb.from('compras_eventos').select('at,detalle').eq('accion','motor_corrida')
      .order('at',{ascending:false}).limit(1),
  ]);
  if (b.error) throw b.error;
  BANDEJA = (b.data || []).filter(d => !!d.es_prueba === MODO_PRUEBA);
  if (c.data) CONCEPTOS = c.data;
  MOTOR = (m.data && m.data[0]) || null;
}

let MOTOR_PEDIDO = null;   // {id, estado} del pedido en curso (botón 🤖)

async function pedirMotor(){
  const btn = document.getElementById('btn-motor');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Pidiendo…'; }
  const {data, error} = await sb.rpc('compras_pedir_motor');
  if (error){ alert('No pude pedir la lectura: ' + error.message); if (btn){ btn.disabled=false; btn.textContent='🤖 Leer 1 - SIN CONTABILIZAR'; } return; }
  MOTOR_PEDIDO = {id: data.id, estado: 'pendiente', desde: Date.now()};
  pintarEstadoMotor();
  seguirPedido();
}
function pintarEstadoMotor(){
  const el = document.getElementById('motor-estado'); if (!el) return;
  const p = MOTOR_PEDIDO;
  if (!p) { el.innerHTML = ''; return; }
  const seg = Math.round((Date.now() - p.desde)/1000);
  if (p.estado === 'pendiente') el.innerHTML = MODO_PRUEBA
    ? `📥 Pedido #${p.id} registrado. En la etapa de prueba lo atiende Claude (Cowork) en su próxima pasada — sin consumir saldo de la API. Podés cerrar y volver más tarde: la Bandeja se actualiza sola. (${Math.floor(seg/60)} min)`
    : `⏳ Pedido #${p.id} en cola — el servidor lo toma en menos de 1 minuto (${seg}s)`;
  else if (p.estado === 'corriendo') el.innerHTML = `🔄 Leyendo la carpeta… (${seg}s)`;
  else if (p.estado === 'listo') el.innerHTML = `✅ Listo: ${p.resumen || 'lectura terminada'}`;
  else if (p.estado === 'error') el.innerHTML = `<span style="color:#dc2626">✗ El motor falló: ${esc(p.error || '')}</span>`;
}
async function seguirPedido(){
  if (!MOTOR_PEDIDO) return;
  const {data} = await sb.from('compras_motor_cola').select('estado,resultado').eq('id', MOTOR_PEDIDO.id).maybeSingle();
  if (data){
    MOTOR_PEDIDO.estado = data.estado;
    if (data.estado === 'listo'){
      const r = data.resultado || {};
      const leidas = (r.a_revisar||0)+(r.sin_regla||0)+(r.auto||0);
      MOTOR_PEDIDO.resumen = `${leidas} nueva(s) en la Bandeja · ${r.ignoradas||0} fuera de norma · ${r.errores||0} error(es)`;
      pintarEstadoMotor();
      await cargarTodo();      // refresca Bandeja + franja 🤖
      MOTOR_PEDIDO = null;
      return;
    }
    if (data.estado === 'error'){ MOTOR_PEDIDO.error = (data.resultado||{}).error; pintarEstadoMotor(); return; }
  }
  pintarEstadoMotor();
  const limite = MODO_PRUEBA ? 3*60*60*1000 : 5*60*1000;
  if (Date.now() - MOTOR_PEDIDO.desde > limite){
    MOTOR_PEDIDO.estado = 'error'; MOTOR_PEDIDO.error = MODO_PRUEBA
      ? 'pasaron 3 horas sin respuesta — avisale a JP que corra la pasada desde Cowork'
      : 'pasaron 5 minutos y el servidor no respondió — revisar el cron de compras en el VPS';
    pintarEstadoMotor(); return;
  }
  setTimeout(seguirPedido, MODO_PRUEBA ? 30000 : 4000);
}

// ── Modal de control ────────────────────────────────────────────────────
async function abrirControl(id){
  await cargarCatalogosGastos();
  enControl = BANDEJA.find(d => d.id === id);
  if (!enControl) return;
  delete enControl._reparto; delete enControl._gBase;   // cada apertura arranca de la sugerencia
  const neto = Number(enControl.neto_gravado||0) + Number(enControl.neto_no_gravado||0) + Number(enControl.exento||0);
  lineasControl = [{concepto: enControl.sug_concepto || '', monto: Math.round((neto || Number(enControl.total)) * 100)/100}];
  // (23-sep) Factura con parte gravada Y parte no gravada (Edenor: tasas y contribuciones): se propone
  // partida en dos, como en el Dragonfish — el concepto gravado y su hermano "no gravado".
  const _ng = Number(enControl.neto_no_gravado||0) + Number(enControl.exento||0), _gr = Number(enControl.neto_gravado||0);
  const _herm = _conceptoNoGravado(enControl.sug_concepto);
  if (_ng > 0 && _gr > 0 && _herm){
    lineasControl = [{concepto: enControl.sug_concepto, monto: Math.round(_gr*100)/100},
                     {concepto: _herm, monto: Math.round(_ng*100)/100}];
  }
  pintarControl();
  // Desglose impositivo (la RPC de la bandeja no lo trae): IVA por alícuota, percepciones y otros tributos
  try {
    const { data: imp } = await sb.from('compras_documentos')
      .select('iva_21,iva_105,iva_27,iva_otros,percep_iva,percep_iibb_caba,percep_iibb_ba,otros_tributos,fecha_vto,cae,cae_vto,extraido_json,descuentos_extra,numero_interno,fecha_ingreso').eq('id', id).single();
    if (imp && enControl && enControl.id === id){ Object.assign(enControl, imp); enControl._impuestosOk = true; pintarControl(); }
  } catch (_) {}
  // Renglones de la factura (mercadería) con el control contra las listas COMPRA / COSTO del Dragonfish
  try {
    const { data: rg } = await sb.rpc('compras_doc_renglones', { p_doc: id });
    if (enControl && enControl.id === id){ enControl._renglones = rg || []; pintarControl(); }
  } catch (_) {}
  try {
    const { data: ac } = await _arcaDe(enControl.cuit_emisor);
    if (enControl && enControl.id === id){ enControl._arca = ac; pintarControl(); }
  } catch (_) {}
  const {data} = await sb.rpc('compras_conceptos_proveedor', {p_cuit: enControl.cuit_emisor});
  enControl._usados = data || [];
  pintarControl();
}
function cerrarControl(){
  const o = document.getElementById('ctrl-overlay');
  if (o) o.remove();
  document.body.style.overflow = '';
  enControl = null;
}

// ── Desglose impositivo del comprobante (pedido JP 11-sep: ver IVA, % y percepciones por separado) ──
function _desgloseImpositivo(d, neto){
  if (!d._impuestosOk) return '<p class="mini">Cargando desglose impositivo…</p>';
  const n = x => Number(x || 0);
  const grav = n(d.neto_gravado), nograv = n(d.neto_no_gravado), ex = n(d.exento);
  const pct = (imp, base) => base > 0 ? (imp / base * 100).toLocaleString('es-AR', { maximumFractionDigits: 2 }) + ' %' : '—';
  const filas = [];
  const add = (grupo, nombre, importe, base, esperado) => {
    if (!importe) return;
    const p = base > 0 ? importe / base * 100 : null;
    const raro = esperado != null && p != null && Math.abs(p - esperado) > 0.6;   // alícuota que no coincide con la nominal
    filas.push(`<tr><td>${grupo}</td><td>${nombre}</td><td class="num">${plata(base)}</td>
      <td class="num" style="${raro ? 'color:#b45309;font-weight:600' : ''}" title="${raro ? 'La alícuota efectiva no coincide con la nominal: revisar la base o el importe' : 'importe ÷ base'}">${pct(importe, base)}${raro ? ' ⚠' : ''}</td>
      <td class="num"><b>${plata(importe)}</b></td></tr>`);
  };
  // IVA: base = neto gravado. Si hay más de una alícuota no se puede repartir la base sin los renglones: se usa la alícuota nominal.
  const ivas = [['IVA 21 %', n(d.iva_21), 21], ['IVA 10,5 %', n(d.iva_105), 10.5], ['IVA 27 %', n(d.iva_27), 27]].filter(x => x[1]);
  if (ivas.length === 1) add('IVA', ivas[0][0], ivas[0][1], grav, ivas[0][2]);
  else ivas.forEach(([nom, imp, al]) => add('IVA', nom, imp, imp / (al / 100), al));
  if (n(d.iva_otros)) add('IVA', 'IVA otras alícuotas', n(d.iva_otros), grav, null);
  add('Percepción', 'Percepción IVA', n(d.percep_iva), grav, null);
  add('Percepción', 'IIBB CABA', n(d.percep_iibb_caba), neto, null);
  add('Percepción', 'IIBB Buenos Aires', n(d.percep_iibb_ba), neto, null);
  add('Otros', 'Otros tributos / impuestos internos', n(d.otros_tributos), neto, null);
  const sumaImp = n(d.iva_21) + n(d.iva_105) + n(d.iva_27) + n(d.iva_otros) + n(d.percep_iva) + n(d.percep_iibb_caba) + n(d.percep_iibb_ba) + n(d.otros_tributos);
  const dif = Math.round((n(d.total) - neto - sumaImp) * 100) / 100;
  return `<details class="c-imp" ${filas.length ? 'open' : ''} style="margin:6px 0 10px;border:1px solid var(--bd);border-radius:8px;padding:6px 10px;">
    <summary style="cursor:pointer;font-size:12.5px;font-weight:600;color:var(--mut);">🧾 Desglose impositivo · ${filas.length ? filas.length + ' concepto(s)' : 'sin impuestos discriminados'}</summary>
    <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;margin:6px 0 4px;">
      <span>Neto gravado <b>${plata(grav)}</b></span>
      ${nograv ? `<span>No gravado <b>${plata(nograv)}</b></span>` : ''}
      ${ex ? `<span>Exento <b>${plata(ex)}</b></span>` : ''}
    </div>
    ${filas.length ? `<table style="width:100%;font-size:12.5px;"><thead><tr><th></th><th>Impuesto</th><th class="num">Base</th><th class="num">%</th><th class="num">Importe</th></tr></thead>
      <tbody>${filas.join('')}</tbody>
      <tfoot><tr><td colspan="4" style="text-align:right;color:var(--mut);">Total impuestos</td><td class="num"><b>${plata(sumaImp)}</b></td></tr></tfoot></table>` : ''}
    <div class="mini" style="margin-top:4px;display:flex;justify-content:space-between;align-items:center;gap:8px;${Math.abs(dif) > 1 ? 'color:#b91c1c;font-weight:600' : 'color:#166534'}">
      <span>${Math.abs(dif) > 1 ? `⚠ Neto + impuestos no llegan al total: faltan ${plata(dif)} (el motor no identificó algún concepto — revisar el PDF)` : '✓ Neto + impuestos = total de la factura'}</span>
      <button class="act" type="button" onclick="_editarImportes()" title="Si el motor leyó mal algún importe, corregilo a mano">✏ Corregir importes</button>
    </div>
    <div id="imp-edit"></div>
  </details>`;
}


// ═══════════════════════════════════════════════════════════════════════
//  FORMATO "ESPEJO DE LA FACTURA" (decisión JP 22-sep: opción A)
//  El modal de control y el resumen se arman con la misma anatomía que el
//  papel: proveedor arriba a la izquierda, datos del comprobante a la derecha,
//  renglones en el medio, pie con la pirámide subtotal → neto → IVA → total.
//  Lo que agrega el módulo (concepto, control contra lista, planilla) va en
//  bloques aparte para que lo de la izquierda sea solo lo que dice el papel.
// ═══════════════════════════════════════════════════════════════════════
const _FX_ESTADO = {
  ok:         ['✓ lista', '#166534', 'Precio e importe coinciden con la lista COSTO (con descuento) vigente a la fecha'],
  ok_precio:  ['✓ precio', '#166534', 'El precio unitario coincide con la lista COMPRA; el descuento difiere de la lista COSTO'],
  difiere:    ['≠ lista', '#b45309', 'Difiere de la lista del Dragonfish'],
  sin_lista:  ['sin lista', '#64748b', 'El SKU no tiene precio cargado en el Dragonfish a esa fecha'],
  sin_sku:    ['sin SKU', '#b91c1c', 'No se pudo traducir el código del proveedor: resolverlo en 🔗 Equivalencias'],
  sin_stock:  ['no es stock', '#64748b', 'Renglón que se paga pero no entra al stock (cajas, fletes)'],
};
const _fxPct = v => v == null ? '' : (v > 0 ? '+' : '') + Number(v).toLocaleString('es-AR', {maximumFractionDigits: 1}) + ' %';
// (24-sep, JP) Un renglón = cant × p.unit × (1 − dto). Mismas cuentas que compras_doc_renglones / compras_renglones_guardar.
const _r2 = x => Math.round((Number(x) || 0) * 100) / 100;
function _rengPun(r){ return r.precio_unitario == null ? null : Number(r.precio_unitario) * (1 - Number(r.descuento_pct || 0) / 100); }
function _rengNeto(r){ const pu = _rengPun(r); return pu == null ? Number(r.importe || 0) : _r2(Number(r.cantidad || 0) * pu); }
// El control contra lista se recalcula en el navegador cuando se edita un renglón (misma regla que la RPC)
function _rengEstado(r){
  const lc = r.lista_compra != null ? Number(r.lista_compra) : null, lk = r.lista_costo != null ? Number(r.lista_costo) : null;
  const pu = r.precio_unitario != null ? Number(r.precio_unitario) : null, pun = _rengPun(r);
  const dp = lc > 0 && pu != null ? Math.round((pu / lc - 1) * 10000) / 100 : null;
  const dk = lk > 0 && pun != null ? Math.round((pun / lk - 1) * 10000) / 100 : null;
  let e;
  if (r.sin_stock) e = 'sin_stock';
  else if (!r.sku) e = 'sin_sku';
  else if (lc == null && lk == null) e = 'sin_lista';
  else if (lk > 0 && pun != null && Math.abs(pun / lk - 1) <= 0.005) e = 'ok';
  else if (lc > 0 && pu != null && Math.abs(pu / lc - 1) <= 0.005) e = 'ok_precio';
  else e = 'difiere';
  return {estado: e, dif_precio_pct: dp, dif_costo_pct: dk};
}
// Descuentos generales (no por producto: pago contado, bonificación, etc.). Con % se calcula sobre la suma de renglones.
function _descExtras(d, sub){
  const arr = d._descExtra ?? d.descuentos_extra ?? [];
  return arr.map(x => ({...x, monto: (x.pct !== null && x.pct !== undefined && x.pct !== '') ? _r2(sub * Number(x.pct) / 100) : _r2(x.importe)}));
}

// Última consulta al padrón de ARCA para ese CUIT (null si nunca se validó)
async function _arcaDe(cuit){
  if (!cuit) return {data: null};
  const r = await sb.from('compras_arca_consultas').select('cuit,vigente,estado_clave,cond_iva,consultado_at').eq('cuit', String(cuit)).maybeSingle();
  return {data: r.data || null};
}
// Consulta a ARCA desde el modal de control / resumen (misma cola que la ficha del proveedor)
async function _arcaConsultarDoc(cuit){
  const d = enControl; if (!d || String(d.cuit_emisor) !== String(cuit)) return;
  d._arcaBuscando = true; pintarControl();
  try {
    const { data, error } = await sb.rpc('compras_arca_pedir', { p_cuit: String(cuit).replace(/\D/g,''), p_forzar: false });
    if (error || !data?.ok) throw new Error(error?.message || data?.motivo || 'No se pudo pedir la consulta');
    let c = data.consulta;
    for (let i = 0; i < 45 && !c; i++){
      await new Promise(r => setTimeout(r, 2000));
      const { data: e } = await sb.rpc('compras_arca_estado', { p_cola_id: data.cola_id });
      if (e?.estado === 'listo' && e.consulta) c = e.consulta;
      if (e?.estado === 'error') throw new Error('El consultor de ARCA no respondió. ¿Está corriendo arca_padron.py en la PC de JP?');
    }
    if (!c) throw new Error('ARCA no respondió en 90 segundos. Probá de nuevo en un rato.');
    if (enControl && enControl.id === d.id) enControl._arca = c;
  } catch (e) { alert(e.message); }
  if (enControl && enControl.id === d.id){ enControl._arcaBuscando = false; pintarControl(); }
}

// Renglones del papel. Con renglones reales (mercadería): cant · descripción/SKU · p.unit · dto · neto · control.
// Sin renglones reales pero con los que leyó el motor (descripción + monto): esos. Sin nada: vacío.
function _facturaRenglones(d, reng, opts = {}){
  const ej = d.extraido_json || {};
  if (reng && reng.length){
    const concs = (opts.conceptos || []).filter(c => (c||'').trim());

    const ed = !!opts.editable;
    const inp = (i, campo, v, w) => `<input type="text" inputmode="decimal" class="fx-in" style="width:${w}px" value="${v == null ? '' : String(v).replace('.', ',')}" oninput="_rengEdit(${i}, '${campo}', this.value)">`;
    return `<div style="overflow-x:auto"><table class="fx-tbl">
      <thead><tr><th class="num">Cant</th><th>Descripción · SKU</th><th class="num">P. unit</th><th class="num">Dto</th><th class="num">P. unit c/desc</th><th class="num">Neto</th><th>Control</th><th>Concepto</th></tr></thead>
      <tbody>${reng.map((r, i) => { const est = _rengEstado(r), pun = _rengPun(r);
        return `<tr>
        <td class="num">${ed ? inp(i, 'cantidad', r.cantidad, 54) : Number(r.cantidad||0).toLocaleString('es-AR')}</td>
        <td>${esc(r.descripcion || '')}<br><span class="mini">${r.sku ? `<code>${esc(r.sku)}</code>` : `<span style="color:#b91c1c">${esc(r.codigo_proveedor || '')} → sin SKU</span>`}${(!r.sku && !r.sin_stock && opts.desde) ? ` <button class="act fx-eq-btn" title="Traducir el código del proveedor a un artículo nuestro. Se guarda como equivalencia y las próximas facturas de este proveedor lo reconocen solas." onclick="abrirMapeoRenglon(${Number(d.id)}, '${esc(opts.desde)}', ${i})">🔗 Asignar SKU</button>` : ''}${r.lista_compra != null ? ` · lista ${plata(r.lista_compra)}` : ''}${r.lista_costo != null ? ` · costo ${plata(r.lista_costo)}` : ''}</span></td>
        <td class="num">${ed ? inp(i, 'precio_unitario', r.precio_unitario, 96) : (r.precio_unitario != null ? plata(r.precio_unitario) : '—')}</td>
        <td class="num">${ed ? inp(i, 'descuento_pct', r.descuento_pct, 46) + ' %' : (Number(r.descuento_pct) ? Number(r.descuento_pct).toLocaleString('es-AR') + ' %' : '—')}</td>
        <td class="num" id="fx-pun-${i}">${pun != null ? plata(pun) : '—'}</td>
        <td class="num" id="fx-net-${i}"><b>${plata(_rengNeto(r))}</b></td>
        <td id="fx-ctl-${i}">${_fxChip(est)}</td>
        <td>${conc}</td>

      <tfoot><tr><td colspan="5" style="text-align:right;color:var(--mut)">Suma de renglones</td><td class="num" id="fx-sub"><b>${plata(reng.reduce((a,r) => a + _rengNeto(r), 0))}</b></td><td colspan="2"></td></tr></tfoot>
    </table></div>

  }
  const lr = ej.renglones || [];
  if (lr.length){
    return `<table class="fx-tbl"><thead><tr><th>Descripción (leída del PDF)</th><th class="num">Importe</th></tr></thead>
      <tbody>${lr.map(r => `<tr><td>${esc(r.descripcion || r.desc || '')}</td><td class="num">${plata(r.monto ?? r.importe)}</td></tr>`).join('')}</tbody></table>`;
  }
  return '';
}

function _fxChip(est){
  const e = _FX_ESTADO[est.estado] || _FX_ESTADO.sin_lista;
  const det = est.estado === 'difiere' ? [est.dif_precio_pct != null ? 'precio ' + _fxPct(est.dif_precio_pct) : '', est.dif_costo_pct != null ? 'vs costo ' + _fxPct(est.dif_costo_pct) : ''].filter(Boolean).join(' · ') : '';
  return `<span class="chip" title="${esc(e[2])}" style="background:${e[1]}18;color:${e[1]}">${e[0]}</span>${det ? `<br><span class="mini" style="color:#b45309">${esc(det)}</span>` : ''}`;
