        <option value="pct" ${esPct ? 'selected' : ''}>%</option><option value="fijo" ${esPct ? '' : 'selected'}>$ importe fijo</option></select>
      ${esPct
        ? `<input type="text" inputmode="decimal" class="fx-in" style="width:54px" value="${x.pct}" placeholder="%" oninput="_descEdit(${i}, 'pct', this.value)"> %
           <span class="mini">=</span><span class="mini" id="fx-dg-imp-${i}" style="min-width:90px;text-align:right"><b>${plata(x.monto)}</b></span>`
        : `<span class="mini">$</span><input type="text" inputmode="decimal" class="fx-in" id="fx-dg-fijo-${i}" style="width:120px" value="${nmShow(x.monto)}" placeholder="0,00" oninput="_descEdit(${i}, 'importe', this.value)">`}
      <button class="act gh" type="button" style="padding:3px 8px" title="Quitar" onclick="_descQuitar(${i})">✕</button>
    </div>`; }).join('')}
    <button class="act gh" type="button" style="font-size:12px;padding:4px 9px" onclick="_descAgregar()">+ Agregar descuento general</button>
  </div>`;
}
function _descGeneralesLectura(d, reng){
  const sub = reng.reduce((a,r) => a + _rengNeto(r), 0);
  const ex = _descExtras(d, sub);
  return ex.length ? `<div class="mini" style="margin:2px 0 6px">Descuentos generales: ${ex.map(x => `<b>${esc(x.descripcion)}</b>${x.pct != null && x.pct !== '' ? ' ' + x.pct + ' %' : ''} (${plata(x.monto)})`).join(' · ')}</div>` : '';
}
function _rengEdit(i, campo, v){
  const d = enControl, r = d && d._renglones && d._renglones[i]; if (!r) return;
  const t = String(v).trim();
  r[campo] = t === '' ? (campo === 'descuento_pct' ? 0 : null) : nmParse(t);
  r.importe = _rengNeto(r);
  d._rengDirty = true;
  const pun = _rengPun(r);
  const set = (id, h) => { const el = document.getElementById(id); if (el) el.innerHTML = h; };
  set('fx-pun-' + i, pun != null ? plata(pun) : '—');
  set('fx-net-' + i, `<b>${plata(_rengNeto(r))}</b>`);
  set('fx-ctl-' + i, _fxChip(_rengEstado(r)));
  set('fx-sub', `<b>${plata(d._renglones.reduce((a,x) => a + _rengNeto(x), 0))}</b>`);
  _refrescarDescMontos(); _repintarPie();
}
function _dtoATodos(){
  const d = enControl; if (!d || !d._renglones) return;
  const v = (document.getElementById('fx-dto-todos') || {}).value || '';
  const p = nmParse(v); if (v.trim() === '' || p < 0 || p > 100){ alert('Poné un porcentaje entre 0 y 100.'); return; }
  d._renglones.forEach(r => { if (!r.sin_stock && r.precio_unitario != null){ r.descuento_pct = p; r.importe = _rengNeto(r); } });
  d._rengDirty = true; _repintarRenglones();
}
function _descLista(){ const d = enControl; if (!d._descExtra) d._descExtra = JSON.parse(JSON.stringify(d.descuentos_extra || [])); return d._descExtra; }
function _descAgregar(){ _descLista().push({descripcion: 'Pago contado', pct: 5, importe: 0}); enControl._descDirty = true; _repintarRenglones(); }
function _descQuitar(i){ _descLista().splice(i, 1); enControl._descDirty = true; _repintarRenglones(); }
function _descEdit(i, campo, v){
  const l = _descLista(), x = l[i]; if (!x) return;
  if (campo === 'descripcion') x.descripcion = v;
  else if (campo === 'pct') x.pct = String(v).trim() === '' ? 0 : nmParse(v);   // en modo % el % nunca queda vacío (vacío = 0 %)
  else x.importe = String(v).trim() === '' ? 0 : nmParse(v);
  enControl._descDirty = true;
  if (campo !== 'descripcion'){ _refrescarDescMontos(); _repintarPie(); }
}
function _refrescarDescMontos(){
  const d = enControl; if (!d) return;
  const sub = (d._renglones || []).reduce((a,r) => a + _rengNeto(r), 0);
  _descExtras(d, sub).forEach((x, i) => { const el = document.getElementById('fx-dg-imp-' + i); if (el) el.innerHTML = `<b>${plata(x.monto)}</b>`; });
}
// (25-sep, JP) cada descuento general es por % o por importe fijo: lo elige el desplegable
function _descTipo(i, tipo){
  const d = enControl, l = _descLista(), x = l[i]; if (!x) return;
  const sub = (d._renglones || []).reduce((a,r) => a + _rengNeto(r), 0);
  const actual = _descExtras(d, sub)[i];
  if (tipo === 'fijo'){ x.importe = actual ? actual.monto : 0; x.pct = null; }
  else { x.pct = sub > 0 && actual && actual.monto ? _r2(actual.monto / sub * 100) : 0; x.importe = 0; }
  enControl._descDirty = true; _repintarRenglones();
}
function _repintarRenglones(){
  const d = enControl, el = document.getElementById('fx-reng'); if (!d || !el) return;
  el.innerHTML = _facturaRenglones(d, d._renglones || [], {conceptos: lineasControl.map(l => l.concepto), desde: 'control', editable: true});
  _repintarPie();
}
function _pieControlHTML(){
  const d = enControl; if (!d) return '';
  const neto = Number(d.neto_gravado||0) + Number(d.neto_no_gravado||0) + Number(d.exento||0);
  const asignado = lineasControl.reduce((a,l) => a + (Number(l.monto)||0), 0);
  const dif = Math.round((neto - asignado) * 100) / 100;
  return _facturaPie(d, d._renglones || [], {lineasOk: Math.abs(dif) < 0.02, lineasTxt: Math.abs(dif) < 0.02 ? 'Los conceptos suman el neto' : `Faltan ${plata(dif)} por imputar a conceptos`,
    extra: `<div style="margin-top:6px"><button class="act gh" type="button" style="font-size:12px;padding:4px 9px" onclick="_editarImportes()" title="Si el motor leyó mal algún importe, corregilo a mano">✏ Corregir importes</button></div>`});
}
function _repintarPie(){ const el = document.getElementById('fx-pie-wrap'); if (el) el.innerHTML = _pieControlHTML(); }

// Pie: la pirámide del papel. Devuelve las filas (label, valor, opciones).
function _facturaPieFilas(d, reng){
  const n = x => Number(x || 0);
  const grav = n(d.neto_gravado), nograv = n(d.neto_no_gravado), ex = n(d.exento);
  const neto = grav + nograv + ex;
  const filas = [];
  if (reng && reng.length){
    const sub = reng.reduce((a,r) => a + _rengNeto(r), 0);
    const ex = _descExtras(d, sub);
    const calc = sub - ex.reduce((a,x) => a + x.monto, 0);
    const resid = Math.round((calc - neto) * 100) / 100;
    if (ex.length || Math.abs(resid) > 0.02){
      filas.push(['Suma de renglones', sub]);
      ex.forEach(x => filas.push([`Dto. ${x.descripcion || 'general'}${x.pct !== null && x.pct !== undefined && x.pct !== '' ? ' ' + Number(x.pct).toLocaleString('es-AR') + ' %' : ''}`, -x.monto]));
      if (Math.abs(resid) > 0.02) filas.push([resid > 0 ? 'Descuento sin explicar' : 'Ajuste sin explicar', -resid, {raro: true, tip: 'La suma de renglones menos los descuentos no llega al neto de la factura: revisá precios, descuentos por renglón o agregá un descuento general.'}]);
    }
  }
  filas.push(['Neto gravado', grav, {b: true}]);
  if (nograv) filas.push(['No gravado', nograv]);
  if (ex) filas.push(['Exento', ex]);
  const pct = (imp, base) => base > 0 ? imp / base * 100 : null;
  [['IVA 21 %', n(d.iva_21), 21], ['IVA 10,5 %', n(d.iva_105), 10.5], ['IVA 27 %', n(d.iva_27), 27]].forEach(([nom, imp, al]) => {
    if (!imp) return;
    const ivas = [n(d.iva_21), n(d.iva_105), n(d.iva_27)].filter(Boolean).length;
    const p = ivas === 1 ? pct(imp, grav) : al;
    filas.push([nom, imp, {raro: p != null && Math.abs(p - al) > 0.6, p}]);
  });
  if (n(d.iva_otros)) filas.push(['IVA otras alícuotas', n(d.iva_otros), {raro: true, tip: 'IVA de ajuste: el histórico lo metió para que el comprobante cerrara'}]);
  if (n(d.percep_iva)) filas.push(['Percepción IVA', n(d.percep_iva)]);
  if (n(d.percep_iibb_caba)) filas.push(['Perc. IIBB CABA', n(d.percep_iibb_caba)]);
  if (n(d.percep_iibb_ba)) filas.push(['Perc. IIBB Buenos Aires', n(d.percep_iibb_ba)]);
  if (n(d.otros_tributos)) filas.push(['Otros tributos', n(d.otros_tributos)]);
  const sumaImp = n(d.iva_21) + n(d.iva_105) + n(d.iva_27) + n(d.iva_otros) + n(d.percep_iva) + n(d.percep_iibb_caba) + n(d.percep_iibb_ba) + n(d.otros_tributos);
  const dif = Math.round((n(d.total) - neto - sumaImp) * 100) / 100;
  return {filas, neto, sumaImp, dif};
}

function _facturaPie(d, reng, opts = {}){
  if (!d._impuestosOk && !opts.listo) return '<p class="mini">Cargando el pie de la factura…</p>';
  const {filas, neto, dif} = _facturaPieFilas(d, reng);
  const cargado = (d.cae || (d.extraido_json||{}).cae), caeVto = d.cae_vto || (d.extraido_json||{}).cae_vto;
  const checks = [];
  const okDif = Math.abs(dif) <= 1;
  checks.push([okDif, okDif ? 'Neto + IVA + percepciones = total' : `Neto + impuestos no llegan al total: faltan ${plata(dif)}`]);
  if (reng && reng.length){
    const conSku = reng.filter(r => r.sku && !r.sin_stock), sinSku = reng.filter(r => !r.sku && !r.sin_stock);
    const _e = r => _rengEstado(r).estado;
    const okL = conSku.filter(r => _e(r) === 'ok' || _e(r) === 'ok_precio').length, difL = conSku.filter(r => _e(r) === 'difiere').length, sinL = conSku.filter(r => _e(r) === 'sin_lista').length;
    checks.push([difL === 0, `Precio vs lista Dragonfish: ${okL} de ${conSku.length} coinciden${difL ? ` · ${difL} difieren` : ''}${sinL ? ` · ${sinL} sin lista` : ''}`]);
    if (sinSku.length) checks.push([false, `${sinSku.length} renglón(es) sin SKU (🔗 Equivalencias)`]);
    const sub = reng.reduce((a,r) => a + _rengNeto(r), 0);
    const ex = _descExtras(d, sub), calc = sub - ex.reduce((a,x) => a + x.monto, 0);
    const okSub = Math.abs(calc - neto) <= 1;
    checks.push([okSub, okSub ? (ex.length ? 'Renglones − descuentos generales = neto' : 'Los renglones suman el neto')
      : `Renglones${ex.length ? ' − descuentos' : ''} dan ${plata(calc)} y el neto de la factura dice ${plata(neto)} (dif ${plata(calc - neto)})`]);
  }
  if (opts.lineasOk != null) checks.push([opts.lineasOk, opts.lineasTxt]);
  checks.push([!!cargado && !!caeVto, cargado ? (caeVto ? 'CAE y vencimiento leídos' : 'CAE leído · falta el vencimiento') : 'Falta el CAE']);
  if (opts.vtoCheck !== false) checks.push([!!(d.fecha_vto || (d.extraido_json||{}).fecha_vto), (d.fecha_vto || (d.extraido_json||{}).fecha_vto) ? 'Vencimiento cargado (define la fecha de pago)' : 'Sin vencimiento: cargalo arriba, es la fecha de pago de la OP']);
  return `<div class="fx-pie">
    <div>
      <div style="font-weight:700;font-size:12.5px;color:var(--mut);margin-bottom:4px">CONTROL</div>
      ${checks.map(([ok, tx]) => `<div class="mini" style="color:${ok ? '#166534' : '#b45309'};margin:2px 0">${ok ? '✓' : '⚠'} ${esc(tx)}</div>`).join('')}
      ${opts.extra || ''}
    </div>
    <table class="fx-tot"><tbody>
      ${filas.map(([l, v, o = {}]) => `<tr><td style="color:var(--mut)">${esc(l)}${o.raro ? ` <span title="${esc(o.tip || ('La alícuota efectiva (' + (o.p != null ? o.p.toFixed(2) : '?') + ' %) no coincide con la nominal: revisar la base o el importe'))}" style="color:#b45309;cursor:help">⚠</span>` : ''}</td>
        <td class="num" style="${o.b ? 'font-weight:600' : ''}">${plata(v)}</td></tr>`).join('')}
      <tr class="fx-total"><td>TOTAL</td><td class="num">${plata(d.total)}</td></tr>
    </tbody></table>
  </div>`;
}

async function _guardarImportes(){

function _conceptoNoGravado(cod){

  const asignado = lineasControl.reduce((a,l) => a + (Number(l.monto)||0), 0);
  const dif = Math.round((neto - asignado) * 100) / 100;
  const el = document.getElementById('ctrl-dif');
  if (el) el.innerHTML = Math.abs(dif) < 0.02
    ? `<span style="color:var(--ok)">✓ Los conceptos suman el neto de la factura.</span>`
    : `<span style="color:var(--warn)">⚠ Faltan ${plata(dif)} por asignar (neto ${plata(neto)}).</span>`;
  _repintarPie();
}

// Hoy en hora argentina (toISOString da el día siguiente después de las 21 hs)
function _hoyAR(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires'}).format(new Date()); }

async function contabilizar(){
  const lineas = lineasControl
    .filter(l => (l.concepto||'').trim())
    .map(l => ({concepto: l.concepto.trim(), monto_neto: Number(l.monto)||0,
                alicuota: (l.alicuota === '' || l.alicuota == null) ? null : String(Number(l.alicuota))}));
  if (!lineas.length){ alert('Elegí al menos un concepto contable.'); return; }
  const alicMala = lineas.find(l => l.alicuota !== null && (isNaN(Number(l.alicuota)) || Number(l.alicuota) < 0 || Number(l.alicuota) > 100));
  if (alicMala){ alert('La alícuota de IVA tiene que ser un número entre 0 y 100 (ej: 21, 10.5, 27, 0).'); return; }
  const cae = (document.getElementById('ctrl-cae')?.value || '').trim(), caeVto = document.getElementById('ctrl-cae-vto')?.value || null;
  if (cae && !/^\d{14}$/.test(cae) && !confirm('El CAE suele tener 14 dígitos y este tiene ' + cae.length + '. ¿Guardar igual?')) return;
  const vtoIn = document.getElementById('ctrl-vto')?.value || '';
  if (!vtoIn && !confirm('La factura no tiene FECHA DE VENCIMIENTO cargada.\n\nSin vencimiento, la orden de pago no sabe cuándo pagarla (va a proponer la fecha del día). ¿Contabilizar igual?')) return;
  for (const [id, t] of [['ctrl-ingreso','de ingreso'],['ctrl-vto','de vencimiento'],['ctrl-cae-vto','de vencimiento del CAE']]){
    const el = document.getElementById(id);
    if (_fechaInvalida(el)){ alert('⚠ La fecha ' + t + ' no es válida. Revisá día, mes y año.'); el.focus(); return; }
  }
  const ingIn = document.getElementById('ctrl-ingreso')?.value || null;
  // (24-sep, JP) Tope de 12 meses entre emisión e ingreso (la base también lo frena).
  if (ingIn && enControl.fecha_emision && ingIn > _sumarMeses(enControl.fecha_emision, 12)){
    alert('La fecha de ingreso (' + _fecha(ingIn) + ') supera el tope de 12 meses desde la emisión (' + _fecha(enControl.fecha_emision)
      + ').\n\nÚltimo día permitido: ' + _fecha(_sumarMeses(enControl.fecha_emision, 12)) + '.');
    return;
  }
  if (ingIn && ingIn.slice(0,7) !== _hoyAR().slice(0,7)
      && !confirm('La fecha de ingreso (' + fechaCorta(ingIn) + ') es de otro mes que hoy.\n\nEsta factura va a entrar en el Libro IVA Compras de ' + MESES[+ingIn.slice(5,7)-1] + ' ' + ingIn.slice(0,4) + '. ¿Seguro?')) return;
  if (ingIn && enControl.fecha_emision && ingIn < enControl.fecha_emision){ alert('La fecha de ingreso no puede ser anterior a la emisión (' + fechaCorta(enControl.fecha_emision) + ').'); return; }
  const niTxt = (document.getElementById('ctrl-numint')?.value || '').trim();
  if (niTxt && !(/^\d+$/.test(niTxt) && Number(niTxt) > 0)){ alert('El número interno tiene que ser un entero mayor a cero (o dejalo vacío para que se asigne solo).'); return; }
  if (vtoIn && enControl.fecha_emision && vtoIn < enControl.fecha_emision){ alert('El vencimiento no puede ser anterior a la emisión (' + fechaCorta(enControl.fecha_emision) + ').'); return; }
  // (24-sep) Renglones editados / descuentos generales: se guardan primero (queda el antes/después en eventos)
  if (enControl._rengDirty || enControl._descDirty){
    const dl = enControl._descExtra || [];
    if (dl.some(x => !String(x.descripcion || '').trim())){ alert('Cada descuento general necesita una descripción (ej. "Pago contado").'); return; }
    const sub = (enControl._renglones || []).reduce((a,r) => a + _rengNeto(r), 0);
    const {error: eR} = await sb.rpc('compras_renglones_guardar', {
      p_doc: enControl.id,
      p_renglones: enControl._rengDirty ? (enControl._renglones || []).map(r => ({nroitem: r.nroitem, cantidad: r.cantidad, precio_unitario: r.precio_unitario, descuento_pct: r.descuento_pct ?? 0})) : null,
      p_descuentos: enControl._descDirty ? _descExtras(enControl, sub).map(x => ({descripcion: x.descripcion, pct: (x.pct === '' ? null : x.pct), importe: x.monto})) : null,
    });
    if (eR){ alert('No se pudieron guardar los renglones: ' + eR.message); return; }
    enControl._rengDirty = false; enControl._descDirty = false;
  }
  // (24-sep) Planilla de gastos: una parte = como siempre · varias partes = reparto por unidad y/o período
  let gestionPayload = null;
  if (document.getElementById('ctrl-gestion').checked){
    const P = enControl._reparto || [];
    if (P.length > 1){
      const falta = P.findIndex(x => !x.periodo || !x.unidad || !x.categoria || x.importe == null || x.importe === '');
      if (falta >= 0){ alert('La parte ' + (falta+1) + ' del reparto está incompleta: necesita período, unidad, categoría e importe.'); return; }
      const suma = _r2g(P.reduce((a,x) => a + Number(x.importe), 0)), base = Number(enControl._gBase || 0);
      // (25-sep, JP) TRABA: los renglones tienen que sumar exacto el total (la base lo vuelve a controlar)
      if (Math.abs(suma - base) > 0.01){
        const dif = _r2g(suma - base);
        alert('No se puede contabilizar: el reparto no cierra.\n\nLos renglones suman ' + plata(suma) + ' y el total a la planilla es ' + plata(base) + ': ' + (dif > 0 ? 'sobran ' : 'faltan ') + plata(Math.abs(dif)) + '.\n\nCorregí el importe de algún renglón o el total a la planilla.');
        const el = document.getElementById('ctrl-g-rep'); if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
        return;
      }
      gestionPayload = {total: base, reparto: P.map(x => ({periodo: x.periodo, unidad: x.unidad, categoria: x.categoria, pct: null, importe: Number(x.importe)}))};
    } else if (P.length === 1){
      const x = P[0];
      gestionPayload = {periodo: x.periodo || null, unidad: x.unidad || null, categoria: x.categoria || null,
                        importe: x.importe == null || x.importe === '' ? null : Number(x.importe)};
    }
  }
  const {data, error} = await sb.rpc('compras_contabilizar', {
    p_doc_id: enControl.id,
    p_lineas: lineas,
    p_tipo_gasto: document.getElementById('ctrl-tipo').value || null,
    p_computa_formal:  document.getElementById('ctrl-formal').checked,
    p_computa_gestion: document.getElementById('ctrl-gestion').checked,
    p_cotizacion: enControl._cotizNueva || null,
    p_cae: cae || null, p_cae_vto: caeVto,
    p_fecha_vto: document.getElementById('ctrl-vto')?.value || null,
    p_fecha_ingreso: ingIn,
    p_numero_interno: niTxt ? Number(niTxt) : null,
    p_gestion: gestionPayload,
  });
  if (error){ alert('No se pudo contabilizar: ' + error.message); return; }
  cerrarControl();
  await cargarTodo();
}

// ── 📊 LISTADOS: la ex planilla de gestión ──────────────────────────────
// ═══════════════════════════════════════════════════════════════════════
//  📊 LISTADOS · dos miradas del mismo mes
//    · Gestión  → cuánto se gastó y en qué (tipo de gasto, mes, proveedor)
//    · Estudio  → IVA Compras, percepciones sufridas y retenciones
//  Se separan porque responden preguntas distintas: la de gestión mira el
//  total pagado, la del estudio mira el crédito fiscal.
// ═══════════════════════════════════════════════════════════════════════
// (24-sep, JP) Los listados del estudio filtran por fecha de INGRESO y de EMISIÓN a la vez.
// Cada rango es opcional: "Desde" vacío = desde el principio · "Hasta" vacío = sin tope.
// listPor = a qué fila aplica el selector rápido de mes (‹ Mes Año ›).
let listPor = 'ingreso';
let listSub = 'gestion', LIST_IVA = null, LIST_PERC = null, LIST_RET = null, LIST_PDET = null, LIST_FUERA = null;
const _ymd = (y, m, d) => `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
const _finMes = (y, m) => new Date(y, m, 0).getDate();          // m = 1..12
function _rangoMes(y, m){ return { desde: _ymd(y, m, 1), hasta: _ymd(y, m, _finMes(y, m)) }; }
const _hoyIso = _hoyAR();
let listPer = { ing: _rangoMes(+_hoyIso.slice(0,4), +_hoyIso.slice(5,7)), emi: { desde: '', hasta: '' } };
const _listFila = () => listPor === 'emision' ? 'emi' : 'ing';

// Suma n meses a una fecha ISO igual que Postgres (31/01 + 1 mes = 28 o 29/02).
function _sumarMeses(iso, n){
  const y = +iso.slice(0,4), m0 = +iso.slice(5,7) - 1 + n, d = +iso.slice(8,10);
  const yy = y + Math.floor(m0 / 12), mm = ((m0 % 12) + 12) % 12 + 1;
  return _ymd(yy, mm, Math.min(d, _finMes(yy, mm)));
}
// Una fecha que el navegador no pudo interpretar (31/02, 32/01) o con un año absurdo.
function _fechaInvalida(el){
  if (!el || el.type !== 'date') return false;
  if (el.validity && el.validity.badInput) return true;
  const v = el.value; if (!v) return false;
  const y = +v.slice(0,4); return !(y >= 2000 && y <= 2100);
}
// Aviso para TODOS los campos de fecha del módulo, apenas se sale del campo.
document.addEventListener('change', e => {
  const el = e.target; if (!el || el.type !== 'date') return;
  if (_fechaInvalida(el)){
    el.classList.add('fecha-mala');
    alert('⚠ Fecha inválida' + (el.validity && el.validity.badInput ? ': esa fecha no existe' : ' (' + _fecha(el.value) + ')')
      + '.\n\nRevisá día, mes y año — por ejemplo, el 32/01 o el 31/02 no existen.');
  } else el.classList.remove('fecha-mala');
}, true);

                 onclick="listSub='${k}'; render()">${t}</button>`).join('')}</div>
    </div>
    ${listSub === 'gestion' ? _listGestion()
      : `<div id="list-estudio"><div class="vacio">Cargando…</div></div>`}`;
}

function _listMes(delta){
  const f = _listFila(), r = listPer[f];
  const base = r.desde || r.hasta || _hoyAR();
  const d = new Date(+base.slice(0,4), +base.slice(5,7) - 1 + delta, 1);
  listPer[f] = _rangoMes(d.getFullYear(), d.getMonth() + 1);
  LIST_IVA = null; cargarListadosEstudio();
}
// ¿la fila del selector rápido tiene exactamente un mes calendario?
function _listEsMesEntero(){
  const { desde: d, hasta: h } = listPer[_listFila()];
  if (!d || !h || d.slice(0,7) !== h.slice(0,7) || d.slice(8) !== '01') return false;
  return +h.slice(8) === _finMes(+d.slice(0,4), +d.slice(5,7));
}
function _listAnios(){
  const hoy = new Date().getFullYear(), arr = [];
  for (let a = hoy + 1; a >= 2019; a--) arr.push(a);
  return arr;
}
// Mes + año → el rango se arma solo (1 al último día), en la fila elegida.
function _listMesRapido(){
  const m = +document.getElementById('lp-mes').value, a = +document.getElementById('lp-anio').value;
  if (!m || !a) return;
  listPer[_listFila()] = _rangoMes(a, m);
  LIST_IVA = null; cargarListadosEstudio();
}
// Cambiar a qué fecha aplica el mes: el rango se muda de fila (como el filtro de antes).
function _listPorCambio(v){
  const de = _listFila(); listPor = v; const a = _listFila();
  if (de !== a){ listPer[a] = { ...listPer[de] }; listPer[de] = { desde: '', hasta: '' }; }
  LIST_IVA = null; cargarListadosEstudio();
}
function _listLimpiar(f){
  listPer[f] = { desde: '', hasta: '' };
  if (!listPer.ing.desde && !listPer.ing.hasta && !listPer.emi.desde && !listPer.emi.hasta){
    const h = _hoyAR(); listPer.ing = _rangoMes(+h.slice(0,4), +h.slice(5,7));
  }
  LIST_IVA = null; cargarListadosEstudio();
}
function _listPerCambio(){
  const ids = ['lp-ing-desde','lp-ing-hasta','lp-emi-desde','lp-emi-hasta'];
  for (const id of ids){ const el = document.getElementById(id); if (_fechaInvalida(el)){ el.focus(); return; } }
  const g = id => document.getElementById(id).value || '';
  const n = { ing: { desde: g('lp-ing-desde'), hasta: g('lp-ing-hasta') },
              emi: { desde: g('lp-emi-desde'), hasta: g('lp-emi-hasta') } };
  for (const [k, t] of [['ing','ingreso'],['emi','emisión']])
    if (n[k].desde && n[k].hasta && n[k].desde > n[k].hasta){
      alert('En la fecha de ' + t + ', "Desde" (' + _fecha(n[k].desde) + ') es posterior a "Hasta" (' + _fecha(n[k].hasta) + ').');
      return;
    }
  if (!n.ing.desde && !n.ing.hasta && !n.emi.desde && !n.emi.hasta){
    alert('Poné al menos una fecha, de ingreso o de emisión.\n\n(Un "Desde" vacío es "desde el principio"; un "Hasta" vacío, "sin tope".)');
    return;
  }
  listPer = n; LIST_IVA = null; cargarListadosEstudio();
}
// Rótulo del período, para el título y los nombres de archivo.
function _listRotulo(archivo){
  const { ing, emi } = listPer;
  const soloMesIng = _listEsMesEntero() && listPor === 'ingreso' && !emi.desde && !emi.hasta;
  if (soloMesIng && !archivo) return new Date(ing.desde + 'T12:00:00').toLocaleDateString('es-AR', {month:'long', year:'numeric'});
  const f = x => archivo ? x : _fecha(x);
  const parte = (r, t) => (r.desde || r.hasta)
    ? `${t} ${r.desde ? f(r.desde) : (archivo ? 'inicio' : 'el principio')} a ${r.hasta ? f(r.hasta) : (archivo ? 'hoy' : 'sin tope')}` : '';
  return [parte(ing, 'ingreso'), parte(emi, 'emisión')].filter(Boolean).join(archivo ? ' + ' : ' · ');
}

async function cargarListadosEstudio(){
  const c = document.getElementById('list-estudio');
  if (!c) return;
  if (!LIST_IVA) c.innerHTML = '<div class="vacio">Armando los listados…</div>';
  // p_prueba = el AMBIENTE, no "sumar los de prueba": en modo 🧪 se listan
  // SOLO los de test y en definitivo SOLO los reales. Nunca se mezclan.
  const P = { p_ing_desde: listPer.ing.desde || null, p_ing_hasta: listPer.ing.hasta || null,
              p_emi_desde: listPer.emi.desde || null, p_emi_hasta: listPer.emi.hasta || null, p_prueba: MODO_PRUEBA };
  // Las retenciones cuelgan de la ORDEN DE PAGO: van por su fecha, con el rango
  // que esté cargado (ingreso primero, si no emisión).
  const R = (listPer.ing.desde || listPer.ing.hasta) ? listPer.ing : listPer.emi;
  const [iva, per, ret, pdet] = await Promise.all([
    sb.rpc('compras_listado_iva', P),
    sb.rpc('compras_listado_percepciones', P),
    sb.rpc('compras_listado_retenciones', {p_desde: R.desde || '2000-01-01', p_hasta: R.hasta || '2999-12-31', p_prueba: MODO_PRUEBA}),
    sb.rpc('compras_listado_percepciones_detalle', P),
  ]);
  if (iva.error){ c.innerHTML = `<div class="alerta">${esc(iva.error.message)}</div>`; return; }
  // Siempre por fecha de emisión, de la más vieja a la más nueva (sort estable:
  // dentro del mismo día respeta el orden que ya trae la base).
  const porEmision = (x, y) => String(x.fecha_emision || '').localeCompare(String(y.fecha_emision || ''));
  LIST_IVA = (iva.data || []).sort(porEmision); LIST_PERC = per.data || []; LIST_RET = ret.data || [];
  LIST_PDET = (pdet.data || []).sort(porEmision);
  // Los que NO van al Libro IVA se muestran aparte: si un comprobante del
  // período no está en el listado, tiene que verse POR QUÉ, no desaparecer.
  let q = sb.from('compras_documentos')
    .select('tipo,letra,punto_venta,numero,proveedor_nombre,fecha_emision,fecha_ingreso,total,moneda')
    .eq('es_prueba', MODO_PRUEBA).eq('computa_formal', false);
  if (listPer.emi.desde) q = q.gte('fecha_emision', listPer.emi.desde);
  if (listPer.emi.hasta) q = q.lte('fecha_emision', listPer.emi.hasta);
  const {data: fuera} = await q.order('fecha_emision').order('numero').limit(3000);
  // mismo criterio que el Libro IVA para el ingreso: si no tiene, cuenta la emisión
  LIST_FUERA = (fuera || []).filter(d => {
    const fi = d.fecha_ingreso || d.fecha_emision || '';
    return (!listPer.ing.desde || fi >= listPer.ing.desde) && (!listPer.ing.hasta || fi <= listPer.ing.hasta);
  });
  _pintarEstudio();
}

const _n0 = v => Number(v) ? Number(v).toLocaleString('es-AR', {maximumFractionDigits:0}) : '—';
const _fecha = f => f ? f.split('-').reverse().join('/') : '';

// ── Export ───────────────────────────────────────────────────────────────
// CSV con ; y coma decimal: Excel en español lo abre de una, sin librerías.
// Hay DOS formatos a propósito:
//  · "Formato estudio" = las mismas columnas del Subdiario que se manda hoy,
//    con el prefijo de comprobante del Dragonfish (FDC/NCC) y una sola columna
//    de alícuota variable, para que el estudio no tenga que cambiar nada.
//  · "IVA Compras completo" = una columna por alícuota + descuadre + alertas.
//    Es el que sirve para controlar, no para presentar.
function _csvBajar(nombre, filas){
  const blob = new Blob(['﻿' + filas.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
const _csvNum = v => (Number(v)||0).toFixed(2).replace('.', ',');
const _csvTxt = v => (v === null || v === undefined) ? '' : String(v).replace(/[;\r\n]/g, ' ');

// El Dragonfish nombra los comprobantes de compra FDC (factura), NCC (nota de
// crédito) y NDC (nota de débito). El módulo guarda FC/NC/ND.
const _compEstudio = x => ({FC:'FDC', NC:'NCC', ND:'NDC'}[x.tipo] || x.tipo) + ' ' +
  (x.letra || '') + ' ' + String(x.punto_venta ?? 0).padStart(5,'0') + '-' +
  String(x.numero ?? 0).padStart(8,'0');

function _bajarFormatoEstudio(){
  if (!LIST_IVA || !LIST_IVA.length){ alert('No hay comprobantes en el período.'); return; }
  const enc = ['Comprobante','Fecha emisión','Proveedor','CUIT','Sit.fiscal','Mto grav.','No Grav.',
               'IVA 21%','IVA %','Importe','Per./Ret. IVA','Otros','Total'];
  const filas = [enc.join(';')].concat(LIST_IVA.map(x => {
    // Una sola alícuota variable, como el listado de hoy: la que tenga importe.

    ['Sec.','secuencia'],
    ['CUIT','cuit_emisor'],['Proveedor','proveedor_nombre'],['Sit. fiscal','sit_fiscal'],
    ['Neto 21','neto_21'],['Neto 10.5','neto_105'],['Neto 27','neto_27'],
    ['No gravado','no_gravado'],['Exento','exento'],
    ['IVA 21','iva_21'],['IVA 10.5','iva_105'],['IVA 27','iva_27'],['IVA ajuste','iva_otros'],
    ['Percep. IVA','percep_iva'],['Percep. IIBB CABA','percep_iibb_caba'],['Percep. IIBB BsAs','percep_iibb_ba'],
    ['Otros tributos','otros_tributos'],['Total','total'],['Descuadre','descuadre'],['Alerta','alerta'],
    ['Tipo gasto','tipo_gasto'],['Moneda','moneda']];

async function guardarRegimen(id){
  const val = x => { const el = document.getElementById(x + '-' + id); if (!el) return null;
                     const v = el.value; return v === '' ? null : Number(v); };
  const reg = REGIMENES.find(r => r.id === id) || {};
  const {error} = await sb.from('compras_regimenes').update({
    // con escala progresiva no hay alícuota única: se conserva null y manda la escala
    alicuota:            (Array.isArray(reg.escala) && reg.escala.length) ? null : val('al'),
    minimo_no_imponible: val('mn'),
    minimo_retencion:    val('mr'),
    base:            document.getElementById('ba-' + id).value,
    acumula_mensual: document.getElementById('ac-' + id).checked,
    activo:          document.getElementById('av-' + id).checked,
    actualizado_at:  new Date().toISOString(),
    actualizado_por: session.email,
  }).eq('id', id);
  if (error){ alert('No se pudo guardar: ' + error.message); return; }
  vistaConfig();
}

async function guardarRegimenNuevo(){
  const v = id => (document.getElementById('nr-' + id).value || '').trim();
  const num = id => v(id) === '' ? null : Number(v(id));
  const codigo = v('codigo').toUpperCase(), nombre = v('nombre');
  if (!codigo || !nombre){ alert('Código y nombre son obligatorios.'); return; }
  if (REGIMENES.some(r => r.codigo.toUpperCase() === codigo)){ alert('Ya existe un régimen con el código ' + codigo + '.'); return; }
  const alic = num('alicuota');
  if (alic != null && (alic < 0 || alic > 100)){ alert('La alícuota va en porcentaje (ej. 2 para 2 %).'); return; }
  if (alic == null && !confirm('Sin alícuota, el módulo NO va a calcular esta retención: la va a dejar en cero con aviso, para completar a mano ' +
      '(o cargar la escala en la base). ¿Crear igual?')) return;
  const fila = {
    codigo, nombre, impuesto: v('impuesto'), clase: v('clase'), jurisdiccion: v('jurisdiccion') || null,
    alicuota: alic, minimo_no_imponible: num('mni'), minimo_retencion: num('mr'),
    base: v('base'), acumula_mensual: document.getElementById('nr-acum').checked, activo: true,
    notas: v('notas') || null, actualizado_at: new Date().toISOString(), actualizado_por: session.email,
  };
  const {error} = await sb.from('compras_regimenes').insert(fila);
  if (error){ alert('No se pudo crear: ' + error.message); return; }
  vistaConfig();
}

// ═══════════════════════════════════════════════════════════════════════
//  🔗 EQUIVALENCIAS · cómo le dice el proveedor / cómo le decimos nosotros
//
//  Cada renglón de una factura de mercadería trae el código y la descripción
//  DEL PROVEEDOR. Acá se traduce a nuestro SKU, una sola vez por código:
//  "P2822804011CU38" va a ser siempre la misma bata, así que resuelto una
//  vez queda resuelto para siempre.
//
//  Con FGR —el 90 % de la mercadería— no hace falta nada: comparten catálogo
//  con nosotros, así que el código de su factura YA ES nuestro SKU.
//
//  🚨 Un código de ellos puede convertirse en VARIOS nuestros: FGR vende
//  sets que después se fraccionan. Por eso se puede partir en varias filas,
//  cada una con su parte del costo, y las partes tienen que sumar 100 %.
// ═══════════════════════════════════════════════════════════════════════
let PENDIENTES = [], enMapeo = null, partesMapeo = [], candidatos = [], EQUIV_HECHAS = [];

async function vistaEquivalencias(){
  const c = document.getElementById('cont');
  c.innerHTML = '<div class="vacio">Buscando artículos sin traducir…</div>';

  const [pend, hechas] = await Promise.all([
    sb.from('compras_renglones')
      .select('codigo_proveedor,descripcion,cantidad,importe,documento_id,compras_documentos(cuit_emisor,proveedor_nombre)')
      .is('sku', null).limit(500),
    sb.from('compras_equivalencias')
      .select('id,cuit_proveedor,codigo_proveedor,descripcion_proveedor,sku,cantidad_por_unidad,proporcion_costo,veces_usada,creada_por,creada_at')
      .order('creada_at', {ascending:false}).limit(600),
  ]);
  if (pend.error){ c.innerHTML = `<div class="alerta">${esc(pend.error.message)}</div>`; return; }

  // un renglón por código distinto: el trabajo es por código, no por factura
  const porCodigo = {};
  (pend.data || []).forEach(r => {
    const d = r.compras_documentos || {};
    const k = (d.cuit_emisor || '') + '|' + (r.codigo_proveedor || r.descripcion || '');
    if (!porCodigo[k]) porCodigo[k] = {...r, cuit: d.cuit_emisor, prov: d.proveedor_nombre, veces: 0};
    porCodigo[k].veces++;
  });
  PENDIENTES = Object.values(porCodigo).sort((a,b) => b.veces - a.veces);
  // Una equivalencia = un código del proveedor (puede tener varias partes si se fracciona)
  const grupos = {};
  (hechas.data || []).forEach(h => {
    const k = h.cuit_proveedor + '|' + (h.codigo_proveedor || '') + '|' + (h.codigo_proveedor ? '' : (h.descripcion_proveedor || '').toUpperCase().trim());

// Desde el renglón de una factura (modal de control o resumen): mismo modal de 🔗 Equivalencias.
let _mapeoRengCache = {};
async function abrirMapeoRenglon(docId, desde, idx){
  const d = desde === 'control' ? enControl : (_mapeoRengCache.doc || null);
  const reng = desde === 'control' ? (enControl && enControl._renglones) : _mapeoRengCache.reng;
  const r = reng && reng[idx]; if (!d || !r) { alert('No encontré el renglón. Cerrá y volvé a abrir la factura.'); return; }
  await _abrirMapeoCon({cuit: String(d.cuit_emisor), codigo_proveedor: r.codigo_proveedor || '',
    descripcion: r.descripcion || '', prov: d.proveedor_nombre, veces: 1,
    _docId: docId, _desde: desde});
}
async function _abrirMapeoCon(m){
  enMapeo = m;
  partesMapeo = []; candidatos = []; pintarMapeo(true);
  const {data, error} = await sb.rpc('compras_resolver_articulo', {
    p_cuit: enMapeo.cuit, p_codigo: enMapeo.codigo_proveedor,
    p_descripcion: enMapeo.descripcion, p_limite: 8,
  });
  candidatos = error ? [] : (data || []);
  if (candidatos.length) partesMapeo = [{sku: candidatos[0].sku, cantidad: 1, proporcion: 1}];
  pintarMapeo();
}
async function abrirMapeo(i){
  enMapeo = PENDIENTES[i];
  partesMapeo = [];
  candidatos = [];
  pintarMapeo(true);
  const {data, error} = await sb.rpc('compras_resolver_articulo', {
    p_cuit: enMapeo.cuit, p_codigo: enMapeo.codigo_proveedor,
    p_descripcion: enMapeo.descripcion, p_limite: 8,
  });
  candidatos = error ? [] : (data || []);
  if (candidatos.length) partesMapeo = [{sku: candidatos[0].sku, cantidad: 1, proporcion: 1}];
  pintarMapeo();
}

// (24-sep, JP) Editar una equivalencia ya cargada: mismo modal, con las partes actuales puestas.
async function editarEquivalencia(i){
  const g = EQUIV_HECHAS[i]; if (!g) return;
  enMapeo = {cuit: g.cuit, codigo_proveedor: g.codigo_proveedor, descripcion: g.descripcion, prov: g.prov,
             veces: 0, _editar: true, _skusViejos: g.partes.map(p => p.sku)};
  partesMapeo = g.partes.map(p => ({sku: p.sku, cantidad: Number(p.cantidad_por_unidad) || 1, proporcion: Number(p.proporcion_costo) || 1}));
  candidatos = []; pintarMapeo(true);
  const {data, error} = await sb.rpc('compras_resolver_articulo', {
    p_cuit: g.cuit, p_codigo: g.codigo_proveedor, p_descripcion: g.descripcion, p_limite: 8 });
  candidatos = error ? [] : (data || []);
  pintarMapeo();
}
async function borrarEquivalencia(i){
  const g = EQUIV_HECHAS[i]; if (!g) return;
  if (!confirm(`¿Borrar la equivalencia ${g.codigo_proveedor || g.descripcion} → ${g.partes.map(p => p.sku).join(' + ')}?\n\n`
    + 'Las facturas ya traducidas no cambian. Las próximas que traigan este código van a volver a aparecer como "sin traducir".')) return;
  const {error} = await sb.from('compras_equivalencias').delete().in('id', g.partes.map(p => p.id));
  if (error){ alert('No se pudo borrar: ' + error.message); return; }
  vistaEquivalencias();
}

function cerrarMapeo(){
  const o = document.getElementById('map-overlay');
  if (o) o.remove();
  if (!document.getElementById('ctrl-overlay') && !document.getElementById('res-overlay')) document.body.style.overflow = '';
  enMapeo = null;
}

function pintarMapeo(cargando){
  const m = enMapeo; if (!m) return;
  const suma = partesMapeo.reduce((a,p) => a + (Number(p.proporcion)||0), 0);
  const okSuma = Math.abs(suma - 1) < 0.01;

  const html = `<div class="c-box">
    <div class="c-head">
      <div style="flex:1">
        <div style="font-weight:700;font-size:16px">${esc(m.descripcion || '')}</div>
        <div style="font-size:12.5px;opacity:.9">${esc(m.prov || m.cuit)} ·
          código <code>${esc(m.codigo_proveedor || '—')}</code> ·
          ${m._editar ? '✏️ editando una equivalencia ya cargada (hoy: ' + esc((m._skusViejos || []).join(' + ')) + ')'
            : m._desde ? 'renglón de esta factura' : `aparece en ${m.veces} factura${m.veces === 1 ? '' : 's'}`}</div>
      </div>
      <button class="m-x" onclick="cerrarMapeo()">✕</button>
    </div>
    <div class="c-body">
      ${cargando ? '<div class="vacio">Buscando parecidos en el catálogo…</div>' : `
      ${!candidatos.length
        ? `<div class="alerta">No encontré ningún artículo parecido. Puede que todavía no esté
             dado de alta en el Dragonfish — en ese caso hay que crearlo primero.</div>`
        : `<div class="mini" style="margin-bottom:7px">Artículos parecidos del catálogo
             ${candidatos[0].origen === 'candidato_proveedor' ? 'de este proveedor' : ''}:</div>
           ${candidatos.map(c => {
             const bueno = Number(c.parecido) >= 0.75;
             return `<button class="act gh" style="display:block;width:100%;text-align:left;margin-bottom:6px;
                       border-color:${bueno ? 'var(--ok)' : 'var(--bd)'}"
                     onclick="elegirSku('${esc(c.sku)}')">
               <b>${esc(c.sku)}</b> · ${esc(c.descripcion || '')}
               <span class="mini" style="float:right;color:${bueno ? 'var(--ok)' : 'var(--mut)'}">
                 ${bueno ? '✓ ' : ''}parecido ${c.parecido}</span></button>`;
           }).join('')}
           <p class="mini" style="margin:4px 0 12px">
             🚨 El parecido es de texto, no entiende de colores ni de talles. Los que dan menos de 0,75
             conviene mirarlos dos veces: en las pruebas, ahí es donde confunde variantes.</p>`}

      <h4 style="font-size:14px;margin:14px 0 7px">Se traduce a</h4>
      ${partesMapeo.map((p,i) => `<div class="c-linea">
        <input list="dl-skus" value="${esc(p.sku)}" placeholder="SKU nuestro" style="flex:1;min-width:140px"
               oninput="partesMapeo[${i}].sku=this.value.split(' ')[0].trim()">
        <input type="number" step="0.01" min="0" max="1" value="${p.proporcion}" style="width:110px;text-align:right"
               title="Qué parte del costo va a este artículo"
               oninput="partesMapeo[${i}].proporcion=Number(this.value); pintarSumaMapeo()">
        ${partesMapeo.length > 1
          ? `<button class="act gh" onclick="partesMapeo.splice(${i},1); pintarMapeo()">✕</button>` : ''}
      </div>`).join('')}
      <button class="act gh" style="font-size:12.5px;padding:5px 10px"
              onclick="partesMapeo.push({sku:'',cantidad:1,proporcion:0}); pintarMapeo()">
        + Se fracciona en otro artículo</button>
      <div id="map-suma" class="mini" style="margin-top:7px">${
        okSuma ? '<span style="color:var(--ok)">✓ Las partes del costo suman 100 %.</span>'
               : `<span style="color:var(--warn)">⚠ Las partes suman ${Math.round(suma*100)} %, tienen que dar 100 %.</span>`}</div>
      <p class="mini" style="margin-top:9px">
        Si ellos venden un set que ustedes fraccionan, agregá una fila por cada artículo nuestro
        y repartí el costo. Por ejemplo 0,6 y 0,4 si uno vale más que el otro.</p>
      `}
    </div>
    <div class="c-pie">
      <div style="flex:1"></div>
      <button class="act gh" onclick="cerrarMapeo()">Cancelar</button>
      <button class="act" onclick="guardarMapeo()">✓ Guardar equivalencia</button>
    </div>
    <datalist id="dl-skus"></datalist>
  </div>`;

  let ov = document.getElementById('map-overlay');
  if (!ov){
    ov = document.createElement('div');
    ov.id = 'map-overlay'; ov.className = 'ctrl-like';
    ov.addEventListener('click', e => { if (e.target === ov) cerrarMapeo(); });
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
  }
  ov.innerHTML = html;
}

function pintarSumaMapeo(){
  const suma = partesMapeo.reduce((a,p) => a + (Number(p.proporcion)||0), 0);
  const el = document.getElementById('map-suma');
  if (el) el.innerHTML = Math.abs(suma - 1) < 0.01
    ? '<span style="color:var(--ok)">✓ Las partes del costo suman 100 %.</span>'
    : `<span style="color:var(--warn)">⚠ Las partes suman ${Math.round(suma*100)} %, tienen que dar 100 %.</span>`;
}
function elegirSku(sku){
  if (partesMapeo.length === 1) partesMapeo[0].sku = sku;
  else partesMapeo.push({sku, cantidad:1, proporcion:0});
  pintarMapeo();
}

async function guardarMapeo(){
  const partes = partesMapeo.filter(p => (p.sku||'').trim())
    .map(p => ({sku: p.sku.trim(), cantidad: Number(p.cantidad)||1, proporcion: Number(p.proporcion)||0}));
  if (!partes.length){ alert('Elegí al menos un artículo nuestro.'); return; }
  const {data: res, error} = await sb.rpc('compras_guardar_equivalencia', {
    p_cuit: enMapeo.cuit, p_codigo: enMapeo.codigo_proveedor,
    p_descripcion: enMapeo.descripcion, p_partes: partes,
  });
  if (error){ alert('No se pudo guardar: ' + error.message); return; }
  if (enMapeo._editar && res && res.retraducidos) alert(`✓ Equivalencia corregida. ${res.retraducidos} renglón(es) de facturas y remitos pasaron al SKU nuevo.`);
  const desde = enMapeo._desde, docId = enMapeo._docId;
  cerrarMapeo();
  if (desde === 'control' && enControl && enControl.id === docId){
    const { data: rg } = await sb.rpc('compras_doc_renglones', { p_doc: docId });
    enControl._renglones = rg || []; pintarControl();
  } else if (desde === 'resumen'){
    abrirResumenDoc(docId);
  } else vistaEquivalencias();
}

async function asociarRemito(cuit, pv, num){
  const q = prompt(`¿Con qué factura va el remito ${pv}-${num}?\nEscribí el número de la factura (solo el número).`);
  if (!q) return;
  const nro = Number(String(q).replace(/\D/g,''));
  if (!nro){ alert('Número inválido.'); return; }
  const {data: docs} = await sb.from('compras_documentos')
    .select('id,tipo,letra,punto_venta,numero,cuit_emisor,proveedor_nombre,fecha_emision,total')
    .eq('numero', nro).eq('es_prueba', MODO_PRUEBA).limit(5);
  if (!docs || !docs.length){ alert('No encontré ninguna factura con ese número.'); return; }
  docs.sort((a,b) => (b.cuit_emisor==='30710971338') - (a.cuit_emisor==='30710971338'));  // FGR primero
  const d = docs[0];
  const ok = confirm(`¿Asociar al ${d.tipo} ${d.letra} ${String(d.punto_venta).padStart(4,'0')}-${String(d.numero).padStart(8,'0')} de ${d.proveedor_nombre||d.cuit_emisor} (${fechaCorta(d.fecha_emision)} · ${plata(d.total)})?`);
  if (!ok) return;
  const {error} = await sb.rpc('compras_asociar_remito', {p_cuit: cuit, p_punto_venta: pv, p_numero: num, p_doc_id: d.id});
  if (error){ alert('No se pudo asociar: ' + error.message); return; }
  vistaMercaderia();
}

// ── Recepción (20-sep) · DISENO_REMITOS_STOCK.md ─────────────────────────
// 21-sep (JP): mientras el stock viva en el Dragon, el módulo SOLO genera el TXT
// (no "recibe"). Pide el local si falta y baja el archivo. La puerta es la RPC
// (SKUs resueltos, local válido). compras_stock_en_dragon() en la base decide
// si el TXT exige recibir o no.
async function txtRemito(cuit, pv, num, local){
  const locales = (SUCS.length ? SUCS : [{clave:'alcorta'},{clave:'unicenter'},{clave:'oficina'}]).filter(x => x.activo !== false).map(x => x.clave);
  if (!local){
    local = (prompt(`¿A qué base va la mercadería del remito ${pv}-${num}?\n(${locales.join(' / ')})`) || '').trim().toLowerCase();
    if (!local) return;
    if (!locales.includes(local)){ alert('Local inválido. Opciones: ' + locales.join(', ')); return; }
    const {error} = await sb.rpc('compras_remito_set_local', {p_cuit: cuit, p_punto_venta: pv, p_numero: num, p_local: local});
    if (error){ alert('No se pudo guardar el local: ' + error.message); return; }
  }
  await descargarTxtRemito(cuit, pv, num);
  vistaMercaderia();
}

async function cambiarDestinoRemito(cuit, pv, num, local){
  if (!local){ vistaMercaderia(); return; }
  const {data, error} = await sb.rpc('compras_remito_set_local', {p_cuit: cuit, p_punto_venta: pv, p_numero: num, p_local: local});
  if (error){ alert('No se pudo cambiar el destino: ' + error.message); }
  vistaMercaderia();
}

// Recepción real (cuando el módulo pase a mover stock, sin Dragon). Hoy no tiene botón.
async function recibirRemito(cuit, pv, num, local){
  const locales = (SUCS.length ? SUCS : [{clave:'alcorta'},{clave:'unicenter'},{clave:'oficina'}]).filter(x => x.activo !== false).map(x => x.clave);
  if (!local){
    local = (prompt(`¿A qué local llegó el remito ${pv}-${num}?\n(${locales.join(' / ')})`) || '').trim().toLowerCase();
    if (!local) return;
    if (!locales.includes(local)){ alert('Local inválido. Opciones: ' + locales.join(', ')); return; }
  }
  if (!confirm(`Confirmar la recepción del remito ${pv}-${num} en ${local} con las cantidades del remito.\n\nEsto marca la mercadería como INGRESADA (una sola vez) y genera el TXT para el Dragonfish. ¿Seguimos?`)) return;
  const {data, error} = await sb.rpc('compras_remito_confirmar', {p_cuit: cuit, p_punto_venta: pv, p_numero: num, p_lineas: null, p_local: local});
  if (error){ alert('No se pudo recibir: ' + error.message); return; }
  await descargarTxtRemito(cuit, pv, num);
  vistaMercaderia();
}

async function descargarTxtRemito(cuit, pv, num){
  const {data, error} = await sb.rpc('compras_remito_txt', {p_cuit: cuit, p_punto_venta: pv, p_numero: num});
  if (error){ alert('El TXT no se pudo generar: ' + error.message); return false; }
  const blob = new Blob([data.contenido], {type:'text/plain'});
  const aEl = document.createElement('a');
  aEl.href = URL.createObjectURL(blob);
  aEl.download = data.nombre;
  aEl.click();
  URL.revokeObjectURL(aEl.href);
  alert(`TXT descargado: ${data.nombre}\n${data.lineas} renglones · ${data.unidades} unidades · destino ${data.destino}\n\nImportalo en el Dragonfish UNA sola vez.`);
  return true;
}

async function guardarRemito(){
  const provTxt = document.getElementById('rem-prov').value;
  const cuit = (provTxt.split('·').pop()||'').replace(/\D/g,'');
  if (cuit.length !== 11){ alert('Elegí el proveedor de la lista (con su CUIT).'); return; }
  const pv = Number(document.getElementById('rem-pv').value);
  const num = Number(document.getElementById('rem-num').value);
  const fecha = document.getElementById('rem-fecha').value;
  const dest = document.getElementById('rem-dest').value;
  if (!pv || !num || !fecha){ alert('Completá punto de venta, número y fecha.'); return; }
  const lineas = remitoLineas.filter(l => l.sku && Number(l.cantidad) > 0)
    .map(l => ({sku: l.sku, cantidad: Number(l.cantidad)}));
  if (!lineas.length){ alert('Cargá al menos un renglón con SKU y cantidad.'); return; }
  const {error} = await sb.rpc('compras_cargar_remito', {
    p_cuit: cuit, p_punto_venta: pv, p_numero: num,
    p_fecha: fecha, p_destino: dest, p_lineas: lineas, p_prueba: MODO_PRUEBA});
  if (error){ alert('No se pudo guardar: ' + error.message); return; }
  // 🚨 (20-sep) el TXT lo arma la base con el formato REAL del importador
  // (DESTINO;PV;NUMERO + "    cant+SKU", CRLF) — antes se armaba acá con un
  // formato inventado que el Dragonfish no tomaba.
  await sb.from('compras_remitos').update({local_destino: dest}).match({proveedor_cuit: cuit, punto_venta: pv, numero: num});
  await descargarTxtRemito(cuit, pv, num);
  cerrarCargaRemito();
  vistaMercaderia();
}

          <td class="num">${a.precio_compra != null ? plata(a.precio_compra) : '—'}</td>
          <td class="num">${a.precio_costo != null ? plata(a.precio_costo) : '—'}</td>
          <td class="num">${a.descuento_pct != null ? a.descuento_pct + ' %' : '—'}</td>
          <td class="num">${a.importe_esperado != null ? plata(a.importe_esperado) : '—'}</td>
        </tr>`).join('')}</tbody></table></div>` : ''}
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════
//  📇 CONCEPTOS · el catálogo contable (SKU + descripción, como Dragonfish)
//  🚨 Regla: crear concepto es para un tipo de gasto GENUINAMENTE nuevo, no
//  para variantes de nombre. Y mientras el Dragonfish siga vivo, todo
//  concepto creado acá tiene que existir también como artículo allá, sino
//  el .txt de exportación lo va a rechazar.
// ═══════════════════════════════════════════════════════════════════════
let CONC_LISTA = [], concBusca = '';

async function vistaConceptos(){
  const c = document.getElementById('cont');
  c.innerHTML = '<div class="vacio">Cargando catálogo…</div>';
  const {data, error} = await sb.from('compras_conceptos')
    .select('codigo,descripcion,alicuota,usos_historicos,activo,origen')
    .order('usos_historicos', {ascending:false}).limit(2000);
  if (error){ c.innerHTML = `<div class="alerta">${esc(error.message)}</div>`; return; }
  CONC_LISTA = data || [];
  pintarConceptos();
}

function pintarConceptos(){
  const c = document.getElementById('cont');
  const t = concBusca.toLowerCase();
  const lista = CONC_LISTA.filter(x => !t ||
    (x.codigo + ' ' + (x.descripcion||'')).toLowerCase().includes(t));
  c.innerHTML = `<div class="kpis">
      <div class="kpi"><div class="lbl">Conceptos</div><div class="val">${CONC_LISTA.length}</div>
        <div class="sub">${CONC_LISTA.filter(x=>x.activo).length} activos</div></div>
      <div class="kpi" style="border-left-color:var(--info)"><div class="lbl">Creados a mano</div>
        <div class="val">${CONC_LISTA.filter(x=>x.origen==='manual').length}</div>
        <div class="sub">el resto vino del histórico</div></div>
    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:4px">Catálogo de conceptos contables</h3>
      <p class="mini" style="margin-bottom:11px">Cada concepto es un SKU + su descripción, igual que los artículos
        del Dragonfish. 🚨 Mientras el Dragonfish siga en uso, todo concepto creado acá hay que darlo de alta
        también allá como artículo — sino la exportación lo rechaza.</p>
      <div class="filtros">
        <input type="search" placeholder="Buscar por SKU o descripción…" value="${esc(concBusca)}"
               oninput="concBusca=this.value; pintarConceptos()">
        <button class="act" onclick="toggleAltaConcepto()">➕ Nuevo concepto</button>
      </div>
      <div id="alta-conc" style="display:none;background:#fff7ed;border:1px solid var(--primary);border-radius:9px;padding:11px;margin-bottom:11px;">
        <div style="display:flex;gap:7px;flex-wrap:wrap;">
          <input id="ac-sku" placeholder="SKU (ej: SEGVIG)" maxlength="20" style="width:150px;text-transform:uppercase">
          <input id="ac-desc" placeholder="Descripción para los listados" style="flex:1;min-width:180px">
          <input id="ac-alic" list="dl-alic" value="21" placeholder="IVA %" title="21 · 10.5 · 27 · 0, o cualquier otra alícuota" style="width:80px;text-align:right">
          <button class="act" style="font-size:12.5px;padding:6px 11px" onclick="altaConcepto()">Crear</button>
        </div>
        <div class="mini" style="margin-top:6px">Recordá darlo de alta también en el Dragonfish.</div>
      </div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>SKU</th><th>Descripción</th><th>Alíc.</th><th class="num">Usos</th>
          <th style="text-align:center">Activo</th><th></th></tr></thead>
        <tbody>${lista.slice(0,150).map(x => `<tr class="${x.activo ? '' : 'dim'}" style="${x.activo?'':'opacity:.5'}">
          <td><b>${esc(x.codigo)}</b>${x.origen==='manual' ? ' <span class="chip" style="background:#dbeafe;color:#1e40af">manual</span>' : ''}</td>
          <td><input value="${esc(x.descripcion||'')}" id="cd-${esc(x.codigo)}" style="width:100%;min-width:200px;font-size:13px;padding:6px 8px"></td>
          <td><select id="ca-${esc(x.codigo)}" style="font-size:13px;padding:6px" onchange="if(this.value==='__otra'){const v=prompt('Alícuota de IVA (%)','');if(v===null||isNaN(Number(v.replace(',','.')))){this.value='21';return;}const o=document.createElement('option');o.value=String(Number(v.replace(',','.')));o.textContent=o.value+'%';this.insertBefore(o,this.lastElementChild);this.value=o.value;}">
            ${['21','10.5','27','0'].concat(x.alicuota && !['21','10.5','27','0'].includes(String(x.alicuota)) ? [String(x.alicuota)] : []).map(al=>`<option value="${al}" ${String(x.alicuota)===al?'selected':''}>${al==='0'?'No grav.':al+'%'}</option>`).join('')}
            <option value="__otra">Otra…</option>
          </select></td>
          <td class="num">${x.usos_historicos||0}</td>
          <td style="text-align:center"><input type="checkbox" id="cx-${esc(x.codigo)}" ${x.activo?'checked':''}></td>
          <td class="num" style="white-space:nowrap">
            <button class="act gh" style="font-size:12px;padding:5px 8px" title="Cambiar el SKU y arrastrar todo lo ya contabilizado"
              onclick="abrirRenombreSKU('${esc(x.codigo)}')">✏ SKU</button>
            <button class="act gh" style="font-size:12px;padding:5px 10px"
              onclick="guardarConcepto('${esc(x.codigo)}')">Guardar</button></td>
        </tr>`).join('')}</tbody></table></div>
      ${lista.length>150 ? `<p class="mini" style="margin-top:8px">Mostrando 150 de ${lista.length} — afiná la búsqueda.</p>` : ''}
    </div>`;
}

function toggleAltaConcepto(){
  const f = document.getElementById('alta-conc');
  if (f) f.style.display = f.style.display === 'none' ? 'block' : 'none';
}
async function altaConcepto(){
  const cod = (document.getElementById('ac-sku').value||'').trim().toUpperCase();
  const desc = (document.getElementById('ac-desc').value||'').trim();
  if (!cod || !desc){ alert('Completá SKU y descripción.'); return; }
  const {error} = await sb.rpc('compras_crear_concepto',
    {p_codigo: cod, p_descripcion: desc, p_alicuota: document.getElementById('ac-alic').value});
  if (error){ alert('No se pudo crear: ' + error.message); return; }
  vistaConceptos();
}
async function guardarConcepto(cod){
  const {error} = await sb.from('compras_conceptos').update({
    descripcion: document.getElementById('cd-'+cod).value.trim(),
    alicuota:    document.getElementById('ca-'+cod).value,
    activo:      document.getElementById('cx-'+cod).checked,
  }).eq('codigo', cod);
  if (error){ alert('No se pudo guardar: ' + error.message); return; }
  const x = CONC_LISTA.find(y=>y.codigo===cod);
  if (x){ x.descripcion=document.getElementById('cd-'+cod).value.trim();
          x.alicuota=document.getElementById('ca-'+cod).value;
          x.activo=document.getElementById('cx-'+cod).checked; }
  pintarConceptos();
}

// ── ✏ Cambiar el SKU de un concepto ───────────────────────────────────
//  El SKU es la clave con la que está escrito TODO lo ya contabilizado.
//  La RPC compras_concepto_renombrar hace el cambio completo en una sola
//  transacción (líneas, proveedores, sugerencias, simulación) y deja el
//  SKU viejo en compras_concepto_alias para poder rastrear los asientos.
//  Si el SKU destino ya existe, es una FUSIÓN y hay que confirmarla aparte.
async function abrirRenombreSKU(cod){
  const {data, error} = await sb.rpc('compras_concepto_impacto', {p_codigo: cod});
  if (error){ alert('No se pudo leer el concepto: ' + error.message); return; }
  const i = data || {};
  const n = v => Number(v || 0).toLocaleString('es-AR');
  openModalP(`
    <h3 style="margin:0 0 4px">✏ Cambiar el SKU de <span style="font-family:monospace">${esc(cod)}</span></h3>
    <p class="mini" style="margin:0 0 12px">${esc(i.descripcion || '')}${i.alicuota ? ' · alícuota ' + esc(i.alicuota) + '%' : ''}</p>
    <div style="background:#f8fafc;border:1px solid var(--bd);border-radius:9px;padding:11px;margin-bottom:12px;font-size:13px;line-height:1.7">
      <b>Lo que se va a reescribir con el SKU nuevo:</b><br>
      · <b>${n(i.lineas)}</b> renglón${Number(i.lineas)===1?'':'es'} ya contabilizado${Number(i.lineas)===1?'':'s'} en <b>${n(i.documentos)}</b> comprobante${Number(i.documentos)===1?'':'s'}${Number(i.monto)?` (${plata(i.monto)})`:''}<br>
      · <b>${n(i.proveedores)}</b> proveedor${Number(i.proveedores)===1?'':'es'} que lo tienen como concepto habitual<br>
      · <b>${n(i.sugerencias)}</b> sugerencia${Number(i.sugerencias)===1?'':'s'} pendiente${Number(i.sugerencias)===1?'':'s'} en la Bandeja
      ${Number(i.simulacion) ? `<br>· ${n(i.simulacion)} fila${Number(i.simulacion)===1?'':'s'} del back-test` : ''}
      ${Number(i.alias_previos) ? `<br>· ${n(i.alias_previos)} SKU viejo${Number(i.alias_previos)===1?'':'s'} que ya apuntaban acá` : ''}
    </div>
    <label>SKU nuevo</label>
    <input id="rs-nuevo" maxlength="20" placeholder="Ej: 71401004" value="${esc(cod)}"
           style="text-transform:uppercase;font-family:monospace" oninput="_rsChequear()">
    <div id="rs-aviso" class="mini" style="margin:6px 0 10px;min-height:18px"></div>
    <label>Por qué lo cambiás (queda asentado)</label>
    <input id="rs-motivo" placeholder="Ej: el SKU viejo no servía para el listado de IVA" style="margin-bottom:12px">
    <div style="background:#fff7ed;border:1px solid #fdba74;border-radius:9px;padding:10px;font-size:12.5px;line-height:1.6;margin-bottom:14px">
      🚨 Mientras el Dragonfish siga en uso, el SKU nuevo <b>tiene que existir también allá</b> como artículo,
      sino la exportación lo rechaza. El SKU viejo queda guardado en el historial para poder rastrear los asientos.
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="act gh" onclick="cerrarModalP()">Cancelar</button>
      <button class="act" id="rs-ok" onclick="confirmarRenombreSKU('${esc(cod)}')">Cambiar el SKU</button>
    </div>`);
  setTimeout(() => { const el = document.getElementById('rs-nuevo'); if (el){ el.focus(); el.select(); } }, 40);
}

function _rsChequear(){
  const el = document.getElementById('rs-nuevo'); if (!el) return;
  const v = (el.value || '').trim().toUpperCase();
  const av = document.getElementById('rs-aviso');
  const existe = CONC_LISTA.find(c => c.codigo === v);
  if (!v){ av.innerHTML = ''; return; }
  if (!/^[A-Z0-9][A-Z0-9._-]*$/.test(v)){
    av.innerHTML = '<span style="color:var(--bad)">Solo letras, números, punto, guión y guión bajo.</span>'; return;
  }
  av.innerHTML = existe
    ? `<span style="color:#b45309">⚠ Ya existe <b>${esc(v)}</b> (${esc(existe.descripcion||'')}). Se van a <b>fusionar</b> los dos en uno.</span>`
    : '<span style="color:var(--mut)">SKU libre.</span>';
}

async function confirmarRenombreSKU(cod){
  const nuevo  = (document.getElementById('rs-nuevo').value || '').trim().toUpperCase();
  const motivo = (document.getElementById('rs-motivo').value || '').trim();
  if (!nuevo || nuevo === cod){ alert('Escribí un SKU distinto al actual.'); return; }
  const fusiona = !!CONC_LISTA.find(c => c.codigo === nuevo);
  const texto = fusiona
    ? `Vas a FUSIONAR "${cod}" dentro de "${nuevo}".\n\nTodo lo contabilizado con ${cod} pasa a ${nuevo} y ${cod} deja de existir.\n\n¿Seguimos?`
    : `Vas a cambiar el SKU "${cod}" por "${nuevo}".\n\nTodo lo ya contabilizado se reescribe con el SKU nuevo.\n\n¿Seguimos?`;
  if (!confirm(texto)) return;
  const btn = document.getElementById('rs-ok');
  if (btn){ btn.disabled = true; btn.textContent = 'Cambiando…'; }
  const {data, error} = await sb.rpc('compras_concepto_renombrar',
    {p_viejo: cod, p_nuevo: nuevo, p_motivo: motivo || null, p_fusionar: fusiona});
  if (error){
    alert('No se pudo cambiar: ' + error.message);
    if (btn){ btn.disabled = false; btn.textContent = 'Cambiar el SKU'; }
    return;
  }
  cerrarModalP();
  const r = data || {};
  alert(`Listo: ${cod} → ${nuevo}\n\n${Number(r.lineas||0).toLocaleString('es-AR')} renglones en ${Number(r.documentos||0).toLocaleString('es-AR')} comprobantes` +
        `${r.proveedores ? `\n${r.proveedores} proveedor(es) actualizados` : ''}` +
        `${r.sugerencias ? `\n${r.sugerencias} sugerencia(s) de la Bandeja` : ''}`);
  CONCEPTOS = [];
  vistaConceptos();
}

async function abrirResumenDoc(docId){
  const d = DOCS.find(x => x.id === docId);

    ov = document.createElement('div');
    ov.id = 'res-overlay';

    ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
  }
  ov.innerHTML = `<div class="c-box"><div class="c-body"><div class="vacio">Cargando…</div></div></div>`;
  const [full, lin, rg] = await Promise.all([
    sb.from('compras_documentos').select('*').eq('id', docId).single(),
    sb.from('compras_lineas').select('*').eq('documento_id', docId).order('nroitem'),
    sb.rpc('compras_doc_renglones', { p_doc: docId }),
  ]);
  const doc = full.data || d, lineas = lin.data || [], reng = rg.data || [];
  _mapeoRengCache = {doc, reng};

  const neto = Number(doc.neto_gravado||0)+Number(doc.neto_no_gravado||0)+Number(doc.exento||0);
  const iva = Number(doc.iva_21||0)+Number(doc.iva_105||0)+Number(doc.iva_27||0)+Number(doc.iva_otros||0);
  const cMap = Object.fromEntries(CONCEPTOS.map(c=>[c.codigo, c.descripcion]));
  const lineasOk = Math.abs(lineas.reduce((a,l) => a + Number(l.monto_neto||0), 0) - neto) <= 1;
  ov.innerHTML = `<div class="c-box fx-box">
    <div class="c-head fx-cabhead">
      <div style="flex:1">${_facturaCabecera(doc, {enHead: true})}</div>
      <button class="hbtn" title="Modificar la contabilización" onclick="editarContabilizacion(${docId})">✏️</button>
      <button class="m-x" onclick="document.getElementById('res-overlay').remove()">✕</button>
    </div>
    <div class="c-body">
      ${_facturaRenglones(doc, reng, {conceptos: lineas.map(l => l.concepto_codigo), desde: 'resumen'})}
      ${_facturaPie(doc, reng, {listo: true, lineasOk, lineasTxt: lineasOk ? 'La imputación suma el neto' : 'La imputación no coincide con el neto (descuento comercial o carga vieja)'})}
      ${(doc.moneda && doc.moneda !== 'ARS' && doc.importe_moneda)
        ? `<div class="mini" style="margin:-4px 0 10px;padding:7px 10px;background:#ecfeff;border-left:4px solid #0e7490;border-radius:6px;color:#0e7490">
            💵 Factura en ${esc(doc.moneda)}: ${esc(doc.moneda)} ${Number(doc.importe_moneda).toLocaleString('es-AR',{minimumFractionDigits:2})}
            × $${Number(doc.cotizacion).toLocaleString('es-AR',{minimumFractionDigits:2})} = ${plata(doc.total)}
            · ${esc(doc.cotizacion_fuente || 'cotización aplicada')}</div>` : ''}
      <div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:11px">
        ${doc.tipo_gasto ? `<span class="chip c-${doc.tipo_gasto}">${TIPOS[doc.tipo_gasto]||doc.tipo_gasto}</span>`
          : '<span class="chip" style="background:#fee2e2;color:#991b1b">sin tipo</span>'}
        <span class="chip" style="background:#f1f5f9;color:#475569" title="CUIT del proveedor">CUIT ${esc(doc.cuit_emisor)}</span>
        ${doc.archivo_path
          ? `<a href="${pdfUrl(doc.archivo_path)}" target="_blank" class="chip"
               style="background:#ecfeff;color:#0e7490;text-decoration:none" onclick="event.stopPropagation()">📄 Ver PDF</a>`
          : '<span class="chip" style="background:#f1f5f9;color:#94a3b8">sin PDF</span>'}
        <select onchange="cambiarEstadoPago(${docId}, this.value)" onclick="event.stopPropagation()"
          style="font-size:12px;padding:4px 8px;border-radius:20px;font-weight:700;border:1px solid var(--bd);
                 background:${(EPAGO[doc.estado_pago]||EPAGO.sin_definir).bg};color:${(EPAGO[doc.estado_pago]||EPAGO.sin_definir).col}">
          ${Object.entries(EPAGO).filter(([k])=>k!=='sin_definir'||doc.estado_pago==='sin_definir').map(([k,v]) =>
            `<option value="${k}" ${doc.estado_pago===k?'selected':''}>${v.tx}</option>`).join('')}
        </select>
        ${doc.corregida ? '<span class="chip" style="background:#fef3c7;color:#92400e">✏️ corregida</span>' : ''}

      <h4 style="font-size:14px;margin:4px 0 7px">Imputación contable</h4>
      ${lineas.length ? `<table>
        <thead><tr><th>Concepto</th><th>Alíc.</th><th class="num">Neto</th></tr></thead>
        <tbody>${lineas.map(l => `<tr>
          <td><b>${esc(l.concepto_codigo||'—')}</b> <span class="mini">${esc(cMap[l.concepto_codigo]||l.descripcion||'')}</span></td>

          <td class="num">${plata(l.monto_neto)}</td>
        </tr>`).join('')}</tbody></table>`
        : '<div class="vacio">Sin líneas de contabilización.</div>'}
      ${doc.aprobada_por ? `<p class="mini" style="margin-top:9px">Contabilizada por ${esc(doc.aprobada_por)}
        el ${_fechaTs(doc.aprobada_at)}</p>`
        : '<p class="mini" style="margin-top:9px">Contabilización migrada del Dragonfish.</p>'}
      <p class="mini" style="margin-top:6px">Nº interno <b>${doc.numero_interno ?? '—'}</b> · Fecha de ingreso <b>${doc.fecha_ingreso ? fechaCorta(doc.fecha_ingreso) : '—'}</b></p>
      <p class="mini" style="margin-top:9px">CAE <b>${esc(doc.cae || (doc.extraido_json||{}).cae || '—')}</b> · vto ${(doc.cae_vto || (doc.extraido_json||{}).cae_vto) ? fechaCorta(doc.cae_vto || doc.extraido_json.cae_vto) : '—'}</p>
      ${doc.archivo_path ? `<p class="mini" style="word-break:break-all">📎 ${esc(doc.archivo_path)}</p>` : ''}
    </div>
  </div>`;
}

  }
  const hoy = new Date().toISOString().slice(0,10);
  ov.innerHTML = `<div class="c-box" style="max-width:560px">

      <div style="flex:1"><div style="font-weight:700;font-size:16px">➕ Cargar gasto sin factura</div>
        <div style="font-size:12.5px;opacity:.9">Gasto real del negocio sin comprobante fiscal</div></div>
      <button class="m-x" onclick="document.getElementById('sf-overlay').remove()">✕</button>
    </div>
    <div class="c-body">
      <div class="c-sug" style="background:#fef3c7;border-color:#92400e">
        <b style="color:#92400e">No entra al Libro IVA</b>
        <div class="mini" style="margin-top:3px">Sin factura no hay crédito fiscal. Computa solamente
        como gasto real en la mirada de gestión.</div>
      </div>
      <label class="mini" style="font-weight:700">Detalle (obligatorio)</label>
      <input id="sf-detalle" placeholder="Qué se pagó y a quién — es lo único que explica el gasto"
             style="width:100%;margin:4px 0 10px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <div><label class="mini" style="font-weight:700">Fecha</label><br>
          <input type="date" id="sf-fecha" value="${hoy}"></div>
        <div><label class="mini" style="font-weight:700">Importe total</label><br>
          <input type="text" inputmode="decimal" id="sf-total" placeholder="0,00" onfocus="wireImporte(this)" style="width:140px;text-align:right"></div>
        <div><label class="mini" style="font-weight:700">Tipo</label><br>
          <select id="sf-tipo">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      </div>
      <label class="mini" style="font-weight:700">Concepto contable</label>
      <input id="sf-concepto" list="dl-conceptos-sf" placeholder="SKU del concepto" style="width:100%;margin:4px 0 10px">
      <datalist id="dl-conceptos-sf">${CONCEPTOS.map(c =>
        `<option value="${esc(c.codigo)}">${esc(c.descripcion||'')}</option>`).join('')}</datalist>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <div style="flex:1;min-width:170px"><label class="mini" style="font-weight:700">Proveedor (opcional)</label><br>
          <input id="sf-prov" placeholder="Nombre" style="width:100%"></div>
        <div><label class="mini" style="font-weight:700">CUIT (opcional)</label><br>
          <input id="sf-cuit" placeholder="Sin guiones" style="width:140px"></div>
        <div><label class="mini" style="font-weight:700">Estado</label><br>
          <select id="sf-estado">
            <option value="pagada" selected>Pagada</option>
            <option value="con_op_sin_pagar">Con OP · sin pagar</option>
            <option value="controlado_sin_op">Controlada · sin OP</option>
          </select></div>
      </div>
    </div>
    <div class="c-pie">
      <div style="flex:1"></div>
      <button class="act gh" onclick="document.getElementById('sf-overlay').remove()">Cancelar</button>
      <button class="act" onclick="guardarSinFactura()">✓ Cargar</button>
    </div>
  </div>`;
}

async function guardarSinFactura(){
  const g = id => document.getElementById(id).value;
  const {error} = await sb.rpc('compras_cargar_sin_factura', {
    p_fecha: g('sf-fecha'),
    p_detalle: g('sf-detalle').trim(),
    p_total: nmParse(g('sf-total')),
    p_tipo_gasto: g('sf-tipo'),
    p_concepto: (g('sf-concepto')||'').split(' ')[0].trim().toUpperCase(),
    p_cuit: g('sf-cuit').trim() || null,
    p_proveedor: g('sf-prov').trim() || null,
    p_estado_pago: g('sf-estado'),
  });
  if (error){ alert('No se pudo cargar: ' + error.message); return; }
  document.getElementById('sf-overlay').remove();
  await cargarTodo();
  irA('facturas');
}

// La ETAPA manda (13-sep, JP): retroceder a "sin contabilizar" o "contabilizado sin
// controlar" devuelve el comprobante a la Bandeja y el motor muda el PDF a esa carpeta.
async function cambiarEstadoPago(docId, estado){
  const volvia = ['sin_contabilizar','contabilizado_sin_controlar'].includes(estado);
  if (volvia && !confirm('Al ponerlo en "' + (EPAGO[estado]?.tx || estado) + '" el comprobante VUELVE a la Bandeja para controlarlo de nuevo, y el PDF se muda a esa carpeta del OneDrive.\n\n¿Seguir?')) return;
  const {data, error} = await sb.from('compras_documentos')
    .update({estado_pago: estado}).eq('id', docId).select('estado,estado_pago').single();
  if (error){ alert('No se pudo cambiar: ' + error.message); return; }
  const d = DOCS.find(x=>x.id===docId);
  if (d){ d.estado_pago = data.estado_pago; d.estado = data.estado; }
  if (data.estado !== 'aprobada'){
    document.getElementById('res-overlay')?.remove();
    await cargarTodo();
    irA('bandeja');
    return;
  }
  abrirResumenDoc(docId);
}

async function editarContabilizacion(docId){
  const {data: doc} = await sb.from('compras_documentos').select('*').eq('id', docId).single();
  const {data: lin} = await sb.from('compras_lineas').select('*').eq('documento_id', docId).order('nroitem');
  if (!doc) return;
  if (doc.origen === 'dragonfish' &&
      !confirm('Esta contabilización vino del Dragonfish y es parte del historial del que aprende el sistema.\n\n¿Seguro que hay que corregirla?')) return;
  const r = document.getElementById('res-overlay');
  if (r) r.remove();
  await cargarCatalogosGastos();
  enControl = {...doc, esEdicion: true};
  if (!doc.gestion_periodo){ const {data: gsug} = await sb.rpc('compras_gestion_sugerir', {p_doc_id: docId}); enControl.gestion_sug = gsug; }
  lineasControl = (lin && lin.length)
    ? lin.map(l => ({concepto: l.concepto_codigo || '', monto: Number(l.monto_neto)||0, alicuota: l.alicuota ?? ''}))
    : [{concepto:'', monto: Number(doc.neto_gravado||0)+Number(doc.neto_no_gravado||0)+Number(doc.exento||0)}];
  enControl._impuestosOk = true;
  pintarControl();
  const [{data}, {data: rg}] = await Promise.all([
    sb.rpc('compras_conceptos_proveedor', {p_cuit: doc.cuit_emisor}),
    sb.rpc('compras_doc_renglones', {p_doc: docId})]);
  enControl._usados = data || [];
  enControl._renglones = rg || [];
  pintarControl();
}

(async () => {
  const {data} = await sb.auth.getSession();
  // (SSO) Con sesión heredada de otro módulo, entra directo solo si el
  // equipo es de confianza o si ya te habías logueado acá antes.
  if (data.session && ADORNO_SSO.entraDirecto('compras', data.session.user.email)){ session.email = data.session.user.email; arrancar(); }
  else document.getElementById('login').style.display = 'block';
})();
