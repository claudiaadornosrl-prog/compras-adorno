//  📚 LIBRO IVA DIGITAL (ARCA · RG 4597) — 2-oct-2026, JP
//
//  Mismo formato de ancho fijo que exporta el Dragonfish.
//  · COMPRAS: se arma acá con los comprobantes del listado en pantalla
//    (CBTE de 325 caracteres + ALICUOTAS de 84). Los despachos de
//    importación (archivo IMPORTACIONES) no están en el módulo.
//  · VENTAS: las ventas no viven en este módulo. Los TXT los genera
//    C:\CRM_Adorno\libros_iva\generar_libro_iva_ventas.py desde el Dragonfish
//    (validado idéntico al export del Dragon, ago-2026) y los publica en
//    `libros_iva_archivos`; acá solo se bajan.
// ═══════════════════════════════════════════════════════════════════════
const LIBRO_CUIT = '30709673110';
const LIBRO_TIPO = {'FC A':'001','ND A':'002','NC A':'003','FC B':'006','ND B':'007','NC B':'008',
                    'FC C':'011','ND C':'012','NC C':'013','FC M':'051','ND M':'052','NC M':'053'};
const _libC = (v, n = 15) => String(Math.abs(Math.round((Number(v) || 0) * 100))).padStart(n, '0');
const _libAscii = t => String(t || '').normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^\x20-\x7E]/g, '?');
function _libBajar(nombre, lineas){
  const blob = new Blob([lineas.join('\r\n') + '\r\n'], {type: 'text/plain;charset=us-ascii'});
  if (_capturar(nombre, blob)) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nombre; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
// Período del libro = el mes entero elegido arriba (AAAA-MM), o null si hay un rango a medida.
function _libPeriodo(){
  const fila = listPer[_listFila()];
  return (_listEsMesEntero() && fila.desde) ? fila.desde.slice(0, 7) : null;
}

function _libroCompras(){
  const cb = [], al = [], avisos = [];
  (LIST_IVA || []).forEach(x => {
    const tipo = LIBRO_TIPO[(x.tipo || '') + ' ' + (x.letra || '')];
    const ref = `${x.comprobante} ${x.proveedor_nombre || ''}`;
    if (!tipo){ avisos.push(`${ref}: tipo/letra sin código de ARCA — no se incluyó`); return; }
    const cuit = String(x.cuit_emisor || '').replace(/\D/g, '');
    if (cuit.length !== 11) avisos.push(`${ref}: CUIT del proveedor incompleto`);
    if ((x.moneda || 'ARS') !== 'ARS') avisos.push(`${ref}: está en ${x.moneda} — se informa en pesos con cotización 1, revisarlo`);
    if (Math.abs(Number(x.iva_otros) || 0) > 0.005) avisos.push(`${ref}: tiene IVA de ajuste (${plata(x.iva_otros)}) que no entra en ninguna alícuota`);
    const clave = tipo + _pvArca(x) + String(x.numero || 0).padStart(20, '0');
    const prov = '80' + cuit.padStart(20, '0');
    const noGrav = Math.abs(Number(x.no_gravado) || 0), exento = Math.abs(Number(x.exento) || 0);
    // alícuotas: una línea por tasa con importe. Los comprobantes C no llevan.
    let lineas = [];
    if (x.letra !== 'C'){
      [['0005', x.neto_21, x.iva_21, 0.21], ['0004', x.neto_105, x.iva_105, 0.105], ['0006', x.neto_27, x.iva_27, 0.27]].forEach(([cod, n, i, t]) => {
        if (Math.abs(Number(n) || 0) > 0.005 || Math.abs(Number(i) || 0) > 0.005) lineas.push([cod, n, i, t]);
      });
      // Con más de una tasa, el módulo guarda un solo neto gravado y el listado lo reparte a prorrata, que deja
      // centavos que no cierran con el IVA. Para ARCA lo que importa es que neto × tasa = IVA de cada línea:
      // se informa cada neto como IVA ÷ tasa (puede diferir centavos del comprobante papel).
      if (lineas.length > 1) lineas.forEach(l => { l[1] = Math.round(Math.abs(Number(l[2]) || 0) / l[3] * 100) / 100; });
      // con no gravado/exento (o sin ninguna tasa) el Dragonfish agrega una línea 0 % en cero
      if (noGrav > 0.005 || exento > 0.005 || !lineas.length) lineas.push(['0003', 0, 0]);
    }
    const codOp = x.letra === 'C' ? 'N' : (noGrav > 0.005 ? 'N' : exento > 0.005 ? 'E' : lineas.some(l => l[0] !== '0003') ? ' ' : 'N');
    const credito = lineas.reduce((a, l) => a + Math.abs(Number(l[2]) || 0), 0);
    cb.push(String(x.fecha_emision || '').replace(/-/g, '') + clave + ' '.repeat(16) + prov
      + _libAscii(x.proveedor_nombre).slice(0, 30).padEnd(30) + _libC(x.total) + _libC(noGrav) + _libC(exento)
      + _libC(x.percep_iva) + _libC(0) + _libC((Number(x.percep_iibb_caba) || 0) + (Number(x.percep_iibb_ba) || 0)) + _libC(0) + _libC(0)
      + 'PES' + '0001000000' + String(lineas.length) + codOp + _libC(credito) + _libC(x.otros_tributos)
      + '0'.repeat(11) + ' '.repeat(30) + _libC(0));
    lineas.forEach(([cod, n, i]) => al.push(clave + prov + _libC(n) + cod + _libC(i)));
  });
  return {cb, al, avisos};
}

function _listGestion(){
  const f = filtrados(DOCS);

  f.forEach(d => {
    const t = d.tipo_gasto || 'sin_clasificar', m = (d.fecha_emision||'').slice(5,7);

async function guardarRegimen(id){
  const val = x => { const el = document.getElementById(x + '-' + id); if (!el) return null;
                     const v = el.value; return v === '' ? null : Number(v); };
  const reg = REGIMENES.find(r => r.id === id) || {};
  const {error} = await sb.from('compras_regimenes').update({
    // con escala progresiva no hay alícuota única: se conserva null y manda la escala
    alicuota:            (Array.isArray(reg.escala) && reg.escala.length) ? null : val('al'),
    minimo_no_imponible: val('mn'),
    minimo_retencion:    val('mr'),
    base:            document.getElementById('ba-' + id).value,
    acumula_mensual: document.getElementById('ac-' + id).checked,
    activo:          document.getElementById('av-' + id).checked,
    actualizado_at:  new Date().toISOString(),
    actualizado_por: session.email,
  }).eq('id', id);
  if (error){ alert('No se pudo guardar: ' + error.message); return; }
  vistaConfig();
}

async function guardarRegimenNuevo(){
  const v = id => (document.getElementById('nr-' + id).value || '').trim();
  const num = id => v(id) === '' ? null : Number(v(id));
  const codigo = v('codigo').toUpperCase(), nombre = v('nombre');
  if (!codigo || !nombre){ alert('Código y nombre son obligatorios.'); return; }
  if (REGIMENES.some(r => r.codigo.toUpperCase() === codigo)){ alert('Ya existe un régimen con el código ' + codigo + '.'); return; }
  const alic = num('alicuota');
  if (alic != null && (alic < 0 || alic > 100)){ alert('La alícuota va en porcentaje (ej. 2 para 2 %).'); return; }
  if (alic == null && !confirm('Sin alícuota, el módulo NO va a calcular esta retención: la va a dejar en cero con aviso, para completar a mano ' +
      '(o cargar la escala en la base). ¿Crear igual?')) return;
  const fila = {
    codigo, nombre, impuesto: v('impuesto'), clase: v('clase'), jurisdiccion: v('jurisdiccion') || null,
    alicuota: alic, minimo_no_imponible: num('mni'), minimo_retencion: num('mr'),
    base: v('base'), acumula_mensual: document.getElementById('nr-acum').checked, activo: true,
    notas: v('notas') || null, actualizado_at: new Date().toISOString(), actualizado_por: session.email,
  };
  const {error} = await sb.from('compras_regimenes').insert(fila);
  if (error){ alert('No se pudo crear: ' + error.message); return; }
  vistaConfig();
}

// ═══════════════════════════════════════════════════════════════════════
//  🔗 EQUIVALENCIAS · cómo le dice el proveedor / cómo le decimos nosotros
//
//  Cada renglón de una factura de mercadería trae el código y la descripción
//  DEL PROVEEDOR. Acá se traduce a nuestro SKU, una sola vez por código:
//  "P2822804011CU38" va a ser siempre la misma bata, así que resuelto una
//  vez queda resuelto para siempre.
//
//  Con FGR —el 90 % de la mercadería— no hace falta nada: comparten catálogo
//  con nosotros, así que el código de su factura YA ES nuestro SKU.
//
//  🚨 Un código de ellos puede convertirse en VARIOS nuestros: FGR vende
//  sets que después se fraccionan. Por eso se puede partir en varias filas,
//  cada una con su parte del costo, y las partes tienen que sumar 100 %.
// ═══════════════════════════════════════════════════════════════════════
let PENDIENTES = [], enMapeo = null, partesMapeo = [], candidatos = [], EQUIV_HECHAS = [];
// (v138, JP) descartados ("no es un artículo"), filtro por proveedor y sugerencias en la fila
let EQ_IGNORADOS = [], EQ_PROV = '', EQ_VER_IGNORADOS = false, _eqSugCargando = false;
const _eqClaveIgn = r => (r.cuit || '') + '|' + (r.codigo_proveedor || '') + '|' + (r.codigo_proveedor ? '' : String(r.descripcion || '').toUpperCase().trim());

async function vistaEquivalencias(){
  const c = document.getElementById('cont');
  c.innerHTML = '<div class="vacio">Buscando artículos sin traducir…</div>';

  const [pend, hechas, ign, usoR] = await Promise.all([
    sb.from('compras_renglones')
      .select('codigo_proveedor,descripcion,cantidad,importe,documento_id,compras_documentos!inner(cuit_emisor,proveedor_nombre,tipo_gasto)')
      .is('sku', null).eq('compras_documentos.tipo_gasto', 'mercaderia').limit(500),   // (v147, JP) solo facturas tipo M
    sb.from('compras_equivalencias')
      .select('id,cuit_proveedor,codigo_proveedor,descripcion_proveedor,sku,cantidad_por_unidad,proporcion_costo,veces_usada,creada_por,creada_at')
      .order('creada_at', {ascending:false}).limit(600),
    sb.from('compras_equiv_ignorados').select('id,cuit_proveedor,codigo_proveedor,descripcion_clave,descripcion,motivo,creado_por,creado_at').order('creado_at', {ascending:false}),
    sb.rpc('compras_equiv_uso'),   // (v138) uso real: veces_usada nunca se incrementó, se cuenta en vivo
  ]);
  const uso = {}; (usoR.error ? [] : (usoR.data || [])).forEach(u => { uso[u.cuit_proveedor + '|' + (u.codigo_proveedor || '') + '|' + (u.descripcion_clave || '') + '|' + u.sku] = Number(u.renglones) || 0; });
  if (pend.error){ c.innerHTML = `<div class="alerta">${esc(pend.error.message)}</div>`; return; }
  EQ_IGNORADOS = ign.error ? [] : (ign.data || []);
  const ignSet = new Set(EQ_IGNORADOS.map(x => x.cuit_proveedor + '|' + (x.codigo_proveedor || '') + '|' + (x.descripcion_clave || '')));

  // un renglón por código distinto: el trabajo es por código, no por factura
  const porCodigo = {};
  (pend.data || []).forEach(r => {
    const d = r.compras_documentos || {};
    const k = (d.cuit_emisor || '') + '|' + (r.codigo_proveedor || r.descripcion || '');
    if (!porCodigo[k]) porCodigo[k] = {...r, cuit: d.cuit_emisor, prov: d.proveedor_nombre, veces: 0};
    porCodigo[k].veces++;
  });
  Object.values(porCodigo).forEach(r => { r.ignorado = ignSet.has(_eqClaveIgn(r)); });
  PENDIENTES = Object.values(porCodigo).sort((a,b) => b.veces - a.veces);
  // Una equivalencia = un código del proveedor (puede tener varias partes si se fracciona)
  const grupos = {};
  (hechas.data || []).forEach(h => {
    const k = h.cuit_proveedor + '|' + (h.codigo_proveedor || '') + '|' + (h.codigo_proveedor ? '' : (h.descripcion_proveedor || '').toUpperCase().trim());
    (grupos[k] = grupos[k] || {cuit: h.cuit_proveedor, codigo_proveedor: h.codigo_proveedor || '',
      descripcion: h.descripcion_proveedor || '', creada_at: h.creada_at, creada_por: h.creada_por, partes: []}).partes.push(h);
  });
  // (7-oct, JP) Un mismo artículo nuestro puede venir con VARIOS códigos del proveedor (blíster / granel…):
  // se muestran juntos. Familia = mismo proveedor + mismas partes (sku, pack, proporción).
  const familias = {};
  Object.values(grupos).forEach(g => {
    // (v148, JP) la firma ya no incluye el pack: POLY3 en blíster ×3 (código A) y en caja ×12 (código B) son el mismo artículo
    const firma = g.cuit + '|' + g.partes.map(p => `${p.sku}:${Number(p.proporcion_costo)||1}`).sort().join('+');
    const fam = familias[firma] = familias[firma] || {...g, codigos: [], usada: 0};
    fam.codigos.push({codigo: g.codigo_proveedor, descripcion: g.descripcion, ids: g.partes.map(p => p.id), creada_at: g.creada_at,
                      pack: g.partes.length === 1 ? (Number(g.partes[0].cantidad_por_unidad) || 1) : null});
    fam.usada += g.partes.reduce((a, p) => a + (uso[g.cuit + '|' + (g.codigo_proveedor || '') + '|' + (g.codigo_proveedor ? '' : (g.descripcion || '').toUpperCase().trim()) + '|' + p.sku] || 0), 0);
    if (g.creada_at > fam.creada_at) fam.creada_at = g.creada_at;
  });
  EQUIV_HECHAS = Object.values(familias).map(fm => { fm.codigos.sort((a, b) => String(a.creada_at).localeCompare(String(b.creada_at))); return fm; });
  const cuits = [...new Set(EQUIV_HECHAS.map(g => g.cuit))];
  if (cuits.length){
    const {data: pv} = await sb.from('tesoreria_proveedores').select('cuit,nombre').in('cuit', cuits);

// (v138, JP) Sugerencia en la fila: mejor candidato del sistema; ✓ acepta sin abrir la ficha (parecido ≥ 0,75)
function _eqSugCelda(p, i){
  if (p.sug === undefined) return '<span class="mini">…</span>';
  if (!p.sug) return '<span class="mini">sin parecido</span>';
  const bueno = Number(p.sug.parecido) >= 0.75, pack = _packDeTexto(p.descripcion) > 1;
  return `<span style="white-space:nowrap"><b>${esc(p.sug.sku)}</b> <span class="mini" style="color:${bueno ? 'var(--ok)' : 'var(--mut)'}" title="${esc(p.sug.descripcion || '')} · parecido ${p.sug.parecido}">${p.sug.parecido}</span>
    ${bueno ? `<button class="act mini-ico" style="background:var(--ok);margin-left:4px" title="${pack ? 'Aceptar (abre la ficha porque el proveedor lo describe como pack: hay que decir cuántas unidades trae)' : 'Aceptar: ' + esc(p.codigo_proveedor || p.descripcion) + ' → ' + esc(p.sug.sku)}" onclick="aceptarSugerencia(${i})">${ico('ok','s')}</button>` : ''}</span>`;
}
async function _eqCargarSugerencias(lista){
  if (_eqSugCargando) return; _eqSugCargando = true;
  try {
    const falta = lista.filter(p => p.sug === undefined);
    for (let k = 0; k < falta.length; k += 15){
      const lote = falta.slice(k, k + 15);
      const {data, error} = await sb.rpc('compras_sugerir_pendientes', {p_items: lote.map(p => ({cuit: p.cuit, codigo: p.codigo_proveedor || '', descripcion: p.descripcion || ''}))});
      if (error){ console.warn('sugerencias', error.message); break; }
      lote.forEach(p => { p.sug = null; });
      (data || []).forEach(x => { const p = lote[x.idx]; if (p) p.sug = {sku: x.sku, descripcion: x.descripcion, parecido: x.parecido, origen: x.origen}; });
      lote.forEach(p => { const i = PENDIENTES.indexOf(p), td = document.getElementById('sug-' + i); if (td) td.innerHTML = _eqSugCelda(p, i); });
      if (!document.getElementById('eq-busca')) break;   // se fue de la pantalla
    }
  } finally { _eqSugCargando = false; }
}
async function aceptarSugerencia(i){
  const p = PENDIENTES[i]; if (!p || !p.sug) return;
  if (_packDeTexto(p.descripcion) > 1){ abrirMapeo(i); return; }
  const r = await sb.rpc('compras_guardar_equivalencia', {p_cuit: p.cuit, p_codigo: (p.codigo_proveedor || '').trim() || null,
    p_descripcion: (p.descripcion || '').trim() || null, p_partes: [{sku: p.sug.sku, cantidad: 1, proporcion: 1}]});
  if (r.error){ alert('No se pudo guardar: ' + r.error.message); return; }
  vistaEquivalencias();
}
async function ignorarPendiente(i){
  const p = PENDIENTES[i]; if (!p) return;
  const motivo = prompt(`"${p.descripcion || p.codigo_proveedor}" de ${p.prov || p.cuit}\n\nSe saca de la lista porque no es un artículo. ¿Qué es? (opcional: servicio, cargo, comisión…)`, '');
  if (motivo === null) return;
  const {error} = await sb.from('compras_equiv_ignorados').upsert({cuit_proveedor: p.cuit, codigo_proveedor: p.codigo_proveedor || '',
    descripcion_clave: p.codigo_proveedor ? '' : String(p.descripcion || '').toUpperCase().trim(), descripcion: p.descripcion || null, motivo: motivo.trim() || null},
    {onConflict: 'cuit_proveedor,codigo_proveedor,descripcion_clave'});
  if (error){ alert('No se pudo marcar: ' + error.message); return; }
  vistaEquivalencias();
}
async function restaurarIgnorado(i){
  const p = PENDIENTES[i]; if (!p) return;
  const x = EQ_IGNORADOS.find(x => x.cuit_proveedor + '|' + (x.codigo_proveedor || '') + '|' + (x.descripcion_clave || '') === _eqClaveIgn(p));
  if (!x) return;
  const {error} = await sb.from('compras_equiv_ignorados').delete().eq('id', x.id);
  if (error){ alert('No se pudo: ' + error.message); return; }
  vistaEquivalencias();
}

// Desde el renglón de una factura (modal de control o resumen): mismo modal de 🔗 Equivalencias.
let _mapeoRengCache = {};
async function abrirMapeoRenglon(docId, desde, idx){
  const d = desde === 'control' ? enControl : (_mapeoRengCache.doc || null);
  const reng = desde === 'control' ? (enControl && enControl._renglones) : _mapeoRengCache.reng;
  const r = reng && reng[idx]; if (!d || !r) { alert('No encontré el renglón. Cerrá y volvé a abrir la factura.'); return; }
  await _abrirMapeoCon({cuit: String(d.cuit_emisor), codigo_proveedor: r.codigo_proveedor || '',
    descripcion: r.descripcion || '', prov: d.proveedor_nombre, veces: 1,
    _docId: docId, _desde: desde});
}
async function _abrirMapeoCon(m){
  enMapeo = m;
  partesMapeo = []; candidatos = []; pintarMapeo(true);
  const {data, error} = await sb.rpc('compras_resolver_articulo', {
    p_cuit: enMapeo.cuit, p_codigo: enMapeo.codigo_proveedor,
    p_descripcion: enMapeo.descripcion, p_limite: 8,
  });
  candidatos = error ? [] : (data || []);
  if (candidatos.length) partesMapeo = [{sku: candidatos[0].sku, cantidad: 1, proporcion: 1}];
  pintarMapeo();
}
async function abrirMapeo(i){
  enMapeo = PENDIENTES[i];
  partesMapeo = [];
  candidatos = [];
  pintarMapeo(true);
  const {data, error} = await sb.rpc('compras_resolver_articulo', {
    p_cuit: enMapeo.cuit, p_codigo: enMapeo.codigo_proveedor,
    p_descripcion: enMapeo.descripcion, p_limite: 8,
  });
  candidatos = error ? [] : (data || []);
  if (candidatos.length) partesMapeo = [{sku: candidatos[0].sku, cantidad: 1, proporcion: 1}];
  pintarMapeo();
}

// (24-sep, JP) Editar una equivalencia ya cargada: mismo modal, con las partes actuales puestas.
async function editarEquivalencia(i){
  const g = EQUIV_HECHAS[i]; if (!g) return;
  enMapeo = {cuit: g.cuit, codigo_proveedor: g.codigo_proveedor, descripcion: g.descripcion, prov: g.prov,
             veces: 0, _editar: true, _skusViejos: g.partes.map(p => p.sku),
             _codigos: (g.codigos || [{codigo: g.codigo_proveedor, descripcion: g.descripcion}]).map(k => ({codigo: k.codigo || '', descripcion: k.descripcion || '', ids: k.ids || [], pack: k.pack || null})),
             _codigosOrig: (g.codigos || []).map(k => ({codigo: k.codigo || '', descripcion: k.descripcion || ''}))};
  partesMapeo = g.partes.map(p => ({sku: p.sku, cantidad: Number(p.cantidad_por_unidad) || 1, proporcion: Number(p.proporcion_costo) || 1}));
  candidatos = []; pintarMapeo(true);
  const {data, error} = await sb.rpc('compras_resolver_articulo', {
    p_cuit: g.cuit, p_codigo: g.codigo_proveedor, p_descripcion: g.descripcion, p_limite: 8 });

async function borrarEquivalencia(i){
  const g = EQUIV_HECHAS[i]; if (!g) return;
  const cods = (g.codigos || []).map(k => k.codigo || k.descripcion).join(', ');
  if (!confirm(`¿Borrar la equivalencia ${cods} → ${g.partes.map(p => p.sku).join(' + ')}?\n\n`
    + 'Las facturas ya traducidas no cambian. Las próximas que traigan ' + (g.codigos.length > 1 ? 'estos códigos' : 'este código') + ' van a volver a aparecer como "sin traducir".')) return;
  const ids = (g.codigos || []).flatMap(k => k.ids || []);
  const {error} = await sb.from('compras_equivalencias').delete().in('id', ids.length ? ids : g.partes.map(p => p.id));
  if (error){ alert('No se pudo borrar: ' + error.message); return; }
  vistaEquivalencias();
}

// Códigos del proveedor que se traducen a estas mismas partes: el que se está traduciendo + los alternativos.
function _mapeoCodigos(){
  if (!enMapeo._codigos) enMapeo._codigos = [{codigo: enMapeo.codigo_proveedor || '', descripcion: enMapeo.descripcion || '', ids: []}];
  return enMapeo._codigos;
}
function pintarSumaMapeo(){
  const suma = partesMapeo.reduce((a,p) => a + (Number(p.proporcion)||0), 0);
  const el = document.getElementById('map-suma');
  if (el) el.innerHTML = Math.abs(suma - 1) < 0.01
    ? '<span style="color:var(--ok)">✓ Las partes del costo suman 100 %.</span>'
    : `<span style="color:var(--warn)">⚠ Las partes suman ${Math.round(suma*100)} %, tienen que dar 100 %.</span>`;
}
function elegirSku(sku){
  if (partesMapeo.length === 1) partesMapeo[0].sku = sku;
  else partesMapeo.push({sku, cantidad:1, proporcion:0});
  pintarMapeo();
}

// (29-sep) "PX2", "PACK X 3", "PACK X3" en la descripción del proveedor → pack sugerido (solo como aviso, no se aplica solo).
// (24-oct, JP) "21109/074 POLYWOOD…" o "63851 - BALANZA…" cargados como DESCRIPCIÓN sin código: la factura trae el código
// aparte y nunca matchean. Detecta un código al principio del texto y propone separarlo.
function _eqCodigoPegado(desc, codigo){
  if ((codigo || '').trim()) return null;
  const t = String(desc || '').trim();
  // primer token con dígitos (21109/074 · 63851 · P2822804011CU36), separado por espacio o " - " del resto
  const m = t.match(/^([A-Z]{0,4}\d[A-Z0-9\/.\-]{2,})(?:\s*[-·:]\s+|\s+)(\S.{2,})$/i);
  if (!m) return null;
  const cod = m[1], resto = m[2].trim();
  if (cod.length < 4 || /^(X|PX|PACK)\d/i.test(cod)) return null;             // "PX2 INDIVIDUAL", "2 X 3": no es código
  if (!/[A-Z]{3}/i.test(resto) || /^(X|PACK|PX)\s*\d/i.test(resto)) return null;
  return {codigo: m[1], descripcion: resto};
}
function _eqSepararCodigo(i){
  const k = _mapeoCodigos()[i], p = k && _eqCodigoPegado(k.descripcion, k.codigo); if (!p) return;
  k.codigo = p.codigo; k.descripcion = p.descripcion;
  if (i === 0){ enMapeo.codigo_proveedor = p.codigo; enMapeo.descripcion = p.descripcion; }
  pintarMapeo();
}
function _packDeTexto(t){
  const m = String(t||'').toUpperCase().match(/\bP(?:ACK)?\s*X\s*(\d{1,2})\b/);
  return m ? Number(m[1]) : 1;
}
async function guardarMapeo(){
  const partes = partesMapeo.filter(p => (p.sku||'').trim())
    .map(p => ({sku: p.sku.trim(), cantidad: Number(p.cantidad)||1, proporcion: partesMapeo.length === 1 ? 1 : (Number(p.proporcion)||0)}));
  if (!partes.length){ alert('Elegí al menos un artículo nuestro.'); return; }
  if (partes.some(p => !(p.cantidad > 0) || !Number.isInteger(p.cantidad))){ alert('"Unid. por pack" tiene que ser un número entero mayor a 0.'); return; }
  // (7-oct, JP) varios códigos del proveedor → mismo artículo: se guarda una equivalencia por código
  const codigos = _mapeoCodigos().filter(k => (k.codigo || '').trim() || (k.descripcion || '').trim());
  if (!codigos.length) codigos.push({codigo: enMapeo.codigo_proveedor || '', descripcion: enMapeo.descripcion || '', ids: []});
  const vistos = new Set();
  for (const k of codigos){
    const clave = (k.codigo || '').trim().toUpperCase() || ('~' + (k.descripcion || '').trim().toUpperCase());
    if (vistos.has(clave)){ alert(`El código ${k.codigo || k.descripcion} está repetido.`); return; }
    vistos.add(clave);
  }
  let res = null, retraducidos = 0;
  for (const k of codigos){
    // (v148) pack propio del código (blíster ×3 vs caja ×12): solo cuando se traduce a UN SKU nuestro
    const partesK = (partes.length === 1 && k.pack > 0) ? [{...partes[0], cantidad: Math.round(k.pack)}] : partes;
    if (partesK.some(p => !Number.isInteger(p.cantidad) || p.cantidad <= 0)){ alert(`El pack del código ${k.codigo || k.descripcion} tiene que ser un entero mayor a 0.`); return; }
    const r = await sb.rpc('compras_guardar_equivalencia', {
      p_cuit: enMapeo.cuit, p_codigo: (k.codigo || '').trim() || null,
      p_descripcion: (k.descripcion || '').trim() || enMapeo.descripcion || null, p_partes: partesK,
    });
    if (r.error){ alert(`No se pudo guardar el código ${k.codigo || k.descripcion}: ` + r.error.message); return; }
    res = r.data; retraducidos += Number(r.data?.retraducidos) || 0;
  }
  // al editar: los códigos que se sacaron de la lista se borran
  if (enMapeo._editar){
    const quedan = new Set(codigos.map(k => (k.codigo || '').trim().toUpperCase() || ('~' + (k.descripcion || '').trim().toUpperCase())));
    const sobrantes = (EQUIV_HECHAS.flatMap(g => g.codigos || []))
      .filter(k => k.ids && k.ids.length && !quedan.has((k.codigo || '').trim().toUpperCase() || ('~' + (k.descripcion || '').trim().toUpperCase())))
      .filter(k => (enMapeo._codigosOrig || []).some(o => o.codigo === k.codigo && o.descripcion === k.descripcion));
    for (const k of sobrantes){ await sb.from('compras_equivalencias').delete().in('id', k.ids); }
  }
  if (enMapeo._editar && retraducidos) alert(`✓ Equivalencia corregida. ${retraducidos} renglón(es) de facturas y remitos quedaron con el SKU y la cantidad nuevos.`);
  const desde = enMapeo._desde, docId = enMapeo._docId;
  cerrarMapeo();
  if (desde === 'control' && enControl && enControl.id === docId){
    const { data: rg } = await sb.rpc('compras_doc_renglones', { p_doc: docId });
    enControl._renglones = rg || []; pintarControl();
  } else if (desde === 'resumen'){
    abrirResumenDoc(docId);
  } else vistaEquivalencias();
}

// ── Recepción (20-sep) · DISENO_REMITOS_STOCK.md ─────────────────────────
// 21-sep (JP): mientras el stock viva en el Dragon, el módulo SOLO genera el TXT
// (no "recibe"). Pide el local si falta y baja el archivo. La puerta es la RPC
// (SKUs resueltos, local válido). compras_stock_en_dragon() en la base decide
// si el TXT exige recibir o no.
async function txtRemito(cuit, pv, num, local){
  const locales = (SUCS.length ? SUCS : [{clave:'alcorta'},{clave:'unicenter'},{clave:'oficina'}]).filter(x => x.activo !== false).map(x => x.clave);
  if (!local){
    local = (prompt(`¿A qué base va la mercadería del remito ${pv}-${num}?\n(${locales.join(' / ')})`) || '').trim().toLowerCase();
    if (!local) return;
    if (!locales.includes(local)){ alert('Local inválido. Opciones: ' + locales.join(', ')); return; }
    const {error} = await sb.rpc('compras_remito_set_local', {p_cuit: cuit, p_punto_venta: pv, p_numero: num, p_local: local});
    if (error){ alert('No se pudo guardar el local: ' + error.message); return; }
  }
  await descargarTxtRemito(cuit, pv, num);
  vistaMercaderia();
}

async function cambiarDestinoRemito(cuit, pv, num, local){
  if (!local){ vistaMercaderia(); return; }
  const {data, error} = await sb.rpc('compras_remito_set_local', {p_cuit: cuit, p_punto_venta: pv, p_numero: num, p_local: local});
  if (error){ alert('No se pudo cambiar el destino: ' + error.message); }

}

// Recepción real (cuando el módulo pase a mover stock, sin Dragon). Hoy no tiene botón.
async function recibirRemito(cuit, pv, num, local){
  const locales = (SUCS.length ? SUCS : [{clave:'alcorta'},{clave:'unicenter'},{clave:'oficina'}]).filter(x => x.activo !== false).map(x => x.clave);
  if (!local){
    local = (prompt(`¿A qué local llegó el remito ${pv}-${num}?\n(${locales.join(' / ')})`) || '').trim().toLowerCase();
    if (!local) return;
    if (!locales.includes(local)){ alert('Local inválido. Opciones: ' + locales.join(', ')); return; }
  }
  if (!confirm(`Confirmar la recepción del remito ${pv}-${num} en ${local} con las cantidades del remito.\n\nEsto marca la mercadería como INGRESADA (una sola vez) y genera el TXT para el Dragonfish. ¿Seguimos?`)) return;
  const {data, error} = await sb.rpc('compras_remito_confirmar', {p_cuit: cuit, p_punto_venta: pv, p_numero: num, p_lineas: null, p_local: local});
  if (error){ alert('No se pudo recibir: ' + error.message); return; }
  await descargarTxtRemito(cuit, pv, num);
  vistaMercaderia();
}

async function descargarTxtRemito(cuit, pv, num){
  const {data, error} = await sb.rpc('compras_remito_txt', {p_cuit: cuit, p_punto_venta: pv, p_numero: num});
  if (error){ alert('El TXT no se pudo generar: ' + error.message); return false; }
  const blob = new Blob([data.contenido], {type:'text/plain'});
  const aEl = document.createElement('a');
  aEl.href = URL.createObjectURL(blob);
  aEl.download = data.nombre;
  aEl.click();
  URL.revokeObjectURL(aEl.href);
  alert(`TXT descargado: ${data.nombre}\n${data.lineas} renglones · ${data.unidades} unidades · destino ${data.destino}\n\nImportalo en el Dragonfish UNA sola vez.`);
  return true;
}

// (TXT y stock). La puerta es la RPC compras_remito_desglosar: valida SKUs, que los
// colores sumen lo facturado (o motivo) y que el remito no se haya importado.
let RDET = null;
async function abrirRemitoDetalle(cuit, pv, num){
  const {data, error} = await sb.rpc('compras_remito_detalle', {p_cuit: cuit, p_numero: num});

function cerrarRemitoDetalle(recargar){

function _rdetNum(n){ return Number(n || 0).toLocaleString('es-AR', {maximumFractionDigits: 2}); }
function _rdetPintar(){
  const ov = document.getElementById('rdet-overlay'); if (!ov || !RDET) return;
  const R = RDET, nro = `${String(R.pv).padStart(4,'0')}-${String(R.num).padStart(8,'0')}`;
  const desg = {}; (R.desgloses || []).forEach(d => { desg[d.id] = d; });
  const vistos = new Set();
  const filas = (R.lineas || []).map(l => {
    let extra = '';
    if (l.desglose_id && !vistos.has(l.desglose_id)){
      vistos.add(l.desglose_id);
      const d = desg[l.desglose_id] || {};
      const suma = (d.partes || []).reduce((a,p) => a + Number(p.cantidad||0), 0);
      extra = `<tr style="background:#f5f3ff"><td colspan="4" class="mini">🎨 <b>${esc(d.descripcion || l.descripcion || '')}</b> — factura ${_rdetNum(d.cantidad_factura)} u., colores ${_rdetNum(suma)} u.
          ${d.nota ? ` · <i>${esc(d.nota)}</i>` : ''}${d.creado_por ? ` · ${esc(d.creado_por)} ${_fechaTs(d.creado_at)}` : ''}</td>
        <td class="num">${R.editable ? `<button class="act gh" style="font-size:11.5px;padding:3px 8px" onclick="deshacerDesglose(${Number(l.desglose_id)})">↩ Deshacer</button>` : ''}</td></tr>`;
    }
    const sinSku = !l.sku;
    return extra + `<tr>
      <td class="num">${_rdetNum(l.cantidad)}</td>
      <td>${esc(l.descripcion || '')}${l.codigo_proveedor ? `<div class="mini">${esc(l.codigo_proveedor)}</div>` : ''}</td>
      <td>${sinSku ? '<span style="color:#b91c1c">sin SKU</span>' : `<code>${esc(l.sku)}</code>${l.desglose_id ? ' <span class="chip" style="background:#ede9fe;color:#6d28d9">🎨</span>' : ''}<div class="mini">${esc(l.sku_desc || '')}</div>`}</td>
      <td class="num">${l.precio_unitario != null ? plata(l.precio_unitario) : '—'}</td>
      <td class="num">${sinSku && R.editable ? `<button class="act" style="font-size:11.5px;padding:3px 8px" onclick="remDesglosarForm(${Number(l.nroitem)})">🎨 Desglosar por color</button>` : ''}</td>
    </tr>`;
  }).join('');
  ov.innerHTML = `<div class="c-box" style="max-width:860px;max-height:92vh;overflow:auto">
    <div class="c-head">
      <div style="flex:1"><div style="font-weight:700;font-size:16px">📦 Remito ${nro}</div>
        <div style="font-size:12.5px;opacity:.9">Lo que sale en el TXT para el Dragonfish, renglón por renglón</div></div>
      <button class="m-x" onclick="cerrarRemitoDetalle(${R._cambio ? 'true' : 'false'})">✕</button>
    </div>
    <div class="c-body">
      ${!R.editable && R.bloqueo ? `<div class="alerta" style="margin-bottom:10px">🔒 ${esc(R.bloqueo)}</div>` : ''}
      ${R.form ? _rdetFormHtml() : `
      <p class="mini" style="margin-bottom:9px">Si la factura trae un artículo en <b>un solo renglón</b> y el remito lo manda <b>por color</b>,
        tocá <b>🎨 Desglosar por color</b> y cargá cuántas vinieron de cada uno. La factura no cambia; el TXT sale por color.
        Para un renglón que es UN solo artículo nuestro, usá 🔗 Asignar SKU en el control de la factura.</p>
      <div style="overflow-x:auto"><table>
        <thead><tr><th class="num">Cant</th><th>Como lo trae el proveedor</th><th>SKU nuestro</th><th class="num">P. unit</th><th></th></tr></thead>
        <tbody>${filas || '<tr><td colspan="5" class="mini">El remito no tiene renglones.</td></tr>'}</tbody>
      </table></div>`}
    </div></div>`;
  if (R.form) remDesgSuma();
}
async function remDesglosarForm(nroitem){
  const l = (RDET.lineas || []).find(x => Number(x.nroitem) === Number(nroitem)); if (!l) return;
  RDET.form = {nroitem, linea: l, partes: [{sku: '', cantidad: ''}], nota: '', sug: []};
  _rdetPintar();
  // Sugerencias: artículos parecidos (los colores de un modelo suelen compartir la descripción)
  const {data} = await sb.rpc('compras_resolver_articulo', {p_cuit: RDET.cuit, p_codigo: l.codigo_proveedor || '', p_descripcion: l.descripcion || '', p_limite: 30});
  if (RDET && RDET.form){ RDET.form.sug = (data || []).filter(x => x.sku); _rdetPintar(); }
}
function _rdetFormHtml(){
  const f = RDET.form, l = f.linea;
  const dl = `<datalist id="rdet-sug">${(f.sug || []).map(x => `<option value="${esc(x.sku)}">${esc(x.descripcion || '')}</option>`).join('')}</datalist>`;
  return `${dl}
    <div style="background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:11px">
      <div class="mini">Renglón de la factura</div>
      <div style="font-weight:700">${_rdetNum(l.cantidad)} × ${esc(l.descripcion || '')}</div>
      ${l.codigo_proveedor ? `<div class="mini">Código del proveedor: ${esc(l.codigo_proveedor)}</div>` : ''}
    </div>
    <table><thead><tr><th>SKU del color</th><th class="num">Cantidad</th><th></th></tr></thead>
      <tbody>${f.partes.map((p, i) => `<tr>
        <td><input list="rdet-sug" placeholder="SKU (tocá para ver sugeridos)" value="${esc(p.sku)}" style="width:260px;text-transform:uppercase"
             oninput="RDET.form.partes[${i}].sku=this.value.toUpperCase().trim();remDesgSuma()">
          <div class="mini" id="rdet-desc-${i}">${esc(_rdetDescSku(p.sku))}</div></td>
        <td class="num"><input type="text" inputmode="decimal" value="${esc(String(p.cantidad))}" style="width:80px;text-align:right"
             oninput="RDET.form.partes[${i}].cantidad=this.value;remDesgSuma()"></td>
        <td class="num">${f.partes.length > 1 ? `<button class="act gh" style="padding:3px 8px" onclick="RDET.form.partes.splice(${i},1);_rdetPintar()">✕</button>` : ''}</td>
      </tr>`).join('')}</tbody></table>
    <button class="act gh" style="margin-top:7px;font-size:12.5px" onclick="remDesgAgregar()">＋ Agregar color</button>
    <div id="rdet-suma" style="margin-top:11px;font-weight:700"></div>
    <div id="rdet-nota-wrap" style="margin-top:8px;display:none">
      <label class="mini">Motivo de la diferencia (faltante, sobrante, cambio de color…)</label>
      <input id="rdet-nota" style="width:100%" value="${esc(f.nota)}" oninput="RDET.form.nota=this.value">
    </div>
    <div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">
      <button class="act gh" onclick="RDET.form=null;_rdetPintar()">Volver</button>
      <button class="act" onclick="guardarDesglose()">Guardar desglose</button>
    </div>`;
}
function _rdetDescSku(sku){
  if (!sku || !RDET || !RDET.form) return '';
  const x = (RDET.form.sug || []).find(s => String(s.sku).toUpperCase() === String(sku).toUpperCase());
  return x ? (x.descripcion || '') : '';
}
function _rdetCant(v){ const n = Number(String(v == null ? '' : v).replace(/\./g, '').replace(',', '.')); return isFinite(n) ? n : 0; }
function remDesgAgregar(){
  const f = RDET.form, falta = Number(f.linea.cantidad || 0) - f.partes.reduce((a,p) => a + _rdetCant(p.cantidad), 0);
  f.partes.push({sku: '', cantidad: falta > 0 ? String(falta) : ''});
  _rdetPintar();
}
function remDesgSuma(){
  if (!RDET || !RDET.form) return;
  const f = RDET.form, tot = Number(f.linea.cantidad || 0), suma = f.partes.reduce((a,p) => a + _rdetCant(p.cantidad), 0);
  f.partes.forEach((p, i) => { const e = document.getElementById('rdet-desc-' + i); if (e) e.textContent = _rdetDescSku(p.sku); });
  const el = document.getElementById('rdet-suma'), nw = document.getElementById('rdet-nota-wrap');
  const ok = Math.abs(suma - tot) < 0.0001;
  if (el){
    el.style.color = ok ? '#166534' : '#b45309';
    el.textContent = ok ? `Los colores suman ${_rdetNum(suma)} de ${_rdetNum(tot)} ✓`
      : `Los colores suman ${_rdetNum(suma)} y la factura dice ${_rdetNum(tot)} — ${suma < tot ? 'faltan ' + _rdetNum(tot - suma) : 'sobran ' + _rdetNum(suma - tot)}`;
  }
  if (nw) nw.style.display = ok ? 'none' : 'block';
}
async function guardarDesglose(){
  const f = RDET.form;
  const partes = f.partes.map(p => ({sku: String(p.sku || '').toUpperCase().trim(), cantidad: _rdetCant(p.cantidad)}))
    .filter(p => p.sku || p.cantidad);
  if (!partes.length){ alert('Cargá al menos un color con su cantidad.'); return; }
  if (partes.some(p => !p.sku)){ alert('Hay un color sin SKU.'); return; }
  if (partes.some(p => !(p.cantidad > 0))){ alert('Todas las cantidades tienen que ser mayores a 0.'); return; }
  const suma = partes.reduce((a,p) => a + p.cantidad, 0), tot = Number(f.linea.cantidad || 0);
  const nota = (f.nota || '').trim();
  if (Math.abs(suma - tot) >= 0.0001 && !nota){ alert(`Los colores suman ${_rdetNum(suma)} y la factura dice ${_rdetNum(tot)}.\nAnotá el motivo de la diferencia.`); return; }
  const {data, error} = await sb.rpc('compras_remito_desglosar', {p_cuit: RDET.cuit, p_numero: RDET.num, p_nroitem: f.nroitem, p_partes: partes, p_nota: nota || null});
  if (error){ alert('No se pudo guardar: ' + error.message); return; }
  const cuit = RDET.cuit, pv = RDET.pv, num = RDET.num;
  await abrirRemitoDetalle(cuit, pv, num);
  if (RDET) { RDET._cambio = true; _rdetPintar(); }
}
async function deshacerDesglose(id){
  if (!confirm('¿Deshacer el desglose por color? El renglón vuelve a quedar sin SKU (y el TXT se frena hasta resolverlo).')) return;
  const {error} = await sb.rpc('compras_remito_deshacer_desglose', {p_desglose_id: id});
  if (error){ alert('No se pudo deshacer: ' + error.message); return; }
  const cuit = RDET.cuit, pv = RDET.pv, num = RDET.num;
  await abrirRemitoDetalle(cuit, pv, num);
  if (RDET) { RDET._cambio = true; _rdetPintar(); }
}

        <input id="rem-prov" list="dl-provs" placeholder="Proveedor (nombre o CUIT)" value="${esc(vals.prov||'')}" style="flex:2;min-width:220px">
        <datalist id="dl-provs">${(window._PROVS||[]).map(p=>`<option value="${esc(p.nombre)} · ${esc(p.cuit_norm||'')}">`).join('')}</datalist>
      </div>
      <div class="c-linea" style="flex-wrap:wrap">
        <input id="rem-pv" type="number" placeholder="Pto vta" value="${esc(vals.pv||'1')}" style="width:90px">

        <input id="rem-fecha" type="date" value="${esc(vals.fecha||new Date().toISOString().slice(0,10))}" style="width:150px">
        <select id="rem-dest" style="flex:1;min-width:130px">
          ${SUCS.filter(x=>x.activo).map(x=>`<option value="${esc(x.clave)}" ${vals.dest===x.clave?'selected':''}>${esc(x.nombre)}</option>`).join('')}
        </select>
      </div>
      <h4 style="font-size:14px;margin:12px 0 7px">Renglones (cantidad + SKU nuestro)</h4>
      <p class="mini" style="margin-bottom:7px">Si el remito trae el código del proveedor, traducilo con la pestaña 🔗 Equivalencias.</p>
      ${remitoLineas.map((l,i)=>`<div class="c-linea">
        <input type="number" min="1" value="${l.cantidad}" style="width:90px;text-align:right"
          oninput="remitoLineas[${i}].cantidad=this.value">
        <input value="${esc(l.sku)}" placeholder="SKU" style="flex:1;text-transform:uppercase"
          oninput="remitoLineas[${i}].sku=this.value.toUpperCase().trim()">
        ${remitoLineas.length>1?`<button class="act gh" onclick="remitoLineas.splice(${i},1);pintarCargaRemito()">✕</button>`:''}
      </div>`).join('')}
      <button class="act gh" style="font-size:12.5px;padding:5px 10px"
        onclick="remitoLineas.push({cantidad:1,sku:''});pintarCargaRemito()">+ Agregar renglón</button>
      <div style="display:flex;gap:9px;margin-top:14px">
        <button class="act" style="flex:1" onclick="guardarRemito()">💾 Guardar remito</button>
        <button class="act gh" onclick="cerrarCargaRemito()">Cancelar</button>
      </div>
      <p class="mini" style="margin-top:9px">Al guardar se descarga el <b>TXT para importar al Dragonfish</b> — así el stock se carga una sola vez. Cuando llegue la factura, el sistema la asocia a este remito.</p>
    </div>
  </div>`;
}
async function guardarRemito(){
  const provTxt = document.getElementById('rem-prov').value;
  const cuit = (provTxt.split('·').pop()||'').replace(/\D/g,'');
  if (cuit.length !== 11){ alert('Elegí el proveedor de la lista (con su CUIT).'); return; }
  const pv = Number(document.getElementById('rem-pv').value);
  const num = Number(document.getElementById('rem-num').value);
  const fecha = document.getElementById('rem-fecha').value;
  const dest = document.getElementById('rem-dest').value;
  if (!pv || !num || !fecha){ alert('Completá punto de venta, número y fecha.'); return; }
  const lineas = remitoLineas.filter(l => l.sku && Number(l.cantidad) > 0)
    .map(l => ({sku: l.sku, cantidad: Number(l.cantidad)}));
  if (!lineas.length){ alert('Cargá al menos un renglón con SKU y cantidad.'); return; }
  const {error} = await sb.rpc('compras_cargar_remito', {
    p_cuit: cuit, p_punto_venta: pv, p_numero: num,
    p_fecha: fecha, p_destino: dest, p_lineas: lineas, p_prueba: MODO_PRUEBA});
  if (error){ alert('No se pudo guardar: ' + error.message); return; }
  // 🚨 (20-sep) el TXT lo arma la base con el formato REAL del importador
  // (DESTINO;PV;NUMERO + "    cant+SKU", CRLF) — antes se armaba acá con un
  // formato inventado que el Dragonfish no tomaba.
  await sb.from('compras_remitos').update({local_destino: dest}).match({proveedor_cuit: cuit, punto_venta: pv, numero: num});
  await descargarTxtRemito(cuit, pv, num);
  cerrarCargaRemito();
  vistaMercaderia();
}

// ═══════════════════════════════════════════════════════════════════════
//  📇 CONCEPTOS · el catálogo contable (SKU + descripción, como Dragonfish)
//  🚨 Regla: crear concepto es para un tipo de gasto GENUINAMENTE nuevo, no
//  para variantes de nombre. Y mientras el Dragonfish siga vivo, todo
//  concepto creado acá tiene que existir también como artículo allá, sino
//  el .txt de exportación lo va a rechazar.
// ═══════════════════════════════════════════════════════════════════════
let CONC_LISTA = [], concBusca = '', _concTimer = null;
// (8-oct, JP · v131) ocultar inactivos por defecto, recordado en el navegador
let CONC_OCULTAR_INACTIVOS = localStorage.getItem('conc_ocultar_inactivos') !== '0';

async function vistaConceptos(){
  const c = document.getElementById('cont');
  c.innerHTML = '<div class="vacio">Cargando catálogo…</div>';
  const {data, error} = await sb.from('compras_conceptos')
    .select('codigo,descripcion,alicuota,usos_historicos,activo,origen')
    .order('usos_historicos', {ascending:false}).limit(2000);
  if (error){ c.innerHTML = `<div class="alerta">${esc(error.message)}</div>`; return; }
  CONC_LISTA = data || [];
  pintarConceptos();
}

function conceptosFiltrados(){
  const t = concBusca.toLowerCase();
  return CONC_LISTA.filter(x => (!CONC_OCULTAR_INACTIVOS || x.activo) && (!t ||
    (x.codigo + ' ' + (x.descripcion||'')).toLowerCase().includes(t)));
}

// (v131) La barra y la cabecera se dibujan una vez; el buscador solo redibuja las
// filas (0,6 s después de la última tecla, o con Enter), así no pierde el foco.
function buscarConcepto(v, inmediato){
  concBusca = v;
  clearTimeout(_concTimer);
  if (inmediato) pintarConceptosFilas(); else _concTimer = setTimeout(pintarConceptosFilas, 600);
}
function toggleInactivosConceptos(){
  CONC_OCULTAR_INACTIVOS = !CONC_OCULTAR_INACTIVOS;
  localStorage.setItem('conc_ocultar_inactivos', CONC_OCULTAR_INACTIVOS ? '1' : '0');
  pintarConceptos();
}

function pintarConceptos(){
  const c = document.getElementById('cont');
  const activos = CONC_LISTA.filter(x=>x.activo).length, inactivos = CONC_LISTA.length - activos;
  // (8-oct, JP) resumen en chips, ayuda en tooltip, alta con "+"
  c.innerHTML = `<div class="abar">
      <span class="fchip" style="cursor:default"><b>${CONC_LISTA.length}</b> conceptos <span class="mini">· ${activos} activos · ${inactivos} inactivos</span></span>
      <span class="fchip" style="cursor:default" title="Creados desde el módulo; el resto vino del histórico del Dragonfish">${ico('mano','s')} <b>${CONC_LISTA.filter(x=>x.origen==='manual').length}</b> a mano</span>
      <button class="fchip ${CONC_OCULTAR_INACTIVOS?'on':''}" type="button" onclick="toggleInactivosConceptos()"
        title="${CONC_OCULTAR_INACTIVOS ? 'Los conceptos dados de baja están ocultos. Tocá para verlos.' : 'Se ven también los dados de baja (al 50 %). Tocá para ocultarlos.'}">${ico('ojo','s')} ${CONC_OCULTAR_INACTIVOS ? 'Ocultar inactivos' : 'Mostrando inactivos'}</button>
      <span class="mini" id="conc-recorte"></span>
    </div>
    <div class="card">
      <div class="filtros">
        <h3 style="font-size:15px;display:flex;align-items:center;gap:8px;margin-right:4px">${ico('etiquetas','s')} Catálogo
          ${ayuda('Cada concepto es un SKU + su descripción, igual que los artículos del Dragonfish. Mientras el Dragonfish siga en uso, todo concepto creado acá hay que darlo de alta también allá como artículo; si no, la exportación lo rechaza. Los cambios en cada renglón se guardan solos al salir del campo.')}</h3>
        <input type="search" placeholder="Buscar por SKU o descripción…" value="${esc(concBusca)}" style="flex:1"
               oninput="buscarConcepto(this.value)" onkeydown="if(event.key==='Enter')buscarConcepto(this.value,true)">
        <button class="act mini-ico" title="Nuevo concepto" onclick="toggleAltaConcepto()">${ico('mas')}</button>
      </div>
      <div id="alta-conc" style="display:none;background:#fff7ed;border:1px solid var(--primary);border-radius:9px;padding:11px;margin-bottom:11px;">
        <div style="display:flex;gap:7px;flex-wrap:wrap;">
          <input id="ac-sku" placeholder="SKU (ej: SEGVIG)" maxlength="20" style="width:150px;text-transform:uppercase">
          <input id="ac-desc" placeholder="Descripción para los listados" style="flex:1;min-width:180px">
          <input id="ac-alic" list="dl-alic" value="21" placeholder="IVA %" title="21 · 10.5 · 27 · 0, o cualquier otra alícuota" style="width:80px;text-align:right">
          <button class="act" style="font-size:12.5px;padding:6px 11px" onclick="altaConcepto()">Crear</button>
        </div>
        <div class="mini" style="margin-top:6px">Recordá darlo de alta también en el Dragonfish.</div>
      </div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>SKU</th><th>Descripción</th><th>Alíc.</th><th class="num">Usos</th>
          <th style="text-align:center">Activo</th><th></th></tr></thead>
        <tbody id="conc-tbody"></tbody></table></div>
    </div>`;
  pintarConceptosFilas();
}

function pintarConceptosFilas(){
  const tb = document.getElementById('conc-tbody'), rec = document.getElementById('conc-recorte');
  if (!tb) return;
  const lista = conceptosFiltrados();
  tb.innerHTML = lista.slice(0,150).map(filaConcepto).join('') ||
    `<tr><td colspan="6" class="mini" style="text-align:center;padding:18px">Sin resultados${CONC_OCULTAR_INACTIVOS ? ' entre los activos' : ''}.</td></tr>`;
  if (rec) rec.textContent = lista.length > 150 ? `Mostrando 150 de ${lista.length} — afiná la búsqueda.` : '';
}

// (v131) Autoguardado: descripción al salir del campo, alícuota y activo al cambiarlos.
function filaConcepto(x){
  const cod = esc(x.codigo);
  return `<tr id="cr-${cod}" style="${x.activo?'':'opacity:.5'}">
    <td style="white-space:nowrap"><b>${cod}</b>${x.origen==='manual' ? ` <span class="mini" title="Creado a mano en el módulo" style="color:#1e40af">${ico('mano','s')}</span>` : ''}</td>
    <td><input value="${esc(x.descripcion||'')}" id="cd-${cod}" style="width:100%;min-width:200px;font-size:13px;padding:6px 8px"
          onchange="guardarConcepto('${cod}')"></td>
    <td><select id="ca-${cod}" style="font-size:13px;padding:6px" onchange="if(this.value==='__otra'){const v=prompt('Alícuota de IVA (%)','');if(v===null||isNaN(Number(v.replace(',','.')))){this.value='21';return;}const o=document.createElement('option');o.value=String(Number(v.replace(',','.')));o.textContent=o.value+'%';this.insertBefore(o,this.lastElementChild);this.value=o.value;} guardarConcepto('${cod}')">
      ${['21','10.5','27','0'].concat(x.alicuota && !['21','10.5','27','0'].includes(String(x.alicuota)) ? [String(x.alicuota)] : []).map(al=>`<option value="${al}" ${String(x.alicuota)===al?'selected':''}>${al==='0'?'No grav.':al+'%'}</option>`).join('')}
      <option value="__otra">Otra…</option>
    </select></td>
    <td class="num">${x.usos_historicos||0}</td>
    <td style="text-align:center"><input type="checkbox" id="cx-${cod}" ${x.activo?'checked':''} onchange="guardarConcepto('${cod}')"></td>
    <td class="num" style="white-space:nowrap">
      <span id="cok-${cod}" class="mini" style="color:#16a34a;font-weight:700;opacity:0;transition:opacity .3s;margin-right:4px">✓ guardado</span>
      <button class="act gh mini-ico" title="Cambiar el SKU y arrastrar todo lo ya contabilizado"
        onclick="abrirRenombreSKU('${cod}')">${ico('lapiz','s')}</button></td>
  </tr>`;
}

function toggleAltaConcepto(){
  const f = document.getElementById('alta-conc');
  if (f) f.style.display = f.style.display === 'none' ? 'block' : 'none';
}
async function altaConcepto(){
  const cod = (document.getElementById('ac-sku').value||'').trim().toUpperCase();
  const desc = (document.getElementById('ac-desc').value||'').trim();
  if (!cod || !desc){ alert('Completá SKU y descripción.'); return; }
  const {error} = await sb.rpc('compras_crear_concepto',
    {p_codigo: cod, p_descripcion: desc, p_alicuota: document.getElementById('ac-alic').value});
  if (error){ alert('No se pudo crear: ' + error.message); return; }
  // (v131) el nuevo tiene 0 usos y quedaría al final: lo dejamos buscado para que se vea
  concBusca = cod;
  vistaConceptos();
}
async function guardarConcepto(cod){
  const desc = document.getElementById('cd-'+cod).value.trim(),
        alic = document.getElementById('ca-'+cod).value,
        act  = document.getElementById('cx-'+cod).checked;
  const {error} = await sb.from('compras_conceptos').update({descripcion: desc, alicuota: alic, activo: act}).eq('codigo', cod);
  if (error){ alert('No se pudo guardar: ' + error.message); return; }
  const x = CONC_LISTA.find(y=>y.codigo===cod);
  if (x){ x.descripcion=desc; x.alicuota=alic; x.activo=act; }
  const tr = document.getElementById('cr-'+cod); if (tr) tr.style.opacity = act ? '' : '.5';
  const ok = document.getElementById('cok-'+cod);
  if (ok){ ok.style.opacity = '1'; setTimeout(()=>{ ok.style.opacity = '0'; }, 1500); }
  // si lo dio de baja y los inactivos están ocultos, la fila desaparece al redibujar
  if (!act && CONC_OCULTAR_INACTIVOS) setTimeout(pintarConceptosFilas, 1600);
}

// ── ✏ Cambiar el SKU de un concepto ───────────────────────────────────
//  El SKU es la clave con la que está escrito TODO lo ya contabilizado.
//  La RPC compras_concepto_renombrar hace el cambio completo en una sola
//  transacción (líneas, proveedores, sugerencias, simulación) y deja el
//  SKU viejo en compras_concepto_alias para poder rastrear los asientos.
//  Si el SKU destino ya existe, es una FUSIÓN y hay que confirmarla aparte.
async function abrirRenombreSKU(cod){
  const {data, error} = await sb.rpc('compras_concepto_impacto', {p_codigo: cod});
  if (error){ alert('No se pudo leer el concepto: ' + error.message); return; }
  const i = data || {};
  const n = v => Number(v || 0).toLocaleString('es-AR');
  openModalP(`
    <h3 style="margin:0 0 4px">✏ Cambiar el SKU de <span style="font-family:monospace">${esc(cod)}</span></h3>
    <p class="mini" style="margin:0 0 12px">${esc(i.descripcion || '')}${i.alicuota ? ' · alícuota ' + esc(i.alicuota) + '%' : ''}</p>
    <div style="background:#f8fafc;border:1px solid var(--bd);border-radius:9px;padding:11px;margin-bottom:12px;font-size:13px;line-height:1.7">
      <b>Lo que se va a reescribir con el SKU nuevo:</b><br>
      · <b>${n(i.lineas)}</b> renglón${Number(i.lineas)===1?'':'es'} ya contabilizado${Number(i.lineas)===1?'':'s'} en <b>${n(i.documentos)}</b> comprobante${Number(i.documentos)===1?'':'s'}${Number(i.monto)?` (${plata(i.monto)})`:''}<br>
      · <b>${n(i.proveedores)}</b> proveedor${Number(i.proveedores)===1?'':'es'} que lo tienen como concepto habitual<br>
      · <b>${n(i.sugerencias)}</b> sugerencia${Number(i.sugerencias)===1?'':'s'} pendiente${Number(i.sugerencias)===1?'':'s'} en la Bandeja
      ${Number(i.simulacion) ? `<br>· ${n(i.simulacion)} fila${Number(i.simulacion)===1?'':'s'} del back-test` : ''}
      ${Number(i.alias_previos) ? `<br>· ${n(i.alias_previos)} SKU viejo${Number(i.alias_previos)===1?'':'s'} que ya apuntaban acá` : ''}
    </div>
    <label>SKU nuevo</label>
    <input id="rs-nuevo" maxlength="20" placeholder="Ej: 71401004" value="${esc(cod)}"
           style="text-transform:uppercase;font-family:monospace" oninput="_rsChequear()">
    <div id="rs-aviso" class="mini" style="margin:6px 0 10px;min-height:18px"></div>
    <label>Por qué lo cambiás (queda asentado)</label>
    <input id="rs-motivo" placeholder="Ej: el SKU viejo no servía para el listado de IVA" style="margin-bottom:12px">
    <div style="background:#fff7ed;border:1px solid #fdba74;border-radius:9px;padding:10px;font-size:12.5px;line-height:1.6;margin-bottom:14px">
      🚨 Mientras el Dragonfish siga en uso, el SKU nuevo <b>tiene que existir también allá</b> como artículo,
      sino la exportación lo rechaza. El SKU viejo queda guardado en el historial para poder rastrear los asientos.
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end">
      <button class="act gh" onclick="cerrarModalP()">Cancelar</button>
      <button class="act" id="rs-ok" onclick="confirmarRenombreSKU('${esc(cod)}')">Cambiar el SKU</button>
    </div>`);
  setTimeout(() => { const el = document.getElementById('rs-nuevo'); if (el){ el.focus(); el.select(); } }, 40);
}

function _rsChequear(){
  const el = document.getElementById('rs-nuevo'); if (!el) return;
  const v = (el.value || '').trim().toUpperCase();
  const av = document.getElementById('rs-aviso');
  const existe = CONC_LISTA.find(c => c.codigo === v);
  if (!v){ av.innerHTML = ''; return; }
  if (!/^[A-Z0-9][A-Z0-9._-]*$/.test(v)){

}

async function confirmarRenombreSKU(cod){

  const texto = fusiona
    ? `Vas a FUSIONAR "${cod}" dentro de "${nuevo}".\n\nTodo lo contabilizado con ${cod} pasa a ${nuevo} y ${cod} deja de existir.\n\n¿Seguimos?`

        ${tog(doc.computa_formal, 'iva', doc.computa_formal ? 'Va al Libro IVA (contabilidad formal)' : 'No va al Libro IVA')}
        ${tog(doc.computa_gestion, 'hoja', planTip)}
      </div>`; })()}
      <div class="c-linea fx-lin-hd" style="margin:4px 0 2px"><span style="flex:1;display:inline-flex;align-items:center;gap:8px">Concepto ${ayuda('Imputación contable de la factura. Las retenciones no van acá: se practican al pagar y se ven en la orden de pago.')}</span><span style="width:72px;text-align:right">IVA %</span><span style="width:140px;text-align:right">Neto</span></div>
      ${lineas.length ? lineas.map(l => `<div class="c-linea" style="align-items:center;margin-bottom:4px">
          <b style="width:150px;flex:none">${esc(l.concepto_codigo||'—')}</b>
          <span class="prov-nom" style="flex:1;max-width:none;color:#166534;font-size:13.5px" title="${esc(cMap[l.concepto_codigo]||l.descripcion||'')}">${esc(cMap[l.concepto_codigo]||l.descripcion||'')}</span>
          <span style="width:72px;text-align:right">${esc(l.alicuota==='0'?'No grav.':(l.alicuota||'')+'%')}</span>
          <span class="num" style="width:140px;text-align:right"><b>${plata(l.monto_neto)}</b></span>
        </div>`).join('')
        : '<div class="vacio">Sin líneas de contabilización.</div>'}
      <div id="res-nota-${docId}" style="margin-top:10px">${_notaDocHTML(doc)}</div>
      <p class="mini" style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <span title="${doc.aprobada_por ? 'Contabilizada por ' + esc(doc.aprobada_por) + ' el ' + _fechaTs(doc.aprobada_at) : 'Contabilización migrada del Dragonfish'}" style="cursor:help">${ico('ok','s')} ${doc.aprobada_por ? esc(String(doc.aprobada_por).split('@')[0]) + ' · ' + _fechaTs(doc.aprobada_at) : 'migrada del Dragonfish'}</span>
        · Nº interno <b>${doc.numero_interno ?? '—'}</b> · ingreso <b>${doc.fecha_ingreso ? fechaCorta(doc.fecha_ingreso) : '—'}</b>
        · CAE <b>${esc(doc.cae || (doc.extraido_json||{}).cae || '—')}</b> <span class="mini">vto ${(doc.cae_vto || (doc.extraido_json||{}).cae_vto) ? fechaCorta(doc.cae_vto || doc.extraido_json.cae_vto) : '—'}</span>
      </p>
    </div>
  </div>`;
}

  let ov = document.getElementById('sf-overlay');

  const hoy = new Date().toISOString().slice(0,10);
  ov.innerHTML = `<div class="c-box" style="max-width:560px">
    <div class="c-head">
      <div style="flex:1"><div style="font-weight:700;font-size:16px">➕ Cargar gasto sin factura</div>
        <div style="font-size:12.5px;opacity:.9">Gasto real del negocio sin comprobante fiscal</div></div>
      <button class="m-x" onclick="document.getElementById('sf-overlay').remove()">✕</button>
    </div>
    <div class="c-body">
      <div class="c-sug" style="background:#fef3c7;border-color:#92400e">
        <b style="color:#92400e">No entra al Libro IVA</b>
        <div class="mini" style="margin-top:3px">Sin factura no hay crédito fiscal. Computa solamente
        como gasto real en la mirada de gestión.</div>
      </div>
      <label class="mini" style="font-weight:700">Detalle (obligatorio)</label>
      <input id="sf-detalle" placeholder="Qué se pagó y a quién — es lo único que explica el gasto"
             style="width:100%;margin:4px 0 10px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <div><label class="mini" style="font-weight:700">Fecha</label><br>
          <input type="date" id="sf-fecha" value="${hoy}"></div>
        <div><label class="mini" style="font-weight:700">Importe total</label><br>
          <input type="text" inputmode="decimal" id="sf-total" placeholder="0,00" onfocus="wireImporte(this)" style="width:140px;text-align:right"></div>
        <div><label class="mini" style="font-weight:700">Tipo</label><br>
          <select id="sf-tipo">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      </div>
      <label class="mini" style="font-weight:700">Concepto contable</label>
      <input id="sf-concepto" list="dl-conceptos-sf" placeholder="SKU del concepto" style="width:100%;margin:4px 0 10px">
      <datalist id="dl-conceptos-sf">${CONCEPTOS.map(c =>
        `<option value="${esc(c.codigo)}">${esc(c.descripcion||'')}</option>`).join('')}</datalist>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <div style="flex:1;min-width:170px"><label class="mini" style="font-weight:700">Proveedor (opcional)</label><br>
          <input id="sf-prov" placeholder="Nombre" style="width:100%"></div>
        <div><label class="mini" style="font-weight:700">CUIT (opcional)</label><br>
          <input id="sf-cuit" placeholder="Sin guiones" style="width:140px"></div>
        <div><label class="mini" style="font-weight:700">Estado</label><br>
          <select id="sf-estado">
            <option value="pagada" selected>Pagada</option>
            <option value="con_op_sin_pagar">Con OP · sin pagar</option>
            <option value="controlado_sin_op">Controlada · sin OP</option>
          </select></div>
      </div>
    </div>
    <div class="c-pie">
      <div style="flex:1"></div>
      <button class="act gh" onclick="document.getElementById('sf-overlay').remove()">Cancelar</button>
      <button class="act" onclick="guardarSinFactura()">✓ Cargar</button>
    </div>
  </div>`;
}

async function guardarSinFactura(){
  const g = id => document.getElementById(id).value;
  const {error} = await sb.rpc('compras_cargar_sin_factura', {
    p_fecha: g('sf-fecha'),
    p_detalle: g('sf-detalle').trim(),
    p_total: nmParse(g('sf-total')),
    p_tipo_gasto: g('sf-tipo'),
    p_concepto: (g('sf-concepto')||'').split(' ')[0].trim().toUpperCase(),
    p_cuit: g('sf-cuit').trim() || null,
    p_proveedor: g('sf-prov').trim() || null,
    p_estado_pago: g('sf-estado'),
  });
  if (error){ alert('No se pudo cargar: ' + error.message); return; }
  document.getElementById('sf-overlay').remove();
  await cargarTodo();
  irA('facturas');
}

// La ETAPA manda (13-sep, JP): retroceder a "sin contabilizar" o "contabilizado sin
// controlar" devuelve el comprobante a la Bandeja y el motor muda el PDF a esa carpeta.
async function cambiarEstadoPago(docId, estado){
  const volvia = ['sin_contabilizar','contabilizado_sin_controlar'].includes(estado);
  if (volvia && !confirm('Al ponerlo en "' + (EPAGO[estado]?.tx || estado) + '" el comprobante VUELVE a la Bandeja para controlarlo de nuevo, y el PDF se muda a esa carpeta del OneDrive.\n\n¿Seguir?')) return;
  const {data, error} = await sb.from('compras_documentos')
    .update({estado_pago: estado}).eq('id', docId).select('estado,estado_pago').single();
  if (error){ alert('No se pudo cambiar: ' + error.message); return; }
  const d = DOCS.find(x=>x.id===docId);
  if (d){ d.estado_pago = data.estado_pago; d.estado = data.estado; }
  if (data.estado !== 'aprobada'){
    document.getElementById('res-overlay')?.remove();
    await cargarTodo();
    irA('bandeja');
    return;
  }
  abrirResumenDoc(docId);
}

async function editarContabilizacion(docId){
  const {data: doc} = await sb.from('compras_documentos').select('*').eq('id', docId).single();
  const {data: lin} = await sb.from('compras_lineas').select('*').eq('documento_id', docId).order('nroitem');
  if (!doc) return;
  if (doc.origen === 'dragonfish' &&
      !confirm('Esta contabilización vino del Dragonfish y es parte del historial del que aprende el sistema.\n\n¿Seguro que hay que corregirla?')) return;
  const r = document.getElementById('res-overlay');
  if (r) r.remove();
  await cargarCatalogosGastos();
  enControl = {...doc, esEdicion: true};
  if (!doc.gestion_periodo){ const {data: gsug} = await sb.rpc('compras_gestion_sugerir', {p_doc_id: docId}); enControl.gestion_sug = gsug; }
  lineasControl = (lin && lin.length)
    ? lin.map(l => ({concepto: l.concepto_codigo || '', monto: Number(l.monto_neto)||0, alicuota: l.alicuota ?? ''}))
    : [{concepto:'', monto: Number(doc.neto_gravado||0)+Number(doc.neto_no_gravado||0)+Number(doc.exento||0)}];
  enControl._impuestosOk = true;
  pintarControl();
  const [{data}, {data: rg}] = await Promise.all([
    sb.rpc('compras_conceptos_proveedor', {p_cuit: doc.cuit_emisor}),
    sb.rpc('compras_doc_renglones', {p_doc: docId})]);
  enControl._usados = data || [];
  enControl._renglones = rg || [];
  await _remitosDelDoc(enControl);
  pintarControl();
}
