<html lang="es">

<style>
@font-face{font-family:'URW Gothic';src:url('fonts/URWGothic-Book.ttf') format('truetype');font-weight:300 700;font-display:swap;}
:root{--primary:#ea580c;--primary-dark:#c2410c;--bg:#f8fafc;--card:#fff;--bd:#e2e8f0;--tx:#0f172a;--mut:#64748b;
      --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'URW Gothic',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;}
header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;
       position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15);}
header h1{font-size:17px;font-weight:700;flex:1;}
.hbtn{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:15px;border-radius:8px;padding:6px 11px;cursor:pointer;}
nav.tabs{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--bd);padding:0 8px;overflow-x:auto;
         position:sticky;top:48px;z-index:40;}
nav.tabs button{background:none;border:none;padding:11px 13px;font-size:14px;color:var(--mut);cursor:pointer;
                border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit;}
nav.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:700;}
main{padding:14px;max-width:1250px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
.kpi{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--primary);border-radius:10px;padding:11px 13px;}
.kpi .lbl{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;}
.kpi .val{font-size:20px;font-weight:700;margin-top:3px;}
.kpi .sub{font-size:12px;color:var(--mut);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:8px 7px;border-bottom:2px solid var(--bd);color:var(--mut);font-size:12px;
   text-transform:uppercase;letter-spacing:.3px;cursor:pointer;white-space:nowrap;}
td{padding:8px 7px;border-bottom:1px solid #f1f5f9;vertical-align:top;}
tr:hover td{background:#fff7ed;}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.c-gastos{background:#dbeafe;color:#1e40af;} .c-mercaderia{background:#dcfce7;color:#166534;}
.c-inversiones{background:#fef3c7;color:#92400e;} .c-no_actividad{background:#f1f5f9;color:#475569;}
.e-aprobada{background:#dcfce7;color:#166534;} .e-a_revisar{background:#fef3c7;color:#92400e;}
.e-auto{background:#dbeafe;color:#1e40af;} .e-sin_regla{background:#fee2e2;color:#991b1b;}
.e-rechazada{background:#fee2e2;color:#991b1b;} .e-extraida{background:#f1f5f9;color:#475569;}
input,select{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;}
input:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.filtros input[type=search]{flex:1;min-width:180px;}
button.act{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:14px;
           cursor:pointer;font-family:inherit;}
button.act.gh{background:#fff;color:var(--primary);border:1px solid var(--primary);}
.alerta{background:#fef2f2;border-left:4px solid var(--bad);border-radius:8px;padding:10px 13px;margin-bottom:10px;
        font-size:13px;color:#991b1b;}
.vacio{text-align:center;color:var(--mut);padding:34px 10px;font-size:14px;}
#login{max-width:340px;margin:70px auto;text-align:center;}
#login input{width:100%;margin-bottom:10px;}
#login h2{margin-bottom:6px;font-size:21px;} #login p{color:var(--mut);font-size:13.5px;margin-bottom:18px;}
.err{color:var(--bad);font-size:13px;margin-top:8px;}
.mini{font-size:11.5px;color:var(--mut);}
@media(max-width:640px){ td,th{padding:7px 5px;font-size:12.5px;} .oculta-mov{display:none;} }
/* ── Modal de control de la Bandeja ── */
#ctrl-overlay,#map-overlay,#res-overlay,#merc-overlay,#sf-overlay,#rem-overlay,#suc-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9998;display:flex;
  align-items:flex-start;justify-content:center;padding:18px 12px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
#ctrl-overlay .c-box,#map-overlay .c-box,#res-overlay .c-box,#merc-overlay .c-box,#sf-overlay .c-box,#rem-overlay,#suc-overlay .c-box{background:#fff;border-radius:14px;max-width:720px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);}
#ctrl-overlay .c-head,#map-overlay .c-head,#res-overlay .c-head,#merc-overlay .c-head,#sf-overlay .c-head,#rem-overlay,#suc-overlay .c-head{position:sticky;top:0;background:var(--primary);color:#fff;padding:13px 17px;
  border-radius:14px 14px 0 0;display:flex;align-items:flex-start;gap:10px;z-index:1;}
#ctrl-overlay .m-x,#map-overlay .m-x,#res-overlay .m-x,#merc-overlay .m-x,#sf-overlay .m-x,#rem-overlay,#suc-overlay .m-x{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:15px;border-radius:8px;padding:5px 10px;cursor:pointer;}
#ctrl-overlay .c-body,#map-overlay .c-body,#res-overlay .c-body,#merc-overlay .c-body,#sf-overlay .c-body,#rem-overlay,#suc-overlay .c-body{padding:15px 17px;}
#ctrl-overlay .c-nums,#map-overlay .c-nums,#res-overlay .c-nums,#merc-overlay .c-nums{display:flex;gap:22px;flex-wrap:wrap;margin-bottom:9px;padding-bottom:10px;border-bottom:1px solid var(--bd);}
#ctrl-overlay .c-nums .lbl,#map-overlay .c-nums .lbl,#res-overlay .c-nums .lbl,#merc-overlay .c-nums .lbl{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;}
#ctrl-overlay .c-nums .v,#map-overlay .c-nums .v,#res-overlay .c-nums .v,#merc-overlay .c-nums .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;}
#ctrl-overlay .c-sug,#map-overlay .c-sug,#res-overlay .c-sug,#merc-overlay .c-sug,#sf-overlay .c-sug{border:1px solid;border-left-width:4px;border-radius:9px;padding:10px 13px;margin:11px 0;font-size:13px;}
#ctrl-overlay .c-linea,#map-overlay .c-linea,#res-overlay .c-linea,#merc-overlay .c-linea,#rem-overlay .c-linea{display:flex;gap:7px;margin-bottom:7px;flex-wrap:wrap;}
#ctrl-overlay .c-fila,#map-overlay .c-fila,#res-overlay .c-fila,#merc-overlay .c-fila{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:15px;
  padding-top:12px;border-top:1px solid var(--bd);font-size:13.5px;}
#ctrl-overlay .c-fila label,#map-overlay .c-fila label,#res-overlay .c-fila label,#merc-overlay .c-fila label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);}
#ctrl-overlay .c-chk,#map-overlay .c-chk,#res-overlay .c-chk,#merc-overlay .c-chk{flex-direction:row!important;align-items:center;gap:6px!important;font-size:13px!important;color:var(--tx)!important;}
#ctrl-overlay .c-pie,#map-overlay .c-pie,#res-overlay .c-pie,#merc-overlay .c-pie,#sf-overlay .c-pie{display:flex;gap:8px;align-items:center;padding:12px 17px;border-top:1px solid var(--bd);
  background:#f8fafc;border-radius:0 0 14px 14px;position:sticky;bottom:0;}
</style>
</head>

  <h2>🛒 Compras</h2>

<div id="app" style="display:none">
  <header>
    <a href="https://claudiaadornosrl-prog.github.io/hub/" title="Volver al Hub" aria-label="Volver al Hub"

    <span style="font-size:20px">🛒</span>
    <h1>Compras</h1>
    <button class="hbtn" onclick="cargarTodo()">↻</button>
    <button class="hbtn" onclick="salir()">Salir</button>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="cont"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL  = 'https://kwwiykssrpabncpqtmwi.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt3d2l5a3NzcnBhYm5jcHF0bXdpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzNjI1NTQsImV4cCI6MjA5NDkzODU1NH0.O1VhKdjPahnJJ9qXcQuSKQbnKGhsEZqYmjDEfRuRpkc';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

const TIPOS = {gastos:'Gastos', mercaderia:'Mercadería', inversiones:'Inversiones', no_actividad:'No actividad'};
// El estado de pago espeja el circuito de carpetas de DOCUMENTOS/CONTABILIZAR
const EPAGO = {
  sin_contabilizar:           {tx:'Sin contabilizar',            bg:'#fee2e2', col:'#991b1b'},
  contabilizado_sin_controlar:{tx:'Contabilizada s/ controlar',  bg:'#fef3c7', col:'#92400e'},
  controlado_sin_op:          {tx:'Controlada · sin OP',         bg:'#dbeafe', col:'#1e40af'},
  con_op_sin_pagar:           {tx:'Con OP · sin pagar',          bg:'#ede9fe', col:'#5b21b6'},
  pagada:                     {tx:'Pagada y archivada',          bg:'#dcfce7', col:'#166534'},
  sin_definir:                {tx:'—',                           bg:'#f1f5f9', col:'#94a3b8'},
};
const chipPago = e => { const p = EPAGO[e] || EPAGO.sin_definir;
  return `<span class="chip" style="background:${p.bg};color:${p.col}">${p.tx}</span>`; };
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
let session = {email:null}, DOCS = [], tabActual = 'bandeja';
let MOTOR = null;   // última corrida del motor del circuito
let filtro = {texto:'', tipo:'', mes:'', anio:String(new Date().getFullYear())};
let orden = {col:'fecha_emision', desc:true};

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plata = n => '$' + (Number(n)||0).toLocaleString('es-AR',{minimumFractionDigits:2, maximumFractionDigits:2});
const platac = n => '$' + (Number(n)||0).toLocaleString('es-AR',{maximumFractionDigits:0});
// (2-sep, pedido JP) importes con miles también en los campos de carga
const nmParse = v => {
  v = String(v ?? '').trim().replace(/\$|\s/g, '');
  if (!v || v === '-') return 0;
  if (!v.includes(',')) {
    const m = v.match(/^(-?\d+)\.(\d{1,2})$/);
    if (m) return Number(v) || 0;
  }
  return Number(v.replace(/\./g, '').replace(',', '.')) || 0;
};
const nmShow = n => { n = Number(n) || 0; return n === 0 ? '' :
  n.toLocaleString('es-AR', { maximumFractionDigits: 2 }); };
function wireImporte(el) {
  if (!el || el._wireImp) return;
  el._wireImp = true;
  el.addEventListener('focus', () => { const n = nmParse(el.value);
    el.value = n ? String(n).replace('.', ',') : ''; el.select?.(); });
  el.addEventListener('blur',  () => { el.value = nmShow(nmParse(el.value)); });
}
const fechaCorta = f => f ? f.slice(8,10)+'/'+f.slice(5,7)+'/'+f.slice(2,4) : '—';
// archivo_path es relativo a la raíz del OneDrive → URL de SharePoint
const pdfUrl = p => p
  ? 'https://claudiaadorno-my.sharepoint.com/personal/office_claudiaadorno_onmicrosoft_com/Documents/'
    + p.split('/').map(encodeURIComponent).join('/')
  : null;

// ── Login ───────────────────────────────────────────────────────────────
async function entrar(){
  const email = document.getElementById('lg-mail').value.trim().toLowerCase();
  const pass  = document.getElementById('lg-pass').value;
  const err   = document.getElementById('lg-err');
  err.textContent = 'Entrando…';
  const {data, error} = await sb.auth.signInWithPassword({email, password:pass});
  if (error){ err.textContent = 'Email o contraseña incorrectos.'; return; }
  session.email = data.user.email;
  arrancar();
}
async function salir(){ await sb.auth.signOut(); location.reload(); }

document.addEventListener('keydown', e => {
  const c = document.getElementById('caps');
  if (c && e.getModifierState) c.style.display = e.getModifierState('CapsLock') ? 'block' : 'none';
  if (e.key === 'Escape' && document.getElementById('ctrl-overlay')) cerrarControl();
});
document.addEventListener('keypress', e => { if (e.key === 'Enter' && document.getElementById('login').style.display !== 'none') entrar(); });

// ── Arranque ────────────────────────────────────────────────────────────
async function arrancar(){
  document.getElementById('login').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderTabs();
  await cargarTodo();
}

function renderTabs(){
  if (MODO_PRUEBA && !document.getElementById('banner-prueba')){
    const b = document.createElement('div');
    b.id = 'banner-prueba';
    b.style.cssText = 'background:#fef3c7;color:#92400e;font-weight:700;font-size:12.5px;text-align:center;padding:6px 10px;border-bottom:2px solid #d97706';
    b.textContent = '🧪 AMBIENTE DE PRUEBA — se muestran solo los comprobantes y remitos de test. El histórico real está guardado pero oculto.';
    document.body.prepend(b);
  }
  const tabs = [['bandeja','📥 Bandeja'],['facturas','📄 Facturas'],['mercaderia','🚚 Mercadería'],
                ['conceptos','📇 Conceptos'],['equivalencias','🔗 Equivalencias'],['listados','📊 Listados'],['config','⚙️ Retenciones']];
  document.getElementById('tabs').innerHTML = tabs.map(([k,t]) =>
    `<button class="${k===tabActual?'on':''}" onclick="irA('${k}')">${t}</button>`).join('');
}
function irA(t){ tabActual = t; renderTabs(); render(); }

async function cargarTodo(){
  document.getElementById('cont').innerHTML = '<div class="vacio">Cargando comprobantes…</div>';
  let todos = [], desde = 0;
  while (true){
    let q = sb.from('compras_documentos')
      .select('id,tipo,letra,punto_venta,numero,cuit_emisor,proveedor_nombre,fecha_emision,total,estado,estado_pago,tipo_gasto,archivo_path,archivo_alerta,confianza,origen,moneda,cotizacion,importe_moneda,cotizacion_fuente,es_prueba')
      .eq('es_prueba', MODO_PRUEBA)
      // (2-sep, regla JP) Facturas = SOLO lo contabilizado (aprobada). Lo que
      // espera control vive en la Bandeja y recién pasa acá al darle el OK.
      .eq('estado', 'aprobada')
      .order('fecha_emision', {ascending:false}).range(desde, desde+999);
    if (!MODO_PRUEBA) q = q.gte('fecha_emision', filtro.anio + '-01-01').lte('fecha_emision', filtro.anio + '-12-31');
    const {data, error} = await q;
    if (error){ document.getElementById('cont').innerHTML = `<div class="alerta">No se pudieron leer los comprobantes: ${esc(error.message)}</div>`; return; }
    todos = todos.concat(data);
    if (data.length < 1000) break;
    desde += 1000;
  }
  DOCS = todos;
  try { await cargarBandeja(); }
  catch(e){ console.warn('bandeja:', e.message); BANDEJA = []; }
  render();
}

// ── Filtro y orden comunes ──────────────────────────────────────────────
function filtrados(base){
  const t = filtro.texto.toLowerCase();
  let r = base.filter(d => {
    if (filtro.tipo && d.tipo_gasto !== filtro.tipo) return false;
    if (filtro.mes && (d.fecha_emision||'').slice(5,7) !== filtro.mes) return false;
    if (t){
      const bolsa = `${d.proveedor_nombre||''} ${d.numero} ${d.cuit_emisor||''} ${d.archivo_path||''}`.toLowerCase();
      if (!bolsa.includes(t)) return false;
    }
    return true;
  });
  r.sort((a,b) => {
    let x = a[orden.col], y = b[orden.col];
    if (orden.col === 'total'){ x = Number(x)||0; y = Number(y)||0; }
    else { x = String(x??'').toLowerCase(); y = String(y??'').toLowerCase(); }
    return (x<y?-1:x>y?1:0) * (orden.desc?-1:1);
  });
  return r;
}
function ordenar(col){ orden = {col, desc: orden.col===col ? !orden.desc : true}; render(); }
function setF(k,v){ filtro[k]=v; if(k==='anio') cargarTodo(); else render(); }

function barraFiltros(){
  const anios = [];
  for (let a = new Date().getFullYear(); a >= 2019; a--) anios.push(a);
  return `<div class="filtros">
    <input type="search" placeholder="Buscar proveedor, número, CUIT…" value="${esc(filtro.texto)}"
           oninput="setF('texto',this.value)">
    <select onchange="setF('anio',this.value)">${anios.map(a=>`<option ${a==filtro.anio?'selected':''}>${a}</option>`).join('')}</select>
    <select onchange="setF('mes',this.value)"><option value="">Todos los meses</option>
      ${MESES.map((m,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${filtro.mes==String(i+1).padStart(2,'0')?'selected':''}>${m}</option>`).join('')}</select>
    <select onchange="setF('tipo',this.value)"><option value="">Todos los tipos</option>
      ${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${filtro.tipo===k?'selected':''}>${v}</option>`).join('')}</select>
  </div>`;
}

// ── Render principal ────────────────────────────────────────────────────
function render(){
  const c = document.getElementById('cont');
  if (tabActual === 'bandeja')  c.innerHTML = vistaBandeja();
  if (tabActual === 'facturas') c.innerHTML = vistaFacturas();
  if (tabActual === 'listados') c.innerHTML = vistaListados();
  if (tabActual === 'config')   vistaConfig();
  if (tabActual === 'equivalencias') vistaEquivalencias();
  if (tabActual === 'mercaderia') vistaMercaderia();
  if (tabActual === 'conceptos') vistaConceptos();
}

// ═══════════════════════════════════════════════════════════════════════
//  📥 BANDEJA · el control humano de la contabilización
//
//  El motor no adivina: cuando el historial del proveedor es claro (mismo
//  concepto en las dos últimas facturas → 96 % de acierto medido sobre las
//  1.147 de 2026) la contabiliza solo; cuando no, la deja acá con el motivo
//  escrito para que quien controla pueda desconfiar con criterio.
//
//  Aprobar o corregir acá alimenta la próxima predicción: no hay tabla de
//  reglas que mantener a mano, el sistema aprende de lo que se contabiliza.
// ═══════════════════════════════════════════════════════════════════════
let BANDEJA = [], CONCEPTOS = [], enControl = null, lineasControl = [];

const CONF = {
  alta:  {ico:'🟢', tx:'Alta',  col:'#166534', bg:'#dcfce7'},
  media: {ico:'🟡', tx:'Media', col:'#92400e', bg:'#fef3c7'},
  baja:  {ico:'🔴', tx:'Baja',  col:'#991b1b', bg:'#fee2e2'},
};

async function cargarBandeja(){
  const [b, c, m] = await Promise.all([
    sb.rpc('compras_bandeja', {p_anio: null}),   // (30-ago) la bandeja no filtra por año: pendiente es pendiente
    CONCEPTOS.length ? Promise.resolve({data:null})
      : sb.from('compras_conceptos').select('codigo,descripcion,alicuota').eq('activo',true).limit(2000),
    sb.from('compras_eventos').select('at,detalle').eq('accion','motor_corrida')
      .order('at',{ascending:false}).limit(1),
  ]);
  if (b.error) throw b.error;
  BANDEJA = (b.data || []).filter(d => !!d.es_prueba === MODO_PRUEBA);
  if (c.data) CONCEPTOS = c.data;
  MOTOR = (m.data && m.data[0]) || null;
}

let MOTOR_PEDIDO = null;   // {id, estado} del pedido en curso (botón 🤖)

async function pedirMotor(){
  const btn = document.getElementById('btn-motor');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ Pidiendo…'; }
  const {data, error} = await sb.rpc('compras_pedir_motor');
  if (error){ alert('No pude pedir la lectura: ' + error.message); if (btn){ btn.disabled=false; btn.textContent='🤖 Leer SIN CONTABILIZAR'; } return; }
  MOTOR_PEDIDO = {id: data.id, estado: 'pendiente', desde: Date.now()};
  pintarEstadoMotor();
  seguirPedido();
}
function pintarEstadoMotor(){
  const el = document.getElementById('motor-estado'); if (!el) return;
  const p = MOTOR_PEDIDO;
  if (!p) { el.innerHTML = ''; return; }
  const seg = Math.round((Date.now() - p.desde)/1000);
  if (p.estado === 'pendiente') el.innerHTML = `⏳ Pedido #${p.id} en cola — la PC de JP lo toma en menos de 1 minuto (${seg}s)`;
  else if (p.estado === 'corriendo') el.innerHTML = `🔄 Leyendo la carpeta… (${seg}s)`;
  else if (p.estado === 'listo') el.innerHTML = `✅ Listo: ${p.resumen || 'lectura terminada'}`;
  else if (p.estado === 'error') el.innerHTML = `<span style="color:#dc2626">✗ El motor falló: ${esc(p.error || '')}</span>`;
}
async function seguirPedido(){
  if (!MOTOR_PEDIDO) return;
  const {data} = await sb.from('compras_motor_cola').select('estado,resultado').eq('id', MOTOR_PEDIDO.id).maybeSingle();
  if (data){
    MOTOR_PEDIDO.estado = data.estado;
    if (data.estado === 'listo'){
      const r = data.resultado || {};
      const leidas = (r.a_revisar||0)+(r.sin_regla||0)+(r.auto||0);
      MOTOR_PEDIDO.resumen = `${leidas} nueva(s) en la Bandeja · ${r.ignoradas||0} fuera de norma · ${r.errores||0} error(es)`;
      pintarEstadoMotor();
      await cargarTodo();      // refresca Bandeja + franja 🤖
      MOTOR_PEDIDO = null;
      return;
    }
    if (data.estado === 'error'){ MOTOR_PEDIDO.error = (data.resultado||{}).error; pintarEstadoMotor(); return; }
  }
  pintarEstadoMotor();
  if (Date.now() - MOTOR_PEDIDO.desde > 5*60*1000){
    MOTOR_PEDIDO.estado = 'error'; MOTOR_PEDIDO.error = 'pasaron 5 minutos y la PC no respondió — ¿está prendida y con la tarea CRM_Adorno_MotorCompras activa?';
    pintarEstadoMotor(); return;
  }
  setTimeout(seguirPedido, 4000);
}

async function abrirControl(id){
  enControl = BANDEJA.find(d => d.id === id);
  if (!enControl) return;
  const neto = Number(enControl.neto_gravado||0) + Number(enControl.neto_no_gravado||0) + Number(enControl.exento||0);
  lineasControl = [{concepto: enControl.sug_concepto || '', monto: Math.round((neto || Number(enControl.total)) * 100)/100}];
  pintarControl();
  const {data} = await sb.rpc('compras_conceptos_proveedor', {p_cuit: enControl.cuit_emisor});
  enControl._usados = data || [];
  pintarControl();
}
function cerrarControl(){
  const o = document.getElementById('ctrl-overlay');

  document.body.style.overflow = '';
  enControl = null;
}

function pintarNums(){
  const d = enControl; if (!d) return;
  const neto = Number(d.neto_gravado||0) + Number(d.neto_no_gravado||0) + Number(d.exento||0);
  const asignado = lineasControl.reduce((a,l) => a + (Number(l.monto)||0), 0);
  const dif = Math.round((neto - asignado) * 100) / 100;
  const el = document.getElementById('ctrl-dif');
  if (el) el.innerHTML = Math.abs(dif) < 0.02
    ? `<span style="color:var(--ok)">✓ Los conceptos suman el neto de la factura.</span>`
    : `<span style="color:var(--warn)">⚠ Faltan ${plata(dif)} por asignar (neto ${plata(neto)}).</span>`;
}
function usarConcepto(cod){ lineasControl[0].concepto = cod; pintarControl(); }
function toggleNuevoConcepto(){
  const f = document.getElementById('nc-form');
  if (f) f.style.display = f.style.display === 'none' ? 'block' : 'none';
}
async function crearConcepto(){
  const cod  = (document.getElementById('nc-codigo').value || '').trim().toUpperCase();
  const desc = (document.getElementById('nc-desc').value || '').trim();
  const alic = document.getElementById('nc-alic').value;
  if (!cod || !desc){ alert('Completá código y descripción.'); return; }
  const {data, error} = await sb.rpc('compras_crear_concepto',
    {p_codigo: cod, p_descripcion: desc, p_alicuota: alic});
  if (error){ alert('No se pudo crear: ' + error.message); return; }
  CONCEPTOS.push({codigo: cod, descripcion: desc, alicuota: alic});
  // lo pone directo en la primera línea vacía (o en la primera)
  const libre = lineasControl.find(l => !(l.concepto||'').trim()) || lineasControl[0];
  libre.concepto = cod;
  pintarControl();
}
function cambioCotiz(v){
  const c = Number(v);
  if (!enControl || !c || c <= 0) return;
  const nuevoTotal = Math.round(Number(enControl.importe_moneda) * c * 100) / 100;
  enControl._cotizNueva = c;
  enControl.cotizacion = c;
  enControl.total = nuevoTotal;
  enControl.neto_no_gravado = nuevoTotal;
  if (lineasControl.length === 1) lineasControl[0].monto = nuevoTotal;
  pintarControl();
}
function agregarLinea(){ lineasControl.push({concepto:'', monto:0}); pintarControl(); }
function quitarLinea(i){ lineasControl.splice(i,1); pintarControl(); }

async function contabilizar(){
  const lineas = lineasControl
    .filter(l => (l.concepto||'').trim())
    .map(l => ({concepto: l.concepto.trim(), monto_neto: Number(l.monto)||0}));
  if (!lineas.length){ alert('Elegí al menos un concepto contable.'); return; }
  const {error} = await sb.rpc('compras_contabilizar', {
    p_doc_id: enControl.id,
    p_lineas: lineas,
    p_tipo_gasto: document.getElementById('ctrl-tipo').value || null,
    p_computa_formal:  document.getElementById('ctrl-formal').checked,
    p_computa_gestion: document.getElementById('ctrl-gestion').checked,
    p_cotizacion: enControl._cotizNueva || null,
  });
  if (error){ alert('No se pudo contabilizar: ' + error.message); return; }
  cerrarControl();
  await cargarTodo();
}

async function rechazarDoc(){
  const motivo = prompt('¿Por qué queda afuera? (duplicada, archivo mal armado, no corresponde…)');
  if (motivo === null) return;
  const {error} = await sb.rpc('compras_rechazar', {p_doc_id: enControl.id, p_motivo: motivo});
  if (error){ alert('No se pudo rechazar: ' + error.message); return; }
  cerrarControl();
  await cargarTodo();
}

    </tr>`).join('')}</tbody></table></div>
    ${lista.length > 400 ? `<p class="mini" style="margin-top:9px">Mostrando los primeros 400 de ${lista.length}. Afiná la búsqueda para ver el resto.</p>` : ''}`;
}

// ── 📊 LISTADOS: la ex planilla de gestión ──────────────────────────────
function vistaListados(){
  const f = filtrados(DOCS);
  const porTipo = {}, porMes = {}, porProv = {};
  f.forEach(d => {
    const t = d.tipo_gasto || 'sin_clasificar', m = (d.fecha_emision||'').slice(5,7);
    const p = d.proveedor_nombre || d.cuit_emisor || '—', v = Number(d.total)||0;
    porTipo[t] = (porTipo[t]||0) + v;
    porMes[m]  = porMes[m]  || {};
    porMes[m][t] = (porMes[m][t]||0) + v;
    porProv[p] = (porProv[p]||0) + v;
  });
  const total = Object.values(porTipo).reduce((a,b)=>a+b, 0) || 1;
  const tipos = Object.keys(TIPOS).filter(t => porTipo[t]);
  const top = Object.entries(porProv).sort((a,b)=>b[1]-a[1]).slice(0,25);

  return `<div class="card">${barraFiltros()}</div>
  <div class="card">
    <h3 style="font-size:15px;margin-bottom:11px">Por tipo de gasto · ${filtro.anio}</h3>
    <table><tbody>${tipos.map(t => `<tr>
        <td><span class="chip c-${t}">${TIPOS[t]}</span></td>
        <td class="num"><b>${platac(porTipo[t])}</b></td>
        <td class="num mini">${(porTipo[t]/total*100).toFixed(1)}%</td>
        <td style="width:45%"><div style="background:#f1f5f9;border-radius:6px;height:12px">
          <div style="background:var(--primary);height:12px;border-radius:6px;width:${(porTipo[t]/total*100).toFixed(1)}%"></div></div></td>
      </tr>`).join('')}
      <tr><td><b>Total</b></td><td class="num"><b>${platac(total)}</b></td><td colspan="2"></td></tr>
    </tbody></table>
  </div>
  <div class="card">
    <h3 style="font-size:15px;margin-bottom:11px">Mes a mes</h3>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Mes</th>${tipos.map(t=>`<th class="num">${TIPOS[t]}</th>`).join('')}<th class="num">Total</th></tr></thead>
      <tbody>${Object.keys(porMes).sort().map(m => {
        const fila = porMes[m], tot = Object.values(fila).reduce((a,b)=>a+b,0);
        return `<tr><td>${MESES[+m-1]||m}</td>
          ${tipos.map(t=>`<td class="num">${fila[t]?platac(fila[t]):'—'}</td>`).join('')}
          <td class="num"><b>${platac(tot)}</b></td></tr>`;
      }).join('')}</tbody></table></div>
  </div>
  <div class="card">
    <h3 style="font-size:15px;margin-bottom:11px">Top proveedores</h3>
    <table><tbody>${top.map(([p,v],i) => `<tr>
      <td class="mini">${i+1}</td><td>${esc(p)}</td><td class="num"><b>${platac(v)}</b></td>
      <td class="num mini">${(v/total*100).toFixed(1)}%</td></tr>`).join('')}</tbody></table>
  </div>`;
}

// ── ⚙️ RETENCIONES Y PERCEPCIONES: los parámetros los pone JP ──────────
// El módulo propone con estos valores; en cada orden de pago se pueden pisar.
// A propósito NO vienen precargados: una alícuota vieja calcula mal y el
// problema es fiscal, así que preferimos que avise "sin configurar".
let REGIMENES = [];

async function vistaConfig(){

  REGIMENES = data || [];

  c.innerHTML = `
    ${faltan ? `<div class="alerta">⚠ Hay ${faltan} régimen(es) sin alícuota cargada. Hasta que los completes,
      el módulo no calcula esas retenciones solo — te las va a dejar en cero para que las pongas a mano.</div>` : ''}
    <div class="card">
      <h3 style="font-size:16px;margin-bottom:4px">Regímenes de retención y percepción</h3>
      <p class="mini" style="margin-bottom:12px">
        Estos son los regímenes que usan hoy, sacados del histórico del Dragonfish. Cargá la alícuota y el mínimo
        que te pase el estudio. <b>El mínimo no imponible se computa sobre el acumulado del mes por proveedor</b>

        </tr></thead>
        <tbody>${REGIMENES.map(r => `<tr>
          <td><b>${esc(r.codigo)}</b><br><span class="mini">${esc(r.jurisdiccion||'')}</span></td>
          <td style="max-width:280px">${esc(r.nombre)}
              ${r.notas ? `<br><span class="mini">${esc(r.notas)}</span>` : ''}</td>
          <td class="num"><input type="number" step="0.0001" style="width:88px;text-align:right"
                 id="al-${r.id}" value="${r.alicuota ?? ''}" placeholder="—"></td>
          <td class="num"><input type="number" step="0.01" style="width:120px;text-align:right"

          <td class="num"><input type="number" step="0.01" style="width:100px;text-align:right"

              </select></td>
          <td style="text-align:center"><input type="checkbox" id="ac-${r.id}" ${r.acumula_mensual?'checked':''}></td>
          <td class="num"><button class="act" onclick="guardarRegimen(${r.id})">Guardar</button></td>
        </tr>`).join('')}</tbody>
      </table></div>
    </div>
    <div class="card">
      <h3 style="font-size:16px;margin-bottom:4px">Cómo se aplica</h3>
      <ul style="font-size:13.5px;line-height:1.8;margin-left:18px;color:#334155">
        <li>Al emitir una orden de pago, el módulo mira qué regímenes le corresponden al proveedor y calcula cada retención.</li>
        <li>Te muestra el detalle —base, alícuota, importe— <b>antes</b> de emitir, y podés pisar cualquier número a mano.</li>
        <li>Si lo pisás, queda guardado lo que propuso el sistema y lo que pusiste vos, con el motivo. Nada se pierde.</li>
        <li>Los proveedores con certificado de no retención se marcan exentos, con fecha de vencimiento del certificado.</li>
        <li><b>IIBB provincia</b>: la alícuota sale del padrón de ARBA y cambia por proveedor y por mes,
            así que se carga por proveedor y pisa la del régimen.</li>
      </ul>
    </div>`;
}

async function guardarRegimen(id){
  const val = x => { const v = document.getElementById(x + '-' + id).value; return v === '' ? null : Number(v); };
  const {error} = await sb.from('compras_regimenes').update({
    alicuota:            val('al'),
    minimo_no_imponible: val('mn'),
    minimo_retencion:    val('mr'),
    base:            document.getElementById('ba-' + id).value,
    acumula_mensual: document.getElementById('ac-' + id).checked,
    actualizado_at:  new Date().toISOString(),
    actualizado_por: session.email,
  }).eq('id', id);
  if (error){ alert('No se pudo guardar: ' + error.message); return; }
  vistaConfig();
}

// ═══════════════════════════════════════════════════════════════════════
//  🔗 EQUIVALENCIAS · cómo le dice el proveedor / cómo le decimos nosotros
//
//  Cada renglón de una factura de mercadería trae el código y la descripción
//  DEL PROVEEDOR. Acá se traduce a nuestro SKU, una sola vez por código:
//  "P2822804011CU38" va a ser siempre la misma bata, así que resuelto una
//  vez queda resuelto para siempre.
//
//  Con FGR —el 90 % de la mercadería— no hace falta nada: comparten catálogo
//  con nosotros, así que el código de su factura YA ES nuestro SKU.
//
//  🚨 Un código de ellos puede convertirse en VARIOS nuestros: FGR vende
//  sets que después se fraccionan. Por eso se puede partir en varias filas,
//  cada una con su parte del costo, y las partes tienen que sumar 100 %.
// ═══════════════════════════════════════════════════════════════════════
let PENDIENTES = [], enMapeo = null, partesMapeo = [], candidatos = [];

async function vistaEquivalencias(){
  const c = document.getElementById('cont');
  c.innerHTML = '<div class="vacio">Buscando artículos sin traducir…</div>';

  const [pend, hechas] = await Promise.all([
    sb.from('compras_renglones')
      .select('codigo_proveedor,descripcion,cantidad,importe,documento_id,compras_documentos(cuit_emisor,proveedor_nombre)')
      .is('sku', null).limit(500),
    sb.from('compras_equivalencias')
      .select('cuit_proveedor,codigo_proveedor,descripcion_proveedor,sku,proporcion_costo,veces_usada')
      .order('creada_at', {ascending:false}).limit(300),
  ]);
  if (pend.error){ c.innerHTML = `<div class="alerta">${esc(pend.error.message)}</div>`; return; }

  // un renglón por código distinto: el trabajo es por código, no por factura
  const porCodigo = {};
  (pend.data || []).forEach(r => {
    const d = r.compras_documentos || {};
    const k = (d.cuit_emisor || '') + '|' + (r.codigo_proveedor || r.descripcion || '');
    if (!porCodigo[k]) porCodigo[k] = {...r, cuit: d.cuit_emisor, prov: d.proveedor_nombre, veces: 0};
    porCodigo[k].veces++;
  });
  PENDIENTES = Object.values(porCodigo).sort((a,b) => b.veces - a.veces);
  const HECHAS = hechas.data || [];

  c.innerHTML = `<div class="kpis">
      <div class="kpi" style="border-left-color:var(--warn)"><div class="lbl">Códigos sin traducir</div>
        <div class="val">${PENDIENTES.length}</div><div class="sub">se resuelven una sola vez</div></div>
      <div class="kpi" style="border-left-color:var(--ok)"><div class="lbl">Equivalencias cargadas</div>
        <div class="val">${HECHAS.length}</div><div class="sub">ya funcionan solas</div></div>
    </div>

    <div class="card">
      <h3 style="font-size:15px;margin-bottom:4px">Artículos que el proveedor nombra distinto</h3>
      <p class="mini" style="margin-bottom:11px">
        Familia García Regueira comparte catálogo con nosotros, así que sus facturas no aparecen acá:
        el código de ellos ya es nuestro SKU. Los que sí aparecen son los del resto de los proveedores.
        Cada código se resuelve <b>una sola vez</b> y de ahí en más el sistema lo traduce solo.
      </p>
      ${!PENDIENTES.length
        ? '<div class="vacio">✅ No hay artículos esperando traducción.</div>'
        : `<div style="overflow-x:auto"><table>
            <thead><tr><th>Proveedor</th><th>Su código</th><th>Cómo lo llama él</th>
              <th class="num">Veces</th><th></th></tr></thead>
            <tbody>${PENDIENTES.slice(0,200).map((p,i) => `<tr>
              <td>${esc(p.prov || p.cuit || '—')}</td>
              <td><code>${esc(p.codigo_proveedor || '—')}</code></td>
              <td>${esc(p.descripcion || '')}</td>
              <td class="num">${p.veces}</td>
              <td class="num"><button class="act" onclick="abrirMapeo(${i})">Traducir</button></td>
            </tr>`).join('')}</tbody></table></div>`}
    </div>

    ${HECHAS.length ? `<div class="card">
      <h3 style="font-size:15px;margin-bottom:11px">Equivalencias ya cargadas</h3>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>Su código</th><th>Cómo lo llama él</th><th>Nuestro SKU</th>
          <th class="num">Parte del costo</th></tr></thead>
        <tbody>${HECHAS.map(h => `<tr>
          <td><code>${esc(h.codigo_proveedor || '—')}</code></td>
          <td>${esc(h.descripcion_proveedor || '')}</td>
          <td><b>${esc(h.sku)}</b></td>
          <td class="num">${Math.round((h.proporcion_costo || 1) * 100)} %</td>
        </tr>`).join('')}</tbody></table></div>
    </div>` : ''}`;
}

async function abrirMapeo(i){
  enMapeo = PENDIENTES[i];
  partesMapeo = [];
  candidatos = [];
  pintarMapeo(true);
  const {data, error} = await sb.rpc('compras_resolver_articulo', {
    p_cuit: enMapeo.cuit, p_codigo: enMapeo.codigo_proveedor,
    p_descripcion: enMapeo.descripcion, p_limite: 8,
  });
  candidatos = error ? [] : (data || []);
  if (candidatos.length) partesMapeo = [{sku: candidatos[0].sku, cantidad: 1, proporcion: 1}];
  pintarMapeo();
}

function cerrarMapeo(){
  const o = document.getElementById('map-overlay');
  if (o) o.remove();
  document.body.style.overflow = '';
  enMapeo = null;
}

function pintarMapeo(cargando){
  const m = enMapeo; if (!m) return;
  const suma = partesMapeo.reduce((a,p) => a + (Number(p.proporcion)||0), 0);
  const okSuma = Math.abs(suma - 1) < 0.01;

  const html = `<div class="c-box">
    <div class="c-head">
      <div style="flex:1">
        <div style="font-weight:700;font-size:16px">${esc(m.descripcion || '')}</div>
        <div style="font-size:12.5px;opacity:.9">${esc(m.prov || m.cuit)} ·
          código <code>${esc(m.codigo_proveedor || '—')}</code> ·
          aparece en ${m.veces} factura${m.veces === 1 ? '' : 's'}</div>
      </div>
      <button class="m-x" onclick="cerrarMapeo()">✕</button>
    </div>
    <div class="c-body">
      ${cargando ? '<div class="vacio">Buscando parecidos en el catálogo…</div>' : `
      ${!candidatos.length
        ? `<div class="alerta">No encontré ningún artículo parecido. Puede que todavía no esté
             dado de alta en el Dragonfish — en ese caso hay que crearlo primero.</div>`
        : `<div class="mini" style="margin-bottom:7px">Artículos parecidos del catálogo
             ${candidatos[0].origen === 'candidato_proveedor' ? 'de este proveedor' : ''}:</div>
           ${candidatos.map(c => {
             const bueno = Number(c.parecido) >= 0.75;
             return `<button class="act gh" style="display:block;width:100%;text-align:left;margin-bottom:6px;
                       border-color:${bueno ? 'var(--ok)' : 'var(--bd)'}"
                     onclick="elegirSku('${esc(c.sku)}')">
               <b>${esc(c.sku)}</b> · ${esc(c.descripcion || '')}
               <span class="mini" style="float:right;color:${bueno ? 'var(--ok)' : 'var(--mut)'}">
                 ${bueno ? '✓ ' : ''}parecido ${c.parecido}</span></button>`;
           }).join('')}
           <p class="mini" style="margin:4px 0 12px">
             🚨 El parecido es de texto, no entiende de colores ni de talles. Los que dan menos de 0,75
             conviene mirarlos dos veces: en las pruebas, ahí es donde confunde variantes.</p>`}

      <h4 style="font-size:14px;margin:14px 0 7px">Se traduce a</h4>
      ${partesMapeo.map((p,i) => `<div class="c-linea">
        <input list="dl-skus" value="${esc(p.sku)}" placeholder="SKU nuestro" style="flex:1;min-width:140px"
               oninput="partesMapeo[${i}].sku=this.value.split(' ')[0].trim()">
        <input type="number" step="0.01" min="0" max="1" value="${p.proporcion}" style="width:110px;text-align:right"
               title="Qué parte del costo va a este artículo"
               oninput="partesMapeo[${i}].proporcion=Number(this.value); pintarSumaMapeo()">
        ${partesMapeo.length > 1
          ? `<button class="act gh" onclick="partesMapeo.splice(${i},1); pintarMapeo()">✕</button>` : ''}
      </div>`).join('')}
      <button class="act gh" style="font-size:12.5px;padding:5px 10px"
              onclick="partesMapeo.push({sku:'',cantidad:1,proporcion:0}); pintarMapeo()">
        + Se fracciona en otro artículo</button>
      <div id="map-suma" class="mini" style="margin-top:7px">${
        okSuma ? '<span style="color:var(--ok)">✓ Las partes del costo suman 100 %.</span>'
               : `<span style="color:var(--warn)">⚠ Las partes suman ${Math.round(suma*100)} %, tienen que dar 100 %.</span>`}</div>
      <p class="mini" style="margin-top:9px">
        Si ellos venden un set que ustedes fraccionan, agregá una fila por cada artículo nuestro
        y repartí el costo. Por ejemplo 0,6 y 0,4 si uno vale más que el otro.</p>
      `}
    </div>
    <div class="c-pie">
      <div style="flex:1"></div>
      <button class="act gh" onclick="cerrarMapeo()">Cancelar</button>
      <button class="act" onclick="guardarMapeo()">✓ Guardar equivalencia</button>
    </div>
    <datalist id="dl-skus"></datalist>
  </div>`;

  let ov = document.getElementById('map-overlay');
  if (!ov){
    ov = document.createElement('div');
    ov.id = 'map-overlay'; ov.className = 'ctrl-like';
    ov.addEventListener('click', e => { if (e.target === ov) cerrarMapeo(); });
    document.body.appendChild(ov);
    document.body.style.overflow = 'hidden';
  }
  ov.innerHTML = html;
}

function pintarSumaMapeo(){
  const suma = partesMapeo.reduce((a,p) => a + (Number(p.proporcion)||0), 0);
  const el = document.getElementById('map-suma');
  if (el) el.innerHTML = Math.abs(suma - 1) < 0.01
    ? '<span style="color:var(--ok)">✓ Las partes del costo suman 100 %.</span>'
    : `<span style="color:var(--warn)">⚠ Las partes suman ${Math.round(suma*100)} %, tienen que dar 100 %.</span>`;
}
function elegirSku(sku){
  if (partesMapeo.length === 1) partesMapeo[0].sku = sku;
  else partesMapeo.push({sku, cantidad:1, proporcion:0});
  pintarMapeo();
}

async function guardarMapeo(){
  const partes = partesMapeo.filter(p => (p.sku||'').trim())
    .map(p => ({sku: p.sku.trim(), cantidad: Number(p.cantidad)||1, proporcion: Number(p.proporcion)||0}));
  if (!partes.length){ alert('Elegí al menos un artículo nuestro.'); return; }
  const {error} = await sb.rpc('compras_guardar_equivalencia', {
    p_cuit: enMapeo.cuit, p_codigo: enMapeo.codigo_proveedor,
    p_descripcion: enMapeo.descripcion, p_partes: partes,
  });
  if (error){ alert('No se pudo guardar: ' + error.message); return; }
  cerrarMapeo();
  vistaEquivalencias();
}

// ═══════════════════════════════════════════════════════════════════════
//  🚚 MERCADERÍA · control de precios y descuentos, factura por factura
//
//  El número de la factura de FGR ES el número del remito que ya está
//  cargado en el sistema (entra cuando administración importa el TXT).
//  Entonces el control no lee nada del PDF: agarra los artículos y
//  cantidades del remito, les pone el precio de la lista COSTO vigente a la
//  fecha de la factura (que ya trae el descuento pactado POR ARTÍCULO), y
//  compara la suma contra el neto facturado. Aritmética contra datos
//  cargados — acá no hay lectura que pueda salir mal.
// ═══════════════════════════════════════════════════════════════════════
let MERC = [], REM_SIN = [];
// 🧪 AMBIENTE DE PRUEBA (31-ago): true = la PWA muestra SOLO comprobantes y
// remitos de test (es_prueba). El histórico real queda intacto pero invisible.
// Cuando el flujo esté perfecto: pasar a false (un solo cambio) y redeployar.
const MODO_PRUEBA = true;
const MERC_EST = {
  coincide:   {ico:'✅', tx:'Coincide con lista',  col:'#166534', bg:'#dcfce7'},
  mas_caro:   {ico:'🔺', tx:'Facturado de MÁS',    col:'#991b1b', bg:'#fee2e2'},
  mas_barato: {ico:'🔻', tx:'Facturado de menos',  col:'#1e40af', bg:'#dbeafe'},
  sin_remito: {ico:'❔', tx:'Sin remito',           col:'#475569', bg:'#f1f5f9'},
  sin_lista:  {ico:'⚠️', tx:'Falta lista',          col:'#92400e', bg:'#fef3c7'},
};

async function vistaMercaderia(){
  const c = document.getElementById('cont');
  c.innerHTML = '<div class="vacio">Cruzando facturas contra remitos y listas…</div>';
  const [{data, error}, rs] = await Promise.all([
    sb.rpc('compras_mercaderia_resumen', {p_anio: Number(filtro.anio), p_prueba: MODO_PRUEBA}),
    sb.rpc('compras_remitos_estado', {p_doc_id: null, p_prueba: MODO_PRUEBA}),
  ]);
  if (error){ c.innerHTML = `<div class="alerta">${esc(error.message)}</div>`; return; }
  MERC = data || [];
  REM_SIN = rs.data || [];

  const n = k => MERC.filter(m => m.estado === k);
  const deMas = n('mas_caro').reduce((a,m) => a + Number(m.dif||0), 0);

  c.innerHTML = `<div class="kpis">
      <div class="kpi" style="border-left-color:var(--ok)"><div class="lbl">Coinciden al peso</div>
        <div class="val">${n('coincide').length}</div><div class="sub">de ${MERC.length} facturas ${filtro.anio}</div></div>

async function asociarRemito(cuit, pv, num){
  const q = prompt(`¿Con qué factura va el remito ${pv}-${num}?\nEscribí el número de la factura (solo el número).`);
  if (!q) return;
  const nro = Number(String(q).replace(/\D/g,''));
  if (!nro){ alert('Número inválido.'); return; }
  const {data: docs} = await sb.from('compras_documentos')
    .select('id,tipo,letra,punto_venta,numero,cuit_emisor,proveedor_nombre,fecha_emision,total')
    .eq('numero', nro).eq('es_prueba', MODO_PRUEBA).limit(5);
  if (!docs || !docs.length){ alert('No encontré ninguna factura con ese número.'); return; }
  docs.sort((a,b) => (b.cuit_emisor==='30710971338') - (a.cuit_emisor==='30710971338'));  // FGR primero
  const d = docs[0];
  const ok = confirm(`¿Asociar al ${d.tipo} ${d.letra} ${String(d.punto_venta).padStart(4,'0')}-${String(d.numero).padStart(8,'0')} de ${d.proveedor_nombre||d.cuit_emisor} (${fechaCorta(d.fecha_emision)} · ${plata(d.total)})?`);
  if (!ok) return;
  const {error} = await sb.rpc('compras_asociar_remito', {p_cuit: cuit, p_punto_venta: pv, p_numero: num, p_doc_id: d.id});
  if (error){ alert('No se pudo asociar: ' + error.message); return; }
  vistaMercaderia();
}

async function guardarRemito(){
  const provTxt = document.getElementById('rem-prov').value;
  const cuit = (provTxt.split('·').pop()||'').replace(/\D/g,'');
  if (cuit.length !== 11){ alert('Elegí el proveedor de la lista (con su CUIT).'); return; }
  const pv = Number(document.getElementById('rem-pv').value);
  const num = Number(document.getElementById('rem-num').value);
  const fecha = document.getElementById('rem-fecha').value;
  const dest = document.getElementById('rem-dest').value;
  if (!pv || !num || !fecha){ alert('Completá punto de venta, número y fecha.'); return; }
  const lineas = remitoLineas.filter(l => l.sku && Number(l.cantidad) > 0)
    .map(l => ({sku: l.sku, cantidad: Number(l.cantidad)}));
  if (!lineas.length){ alert('Cargá al menos un renglón con SKU y cantidad.'); return; }
  const {error} = await sb.rpc('compras_cargar_remito', {
    p_cuit: cuit, p_punto_venta: pv, p_numero: num,
    p_fecha: fecha, p_destino: dest, p_lineas: lineas, p_prueba: MODO_PRUEBA});
  if (error){ alert('No se pudo guardar: ' + error.message); return; }
  // TXT para el importador del Dragonfish: "SUC;PV-NUMERO" + "CANT+SKU"
  const suc = SUCS.find(x => x.clave === dest);
  const codigoSuc = (suc && suc.codigo_txt) || dest.toUpperCase();
  const txt = `${codigoSuc};${String(pv).padStart(3,'0')}-${String(num).padStart(4,'0')}\r\n`
            + lineas.map(l => `${l.cantidad}+${l.sku}`).join('\r\n') + '\r\n';
  const blob = new Blob([txt], {type:'text/plain'});
  const aEl = document.createElement('a');
  aEl.href = URL.createObjectURL(blob);
  aEl.download = `REMITO ${codigoSuc} ${pv}-${num}.txt`;
  aEl.click();
  URL.revokeObjectURL(aEl.href);
  alert('Remito guardado ✅ y TXT descargado.\n\nImportalo en el Dragonfish para que entre el stock (una sola vez). La factura, cuando llegue, se asocia sola o con el botón 🔗.');
  cerrarCargaRemito();
  vistaMercaderia();
}

    </div>
    <div class="card">
      <h3 style="font-size:15px;margin-bottom:4px">Catálogo de conceptos contables</h3>
      <p class="mini" style="margin-bottom:11px">Cada concepto es un SKU + su descripción, igual que los artículos
        del Dragonfish. 🚨 Mientras el Dragonfish siga en uso, todo concepto creado acá hay que darlo de alta
        también allá como artículo — sino la exportación lo rechaza.</p>
      <div class="filtros">
        <input type="search" placeholder="Buscar por SKU o descripción…" value="${esc(concBusca)}"
               oninput="concBusca=this.value; pintarConceptos()">
        <button class="act" onclick="toggleAltaConcepto()">➕ Nuevo concepto</button>
      </div>
      <div id="alta-conc" style="display:none;background:#fff7ed;border:1px solid var(--primary);border-radius:9px;padding:11px;margin-bottom:11px;">
        <div style="display:flex;gap:7px;flex-wrap:wrap;">
          <input id="ac-sku" placeholder="SKU (ej: SEGVIG)" maxlength="20" style="width:150px;text-transform:uppercase">
          <input id="ac-desc" placeholder="Descripción para los listados" style="flex:1;min-width:180px">
          <select id="ac-alic"><option value="21" selected>IVA 21%</option><option value="10.5">IVA 10,5%</option>
            <option value="27">IVA 27%</option><option value="0">No gravado / exento</option></select>
          <button class="act" style="font-size:12.5px;padding:6px 11px" onclick="altaConcepto()">Crear</button>
        </div>
        <div class="mini" style="margin-top:6px">Recordá darlo de alta también en el Dragonfish.</div>
      </div>
      <div style="overflow-x:auto"><table>
        <thead><tr><th>SKU</th><th>Descripción</th><th>Alíc.</th><th class="num">Usos</th>
          <th style="text-align:center">Activo</th><th></th></tr></thead>
        <tbody>${lista.slice(0,150).map(x => `<tr class="${x.activo ? '' : 'dim'}" style="${x.activo?'':'opacity:.5'}">
          <td><b>${esc(x.codigo)}</b>${x.origen==='manual' ? ' <span class="chip" style="background:#dbeafe;color:#1e40af">manual</span>' : ''}</td>
          <td><input value="${esc(x.descripcion||'')}" id="cd-${esc(x.codigo)}" style="width:100%;min-width:200px;font-size:13px;padding:6px 8px"></td>
          <td><select id="ca-${esc(x.codigo)}" style="font-size:13px;padding:6px">
            ${['21','10.5','27','0'].map(al=>`<option value="${al}" ${x.alicuota===al?'selected':''}>${al==='0'?'No grav.':al+'%'}</option>`).join('')}
          </select></td>
          <td class="num">${x.usos_historicos||0}</td>
          <td style="text-align:center"><input type="checkbox" id="cx-${esc(x.codigo)}" ${x.activo?'checked':''}></td>
          <td class="num"><button class="act gh" style="font-size:12px;padding:5px 10px"
              onclick="guardarConcepto('${esc(x.codigo)}')">Guardar</button></td>
        </tr>`).join('')}</tbody></table></div>
      ${lista.length>150 ? `<p class="mini" style="margin-top:8px">Mostrando 150 de ${lista.length} — afiná la búsqueda.</p>` : ''}
    </div>`;
}

function toggleAltaConcepto(){
  const f = document.getElementById('alta-conc');
  if (f) f.style.display = f.style.display === 'none' ? 'block' : 'none';
}
async function altaConcepto(){
  const cod = (document.getElementById('ac-sku').value||'').trim().toUpperCase();
  const desc = (document.getElementById('ac-desc').value||'').trim();
  if (!cod || !desc){ alert('Completá SKU y descripción.'); return; }
  const {error} = await sb.rpc('compras_crear_concepto',
    {p_codigo: cod, p_descripcion: desc, p_alicuota: document.getElementById('ac-alic').value});
  if (error){ alert('No se pudo crear: ' + error.message); return; }
  vistaConceptos();
}
async function guardarConcepto(cod){
  const {error} = await sb.from('compras_conceptos').update({
    descripcion: document.getElementById('cd-'+cod).value.trim(),
    alicuota:    document.getElementById('ca-'+cod).value,
    activo:      document.getElementById('cx-'+cod).checked,
  }).eq('codigo', cod);
  if (error){ alert('No se pudo guardar: ' + error.message); return; }
  const x = CONC_LISTA.find(y=>y.codigo===cod);
  if (x){ x.descripcion=document.getElementById('cd-'+cod).value.trim();
          x.alicuota=document.getElementById('ca-'+cod).value;
          x.activo=document.getElementById('cx-'+cod).checked; }
  pintarConceptos();
}

// ═══════════════════════════════════════════════════════════════════════
//  📄 Resumen de una factura contabilizada (click en la fila de Facturas)
//  Muestra CÓMO se contabilizó, y el ✏️ abre el mismo modal de control
//  para re-contabilizarla (queda marcada "corregida" y asentada en eventos).
// ═══════════════════════════════════════════════════════════════════════
async function abrirResumenDoc(docId){
  const d = DOCS.find(x => x.id === docId);
  if (!d) return;
  let ov = document.getElementById('res-overlay');
  if (!ov){
    ov = document.createElement('div');
    ov.id = 'res-overlay';
    ov.style.cssText = 'position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:9998;display:flex;align-items:flex-start;justify-content:center;padding:18px 12px;overflow-y:auto;';
    ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
  }
  ov.innerHTML = `<div class="c-box"><div class="c-body"><div class="vacio">Cargando…</div></div></div>`;
  const [full, lin] = await Promise.all([
    sb.from('compras_documentos').select('*').eq('id', docId).single(),
    sb.from('compras_lineas').select('*').eq('documento_id', docId).order('nroitem'),
  ]);
  const doc = full.data || d, lineas = lin.data || [];
  const neto = Number(doc.neto_gravado||0)+Number(doc.neto_no_gravado||0)+Number(doc.exento||0);
  const iva = Number(doc.iva_21||0)+Number(doc.iva_105||0)+Number(doc.iva_27||0)+Number(doc.iva_otros||0);
  const cMap = Object.fromEntries(CONCEPTOS.map(c=>[c.codigo, c.descripcion]));
  // Desglose fiscal completo: solo los renglones con importe. Las RETENCIONES
  // no aparecen acá a propósito: se practican al PAGAR y van con la orden de
  // pago (punto 4), no con la factura.
  const fiscal = [
    ['Neto gravado', doc.neto_gravado], ['Neto no gravado', doc.neto_no_gravado],
    ['Exento', doc.exento],
    ['IVA 21%', doc.iva_21], ['IVA 10,5%', doc.iva_105], ['IVA 27%', doc.iva_27],
    ['IVA otros', doc.iva_otros],
    ['Percepción IVA', doc.percep_iva],
    ['Perc. IIBB Buenos Aires', doc.percep_iibb_ba],
    ['Perc. IIBB CABA', doc.percep_iibb_caba],
    ['Otros tributos', doc.otros_tributos],
  ].filter(([,v]) => Math.abs(Number(v)||0) > 0.005);

  ov.innerHTML = `<div class="c-box">
    <div class="c-head">
      <div style="flex:1">
        <div style="font-weight:700;font-size:16px">${esc(doc.proveedor_nombre || doc.cuit_emisor)}</div>
        <div style="font-size:12.5px;opacity:.9">${esc(doc.tipo)} ${esc(doc.letra)}
          ${String(doc.punto_venta).padStart(4,'0')}-${String(doc.numero).padStart(8,'0')} ·
          ${fechaCorta(doc.fecha_emision)} · CUIT ${esc(doc.cuit_emisor)}</div>
      </div>
      <button class="hbtn" title="Modificar la contabilización" onclick="editarContabilizacion(${docId})">✏️</button>
      <button class="m-x" onclick="document.getElementById('res-overlay').remove()">✕</button>
    </div>
    <div class="c-body">
      <div class="c-nums">
        <div><span class="lbl">Neto</span><span class="v">${plata(neto)}</span></div>
        <div><span class="lbl">IVA</span><span class="v">${plata(iva)}</span></div>
        <div><span class="lbl">Total</span><span class="v" style="color:var(--primary)">${plata(doc.total)}</span></div>
      </div>
      ${(doc.moneda && doc.moneda !== 'ARS' && doc.importe_moneda)
        ? `<div class="mini" style="margin:-4px 0 10px;padding:7px 10px;background:#ecfeff;border-left:4px solid #0e7490;border-radius:6px;color:#0e7490">
            💵 Factura en ${esc(doc.moneda)}: ${esc(doc.moneda)} ${Number(doc.importe_moneda).toLocaleString('es-AR',{minimumFractionDigits:2})}
            × $${Number(doc.cotizacion).toLocaleString('es-AR',{minimumFractionDigits:2})} = ${plata(doc.total)}
            · ${esc(doc.cotizacion_fuente || 'cotización aplicada')}</div>` : ''}
      <div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:11px">
        ${doc.tipo_gasto ? `<span class="chip c-${doc.tipo_gasto}">${TIPOS[doc.tipo_gasto]||doc.tipo_gasto}</span>`
          : '<span class="chip" style="background:#fee2e2;color:#991b1b">sin tipo</span>'}
        <span class="chip" style="background:#f1f5f9;color:#475569" title="CUIT del proveedor">CUIT ${esc(doc.cuit_emisor)}</span>
        ${doc.archivo_path
          ? `<a href="${pdfUrl(doc.archivo_path)}" target="_blank" class="chip"
               style="background:#ecfeff;color:#0e7490;text-decoration:none" onclick="event.stopPropagation()">📄 Ver PDF</a>`
          : '<span class="chip" style="background:#f1f5f9;color:#94a3b8">sin PDF</span>'}
        <select onchange="cambiarEstadoPago(${docId}, this.value)" onclick="event.stopPropagation()"
          style="font-size:12px;padding:4px 8px;border-radius:20px;font-weight:700;border:1px solid var(--bd);
                 background:${(EPAGO[doc.estado_pago]||EPAGO.sin_definir).bg};color:${(EPAGO[doc.estado_pago]||EPAGO.sin_definir).col}">
          ${Object.entries(EPAGO).filter(([k])=>k!=='sin_definir'||doc.estado_pago==='sin_definir').map(([k,v]) =>
            `<option value="${k}" ${doc.estado_pago===k?'selected':''}>${v.tx}</option>`).join('')}
        </select>
        ${doc.corregida ? '<span class="chip" style="background:#fef3c7;color:#92400e">✏️ corregida</span>' : ''}
        ${doc.computa_formal ? '<span class="chip" style="background:#f1f5f9;color:#475569">Libro IVA</span>' : '<span class="chip" style="background:#fee2e2;color:#991b1b">Fuera del Libro IVA</span>'}
        ${doc.computa_gestion ? '<span class="chip" style="background:#f1f5f9;color:#475569">Gasto real</span>' : '<span class="chip" style="background:#fee2e2;color:#991b1b">No es gasto real</span>'}
      </div>
      <h4 style="font-size:14px;margin:4px 0 7px">Desglose fiscal</h4>
      <table style="margin-bottom:13px"><tbody>${fiscal.map(([lbl,v]) => `<tr>
        <td style="padding:4px 7px">${lbl}</td>
        <td class="num" style="padding:4px 7px">${plata(v)}</td><td style="width:55%"></td>
      </tr>`).join('')}
        <tr style="border-top:2px solid var(--bd)"><td style="padding:5px 7px"><b>Total</b></td>
        <td class="num" style="padding:5px 7px"><b>${plata(doc.total)}</b></td><td></td></tr>
      </tbody></table>
      <p class="mini" style="margin:-6px 0 12px">Las retenciones no van en la factura: se practican al pagar y las vas a ver en la orden de pago.</p>
      <h4 style="font-size:14px;margin:4px 0 7px">Cómo se contabilizó</h4>
      ${lineas.length ? `<table>
        <thead><tr><th>Concepto</th><th>Alíc.</th><th class="num">Neto</th></tr></thead>
        <tbody>${lineas.map(l => `<tr>
          <td><b>${esc(l.concepto_codigo||'—')}</b> <span class="mini">${esc(cMap[l.concepto_codigo]||l.descripcion||'')}</span></td>
          <td>${esc(l.alicuota==='0'?'No grav.':(l.alicuota||'')+'%')}</td>
          <td class="num">${plata(l.monto_neto)}</td>
        </tr>`).join('')}</tbody></table>`
        : '<div class="vacio">Sin líneas de contabilización.</div>'}
      ${doc.aprobada_por ? `<p class="mini" style="margin-top:9px">Contabilizada por ${esc(doc.aprobada_por)}
        el ${doc.aprobada_at ? new Date(doc.aprobada_at).toLocaleDateString('es-AR') : '—'}</p>`
        : '<p class="mini" style="margin-top:9px">Contabilización migrada del Dragonfish.</p>'}
      ${doc.archivo_path ? `<p class="mini" style="word-break:break-all">📎 ${esc(doc.archivo_path)}</p>` : ''}
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════
//  ➕ Carga manual SIN factura — la pata de GESTIÓN
//  Gastos reales del negocio sin comprobante fiscal. Regla dura: NO computa
//  en el Libro IVA (formal apagado, fijo en el server) y SÍ como gasto real.
// ═══════════════════════════════════════════════════════════════════════
function abrirSinFactura(){
  let ov = document.getElementById('sf-overlay');
  if (!ov){
    ov = document.createElement('div');
    ov.id = 'sf-overlay';
    ov.addEventListener('click', e => { if (e.target === ov) ov.remove(); });
    document.body.appendChild(ov);
  }
  const hoy = new Date().toISOString().slice(0,10);
  ov.innerHTML = `<div class="c-box" style="max-width:560px">
    <div class="c-head">
      <div style="flex:1"><div style="font-weight:700;font-size:16px">➕ Cargar gasto sin factura</div>
        <div style="font-size:12.5px;opacity:.9">Gasto real del negocio sin comprobante fiscal</div></div>
      <button class="m-x" onclick="document.getElementById('sf-overlay').remove()">✕</button>
    </div>
    <div class="c-body">
      <div class="c-sug" style="background:#fef3c7;border-color:#92400e">
        <b style="color:#92400e">No entra al Libro IVA</b>
        <div class="mini" style="margin-top:3px">Sin factura no hay crédito fiscal. Computa solamente
        como gasto real en la mirada de gestión.</div>
      </div>
      <label class="mini" style="font-weight:700">Detalle (obligatorio)</label>
      <input id="sf-detalle" placeholder="Qué se pagó y a quién — es lo único que explica el gasto"
             style="width:100%;margin:4px 0 10px">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <div><label class="mini" style="font-weight:700">Fecha</label><br>
          <input type="date" id="sf-fecha" value="${hoy}"></div>
        <div><label class="mini" style="font-weight:700">Importe total</label><br>
          <input type="text" inputmode="decimal" id="sf-total" placeholder="0,00" onfocus="wireImporte(this)" style="width:140px;text-align:right"></div>
        <div><label class="mini" style="font-weight:700">Tipo</label><br>
          <select id="sf-tipo">${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
      </div>
      <label class="mini" style="font-weight:700">Concepto contable</label>
      <input id="sf-concepto" list="dl-conceptos-sf" placeholder="SKU del concepto" style="width:100%;margin:4px 0 10px">
      <datalist id="dl-conceptos-sf">${CONCEPTOS.map(c =>
        `<option value="${esc(c.codigo)}">${esc(c.descripcion||'')}</option>`).join('')}</datalist>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
        <div style="flex:1;min-width:170px"><label class="mini" style="font-weight:700">Proveedor (opcional)</label><br>
          <input id="sf-prov" placeholder="Nombre" style="width:100%"></div>
        <div><label class="mini" style="font-weight:700">CUIT (opcional)</label><br>
          <input id="sf-cuit" placeholder="Sin guiones" style="width:140px"></div>
        <div><label class="mini" style="font-weight:700">Estado</label><br>
          <select id="sf-estado">
            <option value="pagada" selected>Pagada</option>
            <option value="con_op_sin_pagar">Con OP · sin pagar</option>
            <option value="controlado_sin_op">Controlada · sin OP</option>
          </select></div>
      </div>
    </div>
    <div class="c-pie">
      <div style="flex:1"></div>
      <button class="act gh" onclick="document.getElementById('sf-overlay').remove()">Cancelar</button>
      <button class="act" onclick="guardarSinFactura()">✓ Cargar</button>
    </div>
  </div>`;
}

async function guardarSinFactura(){
  const g = id => document.getElementById(id).value;
  const {error} = await sb.rpc('compras_cargar_sin_factura', {
    p_fecha: g('sf-fecha'),
    p_detalle: g('sf-detalle').trim(),
    p_total: nmParse(g('sf-total')),
    p_tipo_gasto: g('sf-tipo'),
    p_concepto: (g('sf-concepto')||'').split(' ')[0].trim().toUpperCase(),
    p_cuit: g('sf-cuit').trim() || null,
    p_proveedor: g('sf-prov').trim() || null,
    p_estado_pago: g('sf-estado'),
  });
  if (error){ alert('No se pudo cargar: ' + error.message); return; }
  document.getElementById('sf-overlay').remove();
  await cargarTodo();
  irA('facturas');
}

async function cambiarEstadoPago(docId, estado){
  const {error} = await sb.from('compras_documentos')
    .update({estado_pago: estado}).eq('id', docId);
  if (error){ alert('No se pudo cambiar: ' + error.message); return; }
  const d = DOCS.find(x=>x.id===docId); if (d) d.estado_pago = estado;
  abrirResumenDoc(docId);
}

async function editarContabilizacion(docId){
  const {data: doc} = await sb.from('compras_documentos').select('*').eq('id', docId).single();
  const {data: lin} = await sb.from('compras_lineas').select('*').eq('documento_id', docId).order('nroitem');
  if (!doc) return;
  if (doc.origen === 'dragonfish' &&
      !confirm('Esta contabilización vino del Dragonfish y es parte del historial del que aprende el sistema.\n\n¿Seguro que hay que corregirla?')) return;
  const r = document.getElementById('res-overlay');
  if (r) r.remove();
  enControl = {...doc, esEdicion: true};
  lineasControl = (lin && lin.length)
    ? lin.map(l => ({concepto: l.concepto_codigo || '', monto: Number(l.monto_neto)||0}))
    : [{concepto:'', monto: Number(doc.neto_gravado||0)+Number(doc.neto_no_gravado||0)+Number(doc.exento||0)}];
  pintarControl();
  const {data} = await sb.rpc('compras_conceptos_proveedor', {p_cuit: doc.cuit_emisor});
  enControl._usados = data || [];
  pintarControl();
}

// ── Sesión persistente ──────────────────────────────────────────────────
(async () => {
  const {data} = await sb.auth.getSession();
  if (data.session){ session.email = data.session.user.email; arrancar(); }
  else document.getElementById('login').style.display = 'block';
})();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script>
