/* ADORNO_MILES:INI — bloque compartido, idéntico en todos los módulos (fuente: _shared/adorno-miles.js; se inyecta con _shared/inyectar_miles.py). NO editar a mano en un módulo. */
// (1-oct-2026, JP) Separador de miles MIENTRAS se escribe, en todos los módulos.
//  · Campos de texto con inputmode="decimal" (wireImporte y afines): se formatean en vivo
//    "1.234.567,89"; el valor sigue siendo ese texto, que nmParse ya sabe leer.
//  · <input type="number"> de importes: el navegador no puede mostrar puntos en un campo
//    numérico, así que se convierten a texto y se les pone un `value` propio que SIGUE
//    devolviendo el número limpio ("1234567.89"). Number(el.value) funciona igual que antes.
//  · No se tocan los campos que no son importes: los que tienen max, o cuyo id/placeholder
//    habla de días, cuotas, minutos, tasa, %, orden, año, DNI, remito, etc. (data-sin-miles
//    para excluir uno a mano).
//  · El "." que tipea la persona vale como coma decimal: los puntos de miles los pone el sistema.
window.ADORNO_MILES = (function () {
  const NATIVO = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value');
  const nget = el => NATIVO.get.call(el), nset = (el, v) => NATIVO.set.call(el, v);
  const EXCL = new Set(['dias','días','dia','día','cuotas','cuota','mins','minutos','minuto','horas','hora','tasa','pct',
    'porc','porcentaje','orden','puntos','cant','cantidad','pack','pv','num','numero','número','numint','nro','freq',
    'hijos','anio','año','year','pmin','pmax','regimen','régimen','remito','vta','dni','cuit','cuil','cbu','legajo',
    'tel','telefono','teléfono','sku','cp']);

  // "1234567,8" (dígitos + una coma; los puntos se ignoran) → "1.234.567,8"
  function fmtTexto(s) {
    s = String(s == null ? '' : s);
    const neg = /^\s*-/.test(s);
    s = s.replace(/[^\d,]/g, '');
    const i = s.indexOf(',');
    let ent = i < 0 ? s : s.slice(0, i);
    const dec = i < 0 ? null : s.slice(i + 1).replace(/,/g, '');
    ent = ent.replace(/^0+(?=\d)/, '').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    if (dec !== null && ent === '') ent = '0';
    return (neg ? '-' : '') + ent + (dec !== null ? ',' + dec : '');
  }
  // "1.234,5" → "1234.5" (lo que devolvía un type=number)
  function aNumStr(disp) {
    const t = String(disp || '').replace(/\./g, '').replace(',', '.').replace(/[^\d.\-]/g, '').replace(/\.$/, '');
    return (t === '' || t === '-') ? '' : t;
  }
  // número o "1234.5" (estilo JS) → "1.234,5"
  function deNum(v) {
    if (v === '' || v == null) return '';
    const n = Number(v);
    if (!Number.isFinite(n)) return '';
    const s = String(parseFloat(n.toFixed(6)));          // sin ruido de coma flotante
    return fmtTexto((/e/i.test(s) ? n.toFixed(2) : s).replace('.', ','));
  }
  // "10.5" estilo JS (sin coma, 1–2 decimales) → "10,5". Misma regla que nmParse.
  function normTexto(v) {
    v = String(v == null ? '' : v);
    return (!v.includes(',') && /^\s*-?\d+\.\d{1,2}\s*$/.test(v)) ? v.trim().replace('.', ',') : v;
  }

  // (24-oct-2026, JP) FÓRMULAS: si la casilla empieza con "=" se deja escribir como en Excel (=10+10, =1500*1,21,
  // =(100-5%)*3) y al salir del campo se reemplaza por el resultado. Números en formato argentino (coma decimal).
  function evalFormula(v) {
    let e = String(v == null ? '' : v).trim();
    if (!e.startsWith('=')) return null;
    e = e.slice(1).replace(/\s+/g, '');
    if (!e || !/^[\d+\-*/().,%]+$/.test(e)) return null;
    e = e.replace(/(\d)\.(?=\d{3}(?!\d))/g, '$1').replace(/,/g, '.').replace(/%/g, '/100');
    if (/[+\-*/]{2,}|\.\./.test(e.replace(/\(-/g, '('))) return null;
    try { const r = Function('"use strict";return (' + e + ')')(); return Number.isFinite(r) ? Math.round(r * 100) / 100 : null; } catch (_) { return null; }
  }
  function resolverFormula(el) {
    const v = nget(el);
    if (!/^\s*=/.test(v)) return false;
    const r = evalFormula(v);
    if (r == null) return false;
    nset(el, el._miles === 'num' ? deNum(r) : fmtTexto(deNum(r)));
    el.dispatchEvent(new Event('input', { bubbles: true }));
    return true;
  }

  function reformatear(el, ev) {
    let v = nget(el);
    if (/^\s*=/.test(v)) return;                           // fórmula en curso: no se toca hasta salir del campo
    let pos = el.selectionStart == null ? v.length : el.selectionStart;
    const tipo = (ev && ev.inputType) || '';
    const data = (ev && typeof ev.data === 'string') ? ev.data : '';
    if (/^insert/.test(tipo) && data.includes('.') && !v.includes(',')) {
      // El punto que TIPEA la persona es la coma decimal (los de miles los pone el sistema).
      // Se ubica dentro de lo recién insertado, venga de a una tecla o varias juntas.
      const ini = pos - data.length, k = data.lastIndexOf('.');
      if (ini >= 0 && v.slice(ini, pos) === data) v = v.slice(0, ini + k) + ',' + v.slice(ini + k + 1);
    } else if (/paste|drop/i.test(tipo)) {
      v = normTexto(v);                                    // pegado "1234.56"
    }
    const sig = v.slice(0, pos).replace(/[^\d,\-]/g, '').length;
    const nuevo = fmtTexto(v);
    if (nuevo !== nget(el)) nset(el, nuevo);
    let p = 0, vistos = 0;
    while (p < nuevo.length && vistos < sig) { if (/[\d,\-]/.test(nuevo[p])) vistos++; p++; }
    try { el.setSelectionRange(p, p); } catch (_) {}
  }

  // Campo de TEXTO (inputmode=decimal): formato en vivo, el value sigue siendo el texto.
  function wire(el) {
    if (!el || el._miles) return;
    el._miles = 'txt';
    Object.defineProperty(el, 'value', { configurable: true,
      get() { return nget(el); },
      set(v) { nset(el, normTexto(v)); } });
    const v0 = normTexto(nget(el));
    nset(el, /^-?[1-9]\d{3,}(,\d+)?$/.test(v0) ? fmtTexto(v0) : v0);   // "42222" → "42.222"
  }

  // <input type="number"> de importes → texto con miles; .value sigue devolviendo "1234.5".
  function subirNumero(el) {
    if (!el || el._miles) return;
    el._miles = 'num';
    const v0 = nget(el);
    el.setAttribute('type', 'text');
    if (!el.getAttribute('inputmode')) el.setAttribute('inputmode', 'decimal');
    el.setAttribute('data-miles', 'num');
    el.setAttribute('autocomplete', 'off');
    Object.defineProperty(el, 'value', { configurable: true,
      get() { return aNumStr(nget(el)); },
      set(v) { nset(el, deNum(v)); } });
    Object.defineProperty(el, 'valueAsNumber', { configurable: true,
      get() { const s = aNumStr(nget(el)); return s === '' ? NaN : Number(s); },
      set(v) { nset(el, deNum(v)); } });
    nset(el, deNum(v0));
  }

  function esImporte(el) {
    if (el.dataset.sinMiles != null || el.hasAttribute('max')) return false;
    const txt = [el.id, el.name, el.getAttribute('data-field'), el.placeholder, el.title].filter(Boolean).join(' ').toLowerCase();
    if (txt.split(/[^a-záéíóúñ]+/).some(t => EXCL.has(t))) return false;
    const idt = (el.id || el.getAttribute('data-field') || '').toLowerCase().split(/[^a-z]+/).filter(Boolean);
    return !(idt.length && idt[idt.length - 1] === 'min');           // …_min = minutos
  }

  function revisar(n) {
    if (!n || n.nodeType !== 1) return;
    const lista = n.tagName === 'INPUT' ? [n]
      : (n.querySelectorAll ? n.querySelectorAll('input[type="number"], input[inputmode="decimal"]') : []);
    for (const el of lista) {
      if (el._miles || el._milesNo) continue;
      const tipo = (el.getAttribute('type') || 'text').toLowerCase();
      if (tipo === 'number') { if (esImporte(el)) subirNumero(el); else el._milesNo = true; }
      else if (tipo === 'text' && el.getAttribute('inputmode') === 'decimal' && el.dataset.sinMiles == null) wire(el);
      else el._milesNo = true;
    }
  }

  // En captura sobre el documento: corre ANTES que el oninput del propio campo.
  document.addEventListener('input', ev => { const el = ev.target; if (el && el._miles) reformatear(el, ev); }, true);
  document.addEventListener('focusout', ev => { const el = ev.target; if (el && el._miles) resolverFormula(el); }, true);
  document.addEventListener('keydown', ev => { const el = ev.target; if (ev.key === 'Enter' && el && el._miles && /^\s*=/.test(nget(el))) { resolverFormula(el); } }, true);
  document.addEventListener('focusin', ev => revisar(ev.target), true);
  try {
    new MutationObserver(ms => { for (const m of ms) for (const n of m.addedNodes) revisar(n); })
      .observe(document.documentElement, { childList: true, subtree: true });
  } catch (_) {}
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => revisar(document.body));
  else revisar(document.body);

  return { wire, subirNumero, revisar, fmtTexto, aNumStr, deNum, evalFormula };
})();

.fx-in{font:inherit;font-size:12.5px;padding:2px 5px;border:1px solid var(--bd);border-radius:5px;text-align:right;background:#fff;}
.fx-in:focus{border-color:var(--primary);outline:none;}
.fx-dg{margin:4px 0 8px;padding:8px 10px;border:1px dashed var(--bd);border-radius:8px;background:#fafafa;}
.fx-dg-fila{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0;}

.fecha-mala{border-color:#dc2626 !important;background:#fef2f2 !important;}
.lp-rangos{display:flex;gap:10px 22px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px dashed #e5e7eb}

@font-face{font-family:'URW Gothic';src:url('fonts/URWGothic-Book.ttf') format('truetype');font-weight:300 700;font-display:swap;}
:root{--primary:#ea580c;--primary-dark:#c2410c;--bg:#f8fafc;--card:#fff;--bd:#e2e8f0;--tx:#0f172a;--mut:#64748b;
      --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--info:#2563eb;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'URW Gothic',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:15px;}
header{background:var(--primary);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px;
       position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15);}
header h1{font-size:17px;font-weight:700;}
.hbtn{background:rgba(255,255,255,.18);border:none;color:#fff;font-size:15px;border-radius:8px;padding:6px 11px;cursor:pointer;}
/* (8-oct, JP) Íconos SVG de línea, un solo set para todo el módulo */
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-5px}
.ico.s{width:16px;height:16px;vertical-align:-3px}
/* Navegación en la cabecera: solo íconos; al pasar el mouse se despliega el nombre hacia la derecha */
.hnav{display:flex;gap:2px;margin-left:auto;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.hnav::-webkit-scrollbar{display:none}
.hnav button,.hnav a{display:flex;align-items:center;height:34px;padding:0 7px;border:none;border-radius:9px;background:transparent;color:#fff;opacity:.85;cursor:pointer;font-family:inherit;font-size:13px;white-space:nowrap;text-decoration:none;transition:background .15s,opacity .15s}
.hnav .lb{max-width:0;overflow:hidden;opacity:0;margin-left:0;transition:max-width .25s ease,opacity .18s,margin-left .25s}
.hnav button:hover .lb,.hnav a:hover .lb,.hnav button.on .lb{max-width:150px;opacity:1;margin-left:6px}
.hnav button:hover,.hnav a:hover{background:rgba(255,255,255,.18);opacity:1}
.hnav button.on{background:#fff;color:var(--primary);opacity:1;font-weight:700}
.hnav .sep{width:1px;height:22px;background:rgba(255,255,255,.35);margin:0 6px;flex:none}
.hchip{display:inline-flex;align-items:center;gap:4px;background:#fef3c7;color:#92400e;font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;margin-left:8px;cursor:help}
@media(max-width:760px){.hnav button.on .lb{max-width:0;opacity:0;margin-left:0}}
/* Chips de filtro (reemplazan a las tarjetas de números) */
.fchips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fchip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--bd);background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;color:var(--tx)}
.fchip b{font-size:15px}
.fchip .dot{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
.fchip.on{border-color:var(--primary);background:#fff7ed;color:var(--primary-dark);font-weight:700}
/* Barra de acciones */
.abar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.abar .estado{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);cursor:help}
.abar .estado .dot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.abar .estado .dot.mal{background:var(--bad)}
.abar .sepv{width:1px;height:22px;background:var(--bd);margin:0 2px}
.abar .fchip{margin:0}
button.act.ico-btn{display:inline-flex;align-items:center;gap:7px}
/* Tabla de la Bandeja: la fila es el botón */
table.tb-band tbody tr{cursor:pointer}
table.tb-band tbody tr:hover td{background:#fff7ed}
table.tb-band td.oculta-mov{white-space:nowrap}
table.tb-band td.prov{max-width:260px}
table.tb-band .prov-nom{display:inline-block;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
table.tb-band td.ctr{text-align:center}
.chip.tletra{font-weight:800;padding:2px 8px;cursor:help;min-width:26px;display:inline-block;text-align:center}
.eico{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;cursor:help}
a.nro{color:var(--tx);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--mut)}
table.tb-band a.nro:hover{color:var(--primary);border-bottom-color:var(--primary)}
.cdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:1px;cursor:help}
.op-fila3{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}.op-fila3>div{display:flex;flex-direction:column;gap:3px}.op-fila3 label{font-size:12px;color:var(--mut)}
.op-mas{display:inline-flex;align-items:center;gap:6px;margin-left:6px;vertical-align:middle}
button.act.op-ico{background:var(--primary);color:#fff;border:none;padding:2px 4px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;margin-left:3px;vertical-align:middle}
button.act.op-ico svg{width:11px;height:11px}
.op-sec{border:1px solid #fde7d2;border-radius:12px;margin-bottom:12px;overflow:hidden;background:#fff}
/* (22-oct, JP eligió la propuesta A) orden de pago en bloques con cabecera naranja suave */
.op-tit{background:#fff7ed;border-left:5px solid var(--primary);border-radius:10px;padding:10px 14px;color:#9a3412}
.op-blq{border:1px solid #fde7d2;border-radius:12px;margin-bottom:12px;overflow:hidden;background:#fff}
.op-blq>h4{margin:0;padding:8px 12px;background:#fff7ed;border-bottom:1px solid #fde7d2;font-size:11.5px;color:#9a3412;text-transform:uppercase;letter-spacing:.05em}
.op-blq>.cont{padding:10px 12px}.op-blq table{margin:0;width:100%}.op-blq tbody tr:nth-child(even) td{background:#fafafa}
#op-calc .op-blq tr.tot td,#op-calc .op-blq td#op-neto{background:#fff7ed;color:#9a3412}#op-calc .op-blq td#op-neto{font-weight:700;border-top:2px solid var(--primary)}
#prov-modal #op-calc .op-neto{border:1px solid #fed7aa;border-top:3px solid var(--primary)}
.op-lista thead th{background:#fff7ed;color:#9a3412}.op-lista tbody tr:nth-child(even) td{background:#fafafa}.op-lista tbody tr:hover td{background:#fff7ed}
.op-sec>h4{margin:0;padding:7px 11px;background:#fff7ed;border-bottom:1px solid #fde7d2;color:#9a3412;font-size:11.5px;display:flex;gap:7px;align-items:center;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.op-sec table{margin:0;width:100%}.op-sec td{padding:7px 11px;border-top:1px solid #f1f5f9}.op-sec tr:first-child td{border-top:none}
.op-sec tr.tot td{background:#fafafa;font-weight:700}
.op-neto{display:flex;justify-content:space-between;align-items:center;background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:10px 14px;margin-bottom:10px;font-weight:700;color:var(--primary-dark,#9a3412)}
.op-neto b{font-size:18px}
label.c-tog{cursor:pointer;display:inline-flex}label.c-tog input{display:none}
label.c-tog .eico{width:38px;height:38px;color:#cbd5e1;border:1px solid var(--bd);background:#fff;cursor:pointer}
#ctrl-overlay .c-fila label.c-tog{flex-direction:row;align-self:flex-end}
.g-imp{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;text-align:right;background:#fff;width:150px}
label.c-tog input:checked + .eico{color:#fff;background:var(--primary);border-color:var(--primary)}
.aviso-amb{background:#fef3c7;color:#92400e;border-left:4px solid #d97706;border-radius:8px;padding:8px 11px;font-size:13px}.aviso-amb div{display:flex;gap:6px;align-items:flex-start;margin:2px 0}
button.act.mini-ico{padding:5px 7px;border-radius:8px;display:inline-flex}
/* (22-oct, JP) tónica de todos los módulos: los botones de ícono van sin recuadro, solo el ícono, fondo suave al pasar el mouse */
button.act.mini-ico,button.act.gh.mini-ico{background:transparent;border:none;color:var(--primary);box-shadow:none;padding:6px 8px}
button.act.mini-ico:hover,button.act.gh.mini-ico:hover{background:var(--primary-bg,#fff7ed)}
button.act.mini-ico svg{width:18px;height:18px}
/* reloj de arena animado mientras algo trabaja */
@keyframes reloj-gira{0%,70%{transform:rotate(0)}85%,100%{transform:rotate(180deg)}}.reloj{display:inline-block;animation:reloj-gira 1.6s ease-in-out infinite}@keyframes girar{to{transform:rotate(360deg)}}.girar{display:inline-block;animation:girar 1.2s linear infinite}
details.plegable summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:13.5px}
details.plegable summary::-webkit-details-marker{display:none}
details.plegable summary .chev{transition:transform .2s}
details.plegable[open] summary .chev{transform:rotate(90deg)}
nav.tabs{display:none;}
nav.tabs-old{display:flex;gap:4px;background:#fff;border-bottom:1px solid var(--bd);padding:0 8px;overflow-x:auto;
         position:sticky;top:48px;z-index:40;}
nav.tabs button{background:none;border:none;padding:11px 13px;font-size:14px;color:var(--mut);cursor:pointer;
                border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit;}
nav.tabs button.on{color:var(--primary);border-bottom-color:var(--primary);font-weight:700;}
main{padding:14px;max-width:1250px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px;}
/* (v133, JP) ficha del proveedor: apartados plegables, cerrados salvo Datos comerciales */
.pf-sec{border:1px solid var(--bd);border-radius:10px;background:#f8fafc;margin:8px 0;}
.pf-sec>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:700;font-size:13px;color:var(--tx);user-select:none;}
.pf-sec>summary::-webkit-details-marker{display:none;}
.pf-sec>summary .chev{transition:transform .15s;color:var(--mut);flex:none;}
.pf-sec[open]>summary .chev{transform:rotate(90deg);}
.pf-sec>summary .res{margin-left:auto;font-weight:500;color:var(--mut);font-size:12px;text-align:right;}
.pf-sec>summary .res.ok{color:#166534;}
.pf-sec>summary .res.warn{color:#b45309;font-weight:700;}
#prov-modal .pf-aviso{background:#fef3c7;color:#92400e;border-left:3px solid #d97706;border-radius:6px;padding:7px 10px;font-size:12.5px;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.pf-sec .pf-body{padding:8px 12px 12px;background:#fff;border-top:1px solid var(--bd);border-radius:0 0 10px 10px;}
.pf-sec .hint{font-size:12px;color:var(--mut);line-height:1.5;}
/* (v137) ficha de equivalencia: tres bloques, títulos con ℹ, botón + a la derecha del renglón */
.eq-sec{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#fff;}
.eq-sec h4{margin:0 0 8px;font-size:13.5px;display:flex;align-items:center;gap:7px;}
.eq-sec .eq-cab{display:flex;gap:7px;margin-bottom:3px;}
.eq-sec .c-linea{margin-bottom:6px;}
.eq-sec .eq-cand{display:flex;align-items:center;gap:6px;width:100%;text-align:left;margin-bottom:5px;font-size:13px;padding:6px 10px;}
/* (v134) .btn no tenía estilo: todos los botones de la ficha/alta de proveedores */
#prov-modal .btn{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 12px;font-size:13px;font-family:inherit;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap;}
#prov-modal .btn:hover{border-color:var(--primary);color:var(--primary-dark);}
#prov-modal .btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700;}
#prov-modal .btn.primary:hover{background:var(--primary-dark);color:#fff;}
#prov-modal .btn.ico{padding:7px 8px;}
#prov-modal .btn svg{width:15px;height:15px;}
#prov-modal .pf-fila{display:grid;gap:6px;align-items:end;margin-bottom:6px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:#fafafa;}
#prov-modal .pf-fila .eico{width:30px;height:30px;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
.kpi{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--primary);border-radius:10px;padding:11px 13px;}
.kpi .lbl{font-size:11.5px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;}
.kpi .val{font-size:20px;font-weight:700;margin-top:3px;}
.kpi .sub{font-size:12px;color:var(--mut);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;padding:8px 7px;border-bottom:2px solid var(--bd);color:var(--mut);font-size:12px;
   text-transform:uppercase;letter-spacing:.3px;cursor:pointer;white-space:nowrap;}
td{padding:8px 7px;border-bottom:1px solid #f1f5f9;vertical-align:top;}
tr:hover td{background:#fff7ed;}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap;}
.c-gastos{background:#dbeafe;color:#1e40af;} .c-mercaderia{background:#dcfce7;color:#166534;}
.c-inversiones{background:#fef3c7;color:#92400e;} .c-no_actividad{background:#f1f5f9;color:#475569;}
.e-aprobada{background:#dcfce7;color:#166534;} .e-a_revisar{background:#fef3c7;color:#92400e;}
.e-auto{background:#dbeafe;color:#1e40af;} .e-sin_regla{background:#fee2e2;color:#991b1b;}
.e-rechazada{background:#fee2e2;color:#991b1b;} .e-extraida{background:#f1f5f9;color:#475569;}
input,select{font-family:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:#fff;}
input:focus,select:focus{outline:2px solid var(--primary);outline-offset:-1px;}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.filtros input[type=search]{flex:1;min-width:180px;}
button.act{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:14px;
           cursor:pointer;font-family:inherit;}
button.act.gh{background:#fff;color:var(--primary);border:1px solid var(--primary);}
.alerta{background:#fef2f2;border-left:4px solid var(--bad);border-radius:8px;padding:10px 13px;margin-bottom:10px;
        font-size:13px;color:#991b1b;}
.vacio{text-align:center;color:var(--mut);padding:34px 10px;font-size:14px;}
#login{max-width:340px;margin:70px auto;text-align:center;}
#login input{width:100%;margin-bottom:10px;}
#login h2{margin-bottom:6px;font-size:21px;} #login p{color:var(--mut);font-size:13.5px;margin-bottom:18px;}
.err{color:var(--bad);font-size:13px;margin-top:8px;}
.mini{font-size:11.5px;color:var(--mut);}
@media(max-width:640px){ td,th{padding:7px 5px;font-size:12.5px;} .oculta-mov{display:none;} }

.fx-cab{display:grid;grid-template-columns:1fr auto;gap:12px;padding-bottom:10px;margin-bottom:10px;border-bottom:2px solid var(--bd);font-size:13px;}
.fx-cab.fx-head{padding-bottom:0;margin-bottom:0;border-bottom:none;color:#fff;}

// (SSO) Envolver login/logout una sola vez cubre todas las pantallas del
// módulo: al loguearte acá queda recordado (para no pedirte la clave de
// nuevo la próxima), y al salir se olvidan TODOS los módulos — pero no que
// esta computadora es de confianza, que se maneja desde el Hub.
(function (mod) {
  var inOrig = sb.auth.signInWithPassword.bind(sb.auth);
  sb.auth.signInWithPassword = async function (cred) {
    var r = await inOrig(cred);
    if (!r.error && r.data && r.data.user) ADORNO_SSO.recordar(mod, r.data.user.email);
    return r;
  };
  var outOrig = sb.auth.signOut.bind(sb.auth);
  sb.auth.signOut = async function () {
    ADORNO_SSO.olvidarModulos();
    // "Salir" cierra la sesión SOLO en este equipo (scope local). Con el
    // default de Supabase (global) salir en una PC cerraba el mismo usuario
    // en todas las demás, y la pantalla abierta seguía mandando pedidos sin
    // sesión ("permission denied", caso Compras 28-sep).
    window.__adornoSaliendo = true;
    return outOrig(arguments[0] || { scope: 'local' });
  };
  // Si la sesión se cae sola (vencida, revocada, o salieron en otra pestaña)
  // avisar y volver al login en vez de dejar una pantalla que ya no guarda.
  var _tuvoSesion = false;
  sb.auth.onAuthStateChange(function (ev, s) {
    if (s) { _tuvoSesion = true; return; }
    if (ev === 'SIGNED_OUT' && _tuvoSesion && !window.__adornoSaliendo) {
      _tuvoSesion = false;
      alert('Tu sesión se cerró (venció o alguien salió con este usuario).\nVolvé a ingresar: lo que no guardaste hay que cargarlo de nuevo.');
      location.reload();
    }
  });
})('compras');

function irA(t){ tabActual = t; renderTabs(); render(); }

async function cargarTodo(){
  document.getElementById('cont').innerHTML = '<div class="vacio">Cargando comprobantes…</div>';
  let todos = [], desde = 0;
  while (true){
    let q = sb.from('compras_documentos')
      .select('id,tipo,letra,punto_venta,numero,cuit_emisor,proveedor_nombre,fecha_emision,total,estado,estado_pago,tipo_gasto,archivo_path,archivo_alerta,confianza,origen,moneda,cotizacion,importe_moneda,cotizacion_fuente,es_prueba,computa_gestion,gestion_periodo,gestion_unidad,gestion_categoria,gestion_importe,numero_interno,fecha_ingreso,nota,nota_por,nota_at,doc_clase,numeros_extra')
      .eq('es_prueba', MODO_PRUEBA)
      // (2-sep, regla JP) Facturas = SOLO lo contabilizado (aprobada). Lo que
      // espera control vive en la Bandeja y recién pasa acá al darle el OK.
      .eq('estado', 'aprobada')
      .order('fecha_emision', {ascending:false}).range(desde, desde+999);
    if (!MODO_PRUEBA) q = q.gte('fecha_emision', filtro.anio + '-01-01').lte('fecha_emision', filtro.anio + '-12-31');
    const {data, error} = await q;
    if (error){ document.getElementById('cont').innerHTML = `<div class="alerta">No se pudieron leer los comprobantes: ${esc(error.message)}</div>`; return; }
    todos = todos.concat(data);
    if (data.length < 1000) break;
    desde += 1000;
  }
  DOCS = todos;
  await cargarRemitosDeDocs();
  try { await cargarBandeja(); }
  catch(e){ console.warn('bandeja:', e.message); BANDEJA = []; }
  render();
}

// ── Remitos asociados a cada factura (columna "Remito" de la grilla) ────
//  El vínculo vive en compras_remitos.documento_id: lo pone el motor al leer
//  la factura (mismo número, o el nº de remito impreso en la factura) o
//  administración a mano en 🚚 Mercadería. Acá solo se lee para mostrarlo.
let REMITOS_DOC = {}, REMITOS_ALL = [];  // (22-sep) todos los remitos del ambiente, con o sin factura
async function cargarRemitosDeDocs(){
  REMITOS_DOC = {}; REMITOS_ALL = [];
  let desde = 0;
  while (true){
    let q = sb.from('compras_remitos')
      .select('documento_id,proveedor_cuit,fecha,punto_venta,numero,numero_proveedor,estado,origen,local_destino,txt_generado_at,txt_proveedor,asociado_por,archivo_path,doc:compras_documentos(id,tipo,letra,punto_venta,numero,proveedor_nombre,estado)')
      .eq('es_prueba', MODO_PRUEBA)
      .order('numero').range(desde, desde+999);
    if (!MODO_PRUEBA) q = q.gte('fecha', (filtro.anio - 1) + '-10-01');
    const {data, error} = await q;
    if (error){ console.warn('remitos:', error.message); return; }
    (data||[]).forEach(r => { REMITOS_ALL.push(r); if (r.documento_id) (REMITOS_DOC[r.documento_id] ||= []).push(r); });
    if (desde === 0) cargarRemitosImportados();
    if ((data||[]).length < 1000) break;
    desde += 1000;
  }
}
// cómo se ve el remito en la grilla: número + en qué estado está su stock
// (8-oct, JP) Remitos que YA están en el Dragonfish (sync_mercaderia.py sube ADMIN: remitos de venta
// tipo 11 = lo que crea el importador del TXT, y remitos de compra cargados a mano).
let REM_IMP = {}, REM_IMP_OCULTAR = localStorage.getItem('merc_ocultar_importados') !== '0';
const _remKey = r => `${r.proveedor_cuit}|${r.punto_venta}|${r.numero}`;
async function cargarRemitosImportados(){
  const {data, error} = await sb.rpc('compras_remitos_importados', {p_prueba: MODO_PRUEBA});
  if (error){ console.warn('remitos importados:', error.message); return; }
  REM_IMP = {}; (data || []).forEach(x => { REM_IMP[_remKey(x)] = x; });
}
const remImportado = r => REM_IMP[_remKey(r)] || null;
function remImpTip(x){
  return `Ya está en el Dragonfish: remito de ${x.importado_tipo === 'venta' ? 'venta ADMIN → ' + (x.importado_cliente || 'local') : 'compra'}`
       + (x.importado_ref ? ' ' + x.importado_ref : '')
       + (x.importado_fecha ? ' del ' + fechaCorta(x.importado_fecha) : '') + (x.importado_por ? ' · cargado por ' + x.importado_por.split('@')[0] : '')
       + (x.importado_manual ? ' · cargado A MANO (el remito del Dragon menciona este número en sus observaciones, no entró por TXT)' : '');
}
function celdaRemitos(d){
  const rs = REMITOS_DOC[d.id] || [];
  if (!rs.length) return (d.tipo_gasto === 'mercaderia' || d.tipo_gasto === 'M')
    ? '<span class="chip" style="background:#fee2e2;color:#991b1b" title="Factura de mercadería sin remito asociado: la mercadería todavía no tiene cómo entrar al stock">⚠ sin remito</span>'
    : '<span class="mini">—</span>';
  return rs.map(r => {
    const num = `${String(r.punto_venta||0).padStart(4,'0')}-${String(r.numero).padStart(8,'0')}`;
    let chip, tit;
    const imp = remImportado(r);
    if (r.origen === 'fgr_txt' || r.estado === 'recibido'){ chip = '<span class="chip" style="background:#dcfce7;color:#166534">en stock</span>'; tit = 'Ya ingresó al Dragonfish'; }
    else if (imp){ chip = '<span class="chip" style="background:#dcfce7;color:#166534">en Dragon</span>'; tit = remImpTip(imp); }
    else if (r.txt_proveedor){ chip = '<span class="chip" style="background:#e0e7ff;color:#3730a3">📨 TXT prov.</span>'; tit = 'El TXT lo manda el proveedor'; }
    else if (r.txt_generado_at){ chip = '<span class="chip" style="background:#dcfce7;color:#166534">TXT ✓</span>'; tit = 'TXT generado ' + _fechaTs(String(r.txt_generado_at).slice(0,10)); }
    else { chip = '<span class="chip" style="background:#fef3c7;color:#92400e">TXT pend.</span>'; tit = 'Falta generar el TXT para el Dragonfish'; }
    const nro = r.archivo_path ? `<a class="nro" href="${pdfUrl(r.archivo_path)}" target="_blank" rel="noopener" title="Abrir el PDF del remito" onclick="event.stopPropagation()">R ${num}</a>` : `R ${num}`;
    return `<span title="${esc(tit)}${r.local_destino ? ' · destino ' + esc(r.local_destino) : ''}${r.asociado_por ? ' · vinculado: ' + esc(r.asociado_por) : ''}">${nro} ${chip}</span>`;
  }).join('<br>');
}

// ── Filtro y orden comunes ──────────────────────────────────────────────
function filtrados(base){
  const t = filtro.texto.toLowerCase();
  let r = base.filter(d => {
    if (filtro.tipo && d.tipo_gasto !== filtro.tipo) return false;
    if (filtro.clase && filtro.clase !== 'RTO' && d.tipo !== filtro.clase) return false;
    if (filtro.estado && (d.estado_pago || 'sin_definir') !== filtro.estado) return false;
    if (filtro.mes && (d.fecha_emision||'').slice(5,7) !== filtro.mes) return false;
    if (t){
      const bolsa = `${d.proveedor_nombre||''} ${d.numero} ${d.cuit_emisor||''} ${d.archivo_path||''} ${d.numero_interno ? '#' + d.numero_interno + ' ni' + d.numero_interno : ''}`.toLowerCase();
      if (!bolsa.includes(t)) return false;
    }
    return true;
  });
  r.sort((a,b) => {
    let x = a[orden.col], y = b[orden.col];
    if (orden.col === 'total' || orden.col === 'numero_interno'){ x = Number(x)||0; y = Number(y)||0; }
    else if (orden.col === 'remito'){ x = (REMITOS_DOC[a.id]||[]).length; y = (REMITOS_DOC[b.id]||[]).length; }
    else { x = String(x??'').toLowerCase(); y = String(y??'').toLowerCase(); }
    return (x<y?-1:x>y?1:0) * (orden.desc?-1:1);
  });
  return r;
}
function ordenar(col){ orden = {col, desc: orden.col===col ? !orden.desc : true}; render(); }
function setF(k,v){ filtro[k]=v; if(k==='anio') cargarTodo(); else render(); }
// (28-sep, JP) El buscador de texto espera a que termines de escribir: busca 0,6 s
// después de la última tecla (o al apretar Enter) y te devuelve el cursor al campo.
// Antes re-dibujaba la pantalla con cada letra y el campo perdía el foco.
let _buscaTimer = null;
function buscarTexto(v, inmediato){
  filtro.texto = v;
  clearTimeout(_buscaTimer);
  const go = () => {
    render();
    const el = document.querySelector('input[data-busca="texto"]');
    if (el){ el.focus(); const n = el.value.length; try { el.setSelectionRange(n, n); } catch(_){} }
  };
  if (inmediato) go(); else _buscaTimer = setTimeout(go, 600);
}

function barraFiltros(){
  const anios = [];
  for (let a = new Date().getFullYear(); a >= 2019; a--) anios.push(a);
  return `<div class="filtros">
    <input type="search" data-busca="texto" placeholder="Buscar proveedor, número, CUIT…" value="${esc(filtro.texto)}"
           oninput="buscarTexto(this.value)" onkeydown="if(event.key==='Enter')buscarTexto(this.value,true)">
    <select onchange="setF('anio',this.value)">${anios.map(a=>`<option ${a==filtro.anio?'selected':''}>${a}</option>`).join('')}</select>
    <select onchange="setF('mes',this.value)"><option value="">Todos los meses</option>
      ${MESES.map((m,i)=>`<option value="${String(i+1).padStart(2,'0')}" ${filtro.mes==String(i+1).padStart(2,'0')?'selected':''}>${m}</option>`).join('')}</select>
    <select onchange="setF('tipo',this.value)"><option value="">Todos los tipos</option>
      ${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${filtro.tipo===k?'selected':''}>${v}</option>`).join('')}</select>
    ${tabActual === 'facturas' ? `<select onchange="setF('clase',this.value)"><option value="">Facturas, NC, ND y remitos</option>
      <option value="FC" ${filtro.clase==='FC'?'selected':''}>Solo facturas</option>
      <option value="NC" ${filtro.clase==='NC'?'selected':''}>Solo notas de crédito</option>
      <option value="ND" ${filtro.clase==='ND'?'selected':''}>Solo notas de débito</option>
      <option value="RTO" ${filtro.clase==='RTO'?'selected':''}>Solo remitos</option></select>
    <select onchange="setF('estado',this.value)" title="Estado de pago" style="${filtro.estado ? 'border-color:var(--primary);background:#fff7ed;font-weight:700' : ''}"><option value="">Todos los estados</option>
      ${Object.entries(EPAGO).filter(([k]) => k !== 'sin_definir').map(([k,v]) => `<option value="${k}" ${filtro.estado===k?'selected':''}>${v.tx}</option>`).join('')}</select>
    <button class="act mini-ico" onclick="abrirSinFactura()" title="Cargar un gasto sin factura (comprobante interno)">${ico('docmas')}</button>` : ''}
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════
//  💸 ÓRDENES DE PAGO · punto 4
//
//  El circuito: una factura controlada espera OP → se elige el proveedor,
//  se marcan las facturas a pagar (pueden ser varias, y las NC restan), el
//  sistema calcula las retenciones que correspondan y muestra el neto a
//  pagar → al emitir, la factura avanza a "con OP sin pagar" (el PDF se muda
//  solo) y se crea el pendiente en Tesorería para no cargar la plata dos veces.
//
//  🚨 El sistema NUNCA inventa una retención: si al régimen le falta la
//  alícuota, sale $0 y lo dice. Los avisos se muestran SIEMPRE, antes de emitir.
// ═══════════════════════════════════════════════════════════════════════
let OP_PROVS = null, OP_LISTA = null, opSel = null, opDocs = [], opPrep = null, opRets = [], opPagos = [], OP_CUENTAS = null;

async function vistaOrdenes(){
  const c = document.getElementById('cont');
  c.innerHTML = '<div class="vacio">Cargando…</div>';
  const [provs, lista] = await Promise.all([
    sb.rpc('compras_op_proveedores', {p_prueba: MODO_PRUEBA}),
    sb.rpc('compras_ordenes_listar', {p_desde: null, p_hasta: null, p_prueba: MODO_PRUEBA}),
  ]);
  if (provs.error){ c.innerHTML = `<div class="alerta">${esc(provs.error.message)}</div>`; return; }
  OP_PROVS = provs.data || []; OP_LISTA = lista.data || [];
  pintarOrdenes();
}

        <thead><tr><th>Proveedor</th><th class="num">Comprob.</th>
          <th class="num" title="Sin IVA ni percepciones">Neto</th><th class="num">Total</th><th>Más vieja</th><th></th></tr></thead>

          <td class="prov"><span class="prov-nom" title="${esc(p.proveedor||'')} · CUIT ${esc(p.cuit||'')}"><b>${esc(p.proveedor||'—')}</b></span></td>

        </tr>`).join('')}</tbody></table></div>`
      : '<div class="vacio">No hay comprobantes controlados esperando orden de pago.</div>'}
    </div>

    <div class="card">
      <div class="abar" style="margin-bottom:8px">
        <h3 style="font-size:15px;margin:0">Órdenes emitidas <span class="mini">· ${OP_LISTA.filter(o=>o.estado!=='anulada').length}${OP_LISTA.some(o=>o.estado==='anulada') ? ` · ${OP_LISTA.filter(o=>o.estado==='anulada').length} anuladas` : ''}</span></h3>
        <span style="flex:1"></span>
        <input type="date" id="opl-desde" value="${esc(OP_FILTRO.desde)}" onchange="OP_FILTRO.desde=this.value;pintarOrdenes()" style="padding:5px 7px;font-size:12.5px" title="Desde">
        <input type="date" id="opl-hasta" value="${esc(OP_FILTRO.hasta)}" onchange="OP_FILTRO.hasta=this.value;pintarOrdenes()" style="padding:5px 7px;font-size:12.5px" title="Hasta">
        <button class="act gh mini-ico" onclick="opExportar('emit','xlsx')" title="Bajar este listado en Excel">${ico('excel','s')}</button>
        <button class="act gh mini-ico" onclick="opExportar('emit','pdf')" title="Bajar este listado en PDF">${ico('pdf','s')}</button>
      </div>
      ${_opListaFiltrada().length ? `<div style="overflow-x:auto"><table class="tb-band op-lista">

// ── Listados de OP a Excel y PDF (2-oct, JP) ───────────────────────────
const OP_FILTRO = {desde: '', hasta: ''};
const _opListaFiltrada = () => (OP_LISTA || []).filter(o =>
  (!OP_FILTRO.desde || o.fecha >= OP_FILTRO.desde) && (!OP_FILTRO.hasta || o.fecha <= OP_FILTRO.hasta));
function _cargarScript(src){
  return new Promise((ok, mal) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = () => mal(new Error('No se pudo cargar ' + src)); document.head.appendChild(sc); });
}
async function opExportar(cual, formato){
  // columnas: [título, valor(fila), 'n' importe / 'e' entero, ancho relativo en el PDF]
  let titulo, filas, cols;
  if (cual === 'pend'){
    titulo = 'Facturas esperando orden de pago'; filas = OP_PROVS || [];
    cols = [['Proveedor', p => p.proveedor || '', '', 70], ['CUIT', p => p.cuit || '', '', 26], ['Comprob.', p => Number(p.facturas)||0, 'e', 18],
            ['Neto', p => Number(p.neto)||0, 'n', 32], ['Total', p => Number(p.total)||0, 'n', 32], ['Más vieja', p => _fecha(p.mas_vieja), '', 22]];
  } else {
    titulo = 'Órdenes de pago emitidas' + ((OP_FILTRO.desde || OP_FILTRO.hasta) ? (' · ' + (OP_FILTRO.desde ? 'desde ' + _fecha(OP_FILTRO.desde) + ' ' : '') + (OP_FILTRO.hasta ? 'hasta ' + _fecha(OP_FILTRO.hasta) : '')).trimEnd() : '');
    filas = _opListaFiltrada();
    cols = [['Orden', o => o.comprobante, '', 36], ['Fecha', o => _fecha(o.fecha), '', 19], ['Proveedor', o => o.proveedor || '', '', 62], ['CUIT', o => o.cuit || '', '', 24],
            ['Comp.', o => Number(o.comprobantes)||0, 'e', 12], ['Subtotal', o => Number(o.subtotal)||0, 'n', 28], ['Retenciones', o => Number(o.retenciones_total)||0, 'n', 26],
            ['A pagar', o => Number(o.neto_a_pagar)||0, 'n', 28], ['Estado', o => o.estado === 'pago_parcial' ? 'pago parcial' : o.estado, '', 20], ['Medio de pago', o => o.medio_pago || '', '', 30]];
  }
  if (!filas.length){ alert('No hay nada para exportar.'); return; }
  // los totales no suman las anuladas
  const suma = c => filas.filter(x => x.estado !== 'anulada').reduce((a, x) => a + (Number(c[1](x)) || 0), 0);
  const rotTotal = 'TOTAL' + (cual === 'emit' ? ' (sin anuladas)' : '');
  const nombre = titulo.replace(/[·/]/g, '-').replace(/\s+/g, ' ') + (MODO_PRUEBA ? ' (PRUEBA)' : '');
  try {
    if (formato === 'xlsx'){
      if (!window.XLSX) await _cargarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
      const aoa = [[titulo + (MODO_PRUEBA ? ' — AMBIENTE DE PRUEBA' : '')], [], cols.map(c => c[0])]
        .concat(filas.map(x => cols.map(c => c[1](x))))
        .concat([cols.map((c, i) => i === 0 ? rotTotal : c[2] ? suma(c) : '')]);
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = cols.map(c => ({wch: Math.max(10, Math.round(c[3] / 2))}));
      cols.forEach((c, j) => { if (c[2] !== 'n') return;
        for (let i = 3; i < aoa.length; i++){ const cel = ws[XLSX.utils.encode_cell({r: i, c: j})]; if (cel && typeof cel.v === 'number') cel.z = '#,##0.00'; } });
      const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, cual === 'pend' ? 'Esperando OP' : 'Ordenes de pago');
      XLSX.writeFile(wb, nombre + '.xlsx');
    } else {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({unit: 'mm', format: 'a4', orientation: 'landscape'});
      const ancho = cols.reduce((a, c) => a + c[3], 0), k = 269 / ancho, n2 = v => (Number(v)||0).toLocaleString('es-AR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
      let y = 0, pag = 0;
      const fila = (vals, negrita) => { doc.setFont('helvetica', negrita ? 'bold' : 'normal'); doc.setFontSize(8); let x = 14;
        cols.forEach((c, j) => { const w = c[3] * k, num = c[2];
          let t = String(vals[j] ?? ''); const max = Math.floor(w / 1.45); if (!num && t.length > max) t = t.slice(0, max - 1) + '…';
          if (num) doc.text(t, x + w - 1.5, y, {align: 'right'}); else doc.text(t, x, y);
          x += w; }); y += 4.6; };
      const cabecera = () => { pag++; doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.text('Claudia Adorno SRL · ' + titulo, 14, 13);
        doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.text(`Emitido el ${_fecha(_hoyISO())}${MODO_PRUEBA ? ' · AMBIENTE DE PRUEBA' : ''} · página ${pag}`, 283, 13, {align: 'right'});
        y = 21; fila(cols.map(c => c[0]), true); doc.line(14, y - 3.2, 283, y - 3.2); };
      cabecera();
      filas.forEach(xf => { if (y > 195){ doc.addPage(); cabecera(); }
        if (xf.estado === 'anulada') doc.setTextColor(150);
        fila(cols.map(c => c[2] === 'n' ? n2(c[1](xf)) : c[1](xf))); doc.setTextColor(0); });
      doc.line(14, y - 3.2, 283, y - 3.2);
      fila(cols.map((c, i) => i === 0 ? rotTotal : c[2] === 'n' ? n2(suma(c)) : c[2] === 'e' ? suma(c) : ''), true);
      doc.save(nombre + '.pdf');
    }
  } catch (e){ alert('No se pudo generar el listado: ' + e.message); }
}

const _diasDesde = f => {
  if (!f) return '';
  const d = Math.floor((Date.now() - new Date(f+'T12:00:00')) / 86400000);
  return d > 30 ? ` <span style="color:var(--bad)">(${d} días)</span>` : ` <span class="mini">(${d} d)</span>`;
};

async function abrirOP(cuit){
  opSel = cuit; opPrep = null; opRets = []; opPagos = []; opVencManual = false;
  // el catálogo de regímenes lo carga la pestaña ⚙️; si nunca la abrieron, acá
  if (!REGIMENES.length){
    const rg = await sb.from('compras_regimenes').select('*').order('codigo');
    REGIMENES = rg.data || [];
  }
  const {data, error} = await sb.rpc('compras_op_candidatos', {p_cuit: cuit, p_prueba: MODO_PRUEBA});
  if (error){ alert(error.message); return; }
  opDocs = (data||[]).map(d => d.documento_id);   // por defecto, todas
  // (25-sep, JP) remito asociado de cada factura, para ver antes de pagar si la mercadería ya tiene remito
  if (opDocs.length){
    const rr = await sb.from('compras_remitos')
      .select('documento_id,proveedor_cuit,fecha,punto_venta,numero,numero_proveedor,estado,origen,local_destino,txt_generado_at,txt_proveedor,asociado_por')
      .in('documento_id', opDocs);
    if (!rr.error){
      opDocs.forEach(id => { delete REMITOS_DOC[id]; });
      (rr.data||[]).forEach(r => (REMITOS_DOC[r.documento_id] ||= []).push(r));
    }
  }
  _pintarModalOP(data || []);
}

  openModalP(`
    <h3 class="op-tit" style="margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">${ico('pago')} Orden de pago · <span class="prov-nom" style="display:inline-block;max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom" title="${esc(prov.proveedor || opSel)}">${esc(prov.proveedor || opSel)}</span>
      <span class="mini" style="font-weight:400">CUIT ${esc(opSel)}</span>${MODO_PRUEBA ? ` <span class="hchip" style="margin:0" title="Ambiente de prueba: la OP lleva punto de venta 9999 y no genera el pendiente en Tesorería">${ico('frasco','s')} prueba</span>` : ''}</h3>

    <div class="op-blq"><h4>Facturas que se pagan</h4><div class="cont" style="max-height:230px;overflow:auto;padding:0">

             onchange="_opToggle(${d.documento_id}, this.checked)"></td>
        <td class="mini">${_fecha(d.fecha_emision)}</td>
        <td class="mini">${d.fecha_vto ? _fecha(d.fecha_vto) : '<span style="color:var(--bad)" title="La factura no tiene vencimiento cargado: se carga en el control del comprobante">sin vto</span>'}</td>
        <td style="white-space:nowrap">${d.archivo_path ? `<a class="nro" href="${_pdfUrl(d.archivo_path)}" target="_blank" rel="noopener" title="Abrir el PDF" style="color:var(--tx);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--mut)">${esc(d.comprobante)}</a>` : esc(d.comprobante)}</td>
        <td class="ctr">${letraTipo(d.tipo_gasto)}${d.moneda!=='ARS' ? ` <span class="mini">${esc(d.moneda)}</span>` : ''}</td>
        <td style="white-space:nowrap;font-size:12px">${d.es_nc ? '<span class="mini">—</span>' : celdaRemitos({id: d.documento_id, tipo_gasto: d.tipo_gasto})}</td>
        <td class="num mini"${d.es_nc ? ' style="color:var(--bad)"' : ''}>${plata(d.neto)}</td>
        <td class="num"${d.es_nc ? ' style="color:var(--bad)"' : ''}>${plata(d.total)}</td>
      </tr>`).join('')}</tbody></table>
    </div></div>

    ${(() => { const n = cands.filter(d => !d.es_nc && d.tipo_gasto === 'mercaderia' && !(REMITOS_DOC[d.documento_id]||[]).length).length;
      return n ? `<div class="alerta" style="margin:-4px 0 12px;font-size:13px">⚠ ${n} factura${n>1?'s':''} de mercadería sin remito asociado: la mercadería todavía no tiene cómo entrar al stock. Se puede pagar igual; conviene resolver el remito en 🚚 Mercadería.</div>` : ''; })()}
    <div class="op-blq"><h4>Datos de la orden</h4><div class="cont op-fila3">
      <div><label>Fecha de la OP</label><input type="date" id="op-fecha" value="${_hoyISO()}"></div>
      <div><label title="Se propone el vencimiento más cercano de las facturas marcadas. Es la fecha de pago del pendiente en Tesorería.">Vence (fecha de pago)</label><input type="date" id="op-venc" value="${_opVencDefault(cands)}" onchange="opVencManual=true"></div>
      <div style="flex:1;min-width:180px"><label>Observaciones</label><input id="op-obs" placeholder="opcional"></div>
    </div></div>
    <datalist id="dl-medios"><option>Transferencia</option><option>Cheque</option>
      <option>Echeq</option><option>Efectivo</option><option>Mercado Pago</option><option>Mercado Pago - Tarjeta Master Card</option>
      <option>Tarjeta Visa Business</option><option>Débito automático</option></datalist>

    <div id="op-calc"><div class="vacio">Calculando retenciones…</div></div>

    </div>`);
  _opCalcular();

const _hoyISO = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);

// Vencimiento propuesto de la OP = el más cercano entre las facturas marcadas (regla JP 22-sep:
// el vencimiento de la factura determina la fecha de pago). Sin ninguno cargado → hoy.
let opCands = [], opVencManual = false;
function _opVencDefault(cands){
  opCands = cands || opCands;
  const v = opCands.filter(c => opDocs.includes(c.documento_id) && c.fecha_vto).map(c => c.fecha_vto).sort();
  return v[0] || _hoyISO();
}

function _opToggleTodos(on){
  document.querySelectorAll('#prov-modal input[data-doc]').forEach(c => { c.checked = on; });
  opDocs = on ? opCands.map(c => c.documento_id) : [];
  const vi = document.getElementById('op-venc');
  if (vi && !opVencManual) vi.value = _opVencDefault();
  _opCalcular();
}
function _opToggle(id, on){
  opDocs = on ? Array.from(new Set(opDocs.concat([id]))) : opDocs.filter(x => x !== id);
  const vi = document.getElementById('op-venc');
  if (vi && !opVencManual) vi.value = _opVencDefault();
  _opCalcular();
}

async function _opCalcular(){
  const cont = document.getElementById('op-calc'); if (!cont) return;
  const btn = document.getElementById('op-emitir');
  if (!opDocs.length){
    opPrep = null;
    cont.innerHTML = '<div class="alerta">Marcá al menos un comprobante.</div>';
    if (btn) btn.disabled = true;
    return;
  }
  cont.innerHTML = '<div class="vacio">Calculando…</div>';
  const {data, error} = await sb.rpc('compras_op_preparar',
    {p_cuit: opSel, p_docs: opDocs, p_fecha: document.getElementById('op-fecha')?.value || null,
     p_prueba: MODO_PRUEBA});
  if (error){
    opPrep = null; if (btn) btn.disabled = true;
    cont.innerHTML = `<div class="alerta">${esc(error.message)}</div>`; return;
  }
  opPrep = data; if (btn) btn.disabled = false;
  // copia de trabajo: acá es donde se pueden tocar los importes a mano
  opRets = (data.retenciones || []).map(x => ({
    codigo: x.codigo, nombre: x.nombre, propuesto: !!x.propuesto,
    alicuota: x.alicuota, aviso: x.aviso,
    importe: Number(x.importe || 0), calculado: Number(x.importe || 0),
    motivo_edicion: '', agregada: false,
    calculo: Array.isArray(x.calculo) ? x.calculo : [] }));
  if (!opPagos.length) opPagos = [{medio: '', importe: 0, cuenta_id: null, cheque_numero: '', cheque_banco: '', cheque_fecha: '', cheque_emision: '', dias_diferimiento: '', notas: ''}];
  if (opPagos.length === 1) opPagos[0].importe = Math.round(_opNeto() * 100) / 100;
  if (OP_CUENTAS === null){
    // (2-oct, JP) solo las cuentas PAGADORAS (tesoreria_cuentas.pagadora): no se paga desde un plazo fijo o un fondo
    const cu = await sb.from('tesoreria_cuentas').select('id,nombre,tipo,moneda,local,pagadora').eq('activa', true).eq('pagadora', true).order('orden_display');
    OP_CUENTAS = cu.error ? [] : (cu.data || []);
  }
  const av = [...(data.avisos || [])], pp = data.pagos_posibles || [];
  // (v135) constancia de ARCA del proveedor: vieja (> 6 meses), no vigente o nunca consultada
  try {
    const ac = await sb.from('compras_arca_consultas').select('consultado_at,vigente,estado_clave').eq('cuit', String(opSel||'').replace(/\D/g,'')).order('consultado_at', {ascending:false}).limit(1);
    const c = (ac.data || [])[0], m = _mesesDesde(c?.consultado_at);
    if (!c) av.push('Nunca se consultó la constancia de ARCA de este proveedor. Hacelo desde su ficha (🏢 Proveedores) antes de pagar.');
    else if (m > 6) av.push(`La constancia de ARCA de este proveedor tiene ${Math.floor(m)} meses: conviene volver a consultarla desde su ficha antes de pagar (la condición de IVA y la vigencia pueden haber cambiado).`);
    else if (c.vigente !== true) av.push(`ARCA informa este CUIT como NO vigente (${c.estado_clave || 'sin estado'}). Revisalo antes de pagar.`);
  } catch(_){}
  cont.innerHTML = `
    ${pp.length ? `<div class="alerta" style="margin-bottom:10px;border-left:4px solid #b45309">
       <b>⚠ Puede que este pago YA esté hecho.</b><br>
       Hay ${pp.length} egreso${pp.length===1?'':'s'} del banco por este mismo importe sin conciliar:<br>
       ${pp.map(m => `· ${_fecha(m.fecha)} · ${esc(m.cuenta||'')} · ${plata(Math.abs(m.importe))} · ${esc((m.descripcion||'').slice(0,50))} <span class="mini">(${esc(m.evidencia)})</span>`).join('<br>')}
       <br><span class="mini">Si emitís igual, Tesorería lo vincula sola en vez de duplicar el pago.</span></div>` : ''}
    ${av.length ? `<div class="aviso-amb" style="margin-bottom:10px">${av.map(a => `<div>${ico('alerta','s')} ${esc(a)}</div>`).join('')}</div>` : ''}
    <div class="op-blq"><h4>Retenciones y neto a pagar</h4><div class="cont" style="padding:0 12px 8px">
    <table style="font-size:13px"><tbody>
      <tr><td>Comprobantes (${data.comprobantes}) <span class="mini">(neto)</span></td>
          <td class="num" title="Total con impuestos; entre paréntesis el neto sin IVA ni percepciones, base de las retenciones"><b>${plata(data.subtotal)}</b> <span class="mini">(${plata(data.neto)})</span></td></tr>
    </tbody></table>
    <div id="op-rets"></div></div></div>
    <div class="op-blq"><h4>Medio de pago</h4><div class="cont"><div id="op-pagos"></div></div></div>`;
  const np = document.getElementById('op-nro-prox');
  if (np) np.innerHTML = `Se emite como <b>OP X ${String(data.punto_venta).padStart(4,'0')}-${String(data.proximo_numero).padStart(8,'0')}</b>`;
  _opPintarRets();
  _opPintarPagos();
}

// ── Cálculo de la retención, a la vista ────────────────────────────────
//  La RPC devuelve los pasos en castellano (calculo[]) — el front solo los
//  muestra. Así lo que se lee al pasar el mouse es EXACTAMENTE lo que se
//  calculó, y en la OP emitida queda guardado tal cual.
function _opTip(lineas, texto){
  const todo = Array.isArray(lineas) ? lineas.filter(Boolean) : [];
  const ls = todo.filter(l => typeof l === 'string');
  // (v141, JP) la RPC manda como último elemento {ecuacion:[{op,rotulo,monto|pct,nota}]}: se dibuja como la tablita del Dragon
  // (v153, JP) las OPs emitidas antes del 10-oct guardan solo texto: la tablita se arma leyendo esas líneas
  const ec = (todo.find(l => l && typeof l === 'object' && Array.isArray(l.ecuacion)) || {}).ecuacion || _opEcuacionDesdeTexto(ls);
  if (!ls.length && !ec.length) return esc(texto);
  const cuerpo = ec.length
    ? `<div class="op-ec-tit">${esc(ls[0] || texto)}</div><table class="op-ec">${ec.map(f => `<tr class="${f.op === '=' ? 'ig' : ''}${f.op === '' ? ' sub' : ''}">
        <td class="op">${esc(f.op)}</td><td>${esc(f.rotulo)}${f.nota ? ` <span class="nota">· ${esc(f.nota)}</span>` : ''}</td>
        <td class="num">${f.pct != null ? Number(f.pct).toLocaleString('es-AR') + ' %' : f.monto != null ? plata(f.monto) : ''}</td></tr>`).join('')}</table>
       ${ls.filter(l => /certificado|venció|propia del proveedor/i.test(l)).map(l => `<div class="nota">${esc(l)}</div>`).join('')}`
    : ls.map(l => `<div>${esc(l)}</div>`).join('');
  // (22-sep, JP) sin title nativo: duplicaba el popover con el cartel chico del navegador
  // (v141) el popover se ancla con position:fixed al abrirse, así no lo recorta el scroll del modal (OP cerrada)
  return `<span class="op-tip" onclick="_opTipToggle(this);event.stopPropagation()" onmouseenter="_opTipPos(this)" onmouseleave="if(!this.classList.contains('abierto'))_opTipPos(this,true)">${esc(texto)}
    <span class="op-tipbox">${cuerpo}</span></span>`;
}
// (v149) posiciona el popover con position:fixed (hover o click): así no lo recorta ninguna sección ni el scroll del modal
function _opTipPos(el, quitar){
  const box = el.querySelector('.op-tipbox'); if (!box) return;
  if (quitar){ box.style.position = ''; box.style.left = ''; box.style.top = ''; box.style.zIndex = ''; return; }
  const r = el.getBoundingClientRect();
  box.style.position = 'fixed'; box.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 440)) + 'px';
  box.style.top = Math.min(r.bottom + 4, window.innerHeight - 40) + 'px'; box.style.zIndex = '10050';
  requestAnimationFrame(() => { const b = box.getBoundingClientRect(); if (b.bottom > window.innerHeight - 8) box.style.top = Math.max(8, r.top - b.height - 4) + 'px'; });
}
// Reconstruye la ecuación desde las líneas en castellano del cálculo viejo (formatos fijos de compras_op_retencion).
function _opEcuacionDesdeTexto(ls){
  const num = t => { const m = String(t||'').match(/\$\s*(-?[\d.]+,\d{2})/); return m ? Number(m[1].replace(/\./g,'').replace(',','.')) : null; };
  const nums = t => [...String(t||'').matchAll(/\$\s*(-?[\d.]+,\d{2})/g)].map(m => Number(m[1].replace(/\./g,'').replace(',','.')));
  const pct = t => { const m = String(t||'').match(/(-?[\d.]+,?\d*)\s*%/); return m ? Number(m[1].replace(/\./g,'').replace(',','.')) : null; };
  const L = k => ls.find(l => l.includes(k)) || '';
  const base = num(L('Base de este pago')); if (base == null) return [];
  const prev = L('Ya pagado a este proveedor'), prevN = prev ? nums(prev) : [];
  const acum = prevN[0] || 0, retPrev = prevN[1] || 0;
  const min = L('Menos mínimo no imponible'), minN = min ? nums(min) : [];
  const minimo = minN[0] || 0, baseSuj = minN[1] != null ? minN[1] : Math.max(0, acum + base - minimo);
  const ec = [{op:'+', rotulo:'Pagos ant. del mes', monto: acum}, {op:'+', rotulo:'Pago actual (neto)', monto: base},
              {op:'=', rotulo:'Pagos acumulados', monto: acum + base}, {op:'-', rotulo:'Mínimo no imp.', monto: minimo},
              {op:'=', rotulo:'Monto base', monto: baseSuj}];
  if (L('No supera el mínimo')){ ec.push({op:'=', rotulo:'Monto retención', monto: 0, nota:'no supera el mínimo no imponible'}); return ec; }
  const esc = L('Escala progresiva');
  let retTotal = null;
  if (esc){
    const n = nums(esc), p = pct(esc.split('+')[1] || esc);
    // "tramo de más de $A [hasta $H]: fijo $F + P % sobre el excedente $E = $T"
    const A = n[0], fijo = n[n.length - 3], exc = n[n.length - 2]; retTotal = n[n.length - 1];
    ec.push({op:'', rotulo:'Según escala'}, {op:'+', rotulo:'Excedente de ' + plata(A), monto: exc}, {op:'x', rotulo:'Porcentaje', pct: p},
            {op:'=', rotulo:'Subtotal', monto: Math.round((retTotal - fijo) * 100) / 100}, {op:'+', rotulo:'Monto fijo', monto: fijo});
  } else {
    const mul = ls.find(l => / × .*% = /.test(l)) || '';
    const n = nums(mul); retTotal = n[1] != null ? n[1] : null;
    ec.push({op:'x', rotulo:'Porcentaje', pct: pct(mul)});
  }
  if (retTotal == null) return [];
  ec.push({op:'=', rotulo:'Retención total', monto: retTotal}, {op:'-', rotulo:'Retenciones ant.', monto: retPrev});
  const fin = L('Retención:'), bajo = L('por debajo del mínimo de retención');
  const mano = L('Importe puesto a mano');
  // si se puso a mano, el monto final es el primero de esa línea ("$0,00 en vez de $339.581,29")
  const montoFinal = mano ? (nums(mano)[0] ?? 0) : bajo ? 0 : (num(fin) != null ? num(fin) : Math.max(0, retTotal - retPrev));
  ec.push({op:'=', rotulo:'Monto retención', monto: montoFinal, nota: bajo ? 'por debajo del mínimo de retención' : (mano ? mano.replace(/^Importe puesto a mano por /, 'a mano: ') : undefined)});
  return ec;
}
function _opTipToggle(el){
  const abierto = el.classList.toggle('abierto');
  _opTipPos(el, !abierto);
}

// ── Medios de pago: uno o varios ───────────────────────────────────────
//  Una OP puede pagarse parte por transferencia, parte con cheque, parte en
//  efectivo. Cada fila es un medio con su importe; la suma tiene que dar el
//  neto a pagar (la RPC lo vuelve a controlar). Fuera de prueba, cada medio
//  crea SU pendiente en Tesorería, así el banco concilia cada egreso solo.
const _opSumPagos = () => opPagos.reduce((a,p) => a + (Number(p.importe)||0), 0);
const _opEsCheque = m => /cheq|echeq/i.test(m||'');
const _opEsEcheq  = m => /echeq|e-cheq|e cheq/i.test(m||'');
// Cheque/Echeq: fecha de emisión + días de diferimiento → fecha de pago (22-sep, JP)
function _opFechaPago(p){
  if (p.cheque_emision && p.dias_diferimiento !== '' && p.dias_diferimiento != null){
    const d = new Date(p.cheque_emision + 'T12:00:00'); d.setDate(d.getDate() + (Number(p.dias_diferimiento)||0));
    return d.toISOString().slice(0,10);
  }
  return p.cheque_fecha || '';
}
// Título con mayúscula inicial para mostrar (lo guardado se normaliza igual)
const _opCap = m => { m = String(m||'').trim(); return m ? m.charAt(0).toUpperCase() + m.slice(1) : m; };

// (2-oct, JP) Qué cuentas pagadoras sirven para cada medio: efectivo sale de una caja, Mercado Pago de MP,
// cheque/echeq del banco; transferencia y débito automático, del banco o de MP. Medio sin reconocer → todas.
function _opCuentasPara(medio){
  const todas = OP_CUENTAS || [], m = String(medio||'').toLowerCase();
  let tipos = null;
  if (/efect/.test(m)) tipos = ['caja'];
  else if (/tarjeta|visa|master/.test(m)) tipos = ['banco_cc', 'mp'];   // (24-oct) la tarjeta se paga desde la cuenta del banco (o MP)
  else if (/mercado|^mp\b/.test(m)) tipos = ['mp'];
  else if (/cheq/.test(m)) tipos = ['banco_cc'];
  else if (/transf|d[eé]bito/.test(m)) tipos = ['banco_cc', 'mp'];
  const l = tipos ? todas.filter(c => tipos.includes(c.tipo)) : todas;
  return l.length ? l : todas;
}
// Al terminar de elegir el medio: se re-dibuja para que la lista de cuentas sea la de ese medio.
function _opPagoMedioFin(i){
  const p = opPagos[i]; if (!p) return;
  const l = _opCuentasPara(p.medio);
  if (p.cuenta_id && !l.some(c => c.id === p.cuenta_id)) p.cuenta_id = null;
  if (!p.cuenta_id && l.length === 1 && (p.medio||'').trim()) p.cuenta_id = l[0].id;
  _opPintarPagos();
}

function _opPintarPagos(){
  const cont = document.getElementById('op-pagos'); if (!cont) return;
  const neto = _opNeto(), suma = _opSumPagos(), dif = Math.round((neto - suma)*100)/100;
  const ctas = OP_CUENTAS || [];
  cont.innerHTML = `
    <div style="display:flex;align-items:center;gap:6px;margin:0 0 5px">
      <h4 style="font-size:13px;margin:0">Medio de pago${opPagos.length>1 ? 's' : ''}</h4>
      <button class="act op-ico" onclick="_opPagoAgregar()" title="Agregar otro medio de pago (parte por transferencia, parte con cheque…)">${ico('mas','s')}</button>
    </div>
    ${opPagos.map((p,i) => `
      <div class="op-fila3" style="margin-bottom:6px;padding:6px 8px;border:1px solid var(--bd);border-radius:9px">
        <div style="flex:1;min-width:150px"><label>Medio</label>
          <input list="dl-medios" value="${esc(p.medio||'')}" placeholder="Transferencia / Cheque / Efectivo…"
                 oninput="_opPagoSet(${i},'medio',this.value)" onchange="_opPagoMedioFin(${i})" style="font-size:12.5px;padding:5px 7px"></div>
        <div style="width:150px"><label>Importe</label>
          <input type="number" step="0.01" min="0" value="${Number(p.importe)||0}" ${opPagos.length===1 ? 'readonly title="Con un solo medio, el importe es el neto a pagar"' : ''}
                 oninput="_opPagoSet(${i},'importe',this.value)" style="text-align:right;font-size:12.5px;padding:5px 7px"></div>
        ${ctas.length ? `<div style="min-width:160px"><label title="Solo las cuentas desde las que se puede pagar, según el medio elegido">Cuenta</label>
          <select onchange="_opPagoSet(${i},'cuenta_id',this.value)" style="font-size:12.5px;padding:5px 7px">
            <option value="">—</option>
            ${_opCuentasPara(p.medio).map(c => `<option value="${c.id}" ${String(p.cuenta_id||'')===String(c.id)?'selected':''}>${esc(c.nombre)}</option>`).join('')}
          </select></div>` : ''}
        ${_opEsCheque(p.medio) ? `
          ${_opEsEcheq(p.medio) ? '' : `<div style="width:110px"><label>N° cheque</label><input value="${esc(p.cheque_numero||'')}" oninput="_opPagoSet(${i},'cheque_numero',this.value)" style="font-size:12.5px;padding:5px 7px"></div>`}
          <div style="width:110px"><label>Banco</label><input value="${esc(p.cheque_banco||'')}" oninput="_opPagoSet(${i},'cheque_banco',this.value)" style="font-size:12.5px;padding:5px 7px"></div>
          <div style="width:135px"><label>Fecha de emisión</label><input type="date" value="${esc(p.cheque_emision||'')}" onchange="_opPagoSet(${i},'cheque_emision',this.value)" style="font-size:12.5px;padding:5px 7px"></div>
          <div style="width:95px"><label>Días difer.</label><input type="number" min="0" step="1" value="${p.dias_diferimiento ?? ''}" placeholder="30" oninput="_opPagoSet(${i},'dias_diferimiento',this.value)" style="font-size:12.5px;padding:5px 7px"></div>
          <div style="width:120px"><label>Fecha de pago</label><div id="op-fpago-${i}" class="mini" style="padding:6px 0;font-weight:600">${_opFechaPago(p) ? _fecha(_opFechaPago(p)) : '—'}</div></div>
          ${_opEsEcheq(p.medio) ? `<div class="mini" style="width:100%;color:#64748b">El número del Echeq lo asigna el banco al emitirlo: no se carga acá.</div>` : ''}` : ''}
        ${opPagos.length>1 ? `<button class="act gh" onclick="_opPagoQuitar(${i})" title="Quitar este medio" style="padding:4px 8px">✕</button>` : ''}
      </div>`).join('')}
    <div style="display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:6px">
      <span class="mini" id="op-pagos-dif" style="${Math.abs(dif) > 0.005 ? 'color:var(--bad);font-weight:700' : 'color:var(--ok,#166534)'}">
        ${opPagos.length>1 ? (Math.abs(dif) > 0.005
            ? (dif > 0 ? `faltan asignar ${plata(dif)}` : `sobran ${plata(-dif)}`) + ` · asignado ${plata(suma)} de ${plata(neto)}`
            : `✓ ${plata(suma)} repartidos en ${opPagos.length} medios`) : ''}
      </span>
    </div>`;
}
function _opPagoSet(i, campo, val){
  const p = opPagos[i]; if (!p) return;
  if (campo === 'importe') p.importe = Math.max(0, Number(String(val).replace(',', '.')) || 0);
  else if (campo === 'cuenta_id') p.cuenta_id = val ? Number(val) : null;
  else p[campo] = val;
  if (campo === 'cheque_emision' || campo === 'dias_diferimiento'){
    const f = document.getElementById('op-fpago-' + i); const fp = _opFechaPago(p);
    if (f) f.textContent = fp ? _fecha(fp) : '—';
  }
  if (campo === 'medio' || campo === 'importe'){
    // el medio decide si aparecen los campos del cheque; el importe mueve el "faltan"
    if (campo === 'medio'){
      const era = !!p._chq, es = _opEsCheque(val), eraE = !!p._echq, esE = _opEsEcheq(val); p._chq = es; p._echq = esE;
      // (8-oct, JP) si para ese medio hay una sola cuenta posible (Mercado Pago → MP Locales), queda elegida sola
      const l = _opCuentasPara(val);
      if ((val||'').trim() && l.length === 1 && p.cuenta_id !== l[0].id){ p.cuenta_id = l[0].id; _opPintarPagos(); return; }
      if (era !== es || eraE !== esE) { _opPintarPagos(); return; }
    }
    const d = document.getElementById('op-pagos-dif');
    if (d && opPagos.length > 1){
      const neto = _opNeto(), suma = _opSumPagos(), dif = Math.round((neto - suma)*100)/100;
      d.style.cssText = Math.abs(dif) > 0.005 ? 'color:var(--bad);font-weight:700' : 'color:var(--ok,#166534)';
      d.textContent = Math.abs(dif) > 0.005
        ? (dif > 0 ? `faltan asignar ${plata(dif)}` : `sobran ${plata(-dif)}`) + ` · asignado ${plata(suma)} de ${plata(neto)}`
        : `✓ ${plata(suma)} repartidos en ${opPagos.length} medios`;
    }
  }
}
function _opPagoAgregar(){
  // el nuevo medio arranca con lo que falta asignar
  const resto = Math.round((_opNeto() - _opSumPagos())*100)/100;
  opPagos.push({medio: '', importe: resto > 0 ? resto : 0, cuenta_id: null, cheque_numero: '', cheque_banco: '', cheque_fecha: '', cheque_emision: '', dias_diferimiento: '', notas: ''});
  _opPintarPagos();
}
function _opPagoQuitar(i){
  opPagos.splice(i,1);
  if (opPagos.length === 1) opPagos[0].importe = Math.round(_opNeto()*100)/100;
  _opPintarPagos();
}

// ── Retenciones editables ──────────────────────────────────────────────
//  El sistema propone el número, pero quien firma la OP es una persona: si
//  el régimen todavía no tiene alícuota cargada (⚙️ Retenciones), o el
//  contador indica otro importe, se pone a mano. 🚨 Todo importe que difiera
//  de lo calculado EXIGE motivo — el certificado de retención que se le
//  entrega al proveedor tiene que poder explicar de dónde salió el número.
//  La base valida igual: el código y el nombre del régimen los pone la DB.
const _opEditada = r => Math.abs(Number(r.importe||0) - Number(r.calculado||0)) > 0.005;
const _opTotRet  = () => opRets.reduce((a,r) => a + (Number(r.importe)||0), 0);
const _opNeto    = () => Number(opPrep?.subtotal || 0) - _opTotRet();

function _opPintarRets(){
  const cont = document.getElementById('op-rets'); if (!cont) return;
  const libres = (REGIMENES||[]).filter(r => r.activo && !opRets.some(x => x.codigo === r.codigo));
  cont.innerHTML = `
    <table style="font-size:13px"><tbody>
      ${opRets.length ? opRets.map((r,i) => {
        const ed = _opEditada(r);
        if (r.eliminada) return `<tr style="opacity:.6">
        <td style="padding-right:10px"><s>${esc(r.codigo + ' · ' + (r.nombre||'').slice(0,42))}</s>
          <span class="chip" style="background:#fee2e2;color:#991b1b">eliminada</span>
          <br><span class="mini">calculado: ${plata(r.calculado)} · ${esc(r.motivo_edicion||'')}</span></td>
        <td class="num" style="white-space:nowrap">— <button class="act op-ico" onclick="_opRetRestaurar(${i})" title="Volver a aplicar la retención calculada">${ico('refrescar','s')}</button></td></tr>`;
        return `<tr>
        <td style="padding-right:10px">${_opTip(r.calculo, r.codigo + ' · ' + (r.nombre||'').slice(0,42))}
          ${r.alicuota ? ` <span class="mini">${Number(r.alicuota)}%</span>` : ''}
          ${r.propuesto ? ` <span class="mini" title="Propuesta por el sistema según el régimen del proveedor" style="cursor:help">${ico('info','s')}</span>` : ''}
          ${r.agregada ? ' <span class="chip" style="background:#e0e7ff;color:#3730a3">agregada</span>' : ''}
          <span class="chip" id="op-mano-${i}" style="background:#fee2e2;color:#991b1b;${ed?'':'display:none'}">a mano</span>
          ${i === opRets.length - 1 && libres.length ? `<span class="op-mas"><button class="act op-ico" title="Agregar otra retención" onclick="this.nextElementSibling.style.display='';this.style.display='none'">${ico('mas','s')}</button><select style="display:none;font-size:12px;padding:4px 7px;max-width:260px" onchange="_opRetAgregar(this.value)"><option value="">Régimen…</option>${libres.map(x => `<option value="${esc(x.codigo)}">${esc(x.codigo)} · ${esc(x.nombre)}</option>`).join('')}</select></span>` : ''}
          ${r.aviso ? `<br><span class="mini" style="color:#b45309">${esc(r.aviso)}</span>` : ''}
          <div id="op-motivo-${i}" style="${ed?'':'display:none'};margin-top:4px">
            <input id="op-motivo-in-${i}" placeholder="¿Por qué este importe? (va al certificado)"
                   value="${esc(r.motivo_edicion||'')}" oninput="_opRetMotivo(${i}, this.value)"
                   style="font-size:12px;padding:4px 7px">
            <span class="mini">calculado: ${plata(r.calculado)}</span>
          </div></td>
        <td class="num" style="white-space:nowrap">−
          <input type="number" step="0.01" min="0" id="op-imp-${i}" value="${Number(r.importe)||0}"
                 oninput="_opRetImporte(${i}, this.value)"
                 style="width:118px;text-align:right;display:inline-block;padding:4px 7px">
          ${r.agregada
            ? `<button class="act gh" onclick="_opRetQuitar(${i})" title="Quitar" style="padding:2px 7px;margin-left:3px">✕</button>`
            : `<button class="act op-ico" onclick="_opRetReset(${i})" title="Volver a lo calculado">${ico('refrescar','s')}</button><button class="act op-ico" onclick="_opRetEliminar(${i})" title="Eliminar esta retención de la orden" style="background:var(--bad)">${ico('anular','s')}</button>`}
        </td></tr>`; }).join('')
        : `<tr><td class="mini">Sin retenciones para este proveedor.${libres.length ? ` <span class="op-mas"><button class="act op-ico" title="Agregar una retención" onclick="this.nextElementSibling.style.display='';this.style.display='none'">${ico('mas','s')}</button><select style="display:none;font-size:12px;padding:4px 7px;max-width:260px" onchange="_opRetAgregar(this.value)"><option value="">Régimen…</option>${libres.map(x => `<option value="${esc(x.codigo)}">${esc(x.codigo)} · ${esc(x.nombre)}</option>`).join('')}</select></span>` : ''}</td><td></td></tr>`}
      <tr style="font-weight:700;border-top:2px solid var(--bd)">
        <td>Neto a pagar</td>
        <td class="num" style="font-size:16px" id="op-neto">${plata(_opNeto())}</td></tr>
    </tbody></table>`;
}

function _opRetImporte(i, val){
  const r = opRets[i]; if (!r) return;
  r.importe = Math.max(0, Number(String(val).replace(',', '.')) || 0);
  const ed = _opEditada(r);
  const chip = document.getElementById('op-mano-' + i);
  const mot  = document.getElementById('op-motivo-' + i);
  if (chip) chip.style.display = ed ? '' : 'none';
  if (mot)  mot.style.display  = ed ? '' : 'none';
  const neto = document.getElementById('op-neto');
  if (neto){
    neto.textContent = plata(_opNeto());
    neto.style.color = _opNeto() < 0 ? 'var(--bad)' : '';
  }
  if (opPagos.length === 1){ opPagos[0].importe = Math.round(_opNeto()*100)/100; }
  _opPintarPagos();
}

function _opRetReset(i){
  const r = opRets[i]; if (!r) return;
  r.importe = Number(r.calculado) || 0; r.motivo_edicion = '';
  const inp = document.getElementById('op-imp-' + i);
  if (inp) inp.value = r.importe;
  _opRetImporte(i, r.importe);
}

function _opRetAgregar(cod){
  if (!cod) return;
  const reg = (REGIMENES||[]).find(r => r.codigo === cod); if (!reg) return;
  opRets.push({codigo: reg.codigo, nombre: reg.nombre, propuesto: false,
    alicuota: null, aviso: null, importe: 0, calculado: 0,
    motivo_edicion: '', agregada: true});
  _opPintarRets();
}

function _opRetMotivo(i, val){ if (opRets[i]) opRets[i].motivo_edicion = val; }
// (2-oct, JP) Eliminar una retención propuesta. Si el sistema había calculado un importe, queda registrada
// en $0 con el motivo (el certificado tiene que poder explicar por qué NO se retuvo); si ya daba $0, se quita.
function _opRetEliminar(i){
  const r = opRets[i]; if (!r) return;
  if (Number(r.calculado) > 0){
    const m = prompt(`Eliminar la retención ${r.codigo} (${plata(r.calculado)}) de esta orden.\n\n¿Por qué no se retiene? Queda guardado en la orden.`);
    if (m === null) return;
    if (!m.trim()){ alert('El motivo es obligatorio.'); return; }
    r.eliminada = true; r.importe = 0; r.motivo_edicion = 'Retención eliminada: ' + m.trim();
  } else {
    opRets.splice(i, 1);
  }
  _opRetsCambio();
}
function _opRetRestaurar(i){
  const r = opRets[i]; if (!r) return;
  r.eliminada = false; r.importe = Number(r.calculado) || 0; r.motivo_edicion = '';
  _opRetsCambio();
}
function _opRetsCambio(){
  if (opPagos.length === 1) opPagos[0].importe = Math.round(_opNeto()*100)/100;
  _opPintarRets(); _opPintarPagos();
}
function _opRetQuitar(i){ opRets.splice(i,1); _opRetsCambio(); }

async function emitirOP(){
  if (!opPrep){ alert('Todavía no se calculó la orden.'); return; }
  const av = opPrep.avisos || [];
  const editadas = opRets.filter(_opEditada);
  const sinMotivo = editadas.find(r => !(r.motivo_edicion||'').trim());
  if (sinMotivo){
    alert(`Cambiaste a mano la retención de ${sinMotivo.codigo}.\n\n` +
          'Escribí el motivo: queda guardado y es lo que explica el número en el ' +
          'certificado de retención que se le entrega al proveedor.');
    document.getElementById('op-motivo-in-' + opRets.indexOf(sinMotivo))?.focus();
    return;
  }
  if (_opNeto() < 0){ alert('Las retenciones superan el total de la orden.'); return; }
  const sinMedio = opPagos.find(p => !(p.medio||'').trim());
  if (sinMedio){ alert('Poné el medio de pago (transferencia / cheque / efectivo…).'); return; }
  if (opPagos.length > 1){
    const dif = Math.round((_opNeto() - _opSumPagos())*100)/100;
    if (Math.abs(dif) > 0.005){
      alert(`Los medios de pago suman ${plata(_opSumPagos())} y el neto a pagar es ${plata(_opNeto())}.\n\n` +
            (dif > 0 ? `Faltan asignar ${plata(dif)}.` : `Sobran ${plata(-dif)}.`)); return;
    }
    if (opPagos.some(p => !(Number(p.importe) > 0))){ alert('Hay un medio de pago con importe cero: sacalo o ponele importe.'); return; }
  }
  const txt = `Emitir la orden de pago de ${opPrep.proveedor}\n\n` +
    `${opPrep.comprobantes} comprobante(s): ${plata(opPrep.subtotal)}\n` +
    `Retenciones: ${plata(_opTotRet())}` +
    (editadas.length ? ` (${editadas.length} puesta(s) a mano)` : '') + '\n' +
    `A pagar: ${plata(_opNeto())}\n` +
    (opPagos.length > 1 ? opPagos.map(p => `   · ${p.medio}: ${plata(p.importe)}`).join('\n') + '\n' : `   · ${opPagos[0].medio}\n`) + '\n' +
    (editadas.length ? editadas.map(r =>
       `✏ ${r.codigo}: ${plata(r.importe)} en vez de ${plata(r.calculado)} — ${r.motivo_edicion.trim()}`).join('\n') + '\n\n' : '') +
    (av.length ? `⚠ ${av.length} aviso(s) sin resolver:\n${av.map(a=>'· '+a).join('\n')}\n\n` : '') +
    (MODO_PRUEBA ? '🧪 Prueba: no se crea el pendiente en Tesorería.\n\n' : 'Se va a crear el pendiente de pago en Tesorería.\n\n') +
    '¿Confirmás?';
  if (!confirm(txt)) return;
  const btn = document.getElementById('op-emitir');
  if (btn){ btn.disabled = true; btn.textContent = 'Emitiendo…'; }
  const {data, error} = await sb.rpc('compras_op_emitir', {
    p_cuit: opSel, p_docs: opDocs,
    p_fecha: document.getElementById('op-fecha').value || null,
    p_vencimiento: document.getElementById('op-venc').value || null,
    p_medio_pago: _opCap(opPagos[0]?.medio) || null,
    p_observaciones: document.getElementById('op-obs').value || null,
    p_pagos: opPagos.map(p => ({medio: _opCap(p.medio), importe: Math.round((Number(p.importe)||0)*100)/100,
      cuenta_id: p.cuenta_id || null, cheque_numero: _opEsEcheq(p.medio) ? null : ((p.cheque_numero||'').trim() || null),
      cheque_banco: (p.cheque_banco||'').trim() || null, cheque_fecha: _opFechaPago(p) || null,
      cheque_emision: p.cheque_emision || null, dias_diferimiento: (p.dias_diferimiento === '' || p.dias_diferimiento == null) ? null : Number(p.dias_diferimiento),
      notas: (p.notas||'').trim() || null})),
    p_retenciones: opRets.map(r => ({codigo: r.codigo, importe: Number(r.importe)||0,
                                     motivo_edicion: (r.motivo_edicion||'').trim() || null})),
    p_prueba: MODO_PRUEBA });
  if (error){
    alert('No se pudo emitir: ' + error.message);
    if (btn){ btn.disabled = false; btn.textContent = 'Emitir orden de pago'; }
    return;
  }
  cerrarModalP();
  alert(`${data.comprobante} emitida\n\nA pagar: ${plata(data.neto_a_pagar)}` +
        (data.mensaje_pago ? `\n\n${data.mensaje_pago}`
          : data.pendiente_tesoreria ? (data.pagos > 1 ? `\n\nQuedaron ${data.pagos} pendientes en Tesorería, uno por cada medio de pago.` : '\n\nYa quedó el pendiente cargado en Tesorería.') : '') +
        (data.estado_pendiente === 'pagado'
          ? '\n\nLos PDF se archivan como PAGADAS en aproximadamente un minuto.'
          : '\n\nLos PDF se mudan a 4 - CON OP SIN PAGAR en aproximadamente un minuto.'));
  vistaOrdenes();
}
